  gooLowCtx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  tearCanvas = document.createElement("canvas");
  tearCanvas.width = gooCanvas.width;
  tearCanvas.height = gooCanvas.height;
  tearCtx = tearCanvas.getContext("2d", { willReadFrequently: true });
}
function activateGoo() {
  if (gooActive) return;
  const W = window.innerWidth, H = window.innerHeight;
  sizeGoo();
  gooBlobs = [];
  const N = Math.max(12, Math.min(26, Math.round((W * H) / 38000)));
  for (let i = 0; i < N; i++) {
    gooBlobs.push({
      bx: Math.random() * W, by: Math.random() * H,
      x: 0, y: 0, vx: 0, vy: 0,
      r: 150 + Math.random() * 200,
      hue: (i * 360 / N + Math.random() * 24) % 360,
      f1: 0.1 + Math.random() * 0.25, p1: Math.random() * 6.3,
      f2: 0.1 + Math.random() * 0.25, p2: Math.random() * 6.3,
    });
  }
  gooSpecks = [];
  for (let i = 0; i < 150; i++) {
    gooSpecks.push({ x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random() * 1.8 });
  }
  gooCanvas.style.display = "block";
  requestAnimationFrame(() => gooCanvas.classList.add("on"));
  gooActive = true;
  bed('goo');
}

function gooPress(x, y, str) {
  for (const b of gooBlobs) {
    const dx = b.x - x, dy = b.y - y;
    const d = Math.hypot(dx, dy);
    if (d < 300 && d > 0.01) {
      const f = (1 - d / 300) * 950 * str;
      b.vx += (dx / d) * f;
      b.vy += (dy / d) * f;
    }
  }
  if (gooGush.length < 24) gooGush.push({ x, y, r: 8, vr: 260 * (0.6 + str * 0.6), life: 1 });
  if (str > 0.5 && gooSmears.length < 40) gooSmears.push({ x, y, r: 34 + Math.random() * 26, life: 5 });
  const nw = performance.now();
  if (nw - lastSquelch > 160) { lastSquelch = nw; squelchSound(str); }
}
window.addEventListener("pointerdown", (e) => {
  if (!gooActive || gooFinished) return;
  if (vol <= 0.02) {
    makeRip(e.clientX, e.clientY);   // once it's dry, the gel tears like tissue paper
    gooPress(e.clientX, e.clientY, 0.8);
  } else {
    gooPress(e.clientX, e.clientY, 1);
  }
});
window.addEventListener("pointermove", (e) => { if (gooActive && !gooFinished && e.buttons) gooPress(e.clientX, e.clientY, 0.35); });

/* rip a jagged tissue-paper hole through to the white underneath */
function makeRip(x, y) {
  if (!dotWhitened) { dotWhitened = true; dotEl.style.background = "#fdfdfb"; }
  const N = 16;
  /* every tear weakens the sheet — later ones open wider */
  ripCount++;
  const base = (58 + Math.random() * 58) * (1 + ripCount * 0.09);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    let rad = base * (0.55 + Math.random() * 0.6);
    if (Math.random() < 0.22) rad *= 1.4;          // deeper snags
    pts.push([x + Math.cos(a) * rad, y + Math.sin(a) * rad]);
  }
  const path = new Path2D();
  path.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < N; i++) path.lineTo(pts[i][0], pts[i][1]);
  path.closePath();
  tearCtx.fillStyle = "#fff";
  tearCtx.fill(path);
  if (gooFringes.length < 120) gooFringes.push(path);
  /* fibrous strands sticking out of the tear like real torn tissue */
  const strands = new Path2D();
  for (let k = 0; k < 7; k++) {
    const p = pts[(Math.random() * N) | 0];
    let dx = p[0] - x, dy = p[1] - y;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const ln = 4 + Math.random() * 9;
    strands.moveTo(p[0], p[1]);
    strands.lineTo(p[0] + dx * ln + (Math.random() - 0.5) * 3,
                   p[1] + dy * ln + (Math.random() - 0.5) * 3);
  }
  if (gooStrands.length < 120) gooStrands.push(strands);
  /* shreds flutter off the tear */
  for (let i = 0; i < 7; i++) {
    if (gooScraps.length > 90) break;
    gooScraps.push({
      x: x + (Math.random() - 0.5) * base, y: y + (Math.random() - 0.5) * base,
      vx: (Math.random() - 0.5) * 240, vy: -60 - Math.random() * 100,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 10,
      w: 10 + Math.random() * 16, h: 7 + Math.random() * 9,
      hue: Math.random() * 360, life: 1.5 + Math.random() * 0.7,
    });
  }
  ripSound();
  /* torn enough? the rest gives way */
  const d = tearCtx.getImageData(0, 0, tearCanvas.width, tearCanvas.height).data;
  let hit = 0, tot = 0;
  for (let yy = 0; yy < tearCanvas.height; yy += 40) {
    for (let xx = 0; xx < tearCanvas.width; xx += 40) {
      tot++;
      if (d[(yy * tearCanvas.width + xx) * 4 + 3] > 10) hit++;
    }
  }
  /* don't make it a chore: once it's mostly gone, or you've torn enough
     holes in it, the rest of the sheet lets go on its own */
  if (hit / tot > 0.55 || ripCount >= 13) finishGoo();
}

function finishGoo() {
  if (gooFinished) return;
  gooFinished = true;
  ripSound(); ripSound();                        // the whole sheet lets go
  /* it doesn't slide off — it tears into pieces and tumbles */
  const W = window.innerWidth, H = window.innerHeight;
  const cuts = [0, 0.22 + Math.random() * 0.15, 0.5 + Math.random() * 0.12, 0.78 + Math.random() * 0.1, 1];
  for (let k = 0; k < 4; k++) {
    const x0 = Math.round(cuts[k] * W), x1 = Math.round(cuts[k + 1] * W);
    const pw = x1 - x0;
    if (pw < 4) continue;
    const pc = document.createElement("canvas");
    pc.width = pw; pc.height = H;
    pc.getContext("2d").drawImage(gooCanvas, x0, 0, pw, H, 0, 0, pw, H);
    pc.style.cssText = `position:fixed;left:${x0}px;top:0;width:${pw}px;height:${H}px;`
      + `z-index:8;pointer-events:none;`
      + `transition:transform ${1.0 + k * 0.18}s cubic-bezier(.45,0,.9,.6) ${k * 0.09}s,`
      + `opacity 0.5s ease ${0.7 + k * 0.2}s;`;
    document.body.appendChild(pc);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      pc.style.transform = `translateY(${H * 1.3}px) rotate(${Math.random() * 36 - 18}deg)`;
      pc.style.opacity = "0";
    }));
    setTimeout(() => pc.remove(), 2800);
  }
  gooActive = false;
  /* you do not cut to the next room, you go through the hole you just made */
  setTimeout(() => {
    finCanvas.style.background = "transparent";
    finCanvas.style.display = "block";
    sizeFinale();
    passThrough(() => { gooCanvas.style.display = "none"; startFinale(); },
                { src: gooCanvas, dur: 1.5, up: true });
    travelOnly = true;
  }, 1500);
}

function ripSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  for (let k = 0; k < 2; k++) {
    const s = ac.createBufferSource(); s.buffer = noise(ac);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(3400 - k * 900, t0 + k * 0.03);
    bp.frequency.exponentialRampToValueAtTime(1200 - k * 300, t0 + 0.2 + k * 0.03);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + k * 0.03);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015 + k * 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22 + k * 0.03);
    s.connect(bp); bp.connect(g); g.connect(BUS);
    s.start(t0 + k * 0.03); s.stop(t0 + 0.26 + k * 0.03);
  }
}

function squelchSound(v) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(520, t0);
  lp.frequency.exponentialRampToValueAtTime(160, t0 + 0.22);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.22 * v, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.28);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(130, t0);
  o.frequency.exponentialRampToValueAtTime(55, t0 + 0.16);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.12 * v, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
  o.connect(g2); g2.connect(BUS);
  o.start(t0); o.stop(t0 + 0.2);
}

let gooTile = null, gooPat = null;
function buildGooTile() {
  const S = 96, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d");
  for (let i = 0; i < 2400; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.5 ? `rgba(255,255,255,${(v * 0.16).toFixed(3)})`
                          : `rgba(40,20,60,${((0.5 - v) * 0.16).toFixed(3)})`;
    g.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  gooTile = c;
}

function gooFrame(dt) {
  if (!gooActive) return;
  const W = window.innerWidth, H = window.innerHeight;
  const lg = gooLowCtx;   /* soft layers render at half res */

  /* base: a slow-cycling rainbow wash */
  const ang = wT * 0.12;
  const gx = Math.cos(ang), gy = Math.sin(ang);
  const grad = lg.createLinearGradient(
    W / 2 - gx * W * 0.6, H / 2 - gy * H * 0.6,
    W / 2 + gx * W * 0.6, H / 2 + gy * H * 0.6);
  for (let k = 0; k <= 6; k++) {
    grad.addColorStop(k / 6, `hsl(${((wT * 7 * RUN.gooSpin) + RUN.hueShift + k * 60) % 360},84%,50%)`);
  }
  lg.fillStyle = grad;
  lg.fillRect(0, 0, W, H);

  /* the blobs ooze around their drifting homes, shoved aside by presses */
  for (const b of gooBlobs) {
    const hx = b.bx + Math.sin(wT * b.f1 + b.p1) * 55;
    const hy = b.by + Math.sin(wT * b.f2 + b.p2) * 45;
    if (!b.x && !b.y) { b.x = hx; b.y = hy; }
    b.vx += (hx - b.x) * 2.1 * dt * 60 * 0.016;
    b.vy += (hy - b.y) * 2.1 * dt * 60 * 0.016;
    const damp = Math.exp(-1.7 * dt);
    b.vx *= damp; b.vy *= damp;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const rg = lg.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    rg.addColorStop(0, `hsla(${(b.hue + RUN.hueShift + wT * 5 * RUN.gooSpin) % 360},92%,56%,0.80)`);
    rg.addColorStop(1, "hsla(0,0%,100%,0)");
    lg.fillStyle = rg;
    lg.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    /* the film catches the light along the top of every bulge */
    const rim = lg.createRadialGradient(b.x, b.y, b.r * 0.52, b.x, b.y, b.r * 0.92);
    rim.addColorStop(0, "rgba(255,255,255,0)");
    rim.addColorStop(0.72, "rgba(255,255,255,0.10)");
    rim.addColorStop(1, "rgba(255,255,255,0)");
    lg.fillStyle = rim;
    lg.beginPath(); lg.arc(b.x, b.y, b.r * 0.95, 0, 6.3); lg.fill();
    if (W >= 700) {
    const hot = lg.createRadialGradient(
      b.x - b.r * 0.34, b.y - b.r * 0.38, 0,
      b.x - b.r * 0.34, b.y - b.r * 0.38, b.r * 0.30);
    hot.addColorStop(0, "rgba(255,255,255,0.30)");
    hot.addColorStop(1, "rgba(255,255,255,0)");
    lg.fillStyle = hot;
    lg.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
  }

  /* trapped-air specks + a plastic-sheen streak, so it reads as goo under film */
  lg.fillStyle = "rgba(255,255,255,0.10)";
  for (const sp of gooSpecks) {
    lg.beginPath();
    lg.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
    lg.fill();
  }
  /* oil-slick iridescence: two rainbow washes sliding against the drift */
  lg.globalCompositeOperation = "overlay";
  const passes = W < 700 ? 1 : 2;
  for (let k = 0; k < passes; k++) {
    const a2 = (k ? -1 : 1) * (wT * (0.09 + k * 0.05)) + k * 2.2;
    const dx2 = Math.cos(a2), dy2 = Math.sin(a2);
    const og = lg.createLinearGradient(
      W / 2 - dx2 * W * 0.55, H / 2 - dy2 * H * 0.55,
      W / 2 + dx2 * W * 0.55, H / 2 + dy2 * H * 0.55);
    for (let st = 0; st <= 4; st++) {
      og.addColorStop(st / 4, `hsla(${((wT * 16 * (k + 1)) + st * 90) % 360},95%,60%,0.16)`);
    }
    lg.fillStyle = og;
    lg.fillRect(0, 0, W, H);
  }
  lg.globalCompositeOperation = "source-over";

  /* a hard little reflection sliding over the plastic — a broad sheen alone
     reads as fog; it takes one crisp highlight to read as a surface */
  const hx2 = W * (0.24 + 0.06 * Math.sin(wT * 0.23));
  const hy2 = H * (0.20 + 0.05 * Math.sin(wT * 0.31 + 1.1));
  const hr = Math.min(W, H) * 0.16;
  const spec2 = lg.createRadialGradient(hx2, hy2, 0, hx2, hy2, hr);
  spec2.addColorStop(0, "rgba(255,255,255,0.30)");
  spec2.addColorStop(0.45, "rgba(255,255,255,0.09)");
  spec2.addColorStop(1, "rgba(255,255,255,0)");
  lg.save();
  lg.translate(hx2, hy2); lg.scale(1.7, 1); lg.translate(-hx2, -hy2);
  lg.fillStyle = spec2;
  lg.fillRect(hx2 - hr * 1.2, hy2 - hr, hr * 2.4, hr * 2);
  lg.restore();

  /* tooth, and the roll-off at the edges that makes it sit in the frame
     like an object — both on the half-res canvas, four times cheaper and
     indistinguishable once it is blown back up */
  if (!gooTile) buildGooTile();
  if (!gooPat) gooPat = lg.createPattern(gooTile, "repeat");
  lg.globalAlpha = 0.16;
  lg.fillStyle = gooPat;
  lg.fillRect(0, 0, W, H);
  lg.globalAlpha = 1;
  const vg = lg.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.28,
                                     W * 0.5, H * 0.46, Math.max(W, H) * 0.78);
  vg.addColorStop(0, "rgba(24,12,34,0)");
  vg.addColorStop(1, "rgba(20,8,30,0.46)");
  lg.fillStyle = vg;
  lg.fillRect(0, 0, W, H);

  /* composite the soft stack up to full res in one blit */
  gtx.drawImage(gooLow, 0, 0, W, H);

  /* pressed spots stay smudged for a while, then heal */
  for (let i = gooSmears.length - 1; i >= 0; i--) {
    const sm = gooSmears[i];
    sm.life -= dt;
    if (sm.life <= 0) { gooSmears.splice(i, 1); continue; }
    const sg = gtx.createRadialGradient(sm.x, sm.y, 0, sm.x, sm.y, sm.r);
    sg.addColorStop(0, `rgba(30,20,40,${0.10 * Math.min(1, sm.life / 4)})`);
    sg.addColorStop(1, "rgba(30,20,40,0)");
    gtx.fillStyle = sg;
    gtx.fillRect(sm.x - sm.r, sm.y - sm.r, sm.r * 2, sm.r * 2);
  }

  gtx.save();
  gtx.translate(W * 0.5, H * 0.4);
  gtx.rotate(-0.5 + Math.sin(wT * 0.3) * 0.06);
  const sheen = gtx.createLinearGradient(0, -60, 0, 60);
  sheen.addColorStop(0, "rgba(255,255,255,0)");
  sheen.addColorStop(0.5, "rgba(255,255,255,0.12)");
  sheen.addColorStop(1, "rgba(255,255,255,0)");
  gtx.fillStyle = sheen;
  gtx.fillRect(-W, -60, W * 2, 120);
  gtx.restore();



  /* the tears: punch through to the white, leave frayed edges */
  if (gooFringes.length) {
    gtx.globalCompositeOperation = "destination-out";
    gtx.drawImage(tearCanvas, 0, 0);
    gtx.globalCompositeOperation = "source-over";
    gtx.strokeStyle = "rgba(255,255,255,0.85)";
    gtx.lineWidth = 4;
    for (const f of gooFringes) gtx.stroke(f);
    gtx.strokeStyle = "rgba(255,255,255,0.7)";
    gtx.lineWidth = 1.3;
    for (const sPath of gooStrands) gtx.stroke(sPath);
  }

  /* shreds fluttering off fresh rips */
  for (let i = gooScraps.length - 1; i >= 0; i--) {
    const sc = gooScraps[i];
    sc.life -= dt;
    if (sc.life <= 0) { gooScraps.splice(i, 1); continue; }
    sc.vy += 420 * dt;
    sc.x += sc.vx * dt; sc.y += sc.vy * dt;
    sc.vx *= 1 - Math.min(1, 1.5 * dt);
    sc.rot += sc.vr * dt;
    gtx.save();
    gtx.translate(sc.x, sc.y);
    gtx.rotate(sc.rot);
    gtx.globalAlpha = Math.min(1, sc.life);
    gtx.fillStyle = `hsl(${sc.hue},80%,62%)`;
    gtx.fillRect(-sc.w / 2, -sc.h / 2, sc.w, sc.h);
    gtx.restore();
  }
  gtx.globalAlpha = 1;

  /* gushes: the squish rippling out from under your press */
  for (let i = gooGush.length - 1; i >= 0; i--) {
    const gsh = gooGush[i];
    gsh.life -= dt * 1.5;
    if (gsh.life <= 0) { gooGush.splice(i, 1); continue; }
    gsh.r += gsh.vr * dt;
    /* the bulge: goo squeezed bright at the center, compressed dark at the rim */
    gtx.beginPath();
    gtx.arc(gsh.x, gsh.y, Math.max(1, gsh.r * 0.45), 0, Math.PI * 2);
    gtx.fillStyle = `rgba(255,255,255,${0.28 * gsh.life})`;
    gtx.fill();
    gtx.beginPath();
    gtx.arc(gsh.x, gsh.y, gsh.r, 0, Math.PI * 2);
    gtx.strokeStyle = `rgba(255,255,255,${0.45 * gsh.life})`;
    gtx.lineWidth = 7 * gsh.life + 1;
    gtx.stroke();
    gtx.beginPath();
    gtx.arc(gsh.x, gsh.y, gsh.r * 0.75, 0, Math.PI * 2);
    gtx.strokeStyle = `rgba(0,0,0,${0.10 * gsh.life})`;
    gtx.lineWidth = 10 * gsh.life + 1;
    gtx.stroke();
  }
}

function startGurgle() {
  const ac = audio(); if (!ac) return;
  const src = ac.createBufferSource(); src.buffer = noise(ac); src.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.6;
  const g = ac.createGain(); g.gain.value = 0.16;
  src.connect(bp); bp.connect(g); g.connect(BUS);
  src.start();
  gurgle = { src, bp, g };
}

/* ================= the finale =================
   The white paper takes an ink drop, the drop splatters, and then the ink
   lets go: it floods the frame and the weather comes in. */
const finCanvas = document.getElementById("finale");
const fctx = finCanvas.getContext("2d");
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let finActive = false, fT = 0;
let inkY = 0, inkV = 0, splatT = -1, splatBlobs = [], splatDots = [], splatArms = [];

function sizeFinale() {
  /* the storm is thousands of thin strokes over full-screen fills — it is
     entirely fill-rate bound, so it renders at 1x and lets the browser
     upscale. Costs 2.25x less than 1.5x and is invisible in motion. */
  const dpr = 1;
  finCanvas.width = window.innerWidth * dpr;
  finCanvas.height = window.innerHeight * dpr;
  finCanvas.style.width = window.innerWidth + "px";
  finCanvas.style.height = window.innerHeight + "px";
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildRain();
}

/* ================= the storm =================
   The ink does not spin. It lets go: the blot creeps outward with a ragged
   edge, runs stream down the paper the way wet ink does, and the whole
   frame floods to black. Then it rains — three parallax layers sheared by
   gusts that never repeat, drops that part around your cursor, splashes
   coming back off the ground. Lightning is a real channel, built by
   recursive midpoint displacement with its own branches, and the thunder
   arrives late by however far away the strike was. Near ones shake the
   frame. Then the cord drops out of the dark. */

let inkRuns = [], inkEdge = [], inkLag = [];
const INK_N = 72;
function buildInk(cx, cy) {
  /* correlated noise, not white noise — smoothing the ring a few times is
     what turns a spiky polygon into something that reads as spreading ink */
  inkEdge = [];
  for (let i = 0; i < INK_N; i++) inkEdge.push(Math.random());
  for (let pass = 0; pass < 4; pass++) {
    const s = inkEdge.slice();
    for (let i = 0; i < INK_N; i++)
      inkEdge[i] = (s[(i - 1 + INK_N) % INK_N] + s[i] * 2 + s[(i + 1) % INK_N]) / 4;
  }
  /* each lobe sets off at its own moment, so it creeps rather than balloons */
  inkLag = [];
  for (let i = 0; i < INK_N; i++) inkLag.push(0.10 + Math.random() * 0.34);
  for (let pass = 0; pass < 3; pass++) {
    const s = inkLag.slice();
    for (let i = 0; i < INK_N; i++)
      inkLag[i] = (s[(i - 1 + INK_N) % INK_N] + s[i] + s[(i + 1) % INK_N]) / 3;
  }
  inkRuns = [];
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, d = 20 + Math.random() * 190;
    inkRuns.push({
      x0: Math.cos(a) * d, y0: Math.sin(a) * d * 0.7,
      len: 200 + Math.random() * 780, w: 3 + Math.random() * 13,
      wob: (Math.random() - 0.5) * 34, ph: Math.random() * 6.3,
      d: Math.random() * 0.16,
    });
  }
}

let rainL = null, drops = null, splashes = [];
function buildRain() {
  const W = window.innerWidth, H = window.innerHeight;
  const tier = Math.max(0.42, Math.min(1, (W * H) / (1500 * 860)));
  rainL = [
    { n: Math.round(240 * tier), v: 640, len: 15, w: 0.9, a: 0.30, par: 0.42 },
    { n: Math.round(150 * tier), v: 1020, len: 28, w: 1.35, a: 0.52, par: 0.72 },
    { n: Math.round(78 * tier), v: 1520, len: 48, w: 2.1, a: 0.80, par: 1.0 },
  ];
  drops = rainL.map(L => {
    const a = [];
    for (let i = 0; i < L.n; i++)
      a.push({ x: Math.random() * W * 1.5 - W * 0.25, y: Math.random() * H, vx: 0 });
    return a;
  });
  splashes = [];
}

let wind = 0, windT = 0, gust = 0;
let ptrX = 0, ptrY = 0, ptrVX = 0, ptrT = 0, lastPX = 0, lastPT = 0;
let bolt = null, boltT = 0, nextBolt = 0.9, flashA = 0, shake = 0;
const BOLT_SEQ = [1, 0.22, 0.95, 0.14, 0.62, 0.08, 0.34, 0.06, 0.18];

/* the storm reads your cursor as wind — drops part around a fast swipe */
window.addEventListener("pointermove", (e) => {
  if (!finActive || nightPhase) return;
  const now = performance.now();
  const dtp = Math.max(8, now - lastPT);
  ptrVX = (e.clientX - lastPX) / dtp * 1000;
  lastPX = e.clientX; lastPT = now;
  ptrX = e.clientX; ptrY = e.clientY; ptrT = 0.35;
}, { passive: true });

function makeBolt(W, H, dist) {
  const x0 = W * (0.06 + Math.random() * 0.88);
  let list = [{ x: x0, y: -30 },
              { x: x0 + (Math.random() - 0.5) * W * 0.55, y: H * (0.52 + Math.random() * 0.55) }];
  let disp = W * 0.10;
  for (let it = 0; it < 6; it++) {
    const out = [list[0]];
    for (let i = 1; i < list.length; i++) {
      const a = list[i - 1], b = list[i];
      const nx = -(b.y - a.y), ny = b.x - a.x;
      const nl = Math.hypot(nx, ny) || 1;
      const o = (Math.random() - 0.5) * disp;
      out.push({ x: (a.x + b.x) / 2 + nx / nl * o, y: (a.y + b.y) / 2 + ny / nl * o });
      out.push(b);
    }
    list = out; disp *= 0.56;
  }
  const branches = [];
  const nb = 1 + (Math.random() * (1 + 4 * RUN.forky) | 0);
  for (let k = 0; k < nb; k++) {
    const i = 6 + (Math.random() * (list.length - 12) | 0);
    const p = list[i];
    let a = Math.atan2(list[i + 1].y - p.y, list[i + 1].x - p.x) + (Math.random() - 0.5) * 1.6;
    const steps = 6 + (Math.random() * 7 | 0);
    const seg = H * (0.08 + Math.random() * 0.20) / steps;
    const bl = [p];
    let bx = p.x, by = p.y;
    for (let s = 0; s < steps; s++) {
      a += (Math.random() - 0.5) * 0.7;
      bx += Math.cos(a) * seg; by += Math.abs(Math.sin(a)) * seg * 0.9 + seg * 0.3;
      bl.push({ x: bx, y: by });
    }
    branches.push(bl);
  }
  return { main: list, branches, life: 0.38 + Math.random() * 0.22,
           power: 1 - dist * 0.72 };
}

function drawBolt(b, vis) {
  const trace = (pts) => {
    fctx.beginPath();
    for (let i = 0; i < pts.length; i++)
      i ? fctx.lineTo(pts[i].x, pts[i].y) : fctx.moveTo(pts[i].x, pts[i].y);
    fctx.stroke();
  };
  fctx.save();
  fctx.lineCap = "round"; fctx.lineJoin = "round";
  fctx.globalCompositeOperation = "lighter";
  const p = vis * b.power;
  /* glow, channel, then a hard white core — that stack is what makes it
     read as light rather than a drawn line */
  fctx.strokeStyle = `rgba(120,160,255,${(0.16 * p).toFixed(3)})`;
  fctx.lineWidth = 16; trace(b.main);
  fctx.strokeStyle = `rgba(180,205,255,${(0.34 * p).toFixed(3)})`;
  fctx.lineWidth = 6; trace(b.main);
  for (const br of b.branches) { fctx.lineWidth = 3; trace(br); }
  fctx.strokeStyle = `rgba(255,255,255,${(0.95 * p).toFixed(3)})`;
  fctx.lineWidth = 1.8; trace(b.main);
  fctx.lineWidth = 1.0;
  for (const br of b.branches) trace(br);
  fctx.restore();
}

/* --- sound: a rain bed, wind, and thunder that arrives when it should --- */
let stormAudio = null;
function startStorm() {
  const ac = audio(); if (!ac || stormAudio) return;
  const nb = noise(ac);
  const mk = (type, freq, q) => {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type;
    f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); g.gain.value = 0.0001;
    s.connect(f); f.connect(g); g.connect(BUS);
    s.start();
    return { s, f, g };
  };
  const rain = mk("highpass", 1400, 0.6);
  const wnd = mk("bandpass", 340, 0.55);
  /* the wind breathes rather than sitting flat */
  const lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.16;
  const lg = ac.createGain(); lg.gain.value = 0.055;
  lfo.connect(lg); lg.connect(wnd.g.gain); lfo.start();
  stormAudio = { rain, wnd, lfo };
}

function stormLevel(v) {
  if (!stormAudio || !AC) return;
  const t = AC.currentTime;
  stormAudio.rain.g.gain.setTargetAtTime(0.055 * v, t, 0.4);
  stormAudio.wnd.g.gain.setTargetAtTime(0.075 * v, t, 0.6);
  stormAudio.rain.f.frequency.setTargetAtTime(1400 - 500 * v, t, 0.5);
}

function stopStorm() {
  if (!stormAudio || !AC) return;
  const t = AC.currentTime;
  const S = stormAudio; stormAudio = null;
  S.rain.g.gain.setTargetAtTime(0.0001, t, 0.35);
  S.wnd.g.gain.setTargetAtTime(0.0001, t, 0.5);
  setTimeout(() => {
    try { S.rain.s.stop(); S.wnd.s.stop(); S.lfo.stop(); } catch (e) {}
  }, 2200);
}

function thunder(power, dist, px) {
  const ac = audio(); if (!ac) return;
  /* sound is slow: the further off the strike, the later and duller it lands */
  const t0 = ac.currentTime + 0.12 + dist * 3.4;
  const dur = 2.2 + dist * 3.2;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(Math.max(70, 420 - dist * 300), t0);
  lp.frequency.exponentialRampToValueAtTime(52, t0 + dur);
  const g = ac.createGain();
  const peak = Math.max(0.02, 0.26 * power);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.05 + dist * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const dst = at(px) || BUS;
  s.connect(lp); lp.connect(g); g.connect(dst);
  s.start(t0); s.stop(t0 + dur + 0.4);
  /* close strikes crack before they rumble */
  if (dist < 0.36) {
    const c = ac.createBufferSource(); c.buffer = noise(ac);
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const cg = ac.createGain();
    cg.gain.setValueAtTime(0.30 * (1 - dist / 0.36), t0);
    cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
    c.connect(hp); hp.connect(cg); cg.connect(dst);
    c.start(t0); c.stop(t0 + 0.3);
  }
}

function startFinale() {
  if (finActive) return;
  finCanvas.style.background = "#fdfdfb";     /* the paper is back */
  sizeFinale();
  finActive = true;
  fT = 0; inkY = 0; inkV = 0; splatT = -1;
  finCanvas.style.display = "block";

  /* every earlier layer is spent by now. They were still full-screen
     canvases the compositor had to blend on every single frame, for
     nothing — that is pure GPU cost, and it is worst on phones. */
  for (const id of ["glue", "glitter", "goo", "dot", "stage", "veil"]) {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  }

  const rnd = (a, b) => a + Math.random() * (b - a);
  splatBlobs = []; splatDots = []; splatArms = [];
  for (let i = 0; i < 15; i++) {
    const a = rnd(0, Math.PI * 2), d = rnd(0, 46);
    splatBlobs.push({ a, d, r: rnd(16, 54), sq: rnd(0.6, 1.3), rot: rnd(0, 6.3) });
  }
  for (let i = 0; i < 34; i++) {
    const a = rnd(0, Math.PI * 2);
    splatDots.push({ a, d: rnd(55, 235), r: rnd(1.6, 9) });
  }
  for (let i = 0; i < 9; i++) {
    const a = rnd(0, Math.PI * 2);
    splatArms.push({ a, len: rnd(60, 190), w: rnd(4, 14), curl: rnd(-0.5, 0.5) });
  }

  inkRuns = []; splashes = [];
  bolt = null; boltT = 0; nextBolt = 1.0; flashA = 0; shake = 0;
  windT = 0; wind = 0;
}

/* --- pieces --- */
function capsule(x1, y1, x2, y2, w, col) {
  fctx.strokeStyle = col; fctx.lineWidth = w; fctx.lineCap = "round";
  fctx.beginPath(); fctx.moveTo(x1, y1); fctx.lineTo(x2, y2); fctx.stroke();
}

/* a limb with the same three-layer treatment as the balloons:
   dark rim, body, highlight offset toward the light */
function limb(x1, y1, x2, y2, w, base, dark, light) {
  fctx.lineCap = "round";
  fctx.strokeStyle = dark; fctx.lineWidth = w;
  fctx.beginPath(); fctx.moveTo(x1, y1); fctx.lineTo(x2, y2); fctx.stroke();
  fctx.strokeStyle = base; fctx.lineWidth = w * 0.82;
  fctx.beginPath(); fctx.moveTo(x1, y1); fctx.lineTo(x2, y2); fctx.stroke();
  fctx.strokeStyle = light; fctx.lineWidth = w * 0.3;
  fctx.beginPath();
  fctx.moveTo(x1 - w * 0.16, y1 - w * 0.18);
  fctx.lineTo(x2 - w * 0.16, y2 - w * 0.18);
  fctx.stroke();
}
function ball(x, y, r, base, dark, light) {
  const g = fctx.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.05, x, y, r * 1.08);
  g.addColorStop(0, light);
  g.addColorStop(0.55, base);
  g.addColorStop(1, dark);
  fctx.fillStyle = g;
  fctx.beginPath(); fctx.arc(x, y, r, 0, 6.3); fctx.fill();
}

/* The 1996 baby: chunky, rendered, and doing the cha-cha. Weight shifts
   on every beat, arms pump on the off-beat, knees bend under the weight,
   and every eight beats it turns all the way around. */
const sstep = (a, b, t) => { const x = Math.max(0, Math.min(1, (t-a)/(b-a))); return x*x*(3-2*x); };

function finaleFrame(dt) {
  if (!finActive) return;
  if (nightPhase) { drawNight(dt); return; }   // the party is over
  fT += dt;
  if (fT > 15.5) showCord();
  const W = window.innerWidth, H = window.innerHeight;
  const cx = W / 2, cy = H * 0.46;


  const ink = "#0b0b0d";
  hardClear(finCanvas, fctx);

  /* ---- 1. the ink drop ---- */
  if (splatT < 0) {
    const swell = Math.min(1, fT / 1.0);
    if (fT < 1.0) {
      fctx.fillStyle = ink;
      const r = 6 + swell * 15;
      fctx.beginPath();
      fctx.ellipse(cx, r * 0.7, r * 0.8, r * (0.9 + swell * 0.35), 0, 0, 6.3);
      fctx.fill();
    } else {
      inkV += 2400 * dt; inkY += inkV * dt;
      const y = 18 + inkY;
      fctx.fillStyle = ink;
      const st = Math.min(1, inkV / 900);
      fctx.beginPath();
      fctx.ellipse(cx, y, 17 - st * 6, 20 + st * 30, 0, 0, 6.3);
      fctx.fill();
      fctx.globalAlpha = 0.5;
      capsule(cx, y - 30 - st * 60, cx, y, 6 - st * 3, ink);
      fctx.globalAlpha = 1;
      if (y >= cy) { splatT = fT; splatSound(); }
    }
  }

  /* ---- 2. the splatter ---- */
  if (splatT >= 0) {
    const age = fT - splatT;
    const g = 1 - Math.pow(1 - Math.min(1, age / 0.45), 3);
    fctx.fillStyle = ink;
    for (const b of splatBlobs) {
      fctx.save(); fctx.translate(cx + Math.cos(b.a)*b.d*g, cy + Math.sin(b.a)*b.d*g);
      fctx.rotate(b.rot);
      fctx.beginPath(); fctx.ellipse(0, 0, b.r*g, b.r*b.sq*g, 0, 0, 6.3); fctx.fill();
      fctx.restore();
    }
    for (const a of splatArms) {
      const ex = cx + Math.cos(a.a + a.curl) * a.len * g;
      const ey = cy + Math.sin(a.a + a.curl) * a.len * g;
      capsule(cx + Math.cos(a.a)*20*g, cy + Math.sin(a.a)*20*g, ex, ey, a.w*g, ink);
      fctx.beginPath(); fctx.arc(ex, ey, a.w*0.7*g, 0, 6.3); fctx.fill();
    }
    for (const d of splatDots) {
      fctx.beginPath();
      fctx.arc(cx + Math.cos(d.a)*d.d*g, cy + Math.sin(d.a)*d.d*g, d.r*g, 0, 6.3);
      fctx.fill();
    }
  }

  /* ---- 3. the ink lets go and floods the frame ---- */
  const fl = sstep(1.8, 6.6, fT);
  if (fl > 0) {
    if (!inkRuns.length) buildInk(cx, cy);
    fctx.fillStyle = ink;
    /* the blot creeps outward with a ragged edge */
    const R = Math.max(W, H) * 0.82;
    const P = [];
    for (let i = 0; i < INK_N; i++) {
      const a = i / INK_N * Math.PI * 2;
      const g = Math.max(0, (fl - inkLag[i]) / (1 - inkLag[i]));
      const r = R * Math.pow(g, 2.6) * (0.60 + inkEdge[i] * 0.62);
      P.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.86 });
    }
    /* through the midpoints, so the outline is a curve and not a polygon */
    fctx.beginPath();
    fctx.moveTo((P[INK_N - 1].x + P[0].x) / 2, (P[INK_N - 1].y + P[0].y) / 2);
    for (let i = 0; i < INK_N; i++) {
      const c = P[i], n = P[(i + 1) % INK_N];
      fctx.quadraticCurveTo(c.x, c.y, (c.x + n.x) / 2, (c.y + n.y) / 2);
    }
    fctx.closePath(); fctx.fill();
    /* and runs down the paper the way wet ink actually does */
    fctx.lineCap = "round"; fctx.strokeStyle = ink;
    for (const r of inkRuns) {
      const g = Math.max(0, Math.min(1, (fl - r.d) / (1 - r.d * 0.7)));
      if (g <= 0) continue;
      const L = r.len * g * g;
      fctx.lineWidth = r.w * (1 - g * 0.45);
      fctx.beginPath();
      fctx.moveTo(cx + r.x0, cy + r.y0);
      for (let s = 1; s <= 5; s++) {
        const t = s / 5;
        fctx.lineTo(cx + r.x0 + Math.sin(t * 5 + r.ph) * r.wob * t,
                    cy + r.y0 + L * t);
      }
      fctx.stroke();
      fctx.beginPath();     // the bead at the head of the run
      fctx.arc(cx + r.x0 + Math.sin(5 + r.ph) * r.wob, cy + r.y0 + L,
               r.w * 0.62 * (1 - g * 0.3), 0, 6.3);
      fctx.fill();
    }
    /* whatever is left goes under */
    if (fl > 0.66) {
      fctx.globalAlpha = sstep(0.66, 1.0, fl);
      fctx.fillStyle = "#07070a";
      fctx.fillRect(-40, -40, W + 80, H + 80);
      fctx.globalAlpha = 1;
    }
  }

  /* everything from here on is the storm, and it gets knocked about
     by the near strikes */
  const inten = sstep(3.2, 8.8, fT);
  if (inten > 0) {
    if (!drops) buildRain();
    startStorm();
    stormLevel(inten);

    shake *= Math.exp(-dt * 4.2);
    const sx = (Math.random() - 0.5) * shake * 13, sy = (Math.random() - 0.5) * shake * 9;
    fctx.save();
    fctx.translate(sx, sy);

    /* ---- 4. wind ---- */
    windT += dt;
    /* three sines that never line up, so the gusts never repeat */
    gust = Math.sin(windT * 0.37) * 0.55 + Math.sin(windT * 0.83 + 1.7) * 0.3
         + Math.sin(windT * 1.61 + 4.1) * 0.17;
    wind = RUN.windDir * (0.44 + gust * 0.52) * inten * RUN.rainHard;

    /* ---- 5. rain, three layers deep ---- */
    const ptrOn = ptrT > 0;
    ptrT = Math.max(0, ptrT - dt);
    for (let li = 0; li < rainL.length; li++) {
      const L = rainL[li], arr = drops[li];
      const vy = L.v * (0.55 + 0.45 * inten);
      const vx0 = wind * L.par * 1450;
      const mag = Math.hypot(vx0, vy) || 1;
      const ux = vx0 / mag * L.len * inten, uy = vy / mag * L.len * inten;
      const R2 = (150 * L.par) * (150 * L.par);
      fctx.beginPath();
      for (const d of arr) {
        if (ptrOn && li > 0) {
          const ddx = d.x - ptrX, ddy = d.y - ptrY, d2 = ddx * ddx + ddy * ddy;
          if (d2 < R2) {
            const f = (1 - d2 / R2) * L.par;
            d.vx += (ptrVX * 0.5 + ddx * 1.6) * f * dt * 8;
          }
        }
        d.vx *= Math.pow(0.05, dt);
        d.x += (vx0 + d.vx) * dt;
        d.y += vy * dt;
        if (d.y > H) {
          if (li === 2 && Math.random() < 0.30 && splashes.length < 90)
            splashes.push({ x: d.x, y: H - 2 - Math.random() * 10,
                            vx: (Math.random() - 0.5) * 90 + vx0 * 0.12,
                            vy: -60 - Math.random() * 110, life: 1 });
          d.y = -24 - Math.random() * 90;
          d.x = Math.random() * W * 1.5 - W * 0.25;
          d.vx = 0;
        }
        if (d.x < -W * 0.28) d.x += W * 1.5;
        else if (d.x > W * 1.22) d.x -= W * 1.5;
        fctx.moveTo(d.x, d.y);
        fctx.lineTo(d.x - ux, d.y - uy);
      }
      fctx.strokeStyle = `rgba(${RUN.stormTint[0]},${RUN.stormTint[1]},${RUN.stormTint[2]},${(L.a * inten * RUN.rainHard * (0.62 + 0.55 * flashA)).toFixed(3)})`;
      fctx.lineWidth = L.w;
      fctx.stroke();
    }

    /* rain hitting the ground and coming back up */
    fctx.strokeStyle = `rgba(206,220,240,${(0.55 * inten).toFixed(3)})`;
    fctx.lineWidth = 1.1;
    fctx.beginPath();
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.life -= dt * 2.6;
      if (s.life <= 0) { splashes.splice(i, 1); continue; }
      s.vy += 900 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      fctx.moveTo(s.x, s.y);
      fctx.lineTo(s.x - s.vx * 0.012, s.y - s.vy * 0.012);
    }
    fctx.stroke();

    /* ---- 6. lightning ---- */
    if (fT > 5.6) {
      nextBolt -= dt;
      if (nextBolt <= 0) {
        const dist = Math.pow(Math.random(), 1.6);        // near strikes are rarer
        bolt = makeBolt(W, H, dist);
        boltT = 0;
        thunder(bolt.power, dist, bolt.main[0].x);
        if (dist < 0.34 && !REDUCED) shake = Math.max(shake, 0.55 + (0.34 - dist) * 1.6);
        /* strikes get closer together as it builds, but never fast enough
           to read as a strobe */
        nextBolt = ((REDUCED ? 3.4 : 1.25) + Math.random() * (REDUCED ? 4 : 3.2)
                    - inten * 0.55) / RUN.boltRate;
      }
    }
    flashA = 0;
    if (bolt) {
      boltT += dt;
      const step = Math.floor(boltT / 0.052);
      const vis = step < BOLT_SEQ.length
        ? BOLT_SEQ[step] * (1 - boltT / bolt.life) : 0;
      if (boltT > bolt.life) bolt = null;
      else if (vis > 0.01) {
        flashA = Math.min(1, vis * bolt.power) * (REDUCED ? 0.16 : 1);
        /* the sky lights up from wherever the channel is */
        const fg = fctx.createLinearGradient(0, 0, 0, H);
        const a0 = 0.42 * flashA, a1 = 0.10 * flashA;
        fg.addColorStop(0, `rgba(214,228,255,${a0.toFixed(3)})`);
        fg.addColorStop(1, `rgba(150,175,225,${a1.toFixed(3)})`);
        fctx.fillStyle = fg;
        fctx.fillRect(-40, -40, W + 80, H + 80);
        drawBolt(bolt, vis);
      }
    }

    /* ---- 7. the wash at the bottom ---- */
    const wh = H * 0.055;
    const wg = fctx.createLinearGradient(0, H - wh, 0, H);
    wg.addColorStop(0, `rgba(34,42,60,${(0.50 * inten).toFixed(3)})`);
    wg.addColorStop(1, `rgba(12,16,28,${(0.80 * inten).toFixed(3)})`);
    fctx.fillStyle = wg;
    fctx.fillRect(0, H - wh, W, wh);
    if (flashA > 0.02) {
      for (let i = 0; i < 5; i++) {
        const y = H - wh + 4 + i * (wh / 6.5);
        fctx.fillStyle = `rgba(190,208,240,${(0.11 * flashA * (1 - i / 6)).toFixed(3)})`;
        fctx.fillRect(0, y + Math.sin(windT * 1.6 + i * 1.7) * 2.2, W, 1);
      }
    }
    fctx.restore();
  }
}

/* ================= lights out =================
   A pull cord drops out of the storm. Yank it and the whole thing dies —
   rain, wind, thunder, all of it — and what is left is a clear night sky. */
const cordEl = document.getElementById("cord");
let cordShown = false, cordPull = 0, cordDrag = null;
let nightPhase = 0, nightT = 0, stars = [], shooters = [], nightPad = null;

/* Orion, from the real thing: right ascension and declination projected
   flat (east to the left, north up) and normalised. Betelgeuse runs warm,
   Rigel runs blue — because they do. */
/* ================= what you get this time =================
   The site was identical on every visit, which makes it a recording. It
   is not any more: the sky, the weather, the light, the colours and the
   coastline are all drawn once when you arrive and hold for the visit,
   so a run is coherent but no two are the same. Everything derives from
   one seed, which means a run can be named and shared. */
const RUN_SEED = (Math.random() * 0xffffffff) >>> 0;
let _rs = RUN_SEED || 1;
function rnd() {                       /* xorshift32 — same seed, same visit */
  _rs ^= _rs << 13; _rs >>>= 0;
  _rs ^= _rs >> 17;
  _rs ^= _rs << 5; _rs >>>= 0;
  return _rs / 4294967296;
}
const pick = a => a[(rnd() * a.length) | 0];

/* --- the sky. Real shapes, real relative magnitudes, real colours. --- */
const SKIES = {

/* everything the visit decides up front */
const RUN = (() => {
  const skyKey = pick(Object.keys(SKIES));
  return {
    seed: RUN_SEED,
    skyKey, sky: SKIES[skyKey],
    /* the weather: which way it drives, how hard, and what kind of storm */
    windDir: rnd() < 0.5 ? -1 : 1,
    rainHard: 0.75 + rnd() * 0.55,
    boltRate: 0.7 + rnd() * 0.85,
    forky: 0.35 + rnd() * 0.6,          /* branchy vs clean channels */
    stormTint: pick([[190, 208, 240], [206, 202, 232], [180, 214, 236]]),
    /* the morning: where the sun comes up and what colour it brings */
    sunX: 0.34 + rnd() * 0.32,
    dawnWarm: rnd(),
    cloudN: 3 + ((rnd() * 5) | 0),
    /* the materials */
    hueShift: (rnd() * 360) | 0,
    gooSpin: 0.7 + rnd() * 0.8,
    palRot: (rnd() * 12) | 0,
  };
})();
const ORION = RUN.sky;     /* the night scene still asks for it by name */

function showCord() {
  if (cordShown) return;
  cordShown = true;
  cordEl.style.display = "block";
  requestAnimationFrame(() => cordEl.classList.add("on"));
}
cordEl.addEventListener("pointerdown", (e) => {
  if (nightPhase) return;
  e.preventDefault();
  cordEl.setPointerCapture(e.pointerId);
  cordEl.classList.add("grabbing");
  cordDrag = { y0: e.clientY };
});
cordEl.addEventListener("pointermove", (e) => {
  if (!cordDrag || nightPhase) return;
  cordPull = Math.max(0, Math.min(160, e.clientY - cordDrag.y0));
  cordEl.style.transition = "none";
  cordEl.style.transform = `translateY(${cordPull}px)`;
});
function releaseCord() {
  if (!cordDrag) return;
  cordDrag = null;
  cordEl.classList.remove("grabbing");
  cordEl.style.transition = "transform 0.4s cubic-bezier(.3,1.7,.5,1)";
  cordEl.style.transform = "translateY(0)";
  if (cordPull > 58) lightsOut();
  cordPull = 0;
}
cordEl.addEventListener("pointerup", releaseCord);
cordEl.addEventListener("pointercancel", releaseCord);

function switchClick() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2600; bp.Q.value = 2.2;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.05);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(70, t0 + 0.01);
  o.frequency.exponentialRampToValueAtTime(34, t0 + 0.3);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.3, t0 + 0.01);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
  o.connect(g2); g2.connect(BUS); o.start(t0 + 0.01); o.stop(t0 + 0.36);
}
function startNightPad() {
  const ac = audio(); if (!ac || nightPad) return;
  const g = ac.createGain(); g.gain.value = 0;
  g.gain.setTargetAtTime(0.035, ac.currentTime, 2.5);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
  lp.connect(g); g.connect(BUS);
  const oscs = [55, 82.4, 110.5].map((f, i) => {
    const o = ac.createOscillator();
    o.type = i === 2 ? "triangle" : "sine";
    o.frequency.value = f * (1 + (i - 1) * 0.002);
    o.connect(lp); o.start();
    return o;
  });
  nightPad = { oscs, g };
}
function chime(n, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const SC = [523.3, 587.3, 659.3, 784, 880, 1046.5];
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.value = SC[n % SC.length] * (n > 5 ? 2 : 1);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.055, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
  o.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 1.7);
}

function lightsOut() {
  if (nightPhase) return;
  nightPhase = 1; nightT = 0;
  stopStorm();
  bed('night');
  finCanvas.style.filter = "none";
  finCanvas.style.background = "#05060a";
  switchClick();
  cordEl.style.transition = "opacity 0.5s ease";
  cordEl.style.opacity = "0";
  setTimeout(() => { cordEl.style.display = "none"; }, 600);

  const W = window.innerWidth, H = window.innerHeight;
  stars = [];
  const N = Math.round(Math.max(120, Math.min(420, (W * H) / 2600)));
  for (let i = 0; i < N; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H,
                 r: 0.4 + Math.random() * 1.6,
                 tw: 0.35 + Math.random() * 2.1, ph: Math.random() * 6.3,
                 b: 0.22 + Math.random() * 0.78 });
  }
  shooters = [];
  setTimeout(startNightPad, 1200);
}

let lastSeg = -1;
function drawNight(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  nightT += dt;
  if (surfOn) { surfaceFrame(dt); return; }
  if (jellyOn) { jellyFrame(dt); travelFrame(dt); return; }
  if (winOn) {
    windowFrame(dt);
    travelFrame(dt);
    /* the flood off the chest fades back through the glass */
    if (whiteOut < 2.4) {
      whiteOut = Math.min(2.4, whiteOut + dt * 0.42);
      const a = Math.max(0, Math.min(1, 1 - (whiteOut - 1) / 1.2));
      if (a > 0) {
        fctx.fillStyle = `rgba(255,250,238,${a.toFixed(3)})`;
        fctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }
    return;
  }
  if (digPhase) { drawDig(dt); travelFrame(dt); return; }   /* the chart said here */
  if (chartT >= 0) drawChart(dt);
  if (dawnPhase) dawnIdle += dt;
  hardClear(finCanvas, fctx);
  fctx.fillStyle = dawnPhase ? skyGradient(dawnU) : "#05060a";
  fctx.fillRect(0, 0, W, H);

  const app = Math.min(1, nightT / 3.0);
  /* the stars go out from the horizon up as the light comes */
  const wash = dawnU * dawnU * (3 - 2 * dawnU);
  fctx.fillStyle = "#eaf2ff";
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(nightT * s.tw + s.ph);
    const alt = 1 - s.y / H;                       // 1 at the top of the sky
    const out = Math.max(0, Math.min(1, (wash - alt * 0.35) / 0.5));
    if (out >= 1) continue;
    fctx.globalAlpha = app * s.b * tw * (1 - out);
    fctx.beginPath(); fctx.arc(s.x, s.y, s.r, 0, 6.3); fctx.fill();
  }
  fctx.globalAlpha = 1;

  /* Orion */
  const SX = Math.min(W * ORION.scale[0], H * 0.62);
  const SY = Math.min(H * ORION.scale[1], W * 0.52);
  const cx = W / 2, cy = H * 0.44;
  const P = i => [cx + ORION.stars[i].p[0] * SX, cy + ORION.stars[i].p[1] * SY];
  const E = ORION.edges;
  const rev = Math.max(0, Math.min(E.length, (nightT - 2.4) / 6.0 * E.length));
  const done = Math.floor(rev);
  if (done > lastSeg && done > 0 && done <= E.length) { lastSeg = done; chime(done - 1, P(E[done - 1][1])[0]); }

  const orionA = Math.max(0, 1 - wash * 1.35);
  fctx.strokeStyle = `rgba(150,190,255,${(0.5 * orionA).toFixed(3)})`;
  fctx.lineWidth = 1.3;
  fctx.lineCap = "round";
  fctx.beginPath();
  for (let i = 0; i < Math.min(done, E.length); i++) {
    const a = P(E[i][0]), b = P(E[i][1]);
    fctx.moveTo(a[0], a[1]); fctx.lineTo(b[0], b[1]);
  }
  if (done < E.length) {
    const f = rev - done, a = P(E[done][0]), b = P(E[done][1]);
    if (f > 0) {
      fctx.moveTo(a[0], a[1]);
      fctx.lineTo(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f);
    }
  }
  fctx.stroke();

  /* the stars of Orion, each its own colour and magnitude */
  const lit = new Set();
  for (let i = 0; i < Math.min(done + 1, E.length); i++) { lit.add(E[i][0]); lit.add(E[i][1]); }
  for (let i = 0; i < ORION.stars.length; i++) {
    if (!lit.has(i)) continue;
    const st = ORION.stars[i];
    const [x, y] = P(i);
    const pulse = 0.8 + 0.2 * Math.sin(nightT * 1.5 + i * 1.7);
    const R = (5 + st.m * 12) * pulse;
    fctx.globalAlpha = Math.min(1, app) * orionA;
    const g = fctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, "rgba(255,255,255,0.98)");
    g.addColorStop(0.22, st.c);
    g.addColorStop(1, "rgba(120,160,255,0)");
    fctx.fillStyle = g;
    fctx.fillRect(x - R, y - R, R * 2, R * 2);
    /* the brightest ones throw diffraction spikes */
    if (st.m > 0.85) {
      const L = R * 2.1 * pulse;
      fctx.strokeStyle = `rgba(255,255,255,${0.32 * app * orionA})`;
      fctx.lineWidth = 1;
      fctx.beginPath();
      fctx.moveTo(x - L, y); fctx.lineTo(x + L, y);
      fctx.moveTo(x, y - L); fctx.lineTo(x, y + L);
      fctx.stroke();
    }
    fctx.fillStyle = "#ffffff";
    fctx.beginPath(); fctx.arc(x, y, 1.5 + st.m * 1.2, 0, 6.3); fctx.fill();
  }
  fctx.globalAlpha = 1;

  /* Orion finished — the sun is waiting just under the horizon */
  if (!dawnPhase && done >= E.length && nightT > 11.5) { dawnPhase = 1; dawnIdle = 0; bed('sea'); }
  if (dawnPhase) drawDawn(dt);

  /* the very occasional shooting star */
  if (!dawnPhase && nightT > 5 && Math.random() < 0.11 * dt) {
    shooters.push({ x: Math.random() * W, y: Math.random() * H * 0.5,
                    vx: -160 - Math.random() * 220, vy: 70 + Math.random() * 110, life: 1 });
  }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const sh = shooters[i];
    sh.life -= dt * 0.85;
    if (sh.life <= 0) { shooters.splice(i, 1); continue; }
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    const g = fctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 0.16, sh.y - sh.vy * 0.16);
    g.addColorStop(0, `rgba(255,255,255,${0.85 * sh.life})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    fctx.strokeStyle = g; fctx.lineWidth = 1.8;
    fctx.beginPath();
    fctx.moveTo(sh.x, sh.y);
    fctx.lineTo(sh.x - sh.vx * 0.16, sh.y - sh.vy * 0.16);
    fctx.stroke();
  }

  travelFrame(dt);
}

/* ================= dawn: the last scene =================
   Orion finishes drawing and the horizon starts to warm. A sliver of sun
   is waiting just under it. Drag it up — the sky lifts with it, the stars
   go out one by one, the sea catches the light, and the name comes back,
   this time written in it. Which is where the whole thing started. */
let dawnPhase = 0, dawnU = 0, dawnGrab = null, dawnIdle = 0;
let nameTrace = null, seaRows = null, dawnDone = 0, dawnPost = 0;
let clouds = null, birds = [];

const HORIZ = () => window.innerHeight * 0.775;

function sunGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const R = Math.max(46, Math.min(W, H) * 0.118);
  const hz = HORIZ();
  const drift = Math.min(0.42, dawnPost * 0.012) * R;   // it keeps rising, slowly
  return { x: W * RUN.sunX, y: hz + R * 0.86 - dawnU * (R * 2.30) - drift, R, hz };
}

/* the name, rebuilt from the very same balloon paths, as a polyline we can
   draw on stroke by stroke */
function buildNameTrace() {
  if (!letters.length) return null;
  const segs = [];
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const L of letters) {
    if (!L.subs) continue;
    for (const sub of L.subs) {
      const pts = sub.pts.map(p => ({ x: L.x + p.x, y: L.base - 100 + p.y }));
      let len = 0;
      for (let i = 1; i < pts.length; i++)
        len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      for (const p of pts) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      segs.push({ pts, len });
    }
  }
  if (!segs.length) return null;
  segs.sort((a, b) => a.pts[0].x - b.pts[0].x);          // left to right
  return { segs, total: segs.reduce((a, s) => a + s.len, 0), minX, maxX, minY, maxY };
}

function buildClouds() {
  const H = window.innerHeight, W = window.innerWidth;
  clouds = [];
  const N = Math.max(2, Math.round(RUN.cloudN * (W < 620 ? 0.6 : 1)));
  for (let i = 0; i < N; i++) {
    const alt = Math.pow(Math.random(), 1.7) * 0.86 + 0.06;   // 0 = horizon, 1 = zenith
    clouds.push({
      alt, x: Math.random() * W * 1.4 - W * 0.2,
      w: (0.14 + Math.random() * 0.30) * W,
      h: (0.008 + Math.random() * 0.020) * H,
      sp: (5 + Math.random() * 13) * (Math.random() < 0.5 ? -1 : 1),
      a: 0.20 + Math.random() * 0.42,
    });
  }
}

function buildSea() {
  const H = window.innerHeight, hz = HORIZ();
  const rows = [];
  for (let y = hz + 1; y < H; y += 2) {
    const d = (y - hz) / Math.max(1, H - hz);           // 0 at horizon, 1 at foot
    rows.push({ y, d, ph: Math.random() * 6.3, sp: 0.5 + Math.random() * 1.9,
                w: 0.25 + Math.random() * 0.9 });
  }
  seaRows = rows;
}

const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t,
                           a[1] + (b[1] - a[1]) * t,
                           a[2] + (b[2] - a[2]) * t];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

const NIGHT_SKY = [[5, 6, 10], [8, 11, 24], [13, 17, 38], [17, 22, 48]];
/* two dawns: one that comes up rose and one that comes up cold gold, and
   any mix of the two */
const DAWN_A = [[16, 26, 74], [72, 56, 122], [206, 108, 96], [255, 190, 122]];
const DAWN_B = [[10, 30, 62], [46, 74, 118], [168, 128, 132], [242, 206, 158]];
const DAWN_SKY = DAWN_A.map((c, i) =>
  c.map((v, k) => Math.round(v * (1 - RUN.dawnWarm) + DAWN_B[i][k] * RUN.dawnWarm)));

function skyGradient(u) {
  const H = window.innerHeight;
  const g = fctx.createLinearGradient(0, 0, 0, HORIZ());
  for (let i = 0; i < 4; i++) {
    /* the warmth arrives from the horizon upward, so lower stops turn first */
    const lag = 0.30 * (3 - i) / 3;
    const t = Math.max(0, Math.min(1, (u - lag) / (1 - lag)));
    g.addColorStop(i / 3, rgb(mixc(NIGHT_SKY[i], DAWN_SKY[i], t * t * (3 - 2 * t))));
  }
  return g;
}

function drawDawn(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  const u = dawnU, S = sunGeom();
  if (!seaRows || Math.abs(seaRows[0].y - (S.hz + 1)) > 2) buildSea();

  /* ---- sea ---- */
  const horizCol = mixc(NIGHT_SKY[3], DAWN_SKY[3], u * u * (3 - 2 * u));
  const sg = fctx.createLinearGradient(0, S.hz, 0, H);
  sg.addColorStop(0, rgb(mixc(horizCol, [10, 16, 34], 0.34)));
  sg.addColorStop(0.35, rgb(mixc(horizCol, [8, 14, 36], 0.66)));
  sg.addColorStop(1, rgb(mixc(horizCol, [4, 9, 26], 0.93)));
  fctx.fillStyle = sg;
  fctx.fillRect(0, S.hz, W, H - S.hz);

  /* the glitter path: the sun's light broken up across the swell */
  const above = Math.max(0, Math.min(1, (S.hz + S.R - S.y) / (S.R * 2)));
  if (above > 0.02) {
    fctx.save();
    fctx.globalCompositeOperation = "lighter";
    for (const r of seaRows) {
      const spread = S.R * (0.55 + r.d * 6.5);
      const n = 1 + Math.round(r.d * 5);
      for (let k = 0; k < n; k++) {
        const j = Math.sin(nightT * r.sp + r.ph + k * 2.4);
        const x = S.x + j * spread;
        const len = (2 + r.d * 16) * (0.5 + 0.5 * Math.cos(nightT * r.sp * 1.7 + r.ph));
        const a = above * (0.30 - r.d * 0.20) * (0.45 + 0.55 * Math.abs(j)) * r.w;
        if (a <= 0.004) continue;
        fctx.fillStyle = `rgba(255,${196 + 40 * (1 - r.d) | 0},${132 + 60 * (1 - r.d) | 0},${a.toFixed(3)})`;
        fctx.fillRect(x - len / 2, r.y, len, 1.4);
      }
    }
    fctx.restore();
  }

  /* ---- the sun ---- */
  fctx.save();
  fctx.beginPath();
  fctx.rect(0, 0, W, S.hz);                              // it rises out of the sea
  fctx.clip();
  const bloom = fctx.createRadialGradient(S.x, S.y, 0, S.x, S.y, S.R * 6.5);
  bloom.addColorStop(0, "rgba(255,206,140,0.42)");
  bloom.addColorStop(0.3, "rgba(255,150,96,0.16)");
  bloom.addColorStop(1, "rgba(255,120,80,0)");
  fctx.fillStyle = bloom;
  fctx.fillRect(S.x - S.R * 6.5, S.y - S.R * 6.5, S.R * 13, S.R * 13);
  const disc = fctx.createRadialGradient(S.x, S.y - S.R * 0.18, S.R * 0.05, S.x, S.y, S.R);
  disc.addColorStop(0, "#fffdf4");
  disc.addColorStop(0.55, "#ffdc93");
  disc.addColorStop(0.88, "#ffab5c");
  disc.addColorStop(1, "rgba(255,140,80,0.55)");
  fctx.fillStyle = disc;
  fctx.beginPath(); fctx.arc(S.x, S.y, S.R, 0, 6.3); fctx.fill();
  fctx.restore();

  /* a hard line where sea meets sky, brightest right under the sun */
  const hl = fctx.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, "rgba(255,190,130,0.06)");
  hl.addColorStop(0.5, `rgba(255,226,180,${(0.10 + 0.5 * above).toFixed(3)})`);
  hl.addColorStop(1, "rgba(255,190,130,0.06)");
  fctx.fillStyle = hl;
  fctx.fillRect(0, S.hz - 1, W, 2);

  /* ---- the grab affordance: it breathes, and drifts sparks upward ---- */
  if (dawnPhase === 1) {
    const puls = 0.5 + 0.5 * Math.sin(nightT * 2.1);
    fctx.save();
    fctx.beginPath(); fctx.rect(0, 0, W, S.hz); fctx.clip();
    fctx.globalCompositeOperation = "lighter";
    const gr = fctx.createRadialGradient(S.x, S.y, S.R * 0.4, S.x, S.y, S.R * (1.7 + 0.5 * puls));
    gr.addColorStop(0, `rgba(255,210,150,${(0.16 + 0.16 * puls).toFixed(3)})`);
    gr.addColorStop(1, "rgba(255,170,110,0)");
    fctx.fillStyle = gr;
    fctx.fillRect(S.x - S.R * 3, S.y - S.R * 3, S.R * 6, S.R * 6);
    if (dawnIdle > 4) {
      for (let i = 0; i < 7; i++) {
        const t = ((nightT * 0.55 + i / 7) % 1);
        const y = S.hz - t * H * 0.16;
        const x = S.x + Math.sin(nightT * 1.3 + i * 2.1) * S.R * 0.75;
        fctx.fillStyle = `rgba(255,214,160,${(0.5 * (1 - t) * Math.min(1, (dawnIdle - 4) / 2)).toFixed(3)})`;
        fctx.beginPath(); fctx.arc(x, y, 1.5 + (1 - t) * 1.6, 0, 6.3); fctx.fill();
      }
    }
    fctx.restore();
  }

  /* ---- swell: a few slow lines of water right under the horizon ---- */
  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3; i++) {
    const y = S.hz + 3 + i * 5 + Math.sin(nightT * (0.4 + i * 0.15) + i) * 1.6;
    const a = above * (0.10 - i * 0.026);
    if (a <= 0) continue;
    fctx.fillStyle = `rgba(255,206,158,${a.toFixed(3)})`;
    fctx.fillRect(0, y, W, 1);
  }
  fctx.restore();

  /* ---- cloud bars catching the light from underneath ---- */
  if (!clouds) buildClouds();
  fctx.save();
  fctx.beginPath(); fctx.rect(0, 0, W, S.hz); fctx.clip();
  for (const c of clouds) {
    c.x += c.sp * dt;
    if (c.x > W + c.w) c.x = -c.w * 1.2;
    if (c.x < -c.w * 1.4) c.x = W + c.w * 0.2;
    const cy = S.hz - c.alt * S.hz;
    /* the closer to the sun, the more light it takes on its underside */
    const near = Math.max(0, 1 - Math.abs(cy - S.y) / (H * 0.42));
    const warm = u * (0.30 + 0.70 * near);
    const g = fctx.createRadialGradient(c.x, cy, 0, c.x, cy, c.w);
    const lit = [196 + 59 * warm, 142 + 88 * warm, 148 + 42 * warm];
    const A = c.a * (0.22 + 0.52 * u);
    g.addColorStop(0, `rgba(${lit[0]|0},${lit[1]|0},${lit[2]|0},${A.toFixed(3)})`);
    g.addColorStop(0.45, `rgba(${lit[0]|0},${lit[1]|0},${lit[2]|0},${(A * 0.62).toFixed(3)})`);
    g.addColorStop(1, "rgba(132,112,142,0)");
    fctx.save();
    fctx.translate(c.x, cy);
    fctx.scale(1, c.h / c.w);
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(0, 0, c.w, 0, 6.3); fctx.fill();
    fctx.restore();
  }
  fctx.restore();

  /* ---- once the sun is up, the odd bird crosses a long way off ---- */
  if (dawnDone) {
    dawnPost += dt;
    if (birds.length < 5 && Math.random() < 0.14 * dt) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      birds.push({ x: dir > 0 ? -30 : W + 30, y: S.hz - H * (0.18 + Math.random() * 0.42),
                   v: dir * (16 + Math.random() * 26), ph: Math.random() * 6.3,
                   s: 3.5 + Math.random() * 4.5, a: 0.20 + Math.random() * 0.28 });
    }
    fctx.save();
    fctx.strokeStyle = "rgba(46,32,30,0.85)";
    fctx.lineCap = "round";
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.x += b.v * dt;
      b.y -= dt * 1.6;
      if (b.x < -60 || b.x > W + 60) { birds.splice(i, 1); continue; }
      const flap = Math.sin(nightT * 5.2 + b.ph) * 0.55;
      fctx.globalAlpha = b.a;
      fctx.lineWidth = Math.max(1, b.s * 0.22);
      fctx.beginPath();
      fctx.moveTo(b.x - b.s, b.y + flap * b.s * 0.5);
      fctx.quadraticCurveTo(b.x - b.s * 0.35, b.y - flap * b.s * 0.4, b.x, b.y);
      fctx.quadraticCurveTo(b.x + b.s * 0.35, b.y - flap * b.s * 0.4, b.x + b.s, b.y + flap * b.s * 0.5);
      fctx.stroke();
    }
    fctx.restore();
  }

  /* ---- something comes in on the tide ---- */
  if (dawnDone && botT < 0 && dawnPost > 5.5) botT = 0;
  if (botT >= 0) drawBottle(dt);

  /* ---- the name, traced back on in light ---- */
  if (!nameTrace) nameTrace = buildNameTrace();
  const NT = nameTrace;
  const rv = Math.max(0, Math.min(1, (u - 0.34) / 0.60));
  if (NT && rv > 0) {
    const bw = NT.maxX - NT.minX, bh = NT.maxY - NT.minY;
    /* clear the sun's final resting place by a comfortable margin, and if
       that pushes the name off the top, shrink it instead of clipping */
    const sunTop = S.hz - S.R * 2.44;
    const top = H * 0.055, bottom = sunTop - H * 0.05;
    let sc = Math.min(W * 0.80 / bw, H * 0.24 / bh, (bottom - top) / bh);
    const ox = W / 2 - (NT.minX + bw / 2) * sc;
    const oy = bottom - NT.maxY * sc;
    let budget = rv * NT.total;
    fctx.save();
    fctx.lineCap = "round"; fctx.lineJoin = "round";
    for (const seg of NT.segs) {
      if (budget <= 0) break;
      const take = Math.min(1, budget / seg.len);
      budget -= seg.len;
      const n = Math.max(2, Math.round(seg.pts.length * take));
      const path = () => {
        fctx.beginPath();
        for (let i = 0; i < n; i++) {
          const p = seg.pts[i];
          const x = ox + p.x * sc, y = oy + p.y * sc;
          i ? fctx.lineTo(x, y) : fctx.moveTo(x, y);
        }
      };
      fctx.globalCompositeOperation = "lighter";
      fctx.strokeStyle = `rgba(255,178,112,${(0.16 * rv).toFixed(3)})`;
      fctx.lineWidth = 15 * sc; path(); fctx.stroke();
      fctx.strokeStyle = `rgba(255,214,158,${(0.30 * rv).toFixed(3)})`;
      fctx.lineWidth = 7 * sc; path(); fctx.stroke();
      fctx.globalCompositeOperation = "source-over";
      fctx.strokeStyle = `rgba(255,248,232,${(0.55 + 0.40 * rv).toFixed(3)})`;
      fctx.lineWidth = 2.4 * sc; path(); fctx.stroke();
    }
    fctx.restore();
  }
}

/* --------- dragging the sun --------- */
function dawnHit(x, y) {
  const S = sunGeom();
  const grab = Math.max(S.R * 1.9, 64 * UIS);
  return Math.hypot(x - S.x, y - S.y) < grab ||
         (y > S.hz - S.R * 0.5 && Math.abs(x - S.x) < grab * 1.6);
}

function dawnDown(e) {
  if (dawnPhase !== 1 && dawnPhase !== 2) return;
  const x = e.clientX, y = e.clientY;
  if (!dawnHit(x, y)) return;
  dawnGrab = { y, u0: dawnU };
  dawnPhase = 2;
  dawnIdle = 0;
  /* taps raise it too, same as the pump */
  const bump = Math.min(1, dawnU + 0.11);
  if (bump > dawnU) { sunRise(bump - dawnU); dawnU = bump; }
  if (dawnU >= 1 && !dawnDone) { dawnDone = 1; dawnPhase = 3; dawnGrab = null; sunUp(); }
  finCanvas.style.cursor = "grabbing";
  if (e.cancelable) e.preventDefault();
}

function dawnMove(e) {
  if (dawnPhase === 1 && dawnHit(e.clientX, e.clientY)) finCanvas.style.cursor = "grab";
  else if (dawnPhase === 1) finCanvas.style.cursor = "";
  if (!dawnGrab) return;
  const H = window.innerHeight;
  const nu = Math.max(0, Math.min(1, dawnGrab.u0 + (dawnGrab.y - e.clientY) / (H * 0.46)));
  if (nu > dawnU) sunRise(nu - dawnU);
  dawnU = Math.max(dawnU, nu);
  dawnIdle = 0;
  if (dawnU >= 1 && !dawnDone) { dawnDone = 1; dawnPhase = 3; dawnGrab = null; sunUp(); }
  if (e.cancelable) e.preventDefault();
}

function dawnUp() {
  dawnGrab = null;
  if (dawnPhase === 2 && !dawnDone) dawnPhase = 1;
  finCanvas.style.cursor = "";
}

window.addEventListener("pointerdown", dawnDown, { passive: false });
window.addEventListener("pointermove", dawnMove, { passive: false });
window.addEventListener("pointerup", dawnUp);
window.addEventListener("pointercancel", dawnUp);

/* --------- sound: the pad opens up as the light does --------- */
let riseVoice = null, lastRise = 0;
function sunRise(d) {
  const ac = audio(); if (!ac || d < 0.004) return;
  const t0 = ac.currentTime;
  if (t0 - lastRise < 0.09) return;
  lastRise = t0;
  const o = ac.createOscillator(); o.type = "triangle";
  const base = 196 * Math.pow(2, Math.floor(dawnU * 7) / 7);   // climbs with the sun
  o.frequency.setValueAtTime(base, t0);
  o.frequency.linearRampToValueAtTime(base * 1.02, t0 + 0.5);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.030 + 0.03 * dawnU, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  o.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 1.0);
}

function sunUp() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [261.6, 329.6, 392, 523.3, 659.3].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 2 ? "sine" : "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.10);
    g.gain.exponentialRampToValueAtTime(0.055, t0 + i * 0.10 + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 5.5);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.10); o.stop(t0 + 5.8);
  });
}

/* ================= the bottle =================
   The site is an elaborate lock. This is what is behind it.
   Once the sun is properly up, something comes in on the tide: a bottle,
   riding the swell, small at the horizon and closer every wave. Pull the
   cork — the same pull the chest taught you — and the note unrolls. */

/* What is in the bottle is not a sign-off. It is a chart, and it is blank
   until the sun gets at it — old citrus ink only shows once it is warmed.
   The X on it is where this goes next. */
let botT = -1, botPull = 0, botGrab = null, botOpen = 0, botLand = 0, corkFloat = 0;
const botEl = () => document.getElementById("note");

function bottleGeom() {
  const W = window.innerWidth, H = window.innerHeight, hz = HORIZ();
  const t = Math.max(0, Math.min(1, botT / 22));
  const e = t * t * (3 - 2 * t);
  /* it comes in from the glare under the sun and lands centre-low */
  const x = W * (0.5 + (0.06 - 0.06 * e));
  const y = hz + (H - hz) * (0.06 + 0.44 * e);
  const s = Math.min(W, H) * (0.045 + 0.235 * e);
  /* the swell keeps working on it right up until it grounds */
  const rest = 1 - botLand;
  const bob = Math.sin(nightT * 1.35 + 0.6) * s * 0.055 * rest;
  const roll = Math.sin(nightT * 0.95) * 0.16 * rest - 0.34;
  return { x, y: y + bob, s, roll, hz };
}

function drawBottle(dt) {
  if (botT < 0) return;
  botT += dt;
  const B = bottleGeom();
  if (botT > 22) botLand = Math.min(1, botLand + dt * 0.6);
  const W = window.innerWidth;

  fctx.save();
  fctx.translate(B.x, B.y);
  fctx.rotate(B.roll);
  const L = B.s, w = L * 0.30;                 // length and barrel width

  /* what it sits in: a dark wet shadow and a wake on the water */
  fctx.save();
  fctx.rotate(-B.roll);
  fctx.fillStyle = "rgba(24,18,14,0.20)";
  fctx.beginPath();
  fctx.ellipse(0, L * 0.16, L * 0.52, L * 0.08, 0, 0, 6.3);
  fctx.fill();
  fctx.restore();

  const body = (inset, col) => {
    fctx.beginPath();
    fctx.moveTo(-L * 0.50 + inset, -w / 2 + inset);
    fctx.lineTo(L * 0.06 - inset, -w / 2 + inset);
    fctx.quadraticCurveTo(L * 0.20, -w / 2 + inset, L * 0.24, -w * 0.22);
    fctx.lineTo(L * 0.44 - inset, -w * 0.20);
    fctx.lineTo(L * 0.44 - inset, w * 0.20);
    fctx.lineTo(L * 0.24, w * 0.22);
    fctx.quadraticCurveTo(L * 0.20, w / 2 - inset, L * 0.06 - inset, w / 2 - inset);
    fctx.lineTo(-L * 0.50 + inset, w / 2 - inset);
    fctx.quadraticCurveTo(-L * 0.58 + inset, 0, -L * 0.50 + inset, -w / 2 + inset);
    fctx.closePath();
    if (col) { fctx.fillStyle = col; fctx.fill(); }
  };

  /* the glass: dark bottle-green, lit through from the sun side */
  const gg = fctx.createLinearGradient(0, -w / 2, 0, w / 2);
  gg.addColorStop(0, "rgba(96,132,104,0.72)");
  gg.addColorStop(0.42, "rgba(44,74,58,0.80)");
  gg.addColorStop(1, "rgba(20,38,30,0.86)");
  body(0, null); fctx.fillStyle = gg; fctx.fill();

  /* the rolled note inside, warm against the green */
  fctx.save();
  body(0, null); fctx.clip();
  fctx.fillStyle = "rgba(226,206,168,0.80)";
  fctx.beginPath();
  fctx.roundRect ? fctx.roundRect(-L * 0.34, -w * 0.20, L * 0.52, w * 0.40, w * 0.20)
                 : fctx.rect(-L * 0.34, -w * 0.20, L * 0.52, w * 0.40);
  fctx.fill();
  fctx.strokeStyle = "rgba(150,124,86,0.55)";
  fctx.lineWidth = Math.max(0.6, L * 0.006);
  for (let i = 0; i < 3; i++) {
    const x = -L * 0.30 + i * L * 0.16;
    fctx.beginPath(); fctx.moveTo(x, -w * 0.19); fctx.lineTo(x, w * 0.19); fctx.stroke();
  }
  /* a band of daylight across the glass */
  fctx.fillStyle = "rgba(255,240,205,0.20)";
  fctx.fillRect(-L * 0.55, -w * 0.5, L * 1.2, w * 0.16);
  fctx.restore();

  /* rim light down the top edge, and a hard specular */
  fctx.strokeStyle = "rgba(224,246,224,0.55)";
  fctx.lineWidth = Math.max(1, L * 0.014);
  body(L * 0.012, null); fctx.stroke();
  fctx.fillStyle = "rgba(255,255,255,0.60)";
  fctx.beginPath();
  fctx.ellipse(-L * 0.18, -w * 0.30, L * 0.16, w * 0.055, -0.05, 0, 6.3);
  fctx.fill();

  /* the cork, pulling free — and once it is out it goes in the water */
  const out = botPull * L * 0.26;
  if (botOpen) {
    fctx.restore();
    corkFloat += dt;
    const cx2 = B.x + B.s * (0.62 + Math.min(1, corkFloat * 0.28) * 0.30);
    const cy2 = B.y + B.s * 0.10 + Math.sin(nightT * 1.9) * B.s * 0.022;
    fctx.save();
    fctx.translate(cx2, cy2);
    fctx.rotate(Math.sin(nightT * 1.2) * 0.22 + 0.5);
    const cg2 = fctx.createLinearGradient(0, -w * 0.19, 0, w * 0.19);
    cg2.addColorStop(0, "#c99a63"); cg2.addColorStop(0.45, "#a9743f");
    cg2.addColorStop(1, "#7c4f28");
    fctx.fillStyle = cg2;
    fctx.beginPath();
    fctx.roundRect ? fctx.roundRect(-L * 0.065, -w * 0.19, L * 0.13, w * 0.38, w * 0.06)
                   : fctx.rect(-L * 0.065, -w * 0.19, L * 0.13, w * 0.38);
    fctx.fill();
    fctx.restore();
    /* the ring it leaves on the water */
    fctx.fillStyle = "rgba(255,232,196,0.10)";
    fctx.beginPath();
    fctx.ellipse(cx2, cy2 + B.s * 0.03, B.s * 0.13, B.s * 0.035, 0, 0, 6.3);
    fctx.fill();
    return;
  }
  const cg = fctx.createLinearGradient(0, -w * 0.20, 0, w * 0.20);
  cg.addColorStop(0, "#c99a63"); cg.addColorStop(0.45, "#a9743f");
  cg.addColorStop(1, "#7c4f28");
  fctx.fillStyle = cg;
  fctx.beginPath();
  fctx.roundRect ? fctx.roundRect(L * 0.40 + out, -w * 0.19, L * 0.13, w * 0.38, w * 0.06)
                 : fctx.rect(L * 0.40 + out, -w * 0.19, L * 0.13, w * 0.38);
  fctx.fill();
  fctx.fillStyle = "rgba(255,255,255,0.16)";
  fctx.fillRect(L * 0.41 + out, -w * 0.15, L * 0.11, w * 0.07);
  fctx.restore();

  /* below the waterline it goes soft and dark, the way things do in water */
  fctx.save();
  fctx.beginPath();
  fctx.rect(0, B.y + B.s * 0.06, W, window.innerHeight);
  fctx.clip();
  fctx.globalAlpha = 0.30;
  fctx.fillStyle = "rgba(12,22,30,0.9)";
  fctx.beginPath();
  fctx.ellipse(B.x, B.y + B.s * 0.14, B.s * 0.46, B.s * 0.12, B.roll, 0, 6.3);
  fctx.fill();
  fctx.restore();
}

/* --- pulling the cork --- */
function bottleHit(x, y) {
  if (botT < 0 || botLand < 0.9 || botOpen) return false;
  const B = bottleGeom();
  return Math.hypot(x - B.x, y - B.y) < Math.max(B.s * 0.55, 48 * UIS);
}

window.addEventListener("pointerdown", (e) => {
  if (!bottleHit(e.clientX, e.clientY)) return;
  botGrab = { y: e.clientY, p0: botPull };
  botPull = Math.min(1, botPull + 0.20);
  squeakCork();
  if (botPull >= 1 && !botOpen) { botOpen = 1; botGrab = null; openNote(); }
  if (e.cancelable) e.preventDefault();
}, { passive: false });

window.addEventListener("pointermove", (e) => {
  if (nightPhase && dawnDone && !botOpen && botLand >= 0.9)
    finCanvas.style.cursor = bottleHit(e.clientX, e.clientY) ? "grab" : "";
  if (!botGrab) return;
  const H = window.innerHeight;
  const np = Math.max(0, Math.min(1, botGrab.p0 + (botGrab.y - e.clientY) / (H * 0.22)));
  if (np > botPull && Math.random() < 0.4) squeakCork();
  botPull = Math.max(botPull, np);
  if (botPull >= 1 && !botOpen) { botOpen = 1; botGrab = null; openNote(); }
  if (e.cancelable) e.preventDefault();
}, { passive: false });

window.addEventListener("pointerup", () => { botGrab = null; });

/* click off the paper and it rolls back up, so the sunrise is not lost
   behind it; the bottle opens it again */
window.addEventListener("pointerdown", (e) => {
  if (!botOpen) return;
  const el = botEl();
  if (!el || el.contains(e.target)) return;
  const open = el.classList.contains("on");
  const B = bottleGeom();
  const onBottle = Math.hypot(e.clientX - B.x, e.clientY - B.y) < Math.max(B.s * 0.55, 48 * UIS);
  if (open && !onBottle) {
    el.classList.remove("on");
    document.getElementById("scrim").classList.remove("on");
  } else if (!open && onBottle) {
    el.classList.add("on");
    document.getElementById("scrim").classList.add("on");
  }
});

let lastSqueak = 0;
function squeakCork() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastSqueak < 0.11) return;
  lastSqueak = t0;
  const o = ac.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(150 + botPull * 260, t0);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 900 + botPull * 900; bp.Q.value = 6;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.020, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
  o.connect(bp); bp.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.15);
}

function openNote() {
  corkPopSound();
  const el = botEl(), sc = document.getElementById("scrim");
  if (!el) return;
  el.style.display = "block";
  if (sc) sc.style.display = "block";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add("on");
    if (sc) sc.classList.add("on");
    buildChart();
  }));
  el.addEventListener("pointerdown", chartClick);
  const ac = audio();
  if (ac) {                       /* paper coming unrolled */
    const t0 = ac.currentTime + 0.18;
    const s = ac.createBufferSource(); s.buffer = noise(ac);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.setValueAtTime(2600, t0);
    bp.frequency.linearRampToValueAtTime(1500, t0 + 1.0);
    bp.Q.value = 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.045, t0 + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
    s.connect(bp); bp.connect(g); g.connect(BUS);
    s.start(t0); s.stop(t0 + 1.3);
  }
}

function buildNote() {
  const el = document.createElement("div");
  el.id = "note";
  el.innerHTML = '<div class="paper"><canvas id="chart"></canvas></div>';
  document.body.appendChild(el);
}
buildNote();

/* ---- the chart, developing ----
   Citrus ink is invisible until it is heated, and then it browns before it
   darkens. So the paper comes out blank and a warm front sweeps across it,
   scorching the lines up out of nothing as it goes. */
let chartC = null, chartX = null, chartT = -1, chartGeo = null, chartDone = 0;

function buildChart() {
  const c = document.getElementById("chart");
  if (!c) return;
  const el = botEl();
  const W = Math.round(el.getBoundingClientRect().width) || 480;
  const H = Math.round(W * 0.62);
  c.width = W * 2; c.height = H * 2;
  c.style.height = H + "px";
  chartC = c; chartX = c.getContext("2d");
  chartX.setTransform(2, 0, 0, 2, 0, 0);

  /* a coastline that is recognisably the one outside the window: a long
     shore with a bay bitten out of it, and the X inland of the point */
  const shore = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const y = H * (0.30 + 0.30 * Math.sin(t * 4.1 + 0.7)
                        + 0.09 * Math.sin(t * 9.3 + 2.2)
                        + 0.04 * Math.sin(t * 17.0));
    shore.push({ x: W * (0.06 + t * 0.88), y });
  }
  const px = W * 0.66, py = H * 0.70;
  /* the dotted walk from where you land to where you dig */
  const path = [];
  const from = { x: W * 0.17, y: H * 0.80 };
  for (let i = 0; i <= 26; i++) {
    const t = i / 26;
    path.push({
      x: from.x + (px - from.x) * t + Math.sin(t * 5.6) * W * 0.045,
      y: from.y + (py - from.y) * t + Math.cos(t * 4.2) * H * 0.05,
    });
  }
  chartGeo = { W, H, shore, path, X: { x: px, y: py }, rose: { x: W * 0.855, y: H * 0.845 } };
  chartT = 0;
  chartDone = 0;
}

/* everything is drawn behind a sweeping front, so it browns into being */
function developed(g, x, y) {
  const d = Math.hypot(x - g.W * 0.42, (y - g.H * 0.42) * 1.15);
  const max = Math.hypot(g.W * 0.68, g.H * 0.72);
  return (chartT * 0.34) * max - d;      /* >0 developed, near 0 = the scorch */
}

function drawChart(dt) {
  if (!chartX || chartT < 0) return;
  const g = chartGeo, x = chartX;
  chartT += dt;
  if (chartT > 4.6) chartDone = 1;
  x.clearRect(0, 0, g.W, g.H);

  const seg = (a, b, col, w) => {
    const dA = developed(g, a.x, a.y);
    if (dA <= 0) return;
    const heat = Math.max(0, 1 - dA / 26);            /* the scorch edge */
    x.strokeStyle = heat > 0.02
      ? `rgba(${164 + 60 * heat | 0},${96 - 20 * heat | 0},${40 - 22 * heat | 0},${(0.55 + 0.45 * (1 - heat)).toFixed(2)})`
      : col;
    x.lineWidth = w * (1 + heat * 0.5);
    x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
  };

  x.lineCap = "round"; x.lineJoin = "round";
  const INK = "rgba(112,64,26,0.86)", FAINT = "rgba(126,84,44,0.42)";

  /* the sea side, hatched the way old charts are */
  for (let i = 0; i < g.shore.length - 1; i++) {
    const a = g.shore[i], b = g.shore[i + 1];
    seg(a, b, INK, 1.6);
    if (i % 2 === 0) {
      const nx = -(b.y - a.y), ny = b.x - a.x;
      const nl = Math.hypot(nx, ny) || 1;
      const L = 7 + 4 * Math.sin(i * 1.3);
      seg(a, { x: a.x - nx / nl * L, y: a.y - ny / nl * L }, FAINT, 0.9);
    }
  }

  /* the walk, dotted */
  for (let i = 0; i < g.path.length - 1; i += 2) {
    seg(g.path[i], g.path[i + 1], FAINT, 1.5);
  }

  /* the compass rose */
  const R = g.rose, rr = g.W * 0.055;
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, l = k % 2 ? rr * 0.5 : rr;
    seg(R, { x: R.x + Math.cos(a) * l, y: R.y + Math.sin(a) * l }, INK, k % 2 ? 0.9 : 1.5);
  }
  if (developed(g, R.x, R.y - rr) > 0) {
    x.fillStyle = INK;
    x.beginPath();
    x.moveTo(R.x, R.y - rr * 1.42);
    x.lineTo(R.x - rr * 0.16, R.y - rr * 1.05);
    x.lineTo(R.x + rr * 0.16, R.y - rr * 1.05);
    x.closePath(); x.fill();
  }

  /* the X — the last thing to come up, and then it will not sit still */
  const XG = g.X, xr = g.W * 0.032;
  const xd = developed(g, XG.x, XG.y);
  if (xd > 0) {
    const puls = chartDone ? 0.72 + 0.28 * Math.sin(nightT * 3.4) : 1;
    x.strokeStyle = `rgba(166,32,26,${(0.90 * puls).toFixed(2)})`;
    x.lineWidth = 3.4;
    x.beginPath();
    x.moveTo(XG.x - xr, XG.y - xr); x.lineTo(XG.x + xr, XG.y + xr);
    x.moveTo(XG.x + xr, XG.y - xr); x.lineTo(XG.x - xr, XG.y + xr);
    x.stroke();
    if (chartDone) {
      x.strokeStyle = `rgba(166,32,26,${(0.30 * (1 - puls)).toFixed(2)})`;
      x.lineWidth = 1.4;
      x.beginPath();
      x.arc(XG.x, XG.y, xr * (2.0 + 1.4 * (1 - puls)), 0, 6.3);
      x.stroke();
    }
  }
}

/* clicking the X is what starts the dig */
function chartClick(e) {
  if (!chartDone || !chartC || digPhase) return;
  const r = chartC.getBoundingClientRect();
  const g = chartGeo;
  const px = (e.clientX - r.left) / r.width * g.W;
  const py = (e.clientY - r.top) / r.height * g.H;
  if (Math.hypot(px - g.X.x, py - g.X.y) > g.W * 0.09) return;
  e.stopPropagation();
  const el = botEl(), sc = document.getElementById("scrim");
  if (el) el.classList.remove("on");
  if (sc) sc.classList.remove("on");
  passThrough(() => startDig(), { dur: 1.6 });
}

/* ================= the dig =================
   The X said here. So: a shovel, and sand that behaves like sand — what
   you scoop out of the pit has to go somewhere, so it piles on the lip,
   and the pile slumps whenever it gets steeper than sand can stand. Dig
   far enough and the blade stops on something that is not sand. */

let digPhase = 0, sandH = null, sandBase = null, digN = 0, digCol = 0;
let grains = [], digT = 0, lidSeen = 0, digging = null, lastScrape = 0, lidClear = 0;
/* Dry sand will not stand steeper than about thirty degrees, which is why
   you cannot dig a narrow deep hole at the top of a beach. Go down far
   enough and it is damp, and damp sand will stand almost vertically — so
   the pit starts out shallow and bowl-shaped and gets steeper the deeper
   it goes, exactly the way a real one does. */
const REPOSE_DRY = 0.55, REPOSE_WET = 1.45;
function reposeAt(i) {
  const d = Math.max(sandH[i] - sandBase[i], sandH[i + 1] - sandBase[i + 1]);
  return REPOSE_DRY + (REPOSE_WET - REPOSE_DRY) * Math.min(1, Math.max(0, d) / 70);
}

function digGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const top = H * 0.42;                                  /* where sand starts */
  return {
    W, H, top,
    water: top + (H - top) * 0.62,
    lidX: W * 0.5,
    lidY: top + (H - top) * 0.20,
    lidR: Math.min(W * 0.105, (H - top) * 0.30),
  };
}

let sandTile = null, sandPat = null;
function buildSandTile() {
  const S = 128, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d");
  for (let i = 0; i < 5200; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.5 ? `rgba(255,246,222,${(0.05 + v * 0.16).toFixed(3)})`
                          : `rgba(96,72,42,${(0.04 + (0.5 - v) * 0.18).toFixed(3)})`;
    g.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  sandTile = c;
  sandPat = null;
}

function buildSand() {
  const G = digGeom();
