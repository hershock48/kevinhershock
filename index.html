<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Hershock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fdfdfb;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6vh;
    transition: opacity 1.4s ease;
  }
  #stage.gone { opacity: 0; pointer-events: none; }
  #heroSvg { width: 100%; height: auto; max-height: 88vh; display: block; }
  #glitter {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .pumpHit { cursor: pointer; }
  .arrowGrp { animation: bounce 0.9s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(14px); }
  }
  .noselect { user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<div id="stage" class="noselect"></div>
<canvas id="glitter"></canvas>

<script>
"use strict";

/* ================= letter definitions =================
   Monoline "balloon" letters. Coordinates: y 0 (top) to 100 (baseline).
   Each letter = one or more subpaths (each subpath is one thin balloon). */
const LETTERS = {
  K: { w: 58, subs: ["M10 4 L10 96", "M52 4 L14 50 L52 96"] },
  E: { w: 52, subs: ["M48 4 L12 4 L12 96 L48 96", "M12 50 L40 50"] },
  V: { w: 60, subs: ["M8 4 L30 96 L52 4"] },
  I: { w: 20, subs: ["M10 4 L10 96"] },
  N: { w: 60, subs: ["M10 96 L10 4 L50 96 L50 4"] },
  H: { w: 58, subs: ["M10 4 L10 96", "M48 4 L48 96", "M10 50 L48 50"] },
  R: { w: 56, subs: ["M12 96 L12 4 L32 4 C52 4 52 48 32 48 L12 48", "M31 48 L50 96"] },
  S: { w: 52, subs: ["M44 13 C37 1 13 0 11 20 C8 41 44 44 46 68 C48 92 17 103 8 83"] },
  O: { w: 60, subs: ["M30 4 C7 4 7 96 30 96 C53 96 53 4 30 4 Z"] },
  C: { w: 54, subs: ["M46 15 C35 -1 10 8 10 50 C10 92 35 101 46 85"] },
};
const PALETTE = ["#e63950","#ff8c00","#ffcf00","#00b869","#0f7fb5","#8b46d9",
                 "#ff5d9e","#00a8e8","#d92645","#6cb520","#e8a013","#2aa8b8","#a95fe0"];
const SPACE_W = 34;
const LETTER_GAP = 10;

/* latex color helper: amt>0 lighten toward white, amt<0 darken */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function subEnds(d) {
  const nums = d.match(/-?\d+(?:\.\d+)?/g).map(Number);
  return {
    sx: nums[0], sy: nums[1],
    ex: nums[nums.length - 2], ey: nums[nums.length - 1],
    closed: /z\s*$/i.test(d),
  };
}

/* ================= state ================= */
const PUMP_STEP = 0.085;        // air per pump
const EXPLODE_AT = 1.42;        // keep pumping past "full" -> boom
const IDLE_MS = 950;            // stop pumping this long -> deflate
const DECAY_PER_S = 0.30;       // deflate speed

let target = 0;
let inf = 0;
let vel = 0;
let lastPump = -1e9;
let exploded = false;
let pumpPressT = 0;
let letters = [];
let layoutW = 0, layoutH = 0;
let heroSvg = null, pumpPlunger = null;
const stage = document.getElementById("stage");

/* ================= layout / svg build ================= */
function currentLines() {
  return (window.innerWidth < 720)
    ? ["KEVIN", "HERSHOCK"]
    : ["KEVIN HERSHOCK"];
}

function lineWidth(line) {
  let w = 0;
  for (const ch of line) {
    w += (ch === " ") ? SPACE_W : LETTERS[ch].w + LETTER_GAP;
  }
  return w;
}

function buildSvg() {
  const lines = currentLines();
  const PUMP_ZONE = 165;
  const widest = Math.max(...lines.map(lineWidth));
  const W = PUMP_ZONE + widest + 50;
  const lineGap = 140;
  const firstBase = 190;
  const lastBase = firstBase + (lines.length - 1) * lineGap;
  const H = lastBase + 45;
  layoutW = W; layoutH = H;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", "heroSvg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMin meet");

  const mkPath = (d, cap) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-linecap", cap || "round");
    p.setAttribute("stroke-linejoin", "round");
    return p;
  };

  letters = [];
  let ci = 0;
  lines.forEach((line, li) => {
    const base = firstBase + li * lineGap;
    let x = PUMP_ZONE + (widest - lineWidth(line)) / 2;
    for (const ch of line) {
      if (ch === " ") { x += SPACE_W; continue; }
      const def = LETTERS[ch];
      const g = document.createElementNS(NS, "g");
      const color = PALETTE[ci % PALETTE.length];

      /* real twisting-balloon look, four layers per balloon segment:
         1. dark rim (cylinder edge shadow)
         2. main saturated latex
         3. soft light tint, offset toward the light
         4. hard white specular streak (the glossy shine line) */
      const dark = [], main = [], tint = [], gloss = [];
      for (const d of def.subs) {
        const p = mkPath(d); p.setAttribute("stroke", shade(color, -0.32));
        g.appendChild(p); dark.push(p);
      }
      for (const d of def.subs) {
        const p = mkPath(d);
        g.appendChild(p); main.push(p);
      }
      for (const d of def.subs) {
        const p = mkPath(d); p.setAttribute("stroke", shade(color, 0.34));
        g.appendChild(p); tint.push(p);
      }
      for (const d of def.subs) {
        const p = mkPath(d); p.setAttribute("stroke", "#ffffff");
        g.appendChild(p); gloss.push(p);
      }

      /* knot where the balloon was tied + nubs at the tail ends */
      const ends = def.subs.map(subEnds);
      const knot = document.createElementNS(NS, "circle");
      knot.setAttribute("fill", shade(color, -0.42));
      knot.setAttribute("cx", ends[0].sx);
      knot.setAttribute("cy", ends[0].sy);
      knot.setAttribute("r", 0);
      g.appendChild(knot);
      const nubs = [];
      for (const e of ends) {
        if (e.closed) continue;
        const nub = document.createElementNS(NS, "circle");
        nub.setAttribute("fill", shade(color, -0.28));
        nub.setAttribute("cx", e.ex);
        nub.setAttribute("cy", e.ey);
        nub.setAttribute("r", 0);
        g.appendChild(nub);
        nubs.push(nub);
      }

      svg.appendChild(g);
      const jitter = (Math.random() * 8 - 4);
      const phase = Math.random() * Math.PI * 2;
      letters.push({ g, dark, main, tint, gloss, knot, nubs, x, base, w: def.w, color, jitter, phase });
      x += def.w + LETTER_GAP;
      ci++;
    }
  });

  buildPump(svg, NS, firstBase, letters[0]);
  stage.innerHTML = "";
  stage.appendChild(svg);
  heroSvg = svg;
}

function buildPump(svg, NS, base, firstLetter) {
  const px = 62;
  const ground = base + 8;

  const hy = firstLetter.base;
  const hose = document.createElementNS(NS, "path");
  hose.setAttribute("d",
    `M${px + 38} ${ground - 6} C ${px + 80} ${ground + 14}, ${firstLetter.x - 40} ${hy + 26}, ${firstLetter.x + 10} ${hy - 2}`);
  hose.setAttribute("fill", "none");
  hose.setAttribute("stroke", "#555");
  hose.setAttribute("stroke-width", "6");
  hose.setAttribute("stroke-linecap", "round");
  svg.appendChild(hose);

  const pump = document.createElementNS(NS, "g");

  const plate = document.createElementNS(NS, "rect");
  plate.setAttribute("x", px - 46); plate.setAttribute("y", ground - 10);
  plate.setAttribute("width", 92); plate.setAttribute("height", 12);
  plate.setAttribute("rx", 6); plate.setAttribute("fill", "#c0392b");
  pump.appendChild(plate);

  const cyl = document.createElementNS(NS, "rect");
  cyl.setAttribute("x", px - 20); cyl.setAttribute("y", ground - 90);
  cyl.setAttribute("width", 40); cyl.setAttribute("height", 82);
  cyl.setAttribute("rx", 8); cyl.setAttribute("fill", "#e74c3c");
  pump.appendChild(cyl);
  const cylHi = document.createElementNS(NS, "rect");
  cylHi.setAttribute("x", px - 13); cylHi.setAttribute("y", ground - 84);
  cylHi.setAttribute("width", 7); cylHi.setAttribute("height", 70);
  cylHi.setAttribute("rx", 3.5); cylHi.setAttribute("fill", "#ff7f6e");
  pump.appendChild(cylHi);
  const collar = document.createElementNS(NS, "rect");
  collar.setAttribute("x", px - 24); collar.setAttribute("y", ground - 96);
  collar.setAttribute("width", 48); collar.setAttribute("height", 10);
  collar.setAttribute("rx", 5); collar.setAttribute("fill", "#96281b");
  pump.appendChild(collar);

  const plunger = document.createElementNS(NS, "g");
  const rod = document.createElementNS(NS, "rect");
  rod.setAttribute("x", px - 4); rod.setAttribute("y", ground - 138);
  rod.setAttribute("width", 8); rod.setAttribute("height", 46);
  rod.setAttribute("fill", "#7f8c8d");
  plunger.appendChild(rod);
  const handle = document.createElementNS(NS, "rect");
  handle.setAttribute("x", px - 42); handle.setAttribute("y", ground - 152);
  handle.setAttribute("width", 84); handle.setAttribute("height", 16);
  handle.setAttribute("rx", 8); handle.setAttribute("fill", "#2c3e50");
  plunger.appendChild(handle);
  pump.appendChild(plunger);
  pumpPlunger = { el: plunger, travel: 34 };

  /* bouncing arrow — no words. if they can't figure it out, they're not allowed in. */
  const arrowWrap = document.createElementNS(NS, "g");
  arrowWrap.setAttribute("class", "arrowGrp");
  const arrow = document.createElementNS(NS, "path");
  const ax = px, ay = ground - 200;
  arrow.setAttribute("d",
    `M${ax} ${ay} L${ax} ${ay + 30} M${ax - 13} ${ay + 17} L${ax} ${ay + 32} L${ax + 13} ${ay + 17}`);
  arrow.setAttribute("stroke", "#e74c3c");
  arrow.setAttribute("stroke-width", "8");
  arrow.setAttribute("stroke-linecap", "round");
  arrow.setAttribute("stroke-linejoin", "round");
  arrow.setAttribute("fill", "none");
  arrowWrap.appendChild(arrow);
  pump.appendChild(arrowWrap);

  const hit = document.createElementNS(NS, "rect");
  hit.setAttribute("x", px - 60); hit.setAttribute("y", ground - 165);
  hit.setAttribute("width", 200); hit.setAttribute("height", 180);
  hit.setAttribute("fill", "transparent");
  hit.setAttribute("class", "pumpHit");
  hit.addEventListener("pointerdown", doPump);
  pump.appendChild(hit);

  svg.appendChild(pump);
}

/* ================= pumping ================= */
function doPump(e) {
  if (e) e.preventDefault();
  if (exploded) return;
  target += PUMP_STEP;
  vel += 0.55;
  lastPump = performance.now();
  pumpPressT = 1;
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") doPump(e);
});

/* ================= animation loop ================= */
const easeOut = t => 1 - Math.pow(1 - t, 3);
let prevT = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000);
  prevT = now;

  if (!exploded) {
    if (now - lastPump > IDLE_MS && target > 0) {
      target = Math.max(0, target - DECAY_PER_S * dt);
    }
    const k = 60, damp = 8.5;
    vel += (target - inf) * k * dt;
    vel *= Math.exp(-damp * dt);
    inf += vel * dt;
    if (inf < 0) { inf = 0; vel = 0; }

    if (inf >= EXPLODE_AT) { explode(); }
    else { renderLetters(now); renderPump(dt); }
  }

  tickParticles(dt);
  requestAnimationFrame(frame);
}

function renderLetters(now) {
  const p = Math.min(1, inf);
  const over = Math.max(0, inf - 1);
  const ep = easeOut(p);
  const W = 3 + 20 * ep + 13 * over;

  for (const L of letters) {
    const sy = 0.09 + 0.91 * ep + over * 0.06;
    const sx = 1 + 0.14 * (1 - ep) + over * 0.05;
    const limp = L.jitter * (1 - ep);
    const wob = over > 0
      ? Math.sin(now / 60 + L.phase) * over * 9
      : Math.sin(now / 400 + L.phase) * (1 - ep) * 1.2;
    const cx = L.x + L.w / 2, by = L.base;
    L.g.setAttribute("transform",
      `translate(${cx} ${by}) scale(${sx} ${sy}) rotate(${limp + wob}) translate(${-L.w / 2} -100)`);

    /* uninflated latex reads darker & matte; inflated latex is bright & glossy */
    const mainCol = shade(L.color, -0.20 * (1 - ep));
    for (const el of L.dark) el.setAttribute("stroke-width", W);
    for (const el of L.main) {
      el.setAttribute("stroke-width", Math.max(1.5, W * 0.80));
      el.setAttribute("stroke", mainCol);
    }
    for (const el of L.tint) {
      el.setAttribute("stroke-width", Math.max(1, W * 0.42));
      el.setAttribute("opacity", 0.15 + 0.75 * ep);
      el.setAttribute("transform", `translate(${-W * 0.09} ${-W * 0.12})`);
    }
    for (const el of L.gloss) {
      el.setAttribute("stroke-width", Math.max(0.8, W * 0.15));
      el.setAttribute("opacity", 0.85 * ep);
      el.setAttribute("transform", `translate(${-W * 0.17} ${-W * 0.21})`);
    }
    L.knot.setAttribute("r", 1.5 + 3.6 * ep);
    for (const nub of L.nubs) nub.setAttribute("r", Math.max(0.8, W * 0.17));
  }
}

function renderPump(dt) {
  if (!pumpPlunger) return;
  pumpPressT = Math.max(0, pumpPressT - dt * 5);
  const down = Math.sin(Math.min(1, pumpPressT) * Math.PI) * pumpPlunger.travel;
  pumpPlunger.el.setAttribute("transform", `translate(0 ${down})`);
}

/* ================= explosion + glitter ================= */
const canvas = document.getElementById("glitter");
const ctx = canvas.getContext("2d");
let parts = [];
function sizeCanvas() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function svgToScreen(x, y) {
  const r = heroSvg.getBoundingClientRect();
  const s = r.width / layoutW;
  return { x: r.left + x * s, y: r.top + y * s };
}

function explode() {
  exploded = true;

  // balloon scraps burst from each letter
  for (const L of letters) {
    const c = svgToScreen(L.x + L.w / 2, L.base - 50);
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 220 + Math.random() * 420;
      parts.push({
        kind: "scrap", x: c.x, y: c.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 180,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 14,
        w: 6 + Math.random() * 12, h: 3 + Math.random() * 4,
        color: L.color, life: 2.2 + Math.random() * 1.2,
      });
    }
    L.g.style.display = "none";
  }

  /* THE WALL. a screen-consuming curtain of glitter that pours down
     and unveils the site as it passes. */
  const W = window.innerWidth, H = window.innerHeight;
  const COUNT = Math.min(12000, Math.max(3500, Math.round((W * H) / 95)));
  const GLITTER = ["#ffd700","#ffdf6b","#f5c518","#e8e8e8","#c0c0c0","#ffffff",
                  "#ff4d6d","#06d6a0","#118ab2","#9b5de5","#ff70a6","#ffd60a",
                  "#00bbf9","#f7b32b","#7ef9ff","#ffb3f2"];
  for (let i = 0; i < COUNT; i++) {
    const sparkle = Math.random() < 0.22;   // 4-point star flashes
    parts.push({
      kind: sparkle ? "sparkle" : "glitter",
      x: Math.random() * W,
      y: H * 0.1 - Math.random() * H * 2.6,  // deep band above the screen
      vx: (Math.random() - 0.5) * 50,
      vy: 380 + Math.random() * 340,
      sway: 15 + Math.random() * 45,
      swayF: 2 + Math.random() * 5,
      ph: Math.random() * Math.PI * 2,
      twF: 6 + Math.random() * 9,            // twinkle speed
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 18,
      s: sparkle ? 4 + Math.random() * 8 : 2.5 + Math.random() * 5.5,
      color: GLITTER[(Math.random() * GLITTER.length) | 0],
      life: 12,
    });
  }

  setTimeout(() => stage.classList.add("gone"), 400);
}

function tickParticles(dt) {
  if (!parts.length) { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); return; }
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  const H = window.innerHeight;
  parts = parts.filter(pt => {
    pt.life -= dt;
    if (pt.life <= 0) return false;
    if (pt.kind === "scrap") {
      pt.vy += 900 * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.rot += pt.vr * dt;
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.min(1, pt.life);
      ctx.beginPath();
      ctx.ellipse(0, 0, pt.w, pt.h, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return true;
    }
    pt.ph += pt.swayF * dt;
    pt.x += (pt.vx + Math.sin(pt.ph) * pt.sway) * dt;
    pt.y += pt.vy * dt;
    pt.rot += pt.vr * dt;
    if (pt.y > H + 40) return false;
    if (pt.y < -60) return true;             // not on screen yet, skip drawing
    const tw = Math.sin(pt.ph * pt.twF * 0.35 + pt.x * 0.05);
    ctx.save();
    ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
    if (pt.kind === "sparkle") {
      /* hard white-hot 4-point star with color core, flashing */
      const flash = Math.pow(Math.abs(tw), 3);
      ctx.globalAlpha = 0.25 + 0.75 * flash;
      const s = pt.s * (0.7 + 0.6 * flash);
      ctx.fillStyle = pt.color;
      ctx.fillRect(-s / 2, -s * 0.13, s, s * 0.26);
      ctx.fillRect(-s * 0.13, -s / 2, s * 0.26, s);
      ctx.fillStyle = "#ffffff";
      const c = s * 0.45;
      ctx.fillRect(-c / 2, -c * 0.2, c, c * 0.4);
      ctx.fillRect(-c * 0.2, -c / 2, c * 0.4, c);
    } else {
      ctx.globalAlpha = 0.45 + 0.55 * Math.abs(tw);
      ctx.fillStyle = pt.color;
      ctx.fillRect(-pt.s / 2, -pt.s / 2, pt.s, pt.s * 0.72);
    }
    ctx.restore();
    return true;
  });
}

/* ================= boot ================= */
function boot() {
  sizeCanvas();
  buildSvg();
}
let lastLines = "";
window.addEventListener("resize", () => {
  sizeCanvas();
  if (exploded) return;
  const l = currentLines().join("|");
  if (l !== lastLines) { lastLines = l; buildSvg(); }
});
lastLines = currentLines().join("|");
boot();
requestAnimationFrame(frame);

/* The rest of the site goes here one day. For now: pop the balloons. */
</script>
</body>
</html>
