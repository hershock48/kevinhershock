  digCol = Math.max(3, Math.round(4 * UIS));
  digN = Math.ceil(G.W / digCol) + 1;
  sandBase = new Float32Array(digN);
  sandH = new Float32Array(digN);
  for (let i = 0; i < digN; i++) {
    const t = i / (digN - 1);
    /* a beach, not a table: a slope off the water with dune noise on it */
    const y = G.top + (G.H - G.top) * 0.02
            + Math.sin(t * 7.2) * 5 + Math.sin(t * 3.1 + 1.4) * 9
            + Math.sin(t * 19.0 + 0.3) * 2;
    sandBase[i] = y; sandH[i] = y;
  }
  grains = [];
}

/* the top of the buried lid at a given x, or Infinity where there is none */
function lidTopAt(x) {
  const G = digGeom();
  const dx = (x - G.lidX) / G.lidR;
  if (Math.abs(dx) >= 1) return Infinity;
  return G.lidY - Math.cos(dx * Math.PI * 0.5) * G.lidR * 0.16 + G.lidR * 0.16;
}

function startDig() {
  if (digPhase) return;
  digPhase = 1; digT = 0; lidSeen = 0; lidClear = 0;
  bed('sand');
  buildSand();
  const el = botEl(), sc = document.getElementById("scrim");
  if (el) { el.classList.remove("on"); setTimeout(() => { el.style.display = "none"; }, 900); }
  if (sc) { sc.classList.remove("on"); setTimeout(() => { sc.style.display = "none"; }, 900); }
  botT = -1;                                   /* the beach we are on now */
  const sh = document.getElementById("shovel");
  if (sh && !("ontouchstart" in window)) finCanvas.style.cursor = "none";
  if (sh) sh.style.display = "block";
  digWhoosh();
}

/* --- scooping --- */
function digAt(x, y, dx, dt) {
  const G = digGeom();
  const R = Math.max(30, 48 * UIS);
  const i0 = Math.max(0, Math.floor((x - R) / digCol));
  const i1 = Math.min(digN - 1, Math.ceil((x + R) / digCol));
  let moved = 0, clank = 0;
  for (let i = i0; i <= i1; i++) {
    const cx = i * digCol;
    const f = 1 - Math.abs(cx - x) / R;
    if (f <= 0) continue;
    if (y < sandH[i] - R * 1.35) continue;             /* blade is in the air */
    const want = 1150 * f * dt;
    const floor = lidTopAt(cx);
    const room = floor - sandH[i];
    if (room <= 0.4) { clank += f; continue; }         /* that is not sand */
    const take = Math.min(want, room);
    sandH[i] += take; moved += take;
    if (take < want) clank += f * 0.5;
  }
  if (moved > 0) {
    /* it has to go somewhere: onto the lip, on the side you are pulling to */
    /* It goes on the rim, not in front of the blade. Depositing at a fixed
       offset from the shovel turns the beach into a conveyor: you dig the
       spoil straight back up on the next stroke and bulldoze the whole pile
       downwind. So walk out to where the sand is still undisturbed on each
       side, and throw it there. */
    const c = Math.max(0, Math.min(digN - 1, Math.round(x / digCol)));
    let li = c, ri = c;
    while (li > 0 && sandH[li] > sandBase[li] + 2) li--;
    while (ri < digN - 1 && sandH[ri] > sandBase[ri] + 2) ri++;
    const span = Math.max(2, Math.round(R / digCol));
    let wsum = 0;
    for (let k = -span; k <= span; k++) wsum += Math.max(0, 1 - Math.abs(k) / span);
    const G2 = digGeom();
    const ceil = G2.top - (G2.H - G2.top) * 0.16;      /* piles are not mountains */
    const side = dx >= 0 ? 1 : -1;
    for (const [j0, share] of [[li, side < 0 ? 0.6 : 0.4], [ri, side > 0 ? 0.6 : 0.4]]) {
      for (let k = -span; k <= span; k++) {
        const j = j0 + k;
        if (j < 0 || j >= digN) continue;
        const add = moved * share * Math.max(0, 1 - Math.abs(k) / span) / (wsum || 1);
        sandH[j] = Math.max(ceil, sandH[j] - add);
      }
    }
    if (grains.length < 260) {
      for (let n = 0; n < 3; n++)
        grains.push({ x: x + (Math.random() - 0.5) * R, y: y - Math.random() * 8,
                      vx: side * (90 + Math.random() * 210) + dx * 0.4,
                      vy: -120 - Math.random() * 190, life: 1,
                      s: 0.9 + Math.random() * 1.8 });
    }
    scrape(Math.min(1, moved / 10), x);
  }
  if (clank > 0.35) thud();
}

/* sand will not stand steeper than it will stand */
function slump(passes) {
  for (let p = 0; p < passes; p++) {
    for (let i = 0; i < digN - 1; i++) {
      const d = sandH[i + 1] - sandH[i], lim = reposeAt(i) * digCol;
      if (d > lim) { const m = (d - lim) * 0.5; sandH[i] += m; sandH[i + 1] -= m; }
      else if (d < -lim) { const m = (-d - lim) * 0.5; sandH[i] -= m; sandH[i + 1] += m; }
    }
    for (let i = digN - 2; i >= 0; i--) {
      const d = sandH[i + 1] - sandH[i], lim = reposeAt(i) * digCol;
      if (d > lim) { const m = (d - lim) * 0.5; sandH[i] += m; sandH[i + 1] -= m; }
      else if (d < -lim) { const m = (-d - lim) * 0.5; sandH[i] -= m; sandH[i + 1] += m; }
    }
    /* nothing gets pushed through the lid */
    for (let i = 0; i < digN; i++) {
      const f = lidTopAt(i * digCol);
      if (sandH[i] > f) sandH[i] = f;
    }
  }
}

function drawDig(dt) {
  const G = digGeom();
  if (!sandH || sandH.length !== digN) buildSand();
  digT += dt;
  if (digPhase === 2) {
    /* found — the rest of it comes off on its own, and the walls stop
       creeping back in over what you just uncovered */
    lidClear = Math.min(1, lidClear + dt * 0.55);
    const k = Math.min(1, dt * 2.6);
    for (let i = 0; i < digN; i++) {
      const cx2 = i * digCol;
      const f = lidTopAt(cx2);
      if (f === Infinity) continue;
      if (Math.abs(cx2 - digGeom().lidX) > digGeom().lidR * 0.98) continue;
      if (sandH[i] < f) sandH[i] += (f - sandH[i]) * k;
    }
  } else slump(2);
  hardClear(finCanvas, fctx);
  const W = G.W, H = G.H;

  /* ---- the morning, an hour on from the sunrise ---- */
  const sky = fctx.createLinearGradient(0, 0, 0, G.top);
  sky.addColorStop(0, "#7fa8d6");
  sky.addColorStop(0.55, "#bcd2e6");
  sky.addColorStop(1, "#f0dcc0");
  fctx.fillStyle = sky; fctx.fillRect(0, 0, W, H);

  /* the sea, running in behind us. It is drawn well past the sand line so
     a dune or a spoil heap never opens a gap onto the background. */
  const seaTop = G.top - H * 0.14, seaBot = G.top + H * 0.10;
  const sg = fctx.createLinearGradient(0, seaTop, 0, seaBot);
  sg.addColorStop(0, "#3f6f92");
  sg.addColorStop(0.7, "#96b6c0");
  sg.addColorStop(1, "#bcd2cf");
  fctx.fillStyle = sg; fctx.fillRect(0, seaTop, W, seaBot - seaTop);
  for (let i = 0; i < 7; i++) {
    const y = seaTop + (i + 0.5) * (G.top - seaTop) / 7;
    const ph = Math.sin(digT * (0.55 + i * 0.17) + i * 2.1);
    const x0 = W * (0.5 + 0.42 * Math.sin(digT * 0.22 + i * 1.3)) - W * 0.55;
    const wid = W * (0.5 + 0.35 * Math.abs(Math.sin(i * 2.3)));
    const lg = fctx.createLinearGradient(x0, 0, x0 + wid, 0);
    const a = (0.10 + 0.06 * i).toFixed(2);
    lg.addColorStop(0, "rgba(255,255,255,0)");
    lg.addColorStop(0.5, `rgba(255,255,255,${a})`);
    lg.addColorStop(1, "rgba(255,255,255,0)");
    fctx.fillStyle = lg;
    fctx.fillRect(x0, y + ph * 2.2, wid, 1.2 + i * 0.25);
  }
  /* the last of the swash sliding up the sand and soaking in */
  const swash = 0.5 + 0.5 * Math.sin(digT * 0.55);
  fctx.fillStyle = `rgba(214,232,236,${(0.26 + 0.16 * swash).toFixed(2)})`;
  fctx.fillRect(0, G.top - 6, W, 10 + swash * 12);

  /* ---- the sand ---- */
  const surf = () => {
    fctx.beginPath();
    fctx.moveTo(-2, sandH[0]);
    for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, sandH[i]);
    fctx.lineTo(W + 2, sandH[digN - 1]);
    fctx.lineTo(W + 2, H + 2); fctx.lineTo(-2, H + 2);
    fctx.closePath();
  };
  const dry = fctx.createLinearGradient(0, G.top, 0, H);
  dry.addColorStop(0, "#e8d3a8");
  dry.addColorStop(0.35, "#dcc194");
  dry.addColorStop(1, "#c2a274");
  surf(); fctx.fillStyle = dry; fctx.fill();

  /* the inside of the pit: everything between where the sand was and where
     it is now, darkening as it goes down because it is wetter down there */
  fctx.save();
  fctx.beginPath();
  fctx.moveTo(-2, sandBase[0]);
  for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, sandBase[i]);
  fctx.lineTo(W + 2, sandBase[digN - 1]);
  for (let i = digN - 1; i >= 0; i--) fctx.lineTo(i * digCol, sandH[i]);
  fctx.closePath();
  const wet = fctx.createLinearGradient(0, G.top, 0, H);
  wet.addColorStop(0, "#a98a5e");
  wet.addColorStop(0.4, "#79603c");
  wet.addColorStop(1, "#463522");
  fctx.fillStyle = wet; fctx.fill();
  fctx.restore();

  /* ---- what the blade found ---- */
  let exposed = 0, total = 0;
  for (let i = 0; i < digN; i++) {
    const cx2 = i * digCol;
    if (Math.abs(cx2 - G.lidX) > G.lidR * 0.60) continue;
    total++;
    if (sandH[i] >= lidTopAt(cx2) - 1.4) exposed++;
  }
  lidSeen = total ? exposed / total : 0;
  if (lidSeen > 0.42 && digPhase === 1) {
    digPhase = 2; foundIt();
    const sh = document.getElementById("shovel");
    if (sh) { sh.style.transition = "opacity 0.8s ease"; sh.style.opacity = "0";
              setTimeout(() => { sh.style.display = "none"; }, 900); }
    finCanvas.style.cursor = "";
  }

  /* it is only visible where the sand has actually come off it, so clip to
     the runs of columns that have been dug down to the wood. Once it is
     found, drawLift owns it — hinge, hasp and all. */
  if (digPhase !== 2) {
  fctx.save();
  fctx.beginPath();
  let run = -1;
  for (let i = 0; i < digN; i++) {
    const cx2 = i * digCol;
    const f = lidTopAt(cx2);
    const up = f !== Infinity && sandH[i] >= f - 1.4;
    if (up && run < 0) run = cx2;
    if (!up && run >= 0) { fctx.rect(run - 1, 0, cx2 - run + 2, H); run = -1; }
  }
  if (run >= 0) fctx.rect(run - 1, 0, W - run + 2, H);
  fctx.clip();
  const wood = fctx.createLinearGradient(0, G.lidY - G.lidR * 0.20, 0, G.lidY + G.lidR * 0.6);
  wood.addColorStop(0, "#7a5530");
  wood.addColorStop(0.45, "#54391f");
  wood.addColorStop(1, "#2d1e10");
  fctx.fillStyle = wood;
  fctx.beginPath();
  fctx.moveTo(G.lidX - G.lidR, G.lidY + G.lidR * 0.46);
  for (let k = -1; k <= 1.0001; k += 0.04) {
    fctx.lineTo(G.lidX + k * G.lidR, lidTopAt(G.lidX + k * G.lidR));
  }
  fctx.lineTo(G.lidX + G.lidR, G.lidY + G.lidR * 0.46);
  fctx.closePath(); fctx.fill();
  /* planks, and the iron that holds them */
  fctx.strokeStyle = "rgba(18,11,5,0.42)";
  fctx.lineWidth = Math.max(1, G.lidR * 0.014);
  for (let k = -0.8; k < 0.85; k += 0.22) {
    const x2 = G.lidX + k * G.lidR;
    fctx.beginPath();
    fctx.moveTo(x2, lidTopAt(x2)); fctx.lineTo(x2, G.lidY + G.lidR * 0.46);
    fctx.stroke();
  }
  fctx.fillStyle = "#403830";
  for (const k of [-0.62, 0.62]) {
    const x2 = G.lidX + k * G.lidR;
    fctx.fillRect(x2 - G.lidR * 0.04, lidTopAt(x2) - 1, G.lidR * 0.08, G.lidR * 0.46);
  }
  /* morning coming down into the hole and catching the top of it */
  const sun2 = fctx.createLinearGradient(0, G.lidY - G.lidR * 0.20, 0, G.lidY + G.lidR * 0.22);
  sun2.addColorStop(0, "rgba(255,224,170,0.34)");
  sun2.addColorStop(1, "rgba(255,214,150,0)");
  fctx.fillStyle = sun2;
  fctx.beginPath();
  fctx.moveTo(G.lidX - G.lidR, G.lidY + G.lidR * 0.46);
  for (let k = -1; k <= 1.0001; k += 0.06) fctx.lineTo(G.lidX + k * G.lidR, lidTopAt(G.lidX + k * G.lidR));
  fctx.lineTo(G.lidX + G.lidR, G.lidY + G.lidR * 0.46);
  fctx.closePath(); fctx.fill();

  /* damp sand still lying in the seams */
  fctx.fillStyle = "rgba(150,124,86,0.28)";
  for (let k = -0.9; k < 0.95; k += 0.11) {
    const x2 = G.lidX + k * G.lidR;
    fctx.fillRect(x2 - G.lidR * 0.05, lidTopAt(x2) - 1, G.lidR * 0.10, 2.5 + Math.sin(k * 9) * 1.4);
  }
  /* it goes down into sand again — a dark seam so it does not read as a
     hole cut through the world */
  const bg2 = fctx.createLinearGradient(0, G.lidY + G.lidR * 0.30, 0, G.lidY + G.lidR * 0.62);
  bg2.addColorStop(0, "rgba(30,20,10,0)");
  bg2.addColorStop(0.55, "rgba(28,19,10,0.85)");
  bg2.addColorStop(1, "rgba(70,54,34,0)");
  fctx.fillStyle = bg2;
  fctx.fillRect(G.lidX - G.lidR, G.lidY + G.lidR * 0.30, G.lidR * 2, G.lidR * 0.34);
  fctx.restore();
  }

  /* grain — a beach is not a flat fill, and at this size the eye wants tooth */
  if (!sandTile) buildSandTile();
  if (!sandPat) sandPat = fctx.createPattern(sandTile, "repeat");
  fctx.save();
  fctx.beginPath();
  fctx.moveTo(-2, Math.min(sandBase[0], sandH[0]));
  for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, Math.min(sandBase[i], sandH[i]));
  fctx.lineTo(W + 2, Math.min(sandBase[digN - 1], sandH[digN - 1]));
  fctx.lineTo(W + 2, H + 2); fctx.lineTo(-2, H + 2);
  fctx.closePath();
  fctx.clip();
  fctx.globalAlpha = 0.55;
  fctx.fillStyle = sandPat;
  fctx.fillRect(0, G.top - 40, W, H - G.top + 40);
  fctx.globalAlpha = 1;
  /* wind ripples, but only where the sand has not been turned over */
  fctx.strokeStyle = "rgba(160,132,88,0.22)";
  fctx.lineWidth = 1;
  for (let r = 0; r < 9; r++) {
    const off = 12 + r * (H - G.top) * 0.105;
    fctx.beginPath();
    let pen = false;
    for (let i = 0; i < digN; i += 2) {
      const cx2 = i * digCol;
      if (sandH[i] > sandBase[i] + 3) { pen = false; continue; }
      const y = sandH[i] + off + Math.sin(cx2 * 0.035 + r * 1.7) * (2 + r * 0.5);
      if (!pen) { fctx.moveTo(cx2, y); pen = true; } else fctx.lineTo(cx2, y);
    }
    fctx.stroke();
  }
  fctx.restore();

  /* a rim of shadow where the pit wall meets the light */
  fctx.strokeStyle = "rgba(70,48,24,0.30)";
  fctx.lineWidth = 2;
  fctx.beginPath();
  for (let i = 0; i < digN; i++) {
    if (sandH[i] <= sandBase[i] + 0.5) { fctx.moveTo(i * digCol, sandH[i]); continue; }
    fctx.lineTo(i * digCol, sandBase[i]);
  }
  fctx.stroke();

  /* the surface itself, catching the low sun */
  fctx.strokeStyle = "rgba(255,246,222,0.55)";
  fctx.lineWidth = 1.6;
  fctx.beginPath();
  fctx.moveTo(-2, sandH[0] - 1);
  for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, sandH[i] - 1);
  fctx.stroke();

  /* ---- grains in the air ---- */
  fctx.fillStyle = "#d9bd8c";
  for (let i = grains.length - 1; i >= 0; i--) {
    const g2 = grains[i];
    g2.vy += 1500 * dt;
    g2.x += g2.vx * dt; g2.y += g2.vy * dt;
    g2.life -= dt * 0.9;
    const col = Math.max(0, Math.min(digN - 1, Math.round(g2.x / digCol)));
    if (g2.life <= 0 || g2.y > sandH[col]) {
      if (g2.y > sandH[col] && g2.y < H) sandH[col] -= 0.35;   /* it lands somewhere */
      grains.splice(i, 1); continue;
    }
    fctx.globalAlpha = Math.min(1, g2.life * 1.4);
    fctx.fillRect(g2.x, g2.y, g2.s, g2.s);
  }
  fctx.globalAlpha = 1;

  if (digPhase === 2) drawLift(dt, G);
}

/* --- the shovel --- */
function digPointer(e) {
  if (digPhase !== 1) return;
  const sh = document.getElementById("shovel");
  if (sh) { sh.style.left = e.clientX + "px"; sh.style.top = e.clientY + "px"; }
  if (!digging) return;
  const dx = e.clientX - digging.x;
  digAt(e.clientX, e.clientY, dx, Math.min(0.05, Math.max(0.008, (performance.now() - digging.t) / 1000)));
  digging = { x: e.clientX, y: e.clientY, t: performance.now() };
  if (e.cancelable) e.preventDefault();
}
window.addEventListener("pointerdown", (e) => {
  if (digPhase !== 1) return;
  /* if they are tapping the wood rather than dragging the shovel, take that
     as intent and brush the sand off it — a tap on the thing you are trying
     to uncover should never do nothing */
  const G0 = digGeom();
  if (Math.abs(e.clientX - G0.lidX) < G0.lidR &&
      Math.abs(e.clientY - lidTopAt(e.clientX)) < G0.lidR * 0.6) {
    digAt(e.clientX, lidTopAt(e.clientX) - 4, 0, 0.05);
    digAt(e.clientX, lidTopAt(e.clientX) - 4, 0, 0.05);
  }
  digging = { x: e.clientX, y: e.clientY, t: performance.now() };
  const sh = document.getElementById("shovel");
  if (sh) sh.classList.add("dig");
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", digPointer, { passive: false });
window.addEventListener("pointerup", () => {
  digging = null;
  const sh = document.getElementById("shovel");
  if (sh) sh.classList.remove("dig");
});

/* --- sound --- */
function scrape(v, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastScrape < 0.055) return;
  lastScrape = t0;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  s.playbackRate.value = 0.7 + Math.random() * 0.6;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2400 + Math.random() * 2600; bp.Q.value = 0.9;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.035 * (0.4 + v), t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
  s.connect(bp); bp.connect(g); g.connect(at(px) || BUS);
  s.start(t0); s.stop(t0 + 0.16);
}

let lastThud = 0;
function thud() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastThud < 0.16) return;
  lastThud = t0;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(190, t0);
  o.frequency.exponentialRampToValueAtTime(74, t0 + 0.14);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.14, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  o.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.24);
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.05, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
  s.connect(hp); hp.connect(g2); g2.connect(BUS);
  s.start(t0); s.stop(t0 + 0.1);
}

function digWhoosh() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.setValueAtTime(300, t0);
  bp.frequency.exponentialRampToValueAtTime(2400, t0 + 0.5);
  bp.Q.value = 0.7;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.10, t0 + 0.22);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 1.0);
}

function foundIt() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [196, 261.6, 329.6].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.13);
    g.gain.exponentialRampToValueAtTime(0.05, t0 + i * 0.13 + 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.13); o.stop(t0 + 3.8);
  });
}

/* ================= the lid =================
   The sand is off it. Now it has to be opened, and it is held by an iron
   hasp with a pin through it — pull the pin, then lift. The lid swings on
   its hinges, the last of the sand slides off it, and what is inside is
   light. */
let pinOut = 0, pinGrab = null, lidLift = 0, liftGrab = null, liftT = -1, whiteOut = 0;

function hasp(G) {
  const y = lidTopAt(G.lidX);
  return { x: G.lidX, y: y + G.lidR * 0.10, r: Math.max(22, G.lidR * 0.26) };
}

function drawLift(dt, G) {
  const W = window.innerWidth, H = window.innerHeight;
  if (liftT < 0) liftT = 0; else liftT += dt;
  const ready = liftT > 1.2;

  /* the opening under the lid, and the light in it */
  const open = lidLift;
  if (open > 0.004) {
    const cx = G.lidX, top = lidTopAt(cx);
    fctx.save();
    /* the mouth */
    const ry = G.lidR * 0.10 + open * G.lidR * 0.18;
    const mg = fctx.createRadialGradient(cx, top + G.lidR * 0.06, 0,
                                         cx, top + G.lidR * 0.06, G.lidR * 0.86);
    mg.addColorStop(0, `rgba(${255},${228 - 40 * (1 - open) | 0},${168 - 60 * (1 - open) | 0},${(0.10 + 0.85 * open).toFixed(3)})`);
    mg.addColorStop(0.55, `rgba(120,78,32,${(0.30 + 0.30 * open).toFixed(3)})`);
    mg.addColorStop(1, "#150d06");
    fctx.fillStyle = mg;
    fctx.beginPath();
    fctx.ellipse(cx, top + G.lidR * 0.06, G.lidR * 0.86, ry, 0, 0, 6.3);
    fctx.fill();
    /* light coming up out of it, widening as it opens */
    fctx.globalCompositeOperation = "lighter";
    const rise = H * (0.20 + 0.80 * open);
    const spread = G.lidR * (0.45 + 1.9 * open);
    const a = 0.42 * open;
    const N = 26;
    for (let i = 0; i < N; i++) {
      const u0 = i / N * 2 - 1, u1 = (i + 1) / N * 2 - 1;
      const fall = Math.pow(Math.cos(((u0 + u1) / 2) * Math.PI / 2), 1.6);
      const lg2 = fctx.createLinearGradient(cx, top, cx, top - rise);
      lg2.addColorStop(0, `rgba(255,240,202,${(a * fall).toFixed(4)})`);
      lg2.addColorStop(0.40, `rgba(255,216,146,${(a * fall * 0.40).toFixed(4)})`);
      lg2.addColorStop(1, "rgba(255,198,112,0)");
      fctx.fillStyle = lg2;
      fctx.beginPath();
      fctx.moveTo(cx + u0 * G.lidR * 0.74, top);
      fctx.lineTo(cx + u1 * G.lidR * 0.74, top);
      fctx.lineTo(cx + u1 * spread * 1.55, top - rise);
      fctx.lineTo(cx + u0 * spread * 1.55, top - rise);
      fctx.closePath(); fctx.fill();
    }
    /* motes turning over in the beam */
    fctx.fillStyle = `rgba(255,244,214,${(0.5 * open).toFixed(3)})`;
    for (let i = 0; i < 26; i++) {
      const t = ((digT * (0.10 + (i % 5) * 0.035) + i * 0.137) % 1);
      const yy = top - t * rise;
      const xx = cx + Math.sin(digT * 0.6 + i * 2.3) * spread * t * 1.2;
      const s = 1 + (1 - t) * 1.8;
      fctx.globalAlpha = (1 - t) * open;
      fctx.fillRect(xx, yy, s, s);
    }
    fctx.globalAlpha = 1;
    fctx.restore();
  }

  /* the lid itself, swinging back on its hinges */
  const cx = G.lidX, hy = lidTopAt(cx + G.lidR * 0.98);
  fctx.save();
  fctx.translate(cx + G.lidR * 0.92, hy);
  fctx.rotate(lidLift * 1.55);
  fctx.translate(-(cx + G.lidR * 0.92), -hy);
  /* A chest lid is a curved plank with thickness. Drawing it as the dome
     down to a flat chord made it a sliver the moment it swung up — edge on,
     you have to actually see how thick it is. */
  const TH = Math.max(7, G.lidR * 0.155);
  const wood2 = fctx.createLinearGradient(0, G.lidY - G.lidR * 0.24, 0, G.lidY + TH * 1.4);
  wood2.addColorStop(0, "#9a6d3d");
  wood2.addColorStop(0.45, "#6b4a28");
  wood2.addColorStop(1, "#3c2914");
  fctx.fillStyle = wood2;
  fctx.beginPath();
  for (let k = -1; k <= 1.0001; k += 0.04) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR));
  for (let k = 1; k >= -1.0001; k -= 0.04) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH);
  fctx.closePath(); fctx.fill();
  /* the underside is in its own shadow */
  fctx.fillStyle = "rgba(24,14,6,0.42)";
  fctx.beginPath();
  for (let k = -1; k <= 1.0001; k += 0.06) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH * 0.52);
  for (let k = 1; k >= -1.0001; k -= 0.06) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH);
  fctx.closePath(); fctx.fill();
  /* a highlight along the crown */
  fctx.strokeStyle = "rgba(255,226,178,0.30)";
  fctx.lineWidth = Math.max(1.2, TH * 0.16);
  fctx.beginPath();
  for (let k = -0.94; k <= 0.94; k += 0.05) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH * 0.14);
  fctx.stroke();
  fctx.strokeStyle = "rgba(18,11,5,0.40)";
  fctx.lineWidth = Math.max(1, G.lidR * 0.012);
  for (let k = -0.8; k < 0.85; k += 0.22) {
    const x2 = cx + k * G.lidR;
    fctx.beginPath(); fctx.moveTo(x2, lidTopAt(x2)); fctx.lineTo(x2, lidTopAt(x2) + TH); fctx.stroke();
  }
  fctx.fillStyle = "#4a4038";
  for (const k of [-0.62, 0.62]) {
    const x2 = cx + k * G.lidR;
    fctx.fillRect(x2 - G.lidR * 0.045, lidTopAt(x2) - 1, G.lidR * 0.09, TH + 2);
  }
  /* the hasp, and the pin through it */
  const Hs = hasp(G);
  fctx.strokeStyle = "#5d564c"; fctx.lineWidth = Math.max(2, Hs.r * 0.30);
  fctx.beginPath();
  fctx.arc(Hs.x, Hs.y, Hs.r * 0.62, Math.PI * 0.15, Math.PI * 0.85);
  fctx.stroke();
  const pg = fctx.createLinearGradient(0, Hs.y - Hs.r * 0.2, 0, Hs.y + Hs.r * 0.2);
  pg.addColorStop(0, "#b9b2a6"); pg.addColorStop(0.5, "#7d766a"); pg.addColorStop(1, "#4a443b");
  fctx.fillStyle = pg;
  fctx.fillRect(Hs.x - Hs.r * 1.1 + pinOut * Hs.r * 2.6, Hs.y - Hs.r * 0.17,
                Hs.r * 2.2, Hs.r * 0.34);
  if (ready && pinOut < 1) {
    const p2 = 0.5 + 0.5 * Math.sin(digT * 2.6);
    fctx.strokeStyle = `rgba(255,226,170,${(0.24 + 0.36 * p2).toFixed(2)})`;
    fctx.lineWidth = Math.max(2, Hs.r * 0.10);
    fctx.beginPath(); fctx.arc(Hs.x, Hs.y, Hs.r * (1.8 + 0.55 * p2), 0, 6.3); fctx.stroke();
    /* and the pin itself works itself loose, so the eye goes to it */
    fctx.fillStyle = `rgba(255,240,206,${(0.35 + 0.4 * p2).toFixed(2)})`;
    fctx.fillRect(Hs.x + Hs.r * (1.05 + 0.10 * p2), Hs.y - Hs.r * 0.06, Hs.r * 0.5, Hs.r * 0.12);
  }
  fctx.restore();

  /* it floods at the end, and then it fades back — into somewhere else */
  if (lidLift >= 0.995) whiteOut = Math.min(2.4, whiteOut + dt * 0.42);
  if (whiteOut > 1.05 && !winOn && !jellyOn) startWindow();
  if (whiteOut > 0) {
    const a = whiteOut <= 1 ? whiteOut * whiteOut : Math.max(0, 1 - (whiteOut - 1) / 1.2);
    fctx.fillStyle = `rgba(255,250,238,${a.toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
  }
}

/* The whole lid is the target, not a 70px circle on the hasp — you should
   not have to find the pin to grab the pin. */
function liftHit(x, y) {
  const G = digGeom(), Hs = hasp(G);
  if (Math.abs(x - G.lidX) < G.lidR * 1.05 &&
      y > lidTopAt(G.lidX) - G.lidR * 0.55 && y < G.lidY + G.lidR * 0.75) return true;
  return Math.hypot(x - Hs.x, y - Hs.y) < Math.max(Hs.r * 2.4, 54 * UIS);
}
window.addEventListener("pointerdown", (e) => {
  if (digPhase !== 2 || liftT < 1.2 || whiteOut > 0) return;
  if (!liftHit(e.clientX, e.clientY)) return;
  /* Every other pull on this site advances on a tap — the pump, the dot.
     This one only moved on a drag, so a click did nothing at all and the
     chest read as broken. It takes taps now as well as drags. */
  if (pinOut < 1) {
    pinGrab = { x: e.clientX, p0: pinOut };
    pinOut = Math.min(1, pinOut + 0.26);
    pinScrape();
    if (pinOut >= 1) thud();
  } else {
    liftGrab = { y: e.clientY, l0: lidLift };
    lidLift = Math.min(1, lidLift + 0.20);
    creak(lidLift);
  }
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => {
  if (digPhase === 2 && liftT >= 1.2 && !whiteOut)
    finCanvas.style.cursor = liftHit(e.clientX, e.clientY) ? "grab" : "";
  const W = window.innerWidth, H = window.innerHeight;
  if (pinGrab) {
    const np = Math.max(0, Math.min(1, pinGrab.p0 + (e.clientX - pinGrab.x) / (W * 0.11)));
    if (np > pinOut) pinScrape();
    pinOut = Math.max(pinOut, np);
    if (pinOut >= 1) { pinGrab = null; thud(); }
    if (e.cancelable) e.preventDefault();
  } else if (liftGrab) {
    const nl = Math.max(0, Math.min(1, liftGrab.l0 + (liftGrab.y - e.clientY) / (H * 0.34)));
    if (nl > lidLift) creak(nl);
    lidLift = Math.max(lidLift, nl);
    if (e.cancelable) e.preventDefault();
  }
}, { passive: false });
window.addEventListener("pointerup", () => { pinGrab = null; liftGrab = null; });

let lastPin = 0;
function pinScrape() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastPin < 0.08) return;
  lastPin = t0;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 3600 + Math.random() * 2200; bp.Q.value = 9;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.026, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.12);
}
let lastCreak = 0;
function creak(v) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastCreak < 0.16) return;
  lastCreak = t0;
  const o = ac.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(78 + v * 90, t0);
  o.frequency.linearRampToValueAtTime(94 + v * 130, t0 + 0.3);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 420 + v * 500; bp.Q.value = 7;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.030, t0 + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
  o.connect(bp); bp.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.45);
}


/* ================= going through =================
   A cut between two scenes is a cut. This is the other thing: the scene
   you are leaving is grabbed as it stands, then pushed past you — scaled
   up out of the frame in a stack of copies so it smears radially, the way
   things do when you move through them — while the next one comes up
   underneath. Used at every hard change, so travel has a grammar and the
   whole thing feels like it is going somewhere rather than jumping. */
let travC = null, travX = null, travT = -1, travDur = 1.5, travDone = null;
let travelOnly = false;

function passThrough(after, opts) {
  const W = window.innerWidth, H = window.innerHeight;
  if (!travC) { travC = document.createElement("canvas"); travX = travC.getContext("2d"); }
  travC.width = W; travC.height = H;
  travX.setTransform(1, 0, 0, 1, 0, 0);
  travX.clearRect(0, 0, W, H);
  const src = (opts && opts.src) || finCanvas;
  try { travX.drawImage(src, 0, 0, W, H); } catch (e) {}
  travT = 0;
  travDur = (opts && opts.dur) || 1.5;
  travDone = after || null;
  whoosh((opts && opts.up) ? 1 : -1);
}

function travelFrame(dt) {
  if (travT < 0) return false;
  travT += dt;
  const W = window.innerWidth, H = window.innerHeight;
  const u = Math.min(1, travT / travDur);
  const e = u * u * (3 - 2 * u);
  /* dim what is underneath first, or the smear washes out against a bright
     scene and reads as a streak instead of as motion */
  fctx.fillStyle = `rgba(6,7,12,${(Math.sin(u * Math.PI) * 0.88).toFixed(3)})`;
  fctx.fillRect(0, 0, W, H);
  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  /* eight copies, each a little larger and dimmer: a radial smear for the
     price of eight drawImage calls */
  const N = 8;
  for (let i = 0; i < N; i++) {
    const f = i / (N - 1);
    const s = 1 + e * (1.9 + f * 2.6);
    const a = Math.sin(u * Math.PI) * (0.21 - f * 0.022);
    if (a <= 0.002) continue;
    fctx.globalAlpha = a;
    fctx.drawImage(travC, W / 2 - W * s / 2, H / 2 - H * s / 2, W * s, H * s);
  }
  fctx.restore();
  fctx.globalAlpha = 1;
  if (u >= 1) {
    travT = -1;
    if (travDone) { const f = travDone; travDone = null; f(); }
    return false;
  }
  return true;
}

function whoosh(dir) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.85;
  const a = dir > 0 ? 240 : 2400, b = dir > 0 ? 2600 : 200;
  bp.frequency.setValueAtTime(a, t0);
  bp.frequency.exponentialRampToValueAtTime(b, t0 + 1.5);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.075, t0 + 0.45);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.0);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 2.1);
  /* a low body under it so it has weight */
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(dir > 0 ? 48 : 128, t0);
  o.frequency.exponentialRampToValueAtTime(dir > 0 ? 132 : 42, t0 + 1.4);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.linearRampToValueAtTime(0.055, t0 + 0.4);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
  o.connect(g2); g2.connect(BUS);
  o.start(t0); o.stop(t0 + 1.9);
}

/* ================= the window =================
   The light out of the chest resolves into a pane of glass with rain on
   the far side of it and your breath on this one. There is nothing to
   work out and nothing to press: put a finger on it and wipe. The rain
   helps — every drop that runs cuts its own clear track down the glass.
   Behind it, out of focus, something is moving. */

let winOn = false, winT = 0, winClear = 0, winGone = 0, winWipe = null;
let fogC = null, fogX = null, rainDrops = [], bokeh = [];

function sizeFog() {
  const W = window.innerWidth, H = window.innerHeight;
  if (!fogC) {
    fogC = document.createElement("canvas");
    /* read back twice a second to see how clear it is — tell the browser so */
    fogX = fogC.getContext("2d", { willReadFrequently: true });
  }
  fogC.width = W; fogC.height = H;
  fogX.setTransform(1, 0, 0, 1, 0, 0);
  /* breath on glass is not flat — it is a field of tiny beads */
  fogX.clearRect(0, 0, W, H);
  const g = fogX.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
  g.addColorStop(0, "rgba(222,234,240,0.68)");
  g.addColorStop(1, "rgba(196,213,224,0.82)");
  fogX.fillStyle = g;
  fogX.fillRect(0, 0, W, H);
  for (let i = 0; i < 4200; i++) {
    const v = Math.random();
    fogX.fillStyle = v > 0.5 ? `rgba(255,255,255,${(v * 0.22).toFixed(3)})`
                             : `rgba(168,190,204,${((0.5 - v) * 0.26).toFixed(3)})`;
    const r = 0.6 + Math.random() * 2.2;
    fogX.beginPath();
    fogX.arc(Math.random() * W, Math.random() * H, r, 0, 6.3);
    fogX.fill();
  }
}

function startWindow() {
  if (winOn) return;
  winOn = true; winT = 0; winClear = 0; winGone = 0;
  sizeFog();
  const W = window.innerWidth, H = window.innerHeight;
  bokeh = [];
  const N = W < 620 ? 20 : 32;
  for (let i = 0; i < N; i++) {
    bokeh.push({
      x: rnd() * W, y: rnd() * H,
      r: Math.min(W, H) * (0.045 + rnd() * 0.13),
      hue: 168 + rnd() * 60,
      a: 0.34 + rnd() * 0.46,
      vx: (rnd() - 0.5) * 9, vy: -3 - rnd() * 9,
      ph: rnd() * 6.3, sp: 0.3 + rnd() * 0.7,
    });
  }
  rainDrops = [];
  finCanvas.style.cursor = "";
  bed('glass');
  rainOnGlass();
}

function fogLeft() {
  /* coarse sample — reading every pixel each frame is not worth it */
  const W = fogC.width, H = fogC.height;
  const step = 24;
  const d = fogX.getImageData(0, 0, W, H).data;
  let on = 0, n = 0;
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      n++;
      if (d[(y * W + x) * 4 + 3] > 90) on++;
    }
  }
  return n ? on / n : 1;
}

function wipeAt(x, y, r) {
  if (!fogX) return;
  fogX.save();
  fogX.globalCompositeOperation = "destination-out";
  const g = fogX.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(0.45, "rgba(0,0,0,0.94)");
  g.addColorStop(0.78, "rgba(0,0,0,0.42)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  fogX.fillStyle = g;
  fogX.fillRect(x - r, y - r, r * 2, r * 2);
  fogX.restore();
}

function windowFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  winT += dt;
  if (!fogC || fogC.width !== W || fogC.height !== H) sizeFog();
  hardClear(finCanvas, fctx);

  /* ---- what is behind the glass: out of focus, and moving ---- */
  const dark = fctx.createLinearGradient(0, 0, 0, H);
  dark.addColorStop(0, "#0a1f2b");
  dark.addColorStop(0.55, "#0d3040");
  dark.addColorStop(1, "#061520");
  fctx.fillStyle = dark; fctx.fillRect(0, 0, W, H);
  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  for (const b of bokeh) {
    b.x += (b.vx + Math.sin(winT * b.sp + b.ph) * 6) * dt;
    b.y += b.vy * dt;
    if (b.y < -b.r * 2) { b.y = H + b.r * 2; b.x = Math.random() * W; }
    if (b.x < -b.r) b.x = W + b.r;
    if (b.x > W + b.r) b.x = -b.r;
    /* they tighten up as the glass clears — the world coming into focus */
    const focus = 0.35 + 0.65 * winGone;
    const rr = b.r * (1.25 - 0.45 * winGone);
    const g = fctx.createRadialGradient(b.x, b.y, rr * 0.05 * focus, b.x, b.y, rr);
    const pulse = 0.85 + 0.15 * Math.sin(winT * b.sp * 1.7 + b.ph);
    g.addColorStop(0, `hsla(${b.hue},78%,${68 + winGone * 14}%,${(b.a * pulse * (0.8 + 0.4 * winGone)).toFixed(3)})`);
    g.addColorStop(0.42, `hsla(${b.hue},82%,58%,${(b.a * 0.50 * pulse).toFixed(3)})`);
    g.addColorStop(1, "hsla(0,0%,0%,0)");
    fctx.fillStyle = g;
    fctx.fillRect(b.x - rr, b.y - rr, rr * 2, rr * 2);
  }
  fctx.restore();

  /* ---- rain on the far side, cutting its own tracks ---- */
  if (rainDrops.length < (W < 620 ? 22 : 40) && Math.random() < 8 * dt) {
    rainDrops.push({ x: Math.random() * W, y: -10,
                     r: 2.2 + Math.random() * 5.5,
                     v: 0, wob: (Math.random() - 0.5) * 22, ph: Math.random() * 6.3 });
  }
  for (let i = rainDrops.length - 1; i >= 0; i--) {
    const d = rainDrops[i];
    /* a bead only runs once it is heavy enough, then it accelerates and
       picks up whatever it passes through */
    d.v += (18 + d.r * 26) * dt;
    d.v *= Math.exp(-1.6 * dt);
    const dy = d.v * dt;
    d.y += dy;
    d.x += Math.sin(winT * 1.3 + d.ph) * d.wob * dt;
    if (d.y > H + 20) { rainDrops.splice(i, 1); continue; }
    if (dy > 0.4) { wipeAt(d.x, d.y, d.r * 0.72); d.r *= 0.9985; }
  }

  /* ---- the fog, and the clear glass under it ---- */
  fctx.drawImage(fogC, 0, 0);

  /* the beads themselves sit on the glass, catching what is behind them */
  for (const d of rainDrops) {
    const g = fctx.createRadialGradient(d.x - d.r * 0.3, d.y - d.r * 0.35, 0, d.x, d.y, d.r);
    g.addColorStop(0, "rgba(255,255,255,0.55)");
    g.addColorStop(0.5, "rgba(190,225,235,0.20)");
    g.addColorStop(1, "rgba(120,170,190,0.30)");
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(d.x, d.y, d.r, 0, 6.3); fctx.fill();
    fctx.strokeStyle = "rgba(255,255,255,0.35)";
    fctx.lineWidth = Math.max(0.7, d.r * 0.14);
    fctx.beginPath(); fctx.arc(d.x, d.y, d.r * 0.94, 2.4, 4.6); fctx.stroke();
  }

  /* the glass itself: a cold sheen across it, and a frame beyond the edges */
  const sh = fctx.createLinearGradient(0, 0, W * 0.8, H);
  sh.addColorStop(0, "rgba(255,255,255,0.05)");
  sh.addColorStop(0.4, "rgba(255,255,255,0.01)");
  sh.addColorStop(0.75, "rgba(255,255,255,0.04)");
  sh.addColorStop(1, "rgba(255,255,255,0)");
  fctx.fillStyle = sh; fctx.fillRect(0, 0, W, H);

  /* ---- how clear is it ---- */
  if (winT > 0.6 && (winT % 0.5) < dt) {
    const left = fogLeft();
    winClear = 1 - left;
    if (winClear > 0.52 && !winGone) { winGone = 0.0001; clearSigh(); }
  }
  if (winGone > 0) {
    /* the rest of it goes at once, like a held breath let go */
    winGone = Math.min(1, winGone + dt * 0.5);
    fogX.save();
    fogX.globalCompositeOperation = "destination-out";
    fogX.fillStyle = `rgba(0,0,0,${(dt * 3.4).toFixed(3)})`;
    fogX.fillRect(0, 0, W, H);
    fogX.restore();
    if (winGone >= 1 && !jellyOn && travT < 0) {
      passThrough(() => { winOn = false; startJelly(196); }, { dur: 1.5 });
    }
  }

  /* a nudge, if they have not touched it */
  if (winT > 4 && winClear < 0.04) {
    const p = 0.5 + 0.5 * Math.sin(winT * 2.0);
    const cx = W * 0.5, cy = H * 0.52;
    fctx.strokeStyle = `rgba(255,255,255,${(0.10 + 0.16 * p).toFixed(3)})`;
    fctx.lineWidth = Math.max(6, Math.min(W, H) * 0.018);
    fctx.lineCap = "round";
    fctx.beginPath();
    const sweep = Math.min(W, H) * 0.16;
    fctx.moveTo(cx - sweep, cy + Math.sin(winT * 2.0) * sweep * 0.25);
    fctx.quadraticCurveTo(cx, cy - sweep * 0.35,
                          cx + sweep, cy + Math.sin(winT * 2.0 + 1) * sweep * 0.25);
    fctx.stroke();
  }
}

/* --- wiping --- */
function winBrush() { return Math.max(26, Math.min(window.innerWidth, window.innerHeight) * 0.075); }
window.addEventListener("pointerdown", (e) => {
  if (!winOn || winGone) return;
  winWipe = { x: e.clientX, y: e.clientY };
  wipeAt(e.clientX, e.clientY, winBrush());
  squeak(0.4, e.clientX);
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => {
  if (!winOn || winGone) return;
  finCanvas.style.cursor = "cell";
  if (!winWipe) return;
  /* interpolate, or a fast swipe leaves gaps */
  const dx = e.clientX - winWipe.x, dy = e.clientY - winWipe.y;
  const D = Math.hypot(dx, dy), step = winBrush() * 0.34;
  const n = Math.max(1, Math.ceil(D / step));
  for (let i = 1; i <= n; i++)
    wipeAt(winWipe.x + dx * i / n, winWipe.y + dy * i / n, winBrush());
  winWipe = { x: e.clientX, y: e.clientY };
  squeak(Math.min(1, D / 90), e.clientX);
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointerup", () => { winWipe = null; });

/* --- sound --- */
let rainBed = null;
function rainOnGlass() {
  const ac = audio(); if (!ac || rainBed) return;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2600; bp.Q.value = 0.5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.linearRampToValueAtTime(0.038, ac.currentTime + 2.5);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start();
  rainBed = { s, g };
  /* the odd fat drop hitting the pane */
  const tick = () => {
    if (!winOn) return;
    const ac2 = audio(); if (!ac2) return;
    const t0 = ac2.currentTime;
    const o = ac2.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(900 + Math.random() * 1600, t0);
    o.frequency.exponentialRampToValueAtTime(300, t0 + 0.06);
    const gg = ac2.createGain();
    gg.gain.setValueAtTime(0.020, t0);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
    o.connect(gg); gg.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t0); o.stop(t0 + 0.1);
    setTimeout(tick, 300 + Math.random() * 1600);
  };
  setTimeout(tick, 800);
}
let lastSq = 0;
function squeak(v, px) {
  const ac = audio(); if (!ac || v < 0.05) return;
  const t0 = ac.currentTime;
  if (t0 - lastSq < 0.07) return;
  lastSq = t0;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(560 + v * 900, t0);
  o.frequency.exponentialRampToValueAtTime(420 + v * 500, t0 + 0.12);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 1400 + v * 1800; bp.Q.value = 5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.016 * (0.3 + v), t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
  o.connect(bp); bp.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 0.18);
}
function clearSigh() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (rainBed) rainBed.g.gain.setTargetAtTime(0.012, t0, 1.2);
  [196, 261.6, 329.6, 392, 523.3].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 2 ? "sine" : "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.11);
    g.gain.exponentialRampToValueAtTime(0.048, t0 + i * 0.11 + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 5.0);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.11); o.stop(t0 + 5.2);
  });
}

/* ================= inside the jar =================
   Whatever was in it, this is it: deep water with things drifting in it,
   lit from nowhere in particular. There is nothing to work out. Touch one
   and it lights, and lighting them is the whole of it — when they are all
   awake they rise together and take the light with them. */

let jellyOn = false, jellyT = 0, jellies = [], motes = [], jellyHue = 200, jellyRise = 0, jellyLit = 0;

function startJelly(hue) {
  if (jellyOn) return;
  jellyOn = true; jellyT = 0; jellyRise = 0; jellyLit = 0;
  jellyHue = hue === undefined ? 200 : hue;
  const W = window.innerWidth, H = window.innerHeight;
  const N = W < 620 ? 6 : 9;
  jellies = [];
  for (let i = 0; i < N; i++) {
    jellies.push({
      x: W * (0.10 + rnd() * 0.80),
      y: H * (0.12 + rnd() * 0.82),
      r: Math.min(W, H) * (0.055 + rnd() * 0.055),
      ph: rnd() * 6.3,
      sp: 0.55 + rnd() * 0.45,
      drift: (rnd() - 0.5) * 12,
      hue: (jellyHue + (rnd() - 0.5) * 70 + 360) % 360,
      lit: 0, flash: 0,
      arms: 5 + ((rnd() * 4) | 0),
      seed: rnd() * 100,
    });
  }
  motes = [];
  for (let i = 0; i < (W < 620 ? 60 : 120); i++)
    motes.push({ x: rnd() * W, y: rnd() * H, r: 0.4 + rnd() * 1.5,
                 v: 4 + rnd() * 14, ph: rnd() * 6.3 });
  bed('deep');
}

function drawJelly(j, t) {
  const c = fctx;
  /* the bell breathes: it contracts and springs back, and everything
     hanging off it lags behind by a beat */
  const beat = Math.sin(t * j.sp * 1.9 + j.ph);
  const squash = 1 + beat * 0.16;
  const rw = j.r * (1.06 / squash), rh = j.r * 0.86 * squash;
  const lag = Math.sin(t * j.sp * 1.9 + j.ph - 0.9);
  const L = 68 + j.lit * 22, S = 62 + j.lit * 34;
  const A = 0.30 + j.lit * 0.40 + j.flash * 0.5;

  c.save();
  c.translate(j.x, j.y);

  /* tentacles first, so the bell sits over them */
  c.strokeStyle = `hsla(${j.hue},${S}%,${L + 8}%,${(A * 0.55).toFixed(3)})`;
  c.lineWidth = Math.max(1, j.r * 0.028);
  c.lineCap = "round";
  for (let k = 0; k < 11; k++) {
    const u = (k / 10 - 0.5) * 1.7;
    const bx = u * rw * 0.86;
    c.beginPath();
    c.moveTo(bx, rh * 0.55);
    for (let s = 1; s <= 7; s++) {
      const f = s / 7;
      const sway = Math.sin(t * 1.5 + j.seed + k * 0.7 - f * 3.1) * j.r * 0.16 * f
                 - lag * j.r * 0.10 * f;
      c.lineTo(bx + sway + u * j.r * 0.10 * f, rh * 0.55 + f * j.r * (1.6 + 0.5 * Math.sin(j.seed + k)));
    }
    c.stroke();
  }
  /* four thicker oral arms, frilled */
  c.strokeStyle = `hsla(${j.hue},${S + 8}%,${L + 12}%,${(A * 0.72).toFixed(3)})`;
  c.lineWidth = Math.max(1.6, j.r * 0.075);
  for (let k = 0; k < 4; k++) {
    const u = (k / 3 - 0.5) * 0.9;
    c.beginPath();
    c.moveTo(u * rw * 0.4, rh * 0.4);
    for (let s = 1; s <= 6; s++) {
      const f = s / 6;
      const sway = Math.sin(t * 1.15 + j.seed * 2 + k * 1.3 - f * 2.4) * j.r * 0.22 * f
                 - lag * j.r * 0.16 * f;
      c.lineTo(u * rw * 0.4 + sway, rh * 0.4 + f * j.r * 1.15);
    }
    c.stroke();
  }

  /* the bell: translucent, brighter at the crown, with a hard rim */
  const g = c.createRadialGradient(0, -rh * 0.35, rh * 0.06, 0, rh * 0.1, rw * 1.25);
  g.addColorStop(0, `hsla(${j.hue},${S}%,${Math.min(95, L + 26)}%,${(A * 0.95).toFixed(3)})`);
  g.addColorStop(0.55, `hsla(${j.hue},${S}%,${L}%,${(A * 0.55).toFixed(3)})`);
  g.addColorStop(1, `hsla(${(j.hue + 20) % 360},${S}%,${L - 18}%,0)`);
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(0, 0, rw, rh, 0, Math.PI, 0);
  c.quadraticCurveTo(rw * 0.55, rh * 0.62, 0, rh * 0.44);
  c.quadraticCurveTo(-rw * 0.55, rh * 0.62, -rw, 0);
  c.closePath();
  c.fill();
  c.strokeStyle = `hsla(${j.hue},92%,${Math.min(94, L + 22)}%,${(A * 0.85).toFixed(3)})`;
  c.lineWidth = Math.max(1.2, j.r * 0.035);
  c.stroke();
  /* the radial canals across the bell */
  c.strokeStyle = `hsla(${j.hue},90%,${L + 16}%,${(A * 0.45).toFixed(3)})`;
  c.lineWidth = Math.max(1, j.r * 0.022);
  for (let k = 0; k < j.arms; k++) {
    const u = (k / (j.arms - 1) - 0.5) * 1.55;
    c.beginPath();
    c.moveTo(u * rw * 0.9, rh * 0.30);
    c.quadraticCurveTo(u * rw * 0.55, -rh * 0.35, u * rw * 0.24, -rh * 0.66);
    c.stroke();
  }
  c.restore();

  /* lit ones carry their own light */
  if (j.lit > 0.02 || j.flash > 0.02) {
    c.save();
    c.globalCompositeOperation = "lighter";
    const gl = c.createRadialGradient(j.x, j.y, 0, j.x, j.y, j.r * (3.2 + j.flash * 3));
    gl.addColorStop(0, `hsla(${j.hue},95%,80%,${(0.18 * j.lit + 0.34 * j.flash).toFixed(3)})`);
    gl.addColorStop(1, "hsla(0,0%,0%,0)");
    c.fillStyle = gl;
    c.fillRect(j.x - j.r * 6, j.y - j.r * 6, j.r * 12, j.r * 12);
    c.restore();
  }
}

function jellyFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  jellyT += dt;
  hardClear(finCanvas, fctx);

  /* the water */
  const deep = fctx.createLinearGradient(0, 0, 0, H);
  const lift = jellyRise;
  deep.addColorStop(0, `hsl(${(jellyHue + 200) % 360},${46 + lift * 30}%,${7 + lift * 40}%)`);
  deep.addColorStop(0.55, `hsl(${(jellyHue + 190) % 360},${52 + lift * 26}%,${11 + lift * 44}%)`);
  deep.addColorStop(1, `hsl(${(jellyHue + 180) % 360},${58}%,${4 + lift * 34}%)`);
  fctx.fillStyle = deep; fctx.fillRect(0, 0, W, H);

  /* marine snow going the other way */
  fctx.fillStyle = `rgba(210,232,255,${(0.20 + 0.2 * lift).toFixed(2)})`;
  for (const m of motes) {
    m.y -= m.v * dt;
    if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
    fctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(jellyT * 0.6 + m.ph));
    fctx.fillRect(m.x + Math.sin(jellyT * 0.4 + m.ph) * 6, m.y, m.r, m.r);
  }
  fctx.globalAlpha = 1;

  let allLit = true;
  for (const j of jellies) {
    j.flash *= Math.exp(-2.4 * dt);
    if (j.lit < 1 && j.lit > 0) j.lit = Math.min(1, j.lit + dt * 1.6);
    if (j.lit < 0.99) allLit = false;
    /* they always drift up a little; lit ones climb */
    const climb = 9 + j.lit * 46 + jellyRise * 260;
    j.y -= climb * dt;
    j.x += (j.drift + Math.sin(jellyT * 0.4 + j.ph) * 7) * dt;
    if (j.y < -j.r * 3.4) { j.y = H + j.r * 3.4; }
    if (j.x < -j.r * 2) j.x = W + j.r * 2;
    if (j.x > W + j.r * 2) j.x = -j.r * 2;
    drawJelly(j, jellyT);
  }
  jellyLit = jellies.filter(j => j.lit > 0.5).length;

  if (allLit) {
    jellyRise = Math.min(1, jellyRise + dt * 0.22);
    if (jellyRise > 0.72 && !surfOn) { jellyOn = false; startSurface(); return; }
    if (jellyRise > 0.35) {
      fctx.save();
      fctx.globalCompositeOperation = "lighter";
      const f = (jellyRise - 0.35) / 0.65;
      fctx.fillStyle = `hsla(${jellyHue},80%,86%,${(f * f * 0.9).toFixed(3)})`;
      fctx.fillRect(0, 0, W, H);
      fctx.restore();
    }
  }
}

function jellyTouch(x, y) {
  if (!jellyOn) return;
  let best = null, bd = 1e9;
  for (const j of jellies) {
    const d = Math.hypot(x - j.x, y - j.y) / (j.r * 2.2);
    if (d < bd) { bd = d; best = j; }
  }
  if (!best || bd > 1.25) return;
  best.flash = 1;
  if (best.lit < 0.02) { best.lit = 0.02; jellyPing(best.hue, false, best.x); }
  else jellyPing(best.hue, true, best.x);
}
window.addEventListener("pointerdown", (e) => {
  if (!jellyOn) return;
  jellyTouch(e.clientX, e.clientY);
}, { passive: true });
window.addEventListener("pointermove", (e) => {
  if (!jellyOn) return;
  finCanvas.style.cursor = "pointer";
}, { passive: true });

function jellyPing(hue, again, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const SC = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
  const f = SC[Math.floor((hue / 360) * SC.length) % SC.length] * (again ? 2 : 1);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.value = f;
  const o2 = ac.createOscillator(); o2.type = "sine";
  o2.frequency.value = f * 2.004;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(again ? 0.028 : 0.055, t0 + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
  o.connect(g); o2.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 2.6);
  o2.start(t0); o2.stop(t0 + 2.6);
}
function jellySwell() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 340;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.045, t0 + 4);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0);
}

/* ================= the surface =================
   The jellyfish took the light up with them and you went too. This is
   what breaking through looks like from underneath: the underside of the
   surface sweeps down past you, water sheets off the lens, and the world
   un-muffles — the low-pass that has been on everything since you went
   under opens all the way up as your head clears.

   Above it: a still lake at night with mist lying on it, a far shore, and
   paper lanterns adrift on the black water, unlit. Touch one and it
   catches. Light them all and they go up together, and you go with them. */

let surfOn = false, surfT = 0, breach = 0, lanterns = [], lampRise = 0;
let lakeStars = [], mistBands = [], shoreLine = null, lensDrops = [];

function startSurface() {
  if (surfOn) return;
  surfOn = true; surfT = 0; breach = 0; lampRise = 0;
  const W = window.innerWidth, H = window.innerHeight;
  const hz = H * 0.42;

  lakeStars = [];
  for (let i = 0; i < (W < 620 ? 90 : 170); i++)
    lakeStars.push({ x: rnd() * W, y: rnd() * hz * 0.94,
                     r: 0.4 + rnd() * 1.3, b: 0.25 + rnd() * 0.75,
                     tw: 0.4 + rnd() * 1.8, ph: rnd() * 6.3 });

  /* a far shore: conifers, in silhouette, at the size distance makes them */
  shoreLine = [];
  let x = -30;
  while (x < W + 30) {
    const hgt = hz * (0.035 + Math.pow(rnd(), 1.6) * 0.09);
    const wid = hgt * (0.34 + rnd() * 0.26);
    shoreLine.push({ x, h: hgt, w: wid });
    x += wid * (0.55 + rnd() * 0.7);
  }

  mistBands = [];
  for (let i = 0; i < 5; i++)
    mistBands.push({ y: hz + (H - hz) * (0.02 + i * 0.055 + rnd() * 0.03),
                     h: (H - hz) * (0.02 + rnd() * 0.035),
                     sp: (4 + rnd() * 11) * (rnd() < 0.5 ? -1 : 1),
                     x: rnd() * W, a: 0.06 + rnd() * 0.10, bobp: rnd() * 6.3 });

  lanterns = [];
  const N = W < 620 ? 5 : 7;
  for (let i = 0; i < N; i++) {
    const d = 0.10 + (i / N) * 0.72 + rnd() * 0.10;      /* how near the shore */
    lanterns.push({
      d,
      x: W * (0.07 + (i + rnd() * 0.75) / N * 0.86),
      s: Math.min(W, H) * (0.030 + d * 0.055),
      lit: 0, flick: rnd() * 6.3,
      drift: (rnd() - 0.5) * 5,
      bob: rnd() * 6.3,
      hue: 34 + rnd() * 14,
    });
  }
  lanterns.sort((a, b) => a.d - b.d);

  lensDrops = [];
  for (let i = 0; i < 22; i++)
    lensDrops.push({ x: rnd() * W, y: rnd() * H * 0.5, r: 3 + rnd() * 11,
                     v: 40 + rnd() * 160, wob: rnd() * 6.3 });

  bed("sea");
  surfaceBreak();
}

const lakeHZ = () => window.innerHeight * 0.42;

function lanternY(l) {
  const H = window.innerHeight, hz = lakeHZ();
  return hz + (H - hz) * (0.10 + l.d * 0.72)
       + Math.sin(surfT * 0.7 + l.bob) * 2.2
       - lampRise * (H * 0.9) * (0.55 + l.d * 0.6);
}

function drawLantern(l, x, y, s, alpha) {
  const c = fctx;
  const lit = l.lit;
  const flame = 0.72 + 0.28 * Math.sin(surfT * 9 + l.flick)
                     + 0.12 * Math.sin(surfT * 23 + l.flick * 2);
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;

  /* the paper: a soft-shouldered cylinder, warm from inside when it is lit */
  const paper = c.createLinearGradient(x - s, 0, x + s, 0);
  const L = 62 + lit * 26 * flame;
  const S = 12 + lit * 62;
  paper.addColorStop(0, `hsla(${l.hue},${S}%,${L * 0.44}%,${0.86})`);
  paper.addColorStop(0.34, `hsla(${l.hue},${S}%,${L}%,${0.94})`);
  paper.addColorStop(0.62, `hsla(${l.hue},${S}%,${L * 0.86}%,${0.92})`);
  paper.addColorStop(1, `hsla(${l.hue},${S}%,${L * 0.38}%,${0.86})`);
  c.fillStyle = paper;
  c.beginPath();
  c.moveTo(x - s * 0.80, y - s * 0.22);
  c.bezierCurveTo(x - s * 1.00, y - s * 1.20, x - s * 0.74, y - s * 1.98, x, y - s * 2.05);
  c.bezierCurveTo(x + s * 0.74, y - s * 1.98, x + s * 1.00, y - s * 1.20, x + s * 0.80, y - s * 0.22);
  c.quadraticCurveTo(x, y + s * 0.10, x - s * 0.80, y - s * 0.22);
  c.closePath();
  c.fill();
  /* the ribs of it */
  c.strokeStyle = `hsla(${l.hue},${S}%,${L * 0.55}%,0.34)`;
  c.lineWidth = Math.max(0.8, s * 0.035);
  for (let k = -2; k <= 2; k++) {
    const u = k / 2.4;
    c.beginPath();
    c.moveTo(x + u * s * 0.76, y - s * 0.24);
    c.quadraticCurveTo(x + u * s * 0.90, y - s * 1.10, x + u * s * 0.30, y - s * 1.94);
    c.stroke();
  }
  /* bamboo hoop and the little basket under it */
  c.strokeStyle = "rgba(96,72,42,0.85)";
  c.lineWidth = Math.max(1, s * 0.06);
  c.beginPath();
  c.ellipse(x, y - s * 0.20, s * 0.87, s * 0.15, 0, 0, 6.3);
  c.stroke();
  c.strokeStyle = "rgba(70,52,30,0.7)";
  c.lineWidth = Math.max(0.8, s * 0.04);
  c.beginPath();
  c.moveTo(x - s * 0.5, y - s * 0.18); c.lineTo(x, y + s * 0.10);
  c.moveTo(x + s * 0.5, y - s * 0.18); c.lineTo(x, y + s * 0.10);
  c.stroke();

  if (lit > 0.02) {
    /* the flame itself, small and never still */
    c.save();
    c.globalCompositeOperation = "lighter";
    const fy = y - s * 0.62;
    const fg = c.createRadialGradient(x, fy, 0, x, fy, s * 0.55 * flame);
    fg.addColorStop(0, `rgba(255,246,214,${(0.95 * lit).toFixed(3)})`);
    fg.addColorStop(0.4, `rgba(255,196,96,${(0.60 * lit).toFixed(3)})`);
    fg.addColorStop(1, "rgba(255,150,50,0)");
    c.fillStyle = fg;
    c.fillRect(x - s, fy - s, s * 2, s * 2);
    /* and the light it throws */
    const gg = c.createRadialGradient(x, y - s * 0.6, 0, x, y - s * 0.6, s * (5 + flame));
    gg.addColorStop(0, `rgba(255,206,130,${(0.24 * lit).toFixed(3)})`);
    gg.addColorStop(0.45, `rgba(255,170,80,${(0.09 * lit).toFixed(3)})`);
    gg.addColorStop(1, "rgba(255,150,60,0)");
    c.fillStyle = gg;
    c.fillRect(x - s * 6, y - s * 6.6, s * 12, s * 12);
    c.restore();
  } else if (surfT > 3.5) {
    /* unlit ones ask, quietly */
    const p = 0.5 + 0.5 * Math.sin(surfT * 1.8 + l.bob);
    c.strokeStyle = `rgba(240,232,214,${(0.07 + 0.10 * p).toFixed(3)})`;
    c.lineWidth = Math.max(1, s * 0.05);
    c.beginPath();
    c.ellipse(x, y - s * 0.55, s * (1.5 + 0.30 * p), s * (1.5 + 0.30 * p), 0, 0, 6.3);
    c.stroke();
  }
  c.restore();
}

function surfaceFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight, hz = lakeHZ();
  surfT += dt;
  hardClear(finCanvas, fctx);

  /* ---- the sky, and the far side of the water ---- */
  const sky = fctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, "#070b1c");
  sky.addColorStop(0.62, "#0d1730");
  sky.addColorStop(1, "#22283f");
  fctx.fillStyle = sky; fctx.fillRect(0, 0, W, hz + 1);

  fctx.fillStyle = "#eef4ff";
  for (const s of lakeStars) {
    fctx.globalAlpha = s.b * (0.55 + 0.45 * Math.sin(surfT * s.tw + s.ph)) * (1 - lampRise * 0.5);
    fctx.beginPath(); fctx.arc(s.x, s.y, s.r, 0, 6.3); fctx.fill();
  }
  fctx.globalAlpha = 1;

  /* a warm sit of light behind the trees, so the shore reads as far away */
  const glow = fctx.createLinearGradient(0, hz - H * 0.12, 0, hz);
  glow.addColorStop(0, "rgba(90,74,64,0)");
  glow.addColorStop(1, "rgba(148,116,86,0.22)");
  fctx.fillStyle = glow; fctx.fillRect(0, hz - H * 0.12, W, H * 0.12);

  fctx.fillStyle = "#05070f";
  for (const t of shoreLine) {
    fctx.beginPath();
    fctx.moveTo(t.x - t.w, hz + 1);
    fctx.lineTo(t.x, hz - t.h);
    fctx.lineTo(t.x + t.w, hz + 1);
    fctx.closePath(); fctx.fill();
  }
  fctx.fillRect(0, hz - 1, W, 3);

  /* ---- the lake ---- */
  const lake = fctx.createLinearGradient(0, hz, 0, H);
  lake.addColorStop(0, "#0a1020");
  lake.addColorStop(0.4, "#070c18");
  lake.addColorStop(1, "#03050c");
  fctx.fillStyle = lake; fctx.fillRect(0, hz, W, H - hz);

  /* reflections: the lantern light smeared straight down and broken up by
     the ripple, which is the whole reason to put them on water */
  fctx.save();
  fctx.beginPath(); fctx.rect(0, hz, W, H - hz); fctx.clip();
  fctx.globalCompositeOperation = "lighter";
  for (const l of lanterns) {
    if (l.lit < 0.02) continue;
    const y = lanternY(l);
    const base = Math.max(y, hz);
    const len = (H - base) * (0.5 + l.lit * 0.5);
    const rows = 46;
    for (let i = 0; i < rows; i++) {
      const f = i / (rows - 1);
      const ry = base + f * len;
      /* the column wanders and narrows as the ripple pulls it apart */
      const wob = Math.sin(surfT * 1.7 + f * 13 + l.bob) * l.s * 0.30 * (0.25 + f)
                + Math.sin(surfT * 2.9 - f * 21 + l.bob * 2) * l.s * 0.16 * f;
      const a = 0.115 * l.lit * Math.pow(1 - f, 1.7)
              * (0.55 + 0.45 * Math.abs(Math.sin(surfT * 2.2 + f * 17 + l.bob)));
      if (a < 0.003) continue;
      fctx.fillStyle = `rgba(255,${(190 - f * 46) | 0},${(104 - f * 34) | 0},${a.toFixed(3)})`;
      const rw = l.s * (0.85 - f * 0.42) * (0.7 + 0.3 * Math.sin(surfT * 1.3 + f * 9));
      fctx.fillRect(l.x + wob - rw, ry, rw * 2, len / rows + 1.2);
    }
  }
  fctx.restore();

  /* the ring each one sits in */
  for (const l of lanterns) {
    const y = lanternY(l);
    if (y < hz || lampRise > 0.02) continue;
    fctx.strokeStyle = `rgba(190,206,230,${(0.05 + 0.10 * l.lit).toFixed(3)})`;
    fctx.lineWidth = 1;
    for (let k = 0; k < 2; k++) {
      const rr = l.s * (1.2 + k * 0.9 + (surfT * 0.35 + k * 0.5) % 1.6);
      fctx.beginPath();
      fctx.ellipse(l.x, y + l.s * 0.06, rr, rr * 0.20, 0, 0, 6.3);
      fctx.stroke();
    }
  }

  /* ---- the lanterns ---- */
  for (const l of lanterns) {
    if (l.lit > 0 && l.lit < 1) l.lit = Math.min(1, l.lit + dt * 1.1);
    l.x += (l.drift + Math.sin(surfT * 0.3 + l.bob) * 3) * dt;
    if (l.x < -l.s * 3) l.x = W + l.s * 3;
    if (l.x > W + l.s * 3) l.x = -l.s * 3;
    drawLantern(l, l.x, lanternY(l), l.s);
  }

  /* ---- mist, lying on the water and drifting ---- */
  fctx.save();
  for (const m of mistBands) {
    m.x += m.sp * dt;
    if (m.x > W * 1.4) m.x = -W * 0.4;
    if (m.x < -W * 0.4) m.x = W * 1.4;
    /* a band has to fade both ways — along its length and across it — so
       it is drawn as thin rows with a horizontal gradient and a vertical
       falloff on the alpha */
    const gx = fctx.createLinearGradient(m.x - W * 0.55, 0, m.x + W * 0.75, 0);
    gx.addColorStop(0, "rgba(206,220,236,0)");
    gx.addColorStop(0.35, "rgba(210,224,238,0.75)");
    gx.addColorStop(0.62, "rgba(206,220,236,1)");
    gx.addColorStop(1, "rgba(206,220,236,0)");
    fctx.fillStyle = gx;
    const rows = 9;
    for (let k = 0; k < rows; k++) {
      const f = (k + 0.5) / rows;
      const yy = m.y - m.h + f * m.h * 2;
      fctx.globalAlpha = m.a * (1 - lampRise) * Math.sin(f * Math.PI)
                       * (0.75 + 0.25 * Math.sin(surfT * 0.4 + k + m.bobp));
      fctx.fillRect(m.x - W * 0.55, yy, W * 1.3, m.h * 2 / rows + 1);
    }
    fctx.globalAlpha = 1;
  }
  fctx.restore();

  /* ---- still coming up through it ---- */
  if (breach < 1) {
    breach = Math.min(1, breach + dt * 0.42);
    setUnderwater(1 - breach);
    const sy = -H * 0.15 + breach * (H * 1.25);
    /* everything below the line is still under */
    fctx.save();
    fctx.beginPath();
    fctx.moveTo(0, H + 2);
    fctx.lineTo(0, sy);
    for (let x = 0; x <= W; x += 12)
      fctx.lineTo(x, sy + Math.sin(x * 0.017 + surfT * 3.1) * 10
                       + Math.sin(x * 0.045 - surfT * 2.2) * 4);
    fctx.lineTo(W, H + 2);
    fctx.closePath();
    fctx.clip();
    const uw = fctx.createLinearGradient(0, sy, 0, H);
    uw.addColorStop(0, "rgba(70,150,170,0.86)");
    uw.addColorStop(0.5, "rgba(20,70,104,0.94)");
    uw.addColorStop(1, "rgba(4,26,48,0.98)");
    fctx.fillStyle = uw; fctx.fillRect(0, sy - 4, W, H - sy + 8);
    /* the underside of the surface, mirrored and bright */
    fctx.globalCompositeOperation = "lighter";
    fctx.fillStyle = "rgba(200,244,255,0.30)";
    fctx.fillRect(0, sy, W, 10);
    fctx.restore();
    /* the meniscus itself */
    fctx.strokeStyle = `rgba(226,250,255,${(0.55 * (1 - breach * 0.4)).toFixed(2)})`;
    fctx.lineWidth = 2.4;
    fctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const yy = sy + Math.sin(x * 0.017 + surfT * 3.1) * 10
                    + Math.sin(x * 0.045 - surfT * 2.2) * 4;
      x === 0 ? fctx.moveTo(x, yy) : fctx.lineTo(x, yy);
    }
    fctx.stroke();
  } else if (lensDrops.length) {
    /* water still running off the glass for a moment after */
    fctx.save();
    for (let i = lensDrops.length - 1; i >= 0; i--) {
      const d = lensDrops[i];
      d.y += d.v * dt; d.v += 260 * dt;
      if (d.y > H + 20) { lensDrops.splice(i, 1); continue; }
      const g = fctx.createRadialGradient(d.x - d.r * 0.3, d.y - d.r * 0.3, 0, d.x, d.y, d.r);
      g.addColorStop(0, "rgba(235,250,255,0.30)");
      g.addColorStop(0.7, "rgba(190,220,240,0.10)");
      g.addColorStop(1, "rgba(180,210,235,0)");
      fctx.fillStyle = g;
      fctx.beginPath();
      fctx.ellipse(d.x + Math.sin(d.wob + surfT * 4) * 2, d.y, d.r * 0.8, d.r * 1.25, 0, 0, 6.3);
      fctx.fill();
    }
    fctx.restore();
  }

  /* ---- all lit: up they go, and you with them ---- */
  if (lanterns.length && lanterns.every(l => l.lit > 0.98)) {
    lampRise = Math.min(1, lampRise + dt * 0.10);
    if (lampRise > 0.55 && travT < 0 && !surfHanded) {
      surfHanded = true;
      passThrough(() => { surfOn = false; }, { dur: 2.0, up: true });
    }
  }
  travelFrame(dt);
}
let surfHanded = false;

/* --- touching one --- */
window.addEventListener("pointerdown", (e) => {
  if (!surfOn || breach < 0.5 || lampRise > 0) return;
  let best = null, bd = 1e9;
  for (const l of lanterns) {
    const y = lanternY(l);
    const d = Math.hypot(e.clientX - l.x, e.clientY - (y - l.s * 0.6)) / (l.s * 2.4);
    if (d < bd) { bd = d; best = l; }
  }
  if (!best || bd > 1.2) return;
  if (best.lit > 0.01) return;
  best.lit = 0.02;
  lanternCatch(best.x, best.hue);
}, { passive: true });
window.addEventListener("pointermove", (e) => {
  if (!surfOn || breach < 0.5) return;
  let near = false;
  for (const l of lanterns) {
    if (l.lit > 0.01) continue;
    const y = lanternY(l);
    if (Math.hypot(e.clientX - l.x, e.clientY - (y - l.s * 0.6)) < l.s * 2.4) near = true;
  }
  finCanvas.style.cursor = near ? "pointer" : "";
}, { passive: true });

/* --- sound --- */
function surfaceBreak() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* the rush of coming up */
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
  bp.frequency.setValueAtTime(280, t0);
  bp.frequency.exponentialRampToValueAtTime(3200, t0 + 1.6);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.10, t0 + 0.9);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 2.7);
  /* and the drips off it afterwards, scattered across the stereo field */
  for (let i = 0; i < 14; i++) {
    const t = t0 + 1.5 + Math.random() * 2.4;
    const o = ac.createOscillator(); o.type = "sine";
    const f = 900 + Math.random() * 1800;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.09);
    const dg = ac.createGain();
    dg.gain.setValueAtTime(0.030 + Math.random() * 0.020, t);
    dg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(dg); dg.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t); o.stop(t + 0.18);
  }
  /* a wide, slow pad underneath the whole scene */
  [82.4, 123.5, 164.8, 246.9].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 1 ? "sine" : "triangle";
    o.frequency.value = f;
    const lfo = ac.createOscillator(); lfo.type = "sine";
    lfo.frequency.value = 0.06 + i * 0.017;
    const lg = ac.createGain(); lg.gain.value = 0.9;
    lfo.connect(lg); lg.connect(o.detune); lfo.start(t0);
    const pg = ac.createGain();
    pg.gain.setValueAtTime(0.0001, t0);
    pg.gain.linearRampToValueAtTime(0.020, t0 + 6 + i);
    o.connect(pg); pg.connect(BUS);
    o.start(t0);
  });
}

function lanternCatch(px, hue) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const dest = at(px) || BUS;
  /* paper taking: a short bright crackle */
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  s.playbackRate.value = 0.8 + Math.random() * 0.5;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2600;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.055, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
  s.connect(hp); hp.connect(g); g.connect(dest);
  s.start(t0); s.stop(t0 + 0.65);
  /* and a warm note off it, from a scale that cannot go wrong */
  const SC = [174.6, 220, 261.6, 329.6, 392, 440, 523.3];
  const n = Math.floor(((hue - 34) / 14) * SC.length) % SC.length;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.value = SC[(n + SC.length) % SC.length] * 2;
  const o2 = ac.createOscillator(); o2.type = "sine";
  o2.frequency.value = SC[(n + SC.length) % SC.length];
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(0.045, t0 + 0.10);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
  o.connect(g2); o2.connect(g2); g2.connect(dest);
  o.start(t0); o.stop(t0 + 3.8);
  o2.start(t0); o2.stop(t0 + 3.8);
}

function splatSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(2200, t0);
  lp.frequency.exponentialRampToValueAtTime(180, t0 + 0.3);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.36);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(160, t0);
  o.frequency.exponentialRampToValueAtTime(48, t0 + 0.22);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.36, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  o.connect(g2); g2.connect(BUS); o.start(t0); o.stop(t0 + 0.28);
}

/* Don't keep synthesising a drum machine into a tab nobody is looking at,
   and don't come back from the background with a huge time step. */
let audioWasRunning = false;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    audioWasRunning = !!(AC && AC.state === "running");
    if (audioWasRunning) AC.suspend();
  } else {
    prevT = performance.now();
    if (audioWasRunning && AC) AC.resume();
  }
});

/* ================= boot ================= */
/* every prop (tap, chest, key, cork, corkscrew) scales with the screen,
   so a TV gets TV-sized props and a phone gets phone-sized ones */
function uiScaleValue() {
  /* floor of 0.8 keeps every prop at or above the 44px touch minimum */
  return Math.max(0.8, Math.min(2.2,
    Math.min(window.innerWidth, window.innerHeight * 1.45) / 1160));
}
function applyUIScale() {
  UIS = uiScaleValue();
  /* the tap runs bigger than the other props — it has to be spotted at the
     very edge of a screen full of colour, and gripped with a thumb */
  const sizes = [[tapEl, 238, 204], [chestEl, 200, 200], [keyEl, 58, 28],
                 [corkEl, 34, 42], [screwEl, 160, 160], [cordEl, 60, 300]];
  for (const [el, w, h] of sizes) {
    const svg = el.querySelector("svg");
    svg.setAttribute("width", Math.round(w * UIS));
    svg.setAttribute("height", Math.round(h * UIS));
  }
}
function boot() {
  applyUIScale();
  sizeCanvas();
  buildSvg();
  /* film grain tile — kills the CG flatness on every stage */
  const gc = document.createElement("canvas");
  gc.width = gc.height = 128;
  const gg = gc.getContext("2d");
  const gd = gg.createImageData(128, 128);
  for (let i = 0; i < gd.data.length; i += 4) {
    const v = 120 + Math.random() * 135;
    gd.data[i] = gd.data[i + 1] = gd.data[i + 2] = v;
    gd.data[i + 3] = 11;
  }
  gg.putImageData(gd, 0, 0);
  document.getElementById("grain").style.backgroundImage = `url(${gc.toDataURL()})`;
}
let lastLines = "";
window.addEventListener("resize", () => {
  applyUIScale();
  sizeCanvas();
  resizeGlue();
  resizeGoo();
  if (finActive) sizeFinale();
  if (exploded) return;
  const l = currentLines().join("|");
  if (l !== lastLines) { lastLines = l; buildSvg(); }
});
lastLines = currentLines().join("|");
boot();
requestAnimationFrame(frame);

/* The rest of the site goes here one day. For now: pop the balloons. */
</script>
