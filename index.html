  c.ellipse(-s * 0.16, -s * 0.30, s * 0.52, s * 0.22, -0.2, 0, 6.3);
  c.fill();
  c.restore();
  if (!wet) return;
  /* the waterline, and the white water on the upstream face */
  c.fillStyle = "rgba(226,240,248,0.22)";
  c.beginPath();
  c.ellipse(x, y + s * 0.44, s * 0.92, s * 0.17, 0, 0, 6.3);
  c.fill();
  for (let i = 0; i < 4; i++) {
    const p = i / 4;
    const px = x - rivDir * s * (0.62 + p * 0.42);
    const py = y + s * (0.34 + Math.sin(rivT * 5 + i + seed) * 0.08);
    c.fillStyle = `rgba(255,255,255,${(0.30 * (1 - p)).toFixed(3)})`;
    c.beginPath();
    c.ellipse(px, py, s * (0.20 - p * 0.03), s * (0.075 - p * 0.010), 0, 0, 6.3);
    c.fill();
  }
  /* and the wake it leaves behind it */
  c.strokeStyle = "rgba(206,228,240,0.13)";
  c.lineWidth = Math.max(0.8, s * 0.06);
  for (const side of [-1, 1]) {
    c.beginPath();
    c.moveTo(x + rivDir * s * 0.5, y + s * 0.42);
    c.quadraticCurveTo(x + rivDir * s * 1.1, y + s * (0.46 + side * 0.16),
                       x + rivDir * s * 1.9, y + s * (0.50 + side * 0.30));
    c.stroke();
  }
}

function riverFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  const G = rivGeom();
  rivT += dt;
  hardClear(finCanvas, fctx);

  /* ---------- sky ---------- */
  const sky = fctx.createLinearGradient(0, 0, 0, G.farB);
  sky.addColorStop(0, "#0d1526");
  sky.addColorStop(0.52, "#26304a");
  sky.addColorStop(0.82, "#6b5a54");
  sky.addColorStop(1, "#c08a54");
  fctx.fillStyle = sky;
  fctx.fillRect(0, 0, W, G.farB);
  /* the last of the sun, behind the trees */
  const sunX = W * (0.18 + RUN.sunX * 0.64);
  const sg = fctx.createRadialGradient(sunX, G.farB, 0, sunX, G.farB, Math.min(W, H) * 0.60);
  sg.addColorStop(0, "rgba(255,206,132,0.60)");
  sg.addColorStop(0.35, "rgba(226,146,86,0.22)");
  sg.addColorStop(1, "rgba(180,110,70,0)");
  fctx.fillStyle = sg;
  fctx.fillRect(0, 0, W, G.farB);

  /* ---------- the stars, once the sun is properly down ---------- */
  if (rivHanded) {
    const st = Math.min(1, Math.max(0, (rivDone - 1) / 5));
    for (let i = 0; i < 90; i++) {
      const j = Math.sin(i * 12.9898) * 43758.5453, r1 = j - Math.floor(j);
      const k = Math.sin(i * 78.233) * 43758.5453, r2 = k - Math.floor(k);
      const sx2 = r1 * W, sy2 = r2 * G.farB * 0.86;
      const tw = 0.5 + 0.5 * Math.sin(rivT * (0.6 + r1 * 2) + i);
      fctx.fillStyle = `rgba(228,238,255,${(st * (0.20 + 0.55 * tw) * (1 - sy2 / G.farB * 0.5)).toFixed(3)})`;
      fctx.beginPath(); fctx.arc(sx2, sy2, 0.5 + r2 * 1.3, 0, 6.3); fctx.fill();
    }
  }

  /* ---------- clouds, lit from underneath ---------- */
  for (const c of rivClouds) {
    c.x += c.v * dt * 0.05 * rivDir;
    if (c.x > 1.3) c.x -= 1.6; if (c.x < -0.3) c.x += 1.6;
    const y = c.y * G.farB, w = c.w * W, h = c.h * H;
    const warm = Math.pow(c.y, 1.6);          /* the low ones catch the sun */
    const cg = fctx.createLinearGradient(0, y - h, 0, y + h);
    cg.addColorStop(0, `rgba(${(120 + 90 * warm) | 0},${(112 + 60 * warm) | 0},${(126 + 20 * warm) | 0},0)`);
    cg.addColorStop(0.55, `rgba(${(150 + 100 * warm) | 0},${(130 + 62 * warm) | 0},${(136 + 10 * warm) | 0},${(c.a * (0.4 + warm)).toFixed(3)})`);
    cg.addColorStop(1, `rgba(${(180 + 70 * warm) | 0},${(140 + 60 * warm) | 0},${(126 + 6 * warm) | 0},0)`);
    fctx.fillStyle = cg;
    fctx.beginPath();
    fctx.ellipse(c.x * W, y, w, h, 0, 0, 6.3);
    fctx.fill();
  }

  /* ---------- the moon, once you are across ---------- */
  if (moonUp > 0.001) {
    const mr = Math.min(W, H) * 0.052;
    const my = G.farB - H * 0.06 - moonUp * H * 0.26;
    const mx = moonX * W;
    const mg = fctx.createRadialGradient(mx, my, 0, mx, my, mr * 7);
    mg.addColorStop(0, `rgba(226,236,255,${(0.34 * moonUp).toFixed(3)})`);
    mg.addColorStop(0.16, `rgba(190,210,246,${(0.13 * moonUp).toFixed(3)})`);
    mg.addColorStop(1, "rgba(160,190,240,0)");
    fctx.fillStyle = mg;
    fctx.beginPath(); fctx.arc(mx, my, mr * 7, 0, 6.3); fctx.fill();
    fctx.fillStyle = `rgba(244,246,252,${(0.97 * moonUp).toFixed(3)})`;
    fctx.beginPath(); fctx.arc(mx, my, mr, 0, 6.3); fctx.fill();
    /* the seas on it, so it is a moon and not a lamp */
    fctx.fillStyle = `rgba(206,212,226,${(0.55 * moonUp).toFixed(3)})`;
    for (const [ox, oy, orr] of [[-0.30, -0.22, 0.30], [0.26, 0.10, 0.24], [-0.10, 0.34, 0.18]]) {
      fctx.beginPath();
      fctx.ellipse(mx + ox * mr, my + oy * mr, orr * mr, orr * mr * 0.82, 0, 0, 6.3);
      fctx.fill();
    }
    window.__moon = { x: mx, y: my, r: mr };
  }

  /* ---------- three ranges of hills, each one further off ---------- */
  for (const hset of hills) {
    const r = hset.r;
    const base = G.farB - H * (0.004 + r * 0.001);
    const amp = H * (0.10 - r * 0.022);
    const lift = H * (0.030 + r * 0.028);
    const lum = 20 + r * 22;
    fctx.fillStyle = `rgba(${lum + 10},${lum + 12},${lum + 26},${(0.97 - r * 0.16).toFixed(2)})`;
    fctx.beginPath();
    fctx.moveTo(-10, base);
    const n = hset.pts.length - 1;
    for (let i = 0; i <= n; i++) {
      const x = -10 + (W + 20) * (i / n);
      const y = base - lift - hset.pts[i] * amp;
      if (i === 0) fctx.lineTo(x, y);
      else {
        const px = -10 + (W + 20) * ((i - 1) / n);
        const py = base - lift - hset.pts[i - 1] * amp;
        fctx.quadraticCurveTo((px + x) / 2, (py + y) / 2 - amp * 0.10, x, y);
      }
    }
    fctx.lineTo(W + 10, base);
    fctx.closePath();
    fctx.fill();
    /* the haze that sits in front of everything that far away */
    const hz = fctx.createLinearGradient(0, base - lift - amp, 0, base);
    hz.addColorStop(0, `rgba(190,146,108,${(0.02 + r * 0.035).toFixed(3)})`);
    hz.addColorStop(1, `rgba(222,164,114,${(0.10 + r * 0.07).toFixed(3)})`);
    fctx.fillStyle = hz;
    fctx.fillRect(0, base - lift - amp, W, lift + amp);
  }

  /* ---------- birds ---------- */
  {
    const bt = (rivT * 0.020) % 1.5 - 0.25;
    for (const bd of rivBirds) {
      const o = bt - bd.o * 0.045;
      if (o < -0.1 || o > 1.1) continue;
      const bx = (rivDir > 0 ? o : 1 - o) * W;
      const by = G.farB * (0.30 + bd.lift) + Math.sin(rivT * 0.5 + bd.ph) * H * 0.012;
      const flap = Math.sin(rivT * 6.5 * bd.sp + bd.ph);
      const bs = Math.min(W, H) * 0.008;
      fctx.strokeStyle = "rgba(24,26,32,0.55)";
      fctx.lineWidth = Math.max(1, bs * 0.16);
      fctx.beginPath();
      fctx.moveTo(bx - bs, by + flap * bs * 0.42);
      fctx.quadraticCurveTo(bx, by - bs * 0.22, bx + bs, by + flap * bs * 0.42);
      fctx.stroke();
    }
  }

  /* ---------- the trees on the other side ---------- */
  const treeBase = G.farB + 1;
  fctx.fillStyle = "#141a20";
  fctx.beginPath();
  fctx.moveTo(0, treeBase);
  const step = Math.max(16, W / 46);
  for (let x = 0; x <= W + step; x += step) {
    const hgt = H * (0.035 + 0.055 * (0.5 + 0.5 * Math.sin(x * 0.021 + 1.7)))
              * (0.7 + 0.6 * (0.5 + 0.5 * Math.sin(x * 0.061)));
    fctx.lineTo(x - step * 0.5, treeBase - hgt * 0.35);
    fctx.lineTo(x, treeBase - hgt);
    fctx.lineTo(x + step * 0.5, treeBase - hgt * 0.35);
  }
  fctx.lineTo(W, treeBase);
  fctx.closePath();
  fctx.fill();

  /* ---------- the far bank ---------- */
  const bankTop = (x) => G.farB - H * 0.022 + Math.sin(x * 0.008 + 0.6) * H * 0.008
                                            + Math.sin(x * 0.023) * H * 0.004;
  const fb = fctx.createLinearGradient(0, G.farB - H * 0.03, 0, G.farB + H * 0.055);
  fb.addColorStop(0, "#3b3524");
  fb.addColorStop(1, "#1d1c15");
  fctx.fillStyle = fb;
  fctx.beginPath();
  fctx.moveTo(0, G.farB + H * 0.012);
  for (let x = 0; x <= W; x += 14) fctx.lineTo(x, bankTop(x));
  fctx.lineTo(W, G.farB + H * 0.012);
  fctx.closePath();
  fctx.fill();
  /* reeds standing up out of it */
  for (const r of reeds) {
    const x = r.x * W, base = bankTop(x) + H * 0.004;
    const hgt = H * r.h, sway = Math.sin(rivT * 0.9 + r.ph) * hgt * 0.13 + r.lean * hgt * 0.3;
    fctx.strokeStyle = `hsl(${r.hue},20%,${11 + r.h * 260}%)`;
    fctx.lineWidth = Math.max(0.9, H * 0.0016);
    fctx.beginPath();
    fctx.moveTo(x, base);
    fctx.quadraticCurveTo(x + sway * 0.4, base - hgt * 0.6, x + sway, base - hgt);
    fctx.stroke();
    if (r.head) {
      fctx.fillStyle = `hsl(${r.hue - 8},24%,${14 + r.h * 240}%)`;
      fctx.beginPath();
      fctx.ellipse(x + sway, base - hgt, H * 0.0026, H * 0.0075, sway * 0.02, 0, 6.3);
      fctx.fill();
    }
  }

  /* ---------- the water ---------- */
  const wg = fctx.createLinearGradient(0, G.farB, 0, G.nearB);
  wg.addColorStop(0, "#4a4436");
  wg.addColorStop(0.16, "#2c3341");
  wg.addColorStop(0.62, "#141d2b");
  wg.addColorStop(1, "#0b1119");
  fctx.fillStyle = wg;
  fctx.fillRect(0, G.farB, W, G.nearB - G.farB);

  /* What the sky is doing on the surface. This is the thing that makes water
     read as water — it carries the sky, broken up and wobbling — and it is
     the same language as the light on the sea two scenes ago, on purpose. */
  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  const fine = Math.min(W, H) > 560;
  const rows = Math.max(20, Math.round(G.span / (fine ? 8 : 13)));
  for (let i = 0; i < rows; i++) {
    const t0 = i / rows, t1 = (i + 1) / rows;
    const y = rivYAt(G, t0);
    const fade = Math.pow(1 - t0, 1.7);
    if (fade < 0.015) continue;
    const wob = Math.sin(rivT * 0.9 + i * 0.55) * W * 0.012
              + Math.sin(rivT * 1.7 + i * 0.21) * W * 0.006;
    const hw = W * (0.05 + 0.30 * t0);            /* it opens out toward you */
    fctx.globalAlpha = 0.42 * fade;
    fctx.drawImage(barWarm, sunX - hw + wob, y, hw * 2, rivYAt(G, t1) - y + 1);
    fctx.globalAlpha = 1;
  }
  /* and it breaks into pieces on the ripples */
  const glints = fine ? 90 : 44;
  for (let i = 0; i < glints; i++) {
    const j = Math.sin(i * 12.9898) * 43758.5453; const r1 = j - Math.floor(j);
    const k = Math.sin(i * 4.1414) * 21301.7;     const r2 = k - Math.floor(k);
    const t = Math.pow(r1, 1.5) * 0.85;
    const fade = Math.pow(1 - t, 1.6);
    const hw = W * (0.05 + 0.30 * t);
    const off = (r2 - 0.5) * 2;
    const x = sunX + off * hw + Math.sin(rivT * 1.2 + i) * W * 0.01;
    const edge = 1 - Math.min(1, Math.abs(off) * 1.15);
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(rivT * (1.3 + (i % 5) * 0.31) + i));
    const a = 0.5 * fade * edge * tw;
    if (a < 0.02) continue;
    fctx.fillStyle = `rgba(255,222,168,${a.toFixed(3)})`;
    fctx.fillRect(x - (6 + t * 26) / 2, rivYAt(G, t), 6 + t * 26, Math.max(1, 0.8 + t * 2.4));
  }
  fctx.restore();

  /* the moon lays its own road, colder and narrower than the sun's */
  if (moonUp > 0.02 && moonDrop < 0) {
    fctx.save();
    fctx.globalCompositeOperation = "lighter";
    const mrows = Math.max(16, Math.round(G.span / (fine ? 11 : 17)));
    for (let i = 0; i < mrows; i++) {
      const mt0 = i / mrows, mt1 = (i + 1) / mrows;
      const my2 = rivYAt(G, mt0);
      const mfade = Math.pow(1 - mt0, 1.4) * moonUp;
      if (mfade < 0.02) continue;
      const mwob = Math.sin(rivT * 1.3 + i * 0.7) * W * 0.010;
      const mhw = W * (0.026 + 0.15 * mt0);
      fctx.globalAlpha = 0.30 * mfade;
      fctx.drawImage(barCool, moonX * W - mhw + mwob, my2, mhw * 2, rivYAt(G, mt1) - my2 + 1);
    }
    fctx.globalAlpha = 1;
    fctx.restore();
  }

  /* The current. Soft-ended streaks running with the flow, quickest down the
     middle, longer and slower-looking the nearer they are — hard little bars
     read as hatching, which is what this was before. */
  const lines = Math.max(16, Math.round(G.span / (fine ? 11 : 16)));
  for (let i = 0; i < lines; i++) {
    const t = (i + 0.5) / lines;
    const y = rivYAt(G, t) + Math.sin(rivT * 0.8 + i * 1.3) * G.span * 0.004;
    const sp = rivFlow(t);
    const j = Math.sin(i * 91.7) * 0.5 + 0.5;
    const per = W * (0.30 + j * 0.34);
    const off = ((rivT * sp * W * 0.20 * rivDir) % per + per) % per;
    const len = W * (0.06 + 0.16 * t) * (0.55 + j * 0.8);
    const a = (0.035 + 0.10 * t) * (0.4 + 0.6 * sp);
    const hgt = Math.max(0.9, G.span / lines * 0.30);
    for (let k = -1; k * per - off < W + per; k++) {
      const x = k * per - off + Math.sin(rivT * 1.1 + i * 2.7) * 10;
      fctx.globalAlpha = a;
      fctx.drawImage(barCool, x, y, len, hgt);
    }
  }
  fctx.globalAlpha = 1;

  /* ---------- the rocks that were always there ---------- */
  for (const r of rocks) {
    const y = rivYAt(G, r.t);
    drawRock(r.x * W, y, rivScale(G, r.t) * r.s, r.rot, r.seed, true);
  }

  /* ---------- leaves, going by ---------- */
  for (const l of rivLeaves) {
    const sp = rivFlow(l.t);
    l.x += rivDir * sp * dt * 0.085;
    if (l.x > 1.1) l.x -= 1.25; if (l.x < -0.15) l.x += 1.25;
    l.rot += l.spin * dt;
    const y = rivYAt(G, l.t) + Math.sin(rivT * 1.6 + l.t * 9) * G.span * 0.006;
    drawLeaf(fctx, l.x * W, y, l.s * (0.5 + l.t), l.rot, l.hue, 0.55 + 0.35 * l.t);
  }

  /* ---------- the stones you put up ---------- */
  for (const s of stones) {
    s.rise = Math.min(1, s.rise + dt * 1.9);
    const e = 1 - Math.pow(1 - s.rise, 3);
    const sc = rivScale(G, s.t) * s.s;
    const y = rivYAt(G, s.t);
    /* the ring it made coming up */
    if (s.rise < 1) {
      const rr = sc * (1.1 + e * 3.2);
      fctx.strokeStyle = `rgba(226,244,252,${(0.5 * (1 - e)).toFixed(3)})`;
      fctx.lineWidth = Math.max(1, sc * 0.13);
      fctx.beginPath(); fctx.ellipse(s.x, y + sc * 0.4, rr, rr * 0.32, 0, 0, 6.3); fctx.stroke();
    }
    /* foam collar where it parts the water */
    fctx.fillStyle = "rgba(232,246,252,0.20)";
    fctx.beginPath();
    fctx.ellipse(s.x, y + sc * 0.44, sc * (1.02 + 0.07 * Math.sin(rivT * 4 + s.seed)),
                 sc * 0.22, 0, 0, 6.3);
    fctx.fill();
    drawRock(s.x, y - sc * (0.30 * e), sc, s.rot, s.seed, true);
    /* a dry top, because it has been up long enough to drain */
    if (e > 0.6) {
      fctx.fillStyle = `rgba(206,196,176,${(0.30 * (e - 0.6) / 0.4).toFixed(3)})`;
      fctx.beginPath();
      fctx.ellipse(s.x - sc * 0.10, y - sc * (0.30 * e + 0.30), sc * 0.56, sc * 0.24, -0.2, 0, 6.3);
      fctx.fill();
    }
  }

  /* ---------- mist, lying on it where it meets the far bank ---------- */
  for (const m of mist) {
    m.x += m.v * dt * 0.05 * rivDir;
    if (m.x > 1.4) m.x -= 1.8; if (m.x < -0.4) m.x += 1.8;
    const y = rivYAt(G, m.t) + Math.sin(rivT * 0.4 + m.ph) * H * 0.004;
    const w = m.w * W, h = H * (0.004 + m.t * 0.014);
    const mgg = fctx.createLinearGradient(m.x * W - w, 0, m.x * W + w, 0);
    mgg.addColorStop(0, "rgba(206,214,224,0)");
    mgg.addColorStop(0.5, `rgba(214,222,232,${m.a.toFixed(3)})`);
    mgg.addColorStop(1, "rgba(206,214,224,0)");
    fctx.fillStyle = mgg;
    fctx.beginPath();
    fctx.ellipse(m.x * W, y, w, h, 0, 0, 6.3);
    fctx.fill();
  }

  /* ---------- your bank, drawn last so it stands in front ---------- */
  const nearTop = (x) => G.nearB + Math.sin(x * 0.010 + 2.1) * H * 0.010
                                 + Math.sin(x * 0.027) * H * 0.005;
  const nb = fctx.createLinearGradient(0, G.nearB - H * 0.01, 0, H);
  nb.addColorStop(0, "#221f18");
  nb.addColorStop(0.5, "#15130f");
  nb.addColorStop(1, "#0a0908");
  fctx.fillStyle = nb;
  fctx.beginPath();
  fctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 14) fctx.lineTo(x, nearTop(x));
  fctx.lineTo(W, H);
  fctx.closePath();
  fctx.fill();
  /* wet shingle at the waterline, both sides */
  for (const b of bankStones) {
    const x = b.x * W;
    const y = b.near ? nearTop(x) + (H - nearTop(x)) * b.o * 0.55
                     : bankTop(x) + H * 0.004 + b.o * H * 0.030;
    const s = Math.min(W, H) * b.s * (b.near ? 1.15 : 0.6);
    fctx.fillStyle = `hsl(${b.hue},12%,${b.l * 0.62}%)`;
    fctx.save();
    fctx.translate(x, y); fctx.rotate(b.rot);
    fctx.beginPath(); fctx.ellipse(0, 0, s, s * 0.62, 0, 0, 6.3); fctx.fill();
    fctx.restore();
  }
  for (const g2 of tufts) {
    const x = g2.x * W, base = nearTop(x) + (H - nearTop(x)) * g2.o * 0.9;
    const hgt = H * g2.h, sway = Math.sin(rivT * 1.2 + g2.ph) * hgt * 0.2;
    fctx.strokeStyle = `hsl(${g2.hue},18%,${9 + g2.h * 420}%)`;
    fctx.lineWidth = Math.max(0.8, H * 0.0014);
    fctx.beginPath();
    fctx.moveTo(x, base);
    fctx.quadraticCurveTo(x + sway * 0.5, base - hgt * 0.6, x + sway, base - hgt);
    fctx.stroke();
  }

  /* ---------- a nudge: the way across ---------- */
  if (rivT > 5 && !crossed) {
    const p = 0.5 + 0.5 * Math.sin(rivT * 1.8);
    const nx = W * (0.32 + 0.36 * (0.5 + 0.5 * Math.sin(rivT * 0.35)));
    fctx.save();
    fctx.setLineDash([9, 13]);
    fctx.lineDashOffset = -rivT * 22;
    fctx.strokeStyle = `rgba(226,238,246,${(0.09 + 0.13 * p).toFixed(3)})`;
    fctx.lineWidth = Math.max(2, Math.min(W, H) * 0.005);
    fctx.beginPath();
    fctx.moveTo(nx, rivYAt(G, 0.95));
    fctx.lineTo(nx, rivYAt(G, 0.05));
    fctx.stroke();
    fctx.restore();
  }

  /* ---------- across? ---------- */
  crossed = crossingOK(G) ? 1 : 0;
  if (crossed) {
    rivGlow = Math.min(1, rivGlow + dt * 0.5);
    fctx.fillStyle = `rgba(255,214,150,${(rivGlow * 0.10).toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
  }
  if (crossed && !rivHanded) {
    rivHanded = true;
    finCanvas.style.cursor = "";
    crossingDone();
  }
  /* Once you are across, the sun finishes going down and a moon comes up
     over the far bank and lays a second road on the water beside the one
     the sun left. Then it falls out of the sky, which is how you leave. */
  if (rivHanded) {
    rivDone += dt;
    const dusk = Math.min(1, rivDone / 6);
    fctx.fillStyle = `rgba(8,10,22,${(dusk * 0.52).toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
    if (rivDone > 1.5) moonUp = Math.min(1, moonUp + dt * 0.26);
    if (rivDone > 9 && moonDrop < 0) { moonDrop = 0; release("river", 2.4); moonFall(); }
  }
  if (moonDrop >= 0) {
    moonDrop += dt;
    const m = window.__moon;
    if (m) {
      const fall = moonDrop * moonDrop * H * 1.15;
      const my = m.y + fall;
      const gl = fctx.createRadialGradient(m.x, my, 0, m.x, my, m.r * 6);
      gl.addColorStop(0, "rgba(226,236,255,0.34)");
      gl.addColorStop(1, "rgba(160,190,240,0)");
      fctx.fillStyle = gl;
      fctx.beginPath(); fctx.arc(m.x, my, m.r * 6, 0, 6.3); fctx.fill();
      fctx.fillStyle = "rgba(246,248,254,0.98)";
      fctx.beginPath(); fctx.arc(m.x, my, m.r, 0, 6.3); fctx.fill();
      fctx.fillStyle = `rgba(4,5,10,${Math.min(1, moonDrop / 1.5).toFixed(3)})`;
      fctx.fillRect(0, 0, W, H);
      if (my > H + m.r * 2) { rivOn = false; startPan(); return; }
    } else { rivOn = false; startPan(); return; }
  }

  /* the corners, so the eye stays on the water */
  if (!rivVig || rivVigW !== W || rivVigH !== H) {
    rivVig = fctx.createRadialGradient(W * 0.5, H * 0.55, Math.min(W, H) * 0.30,
                                       W * 0.5, H * 0.55, Math.max(W, H) * 0.78);
    rivVig.addColorStop(0, "rgba(0,0,0,0)");
    rivVig.addColorStop(1, "rgba(0,0,0,0.42)");
    rivVigW = W; rivVigH = H;
  }
  fctx.fillStyle = rivVig;
  fctx.fillRect(0, 0, W, H);

  natFrame(dt);
}

/* A crossing is a chain from this bank to that one: something to step on
   near your feet, something near the far side, and no gap in between that
   you would not jump. It does not have to be straight. */
function crossingOK(G) {
  if (stones.length < 3) return false;
  const ss = stones.slice().sort((a, b) => b.t - a.t);   /* near first */
  if (ss[0].t < 0.72) return false;
  if (ss[ss.length - 1].t > 0.28) return false;
  for (let i = 1; i < ss.length; i++) {
    if (ss[i - 1].t - ss[i].t > 0.34) return false;
    if (Math.abs(ss[i - 1].x - ss[i].x) > G.W * 0.26) return false;
  }
  return true;
}

window.addEventListener("pointerdown", (e) => {
  if (!rivOn || crossed) return;
  const G = rivGeom();
  if (e.clientY < G.farB || e.clientY > G.nearB) return;   /* only in the water */
  const t = rivTAt(G, e.clientY);
  stones.push({ t, x: e.clientX, s: 0.026 + rnd() * 0.010,
                rot: rnd() * 6.3, seed: rnd() * 100, rise: 0 });
  stoneUp(e.clientX);
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => {
  if (!rivOn) return;
  const G = rivGeom();
  const inWater = e.clientY > G.farB && e.clientY < G.nearB;
  finCanvas.style.cursor = crossed ? "" : (inWater ? "pointer" : "");
}, { passive: true });

/* --- sound --- */
function riverSound() {
  const ac = audio(); if (!ac || rivNode) return;
  const mk = (f, q, g0, type) => {
    const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = type || "bandpass";
    bp.frequency.value = f; bp.Q.value = q;
    const g = ac.createGain(); g.gain.value = 0.0001;
    s.connect(bp); bp.connect(g); g.connect(BUS);
    s.start();
    g.gain.linearRampToValueAtTime(g0, ac.currentTime + 4);
    return { s, bp, g };
  };
  /* three layers: the body of it, the rush over the rocks, and the fizz */
  rivNode = {
    body: mk(220, 0.4, 0.055, "lowpass"),
    rush: mk(1300, 0.5, 0.045),
    fizz: mk(5200, 0.7, 0.022, "highpass"),
  };
  for (const k of ["body", "rush", "fizz"])
    hold("river", { gain: rivNode[k].g, src: rivNode[k].s });
}
function stoneUp(px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const dest = at(px) || BUS;
  /* the weight of it coming up */
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(120, t0);
  o.frequency.exponentialRampToValueAtTime(38, t0 + 0.4);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.16, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
  o.connect(g); g.connect(dest);
  o.start(t0); o.stop(t0 + 0.6);
  /* and the water coming off it */
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.setValueAtTime(2600, t0);
  bp.frequency.exponentialRampToValueAtTime(900, t0 + 0.5);
  bp.Q.value = 0.7;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(0.085, t0 + 0.03);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  s.connect(bp); bp.connect(g2); g2.connect(dest);
  s.start(t0); s.stop(t0 + 1.0);
}
function moonFall() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  for (const [f, v] of [[74, 0.055], [111, 0.030], [148, 0.018]]) {
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, t0 + 2.4);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.8);
    o.connect(g); g.connect(BUS); o.start(t0); o.stop(t0 + 2.9);
  }
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.6;
  bp.frequency.setValueAtTime(2200, t0);
  bp.frequency.exponentialRampToValueAtTime(240, t0 + 2.2);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.linearRampToValueAtTime(0.055, t0 + 0.7);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
  s.connect(bp); bp.connect(g2); g2.connect(BUS);
  s.start(t0); s.stop(t0 + 2.7);
}

function crossingDone() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [146.8, 220, 293.7, 440].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 1 ? "sine" : "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.11);
    g.gain.exponentialRampToValueAtTime(0.050, t0 + i * 0.11 + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 4.4);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.11); o.stop(t0 + 4.6);
  });
}

function splatSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(2200, t0);
  lp.frequency.exponentialRampToValueAtTime(180, t0 + 0.3);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.36);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(160, t0);
  o.frequency.exponentialRampToValueAtTime(48, t0 + 0.22);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.36, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  o.connect(g2); g2.connect(BUS); o.start(t0); o.stop(t0 + 0.28);
}

/* Don't keep synthesising a drum machine into a tab nobody is looking at,
   and don't come back from the background with a huge time step. */
let audioWasRunning = false;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    audioWasRunning = !!(AC && AC.state === "running");
    if (audioWasRunning) AC.suspend();
  } else {
    prevT = performance.now();
    if (audioWasRunning && AC) AC.resume();
  }
});

/* ================= boot ================= */
/* every prop (tap, chest, key, cork, corkscrew) scales with the screen,
   so a TV gets TV-sized props and a phone gets phone-sized ones */
function uiScaleValue() {
  /* floor of 0.8 keeps every prop at or above the 44px touch minimum */
  return Math.max(0.8, Math.min(2.2,
    Math.min(window.innerWidth, window.innerHeight * 1.45) / 1160));
}
function applyUIScale() {
  UIS = uiScaleValue();
  /* the tap runs bigger than the other props — it has to be spotted at the
     very edge of a screen full of colour, and gripped with a thumb */
  const sizes = [[tapEl, 238, 204], [chestEl, 200, 200], [keyEl, 58, 28],
                 [corkEl, 34, 42], [screwEl, 160, 160], [cordEl, 60, 300]];
  for (const [el, w, h] of sizes) {
    const svg = el.querySelector("svg");
    svg.setAttribute("width", Math.round(w * UIS));
    svg.setAttribute("height", Math.round(h * UIS));
  }
}
function boot() {
  applyUIScale();
  sizeCanvas();
  buildSvg();
  /* film grain tile — kills the CG flatness on every stage */
  const gc = document.createElement("canvas");
  gc.width = gc.height = 128;
  const gg = gc.getContext("2d");
  const gd = gg.createImageData(128, 128);
  for (let i = 0; i < gd.data.length; i += 4) {
    const v = 120 + Math.random() * 135;
    gd.data[i] = gd.data[i + 1] = gd.data[i + 2] = v;
    gd.data[i + 3] = 11;
  }
  gg.putImageData(gd, 0, 0);
  document.getElementById("grain").style.backgroundImage = `url(${gc.toDataURL()})`;
}
let lastLines = "";
window.addEventListener("resize", () => {
  applyUIScale();
  sizeCanvas();
  resizeGlue();
  resizeGoo();
  if (finActive) sizeFinale();
  if (exploded) return;
  const l = currentLines().join("|");
  if (l !== lastLines) { lastLines = l; buildSvg(); }
});
lastLines = currentLines().join("|");
boot();
requestAnimationFrame(frame);
