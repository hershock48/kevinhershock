    const sx = (Math.random() - 0.5) * shake * 13, sy = (Math.random() - 0.5) * shake * 9;
    fctx.save();
    fctx.translate(sx, sy);

    /* ---- 4. wind ---- */
    windT += dt;
    /* three sines that never line up, so the gusts never repeat */
    gust = Math.sin(windT * 0.37) * 0.55 + Math.sin(windT * 0.83 + 1.7) * 0.3
         + Math.sin(windT * 1.61 + 4.1) * 0.17;
    wind = RUN.windDir * (0.44 + gust * 0.52) * inten * RUN.rainHard;

    /* ---- 5. rain, three layers deep ---- */
    const ptrOn = ptrT > 0;
    ptrT = Math.max(0, ptrT - dt);
    for (let li = 0; li < rainL.length; li++) {
      const L = rainL[li], arr = drops[li];
      const vy = L.v * (0.55 + 0.45 * inten);
      const vx0 = wind * L.par * 1450;
      const mag = Math.hypot(vx0, vy) || 1;
      const ux = vx0 / mag * L.len * inten, uy = vy / mag * L.len * inten;
      const R2 = (150 * L.par) * (150 * L.par);
      fctx.beginPath();
      for (const d of arr) {
        if (ptrOn && li > 0) {
          const ddx = d.x - ptrX, ddy = d.y - ptrY, d2 = ddx * ddx + ddy * ddy;
          if (d2 < R2) {
            const f = (1 - d2 / R2) * L.par;
            d.vx += (ptrVX * 0.5 + ddx * 1.6) * f * dt * 8;
          }
        }
        d.vx *= Math.pow(0.05, dt);
        d.x += (vx0 + d.vx) * dt;
        d.y += vy * dt;
        if (d.y > H) {
          if (li === 2 && Math.random() < 0.30 && splashes.length < 90)
            splashes.push({ x: d.x, y: H - 2 - Math.random() * 10,
                            vx: (Math.random() - 0.5) * 90 + vx0 * 0.12,
                            vy: -60 - Math.random() * 110, life: 1 });
          d.y = -24 - Math.random() * 90;
          d.x = Math.random() * W * 1.5 - W * 0.25;
          d.vx = 0;
        }
        if (d.x < -W * 0.28) d.x += W * 1.5;
        else if (d.x > W * 1.22) d.x -= W * 1.5;
        fctx.moveTo(d.x, d.y);
        fctx.lineTo(d.x - ux, d.y - uy);
      }
      fctx.strokeStyle = `rgba(${RUN.stormTint[0]},${RUN.stormTint[1]},${RUN.stormTint[2]},${(L.a * inten * RUN.rainHard * (0.62 + 0.55 * flashA)).toFixed(3)})`;
      fctx.lineWidth = L.w;
      fctx.stroke();
    }

    /* rain hitting the ground and coming back up */
    fctx.strokeStyle = `rgba(206,220,240,${(0.55 * inten).toFixed(3)})`;
    fctx.lineWidth = 1.1;
    fctx.beginPath();
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.life -= dt * 2.6;
      if (s.life <= 0) { splashes.splice(i, 1); continue; }
      s.vy += 900 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      fctx.moveTo(s.x, s.y);
      fctx.lineTo(s.x - s.vx * 0.012, s.y - s.vy * 0.012);
    }
    fctx.stroke();

    /* ---- 6. lightning ---- */
    if (fT > 5.6) {
      nextBolt -= dt;
      if (nextBolt <= 0) {
        const dist = Math.pow(Math.random(), 1.6);        // near strikes are rarer
        bolt = makeBolt(W, H, dist);
        boltT = 0;
        thunder(bolt.power, dist, bolt.main[0].x);
        if (dist < 0.34 && !REDUCED) shake = Math.max(shake, 0.55 + (0.34 - dist) * 1.6);
        /* strikes get closer together as it builds, but never fast enough
           to read as a strobe */
        nextBolt = ((REDUCED ? 3.4 : 1.25) + Math.random() * (REDUCED ? 4 : 3.2)
                    - inten * 0.55) / RUN.boltRate;
      }
    }
    flashA = 0;
    if (bolt) {
      boltT += dt;
      const step = Math.floor(boltT / 0.052);
      const vis = step < BOLT_SEQ.length
        ? BOLT_SEQ[step] * (1 - boltT / bolt.life) : 0;
      if (boltT > bolt.life) bolt = null;
      else if (vis > 0.01) {
        flashA = Math.min(1, vis * bolt.power) * (REDUCED ? 0.16 : 1);
        /* the sky lights up from wherever the channel is */
        const fg = fctx.createLinearGradient(0, 0, 0, H);
        const a0 = 0.42 * flashA, a1 = 0.10 * flashA;
        fg.addColorStop(0, `rgba(214,228,255,${a0.toFixed(3)})`);
        fg.addColorStop(1, `rgba(150,175,225,${a1.toFixed(3)})`);
        fctx.fillStyle = fg;
        fctx.fillRect(-40, -40, W + 80, H + 80);
        drawBolt(bolt, vis);
      }
    }

    /* ---- 7. the wash at the bottom ---- */
    const wh = H * 0.055;
    const wg = fctx.createLinearGradient(0, H - wh, 0, H);
    wg.addColorStop(0, `rgba(34,42,60,${(0.50 * inten).toFixed(3)})`);
    wg.addColorStop(1, `rgba(12,16,28,${(0.80 * inten).toFixed(3)})`);
    fctx.fillStyle = wg;
    fctx.fillRect(0, H - wh, W, wh);
    if (flashA > 0.02) {
      for (let i = 0; i < 5; i++) {
        const y = H - wh + 4 + i * (wh / 6.5);
        fctx.fillStyle = `rgba(190,208,240,${(0.11 * flashA * (1 - i / 6)).toFixed(3)})`;
        fctx.fillRect(0, y + Math.sin(windT * 1.6 + i * 1.7) * 2.2, W, 1);
      }
    }
    fctx.restore();
  }
}

/* ================= lights out =================
   A pull cord drops out of the storm. Yank it and the whole thing dies —
   rain, wind, thunder, all of it — and what is left is a clear night sky. */

/* Orion, from the real thing: right ascension and declination projected
   flat (east to the left, north up) and normalised. Betelgeuse runs warm,
   Rigel runs blue — because they do. */
/* ================= what you get this time =================
   The site was identical on every visit, which makes it a recording. It
   is not any more: the sky, the weather, the light, the colours and the
   coastline are all drawn once when you arrive and hold for the visit,
   so a run is coherent but no two are the same. Everything derives from
   one seed, which means a run can be named and shared. */
/* One seed picks the weather, the constellation, the palette rotation and the
   materials, so a run is reproducible. ?seed=12345 pins it — which makes a run
   shareable, and makes it possible to change the code and prove that nothing
   moved except the thing you meant to move. */
const RUN_SEED = (() => {
  try {
    const q = new URLSearchParams(location.search).get("seed");
    if (q !== null && /^\d+$/.test(q)) return (+q) >>> 0 || 1;
  } catch (e) {}
  return (Math.random() * 0xffffffff) >>> 0;
})();
let _rs = RUN_SEED || 1;
function rnd() {                       /* xorshift32 — same seed, same visit */
  _rs ^= _rs << 13; _rs >>>= 0;
  _rs ^= _rs >> 17;
  _rs ^= _rs << 5; _rs >>>= 0;
  return _rs / 4294967296;
}
const pick = a => a[(rnd() * a.length) | 0];

/* everything the visit decides up front */
const RUN = (() => {
  const skyKey = pick(Object.keys(SKIES));
  return {
    seed: RUN_SEED,
    skyKey, sky: SKIES[skyKey],
    /* the weather: which way it drives, how hard, and what kind of storm */
    windDir: rnd() < 0.5 ? -1 : 1,
    rainHard: 0.75 + rnd() * 0.55,
    boltRate: 0.7 + rnd() * 0.85,
    forky: 0.35 + rnd() * 0.6,          /* branchy vs clean channels */
    stormTint: pick([[190, 208, 240], [206, 202, 232], [180, 214, 236]]),
    /* the morning: where the sun comes up and what colour it brings */
    sunX: 0.34 + rnd() * 0.32,
    dawnWarm: rnd(),
    cloudN: 3 + ((rnd() * 5) | 0),
    /* the materials */
    hueShift: (rnd() * 360) | 0,
    gooSpin: 0.7 + rnd() * 0.8,
    palRot: (rnd() * 12) | 0,
  };
})();
const ORION = RUN.sky;     /* the night scene still asks for it by name */

function showCord() {
  if (cordShown) return;
  cordShown = true;
  cordEl.style.display = "block";
  requestAnimationFrame(() => cordEl.classList.add("on"));
  /* give them a moment to find it themselves before showing them */
  cordNudgeT = setTimeout(() => {
    if (!nightPhase && !cordDrag) cordEl.classList.add("nudge");
  }, 5200);
}
function stopCordNudge() {
  clearTimeout(cordNudgeT);
  cordEl.classList.remove("nudge");
}
cordEl.addEventListener("pointerdown", (e) => {
  if (nightPhase) return;
  e.preventDefault();
  cordEl.setPointerCapture(e.pointerId);
  cordEl.classList.add("grabbing");
  stopCordNudge();
  cordDrag = { y0: e.clientY };
  /* a tap on a light pull is a pull — it snaps down and comes back */
  cordPull = 74;
  cordEl.style.transition = "transform 0.10s ease-out";
  cordEl.style.transform = "translateY(74px)";
});
cordEl.addEventListener("pointermove", (e) => {
  if (!cordDrag || nightPhase) return;
  cordPull = Math.max(0, Math.min(160, Math.max(74, e.clientY - cordDrag.y0)));
  cordEl.style.transition = "none";
  cordEl.style.transform = `translateY(${cordPull}px)`;
});
function releaseCord() {
  if (!cordDrag) return;
  cordDrag = null;
  cordEl.classList.remove("grabbing");
  cordEl.style.transition = "transform 0.4s var(--ease-burst)";
  cordEl.style.transform = "translateY(0)";
  if (cordPull > 58) lightsOut();
  cordPull = 0;
}
cordEl.addEventListener("pointerup", releaseCord);
cordEl.addEventListener("pointercancel", releaseCord);

function switchClick() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2600; bp.Q.value = 2.2;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.5, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.05);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(70, t0 + 0.01);
  o.frequency.exponentialRampToValueAtTime(34, t0 + 0.3);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.3, t0 + 0.01);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
  o.connect(g2); g2.connect(BUS); o.start(t0 + 0.01); o.stop(t0 + 0.36);
}
function startNightPad() {
  const ac = audio(); if (!ac || nightPad) return;
  const g = ac.createGain(); g.gain.value = 0;
  g.gain.setTargetAtTime(0.035, ac.currentTime, 2.5);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420;
  lp.connect(g); g.connect(BUS);
  const oscs = [55, 82.4, 110.5].map((f, i) => {
    const o = ac.createOscillator();
    o.type = i === 2 ? "triangle" : "sine";
    o.frequency.value = f * (1 + (i - 1) * 0.002);
    o.connect(lp); o.start();
    return o;
  });
  nightPad = { oscs, g };
  hold("night", { gain: g });
  for (const o of oscs) hold("night", { src: o });
}
function chime(n, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const SC = [523.3, 587.3, 659.3, 784, 880, 1046.5];
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.value = SC[n % SC.length] * (n > 5 ? 2 : 1);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.055, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
  o.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 1.7);
}

function lightsOut() {
  if (nightPhase) return;
  nightPhase = 1; nightT = 0;
  mark("night");
  stopStorm();
  bed('night');
  finCanvas.style.filter = "none";
  finCanvas.style.background = "var(--ink)";
  switchClick();
  cordEl.style.transition = "opacity 0.5s ease";
  cordEl.style.opacity = "0";
  setTimeout(() => { cordEl.style.display = "none"; }, 600);

  const W = window.innerWidth, H = window.innerHeight;
  stars = [];
  const N = Math.round(Math.max(120, Math.min(420, (W * H) / 2600)));
  for (let i = 0; i < N; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H,
                 r: 0.4 + Math.random() * 1.6,
                 tw: 0.35 + Math.random() * 2.1, ph: Math.random() * 6.3,
                 b: 0.22 + Math.random() * 0.78 });
  }
  shooters = [];
  setTimeout(startNightPad, 1200);
}

let lastSeg = -1;
function drawNight(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  nightT += dt;
  if (chainEnd) { restFrame(dt); return; }
  if (panOn) { panFrame(dt); return; }
  if (bgOn) { bingoFrame(dt); return; }
  if (rivOn) { riverFrame(dt); return; }
  if (woodOn) { woodFrame(dt); return; }
  if (beaconOn) { beaconFrame(dt); return; }
  if (surfOn) { surfaceFrame(dt); return; }
  if (jellyOn) { jellyFrame(dt); natFrame(dt); return; }
  if (winOn) {
    windowFrame(dt);
    /* the flood off the chest fades back through the glass */
    if (whiteOut < 2.4) {
      whiteOut = Math.min(2.4, whiteOut + dt * 0.42);
      const a = Math.max(0, Math.min(1, 1 - (whiteOut - 1) / 1.2));
      if (a > 0) {
        fctx.fillStyle = `rgba(255,250,238,${a.toFixed(3)})`;
        fctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }
    return;
  }
  if (digPhase) { drawDig(dt); natFrame(dt); return; }   /* the chart said here */
  if (chartT >= 0) drawChart(dt);
  if (dawnPhase) dawnIdle += dt;
  hardClear(finCanvas, fctx);
  fctx.fillStyle = dawnPhase ? skyGradient(dawnU) : T.ink;
  fctx.fillRect(0, 0, W, H);

  const app = Math.min(1, nightT / 3.0);
  /* the stars go out from the horizon up as the light comes */
  const wash = dawnU * dawnU * (3 - 2 * dawnU);
  fctx.fillStyle = T.starlight;
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(nightT * s.tw + s.ph);
    const alt = 1 - s.y / H;                       // 1 at the top of the sky
    const out = Math.max(0, Math.min(1, (wash - alt * 0.35) / 0.5));
    if (out >= 1) continue;
    fctx.globalAlpha = app * s.b * tw * (1 - out);
    fctx.beginPath(); fctx.arc(s.x, s.y, s.r, 0, 6.3); fctx.fill();
  }
  fctx.globalAlpha = 1;

  /* Orion */
  const SX = Math.min(W * ORION.scale[0], H * 0.62);
  const SY = Math.min(H * ORION.scale[1], W * 0.52);
  const cx = W / 2, cy = H * 0.44;
  const P = i => [cx + ORION.stars[i].p[0] * SX, cy + ORION.stars[i].p[1] * SY];
  const E = ORION.edges;
  const rev = Math.max(0, Math.min(E.length, (nightT - 2.4) / 6.0 * E.length));
  const done = Math.floor(rev);
  if (done > lastSeg && done > 0 && done <= E.length) { lastSeg = done; chime(done - 1, P(E[done - 1][1])[0]); }

  const orionA = Math.max(0, 1 - wash * 1.35);
  fctx.strokeStyle = `rgba(150,190,255,${(0.5 * orionA).toFixed(3)})`;
  fctx.lineWidth = 1.3;
  fctx.lineCap = "round";
  fctx.beginPath();
  for (let i = 0; i < Math.min(done, E.length); i++) {
    const a = P(E[i][0]), b = P(E[i][1]);
    fctx.moveTo(a[0], a[1]); fctx.lineTo(b[0], b[1]);
  }
  if (done < E.length) {
    const f = rev - done, a = P(E[done][0]), b = P(E[done][1]);
    if (f > 0) {
      fctx.moveTo(a[0], a[1]);
      fctx.lineTo(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f);
    }
  }
  fctx.stroke();

  /* the stars of Orion, each its own colour and magnitude */
  const lit = new Set();
  for (let i = 0; i < Math.min(done + 1, E.length); i++) { lit.add(E[i][0]); lit.add(E[i][1]); }
  for (let i = 0; i < ORION.stars.length; i++) {
    if (!lit.has(i)) continue;
    const st = ORION.stars[i];
    const [x, y] = P(i);
    const pulse = 0.8 + 0.2 * Math.sin(nightT * 1.5 + i * 1.7);
    const R = (5 + st.m * 12) * pulse;
    fctx.globalAlpha = Math.min(1, app) * orionA;
    const g = fctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, "rgba(255,255,255,0.98)");
    g.addColorStop(0.22, st.c);
    g.addColorStop(1, "rgba(120,160,255,0)");
    fctx.fillStyle = g;
    fctx.fillRect(x - R, y - R, R * 2, R * 2);
    /* the brightest ones throw diffraction spikes */
    if (st.m > 0.85) {
      const L = R * 2.1 * pulse;
      fctx.strokeStyle = `rgba(255,255,255,${0.32 * app * orionA})`;
      fctx.lineWidth = 1;
      fctx.beginPath();
      fctx.moveTo(x - L, y); fctx.lineTo(x + L, y);
      fctx.moveTo(x, y - L); fctx.lineTo(x, y + L);
      fctx.stroke();
    }
    fctx.fillStyle = "#ffffff";
    fctx.beginPath(); fctx.arc(x, y, 1.5 + st.m * 1.2, 0, 6.3); fctx.fill();
  }
  fctx.globalAlpha = 1;

  /* Orion finished — the sun is waiting just under the horizon */
  if (!dawnPhase && done >= E.length && nightT > 11.5) { dawnPhase = 1; dawnIdle = 0; bed('sea'); mark("dawn"); }
  if (dawnPhase) drawDawn(dt);

  /* the very occasional shooting star */
  if (!dawnPhase && nightT > 5 && Math.random() < 0.11 * dt) {
    shooters.push({ x: Math.random() * W, y: Math.random() * H * 0.5,
                    vx: -160 - Math.random() * 220, vy: 70 + Math.random() * 110, life: 1 });
  }
  for (let i = shooters.length - 1; i >= 0; i--) {
    const sh = shooters[i];
    sh.life -= dt * 0.85;
    if (sh.life <= 0) { shooters.splice(i, 1); continue; }
    sh.x += sh.vx * dt; sh.y += sh.vy * dt;
    const g = fctx.createLinearGradient(sh.x, sh.y, sh.x - sh.vx * 0.16, sh.y - sh.vy * 0.16);
    g.addColorStop(0, `rgba(255,255,255,${0.85 * sh.life})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    fctx.strokeStyle = g; fctx.lineWidth = 1.8;
    fctx.beginPath();
    fctx.moveTo(sh.x, sh.y);
    fctx.lineTo(sh.x - sh.vx * 0.16, sh.y - sh.vy * 0.16);
    fctx.stroke();
  }

  natFrame(dt);
}

/* ================= dawn: the last scene =================
   Orion finishes drawing and the horizon starts to warm. A sliver of sun
   is waiting just under it. Drag it up — the sky lifts with it, the stars
   go out one by one, the sea catches the light, and the name comes back,
   this time written in it. Which is where the whole thing started. */
let dawnPhase = 0, dawnU = 0, dawnGrab = null, dawnIdle = 0;
let nameTrace = null, seaRows = null, dawnDone = 0, dawnPost = 0;
let clouds = null, birds = [];

const HORIZ = () => window.innerHeight * 0.775;

function sunGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const R = Math.max(46, Math.min(W, H) * 0.118);
  const hz = HORIZ();
  const drift = Math.min(0.42, dawnPost * 0.012) * R;   // it keeps rising, slowly
  return { x: W * RUN.sunX, y: hz + R * 0.86 - dawnU * (R * 2.30) - drift, R, hz };
}

/* the name, rebuilt from the very same balloon paths, as a polyline we can
   draw on stroke by stroke */
function buildNameTrace() {
  if (!letters.length) return null;
  const segs = [];
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const L of letters) {
    if (!L.subs) continue;
    for (const sub of L.subs) {
      const pts = sub.pts.map(p => ({ x: L.x + p.x, y: L.base - 100 + p.y }));
      let len = 0;
      for (let i = 1; i < pts.length; i++)
        len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      for (const p of pts) {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      segs.push({ pts, len });
    }
  }
  if (!segs.length) return null;
  segs.sort((a, b) => a.pts[0].x - b.pts[0].x);          // left to right
  return { segs, total: segs.reduce((a, s) => a + s.len, 0), minX, maxX, minY, maxY };
}

function buildClouds() {
  const H = window.innerHeight, W = window.innerWidth;
  clouds = [];
  const N = Math.max(2, Math.round(RUN.cloudN * (W < 620 ? 0.6 : 1)));
  for (let i = 0; i < N; i++) {
    const alt = Math.pow(Math.random(), 1.7) * 0.86 + 0.06;   // 0 = horizon, 1 = zenith
    clouds.push({
      alt, x: Math.random() * W * 1.4 - W * 0.2,
      w: (0.14 + Math.random() * 0.30) * W,
      h: (0.008 + Math.random() * 0.020) * H,
      sp: (5 + Math.random() * 13) * (Math.random() < 0.5 ? -1 : 1),
      a: 0.20 + Math.random() * 0.42,
    });
  }
}

function buildSea() {
  const H = window.innerHeight, hz = HORIZ();
  const rows = [];
  for (let y = hz + 1; y < H; y += 2) {
    const d = (y - hz) / Math.max(1, H - hz);           // 0 at horizon, 1 at foot
    rows.push({ y, d, ph: Math.random() * 6.3, sp: 0.5 + Math.random() * 1.9,
                w: 0.25 + Math.random() * 0.9 });
  }
  seaRows = rows;
}

const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t,
                           a[1] + (b[1] - a[1]) * t,
                           a[2] + (b[2] - a[2]) * t];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

const NIGHT_SKY = [[5, 6, 10], [8, 11, 24], [13, 17, 38], [17, 22, 48]];
/* two dawns: one that comes up rose and one that comes up cold gold, and
   any mix of the two */
const DAWN_A = [[16, 26, 74], [72, 56, 122], [206, 108, 96], [255, 190, 122]];
const DAWN_B = [[10, 30, 62], [46, 74, 118], [168, 128, 132], [242, 206, 158]];
const DAWN_SKY = DAWN_A.map((c, i) =>
  c.map((v, k) => Math.round(v * (1 - RUN.dawnWarm) + DAWN_B[i][k] * RUN.dawnWarm)));

function skyGradient(u) {
  const H = window.innerHeight;
  const g = fctx.createLinearGradient(0, 0, 0, HORIZ());
  for (let i = 0; i < 4; i++) {
    /* the warmth arrives from the horizon upward, so lower stops turn first */
    const lag = 0.30 * (3 - i) / 3;
    const t = Math.max(0, Math.min(1, (u - lag) / (1 - lag)));
    g.addColorStop(i / 3, rgb(mixc(NIGHT_SKY[i], DAWN_SKY[i], t * t * (3 - 2 * t))));
  }
  return g;
}

function drawDawn(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  const u = dawnU, S = sunGeom();
  if (!seaRows || Math.abs(seaRows[0].y - (S.hz + 1)) > 2) buildSea();

  /* ---- sea ---- */
  const horizCol = mixc(NIGHT_SKY[3], DAWN_SKY[3], u * u * (3 - 2 * u));
  const sg = fctx.createLinearGradient(0, S.hz, 0, H);
  sg.addColorStop(0, rgb(mixc(horizCol, [10, 16, 34], 0.34)));
  sg.addColorStop(0.35, rgb(mixc(horizCol, [8, 14, 36], 0.66)));
  sg.addColorStop(1, rgb(mixc(horizCol, [4, 9, 26], 0.93)));
  fctx.fillStyle = sg;
  fctx.fillRect(0, S.hz, W, H - S.hz);

  /* the glitter path: the sun's light broken up across the swell */
  const above = Math.max(0, Math.min(1, (S.hz + S.R - S.y) / (S.R * 2)));
  if (above > 0.02) {
    fctx.save();
    fctx.globalCompositeOperation = "lighter";
    for (const r of seaRows) {
      const spread = S.R * (0.55 + r.d * 6.5);
      const n = 1 + Math.round(r.d * 5);
      for (let k = 0; k < n; k++) {
        const j = Math.sin(nightT * r.sp + r.ph + k * 2.4);
        const x = S.x + j * spread;
        const len = (2 + r.d * 16) * (0.5 + 0.5 * Math.cos(nightT * r.sp * 1.7 + r.ph));
        const a = above * (0.30 - r.d * 0.20) * (0.45 + 0.55 * Math.abs(j)) * r.w;
        if (a <= 0.004) continue;
        fctx.fillStyle = `rgba(255,${196 + 40 * (1 - r.d) | 0},${132 + 60 * (1 - r.d) | 0},${a.toFixed(3)})`;
        fctx.fillRect(x - len / 2, r.y, len, 1.4);
      }
    }
    fctx.restore();
  }

  /* ---- the sun ---- */
  fctx.save();
  fctx.beginPath();
  fctx.rect(0, 0, W, S.hz);                              // it rises out of the sea
  fctx.clip();
  const bloom = fctx.createRadialGradient(S.x, S.y, 0, S.x, S.y, S.R * 6.5);
  bloom.addColorStop(0, "rgba(255,206,140,0.42)");
  bloom.addColorStop(0.3, "rgba(255,150,96,0.16)");
  bloom.addColorStop(1, "rgba(255,120,80,0)");
  fctx.fillStyle = bloom;
  fctx.fillRect(S.x - S.R * 6.5, S.y - S.R * 6.5, S.R * 13, S.R * 13);
  const disc = fctx.createRadialGradient(S.x, S.y - S.R * 0.18, S.R * 0.05, S.x, S.y, S.R);
  disc.addColorStop(0, "#fffdf4");
  disc.addColorStop(0.55, "#ffdc93");
  disc.addColorStop(0.88, "#ffab5c");
  disc.addColorStop(1, "rgba(255,140,80,0.55)");
  fctx.fillStyle = disc;
  fctx.beginPath(); fctx.arc(S.x, S.y, S.R, 0, 6.3); fctx.fill();
  fctx.restore();

  /* a hard line where sea meets sky, brightest right under the sun */
  const hl = fctx.createLinearGradient(0, 0, W, 0);
  hl.addColorStop(0, "rgba(255,190,130,0.06)");
  hl.addColorStop(0.5, `rgba(255,226,180,${(0.10 + 0.5 * above).toFixed(3)})`);
  hl.addColorStop(1, "rgba(255,190,130,0.06)");
  fctx.fillStyle = hl;
  fctx.fillRect(0, S.hz - 1, W, 2);

  /* ---- the grab affordance: it breathes, and drifts sparks upward ---- */
  if (dawnPhase === 1) {
    const puls = 0.5 + 0.5 * Math.sin(nightT * 2.1);
    fctx.save();
    fctx.beginPath(); fctx.rect(0, 0, W, S.hz); fctx.clip();
    fctx.globalCompositeOperation = "lighter";
    const gr = fctx.createRadialGradient(S.x, S.y, S.R * 0.4, S.x, S.y, S.R * (1.7 + 0.5 * puls));
    gr.addColorStop(0, `rgba(255,210,150,${(0.16 + 0.16 * puls).toFixed(3)})`);
    gr.addColorStop(1, "rgba(255,170,110,0)");
    fctx.fillStyle = gr;
    fctx.fillRect(S.x - S.R * 3, S.y - S.R * 3, S.R * 6, S.R * 6);
    if (dawnIdle > 4) {
      for (let i = 0; i < 7; i++) {
        const t = ((nightT * 0.55 + i / 7) % 1);
        const y = S.hz - t * H * 0.16;
        const x = S.x + Math.sin(nightT * 1.3 + i * 2.1) * S.R * 0.75;
        fctx.fillStyle = `rgba(255,214,160,${(0.5 * (1 - t) * Math.min(1, (dawnIdle - 4) / 2)).toFixed(3)})`;
        fctx.beginPath(); fctx.arc(x, y, 1.5 + (1 - t) * 1.6, 0, 6.3); fctx.fill();
      }
    }
    fctx.restore();
  }

  /* ---- swell: a few slow lines of water right under the horizon ---- */
  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3; i++) {
    const y = S.hz + 3 + i * 5 + Math.sin(nightT * (0.4 + i * 0.15) + i) * 1.6;
    const a = above * (0.10 - i * 0.026);
    if (a <= 0) continue;
    fctx.fillStyle = `rgba(255,206,158,${a.toFixed(3)})`;
    fctx.fillRect(0, y, W, 1);
  }
  fctx.restore();

  /* ---- cloud bars catching the light from underneath ---- */
  if (!clouds) buildClouds();
  fctx.save();
  fctx.beginPath(); fctx.rect(0, 0, W, S.hz); fctx.clip();
  for (const c of clouds) {
    c.x += c.sp * dt;
    if (c.x > W + c.w) c.x = -c.w * 1.2;
    if (c.x < -c.w * 1.4) c.x = W + c.w * 0.2;
    const cy = S.hz - c.alt * S.hz;
    /* the closer to the sun, the more light it takes on its underside */
    const near = Math.max(0, 1 - Math.abs(cy - S.y) / (H * 0.42));
    const warm = u * (0.30 + 0.70 * near);
    const g = fctx.createRadialGradient(c.x, cy, 0, c.x, cy, c.w);
    const lit = [196 + 59 * warm, 142 + 88 * warm, 148 + 42 * warm];
    const A = c.a * (0.22 + 0.52 * u);
    g.addColorStop(0, `rgba(${lit[0]|0},${lit[1]|0},${lit[2]|0},${A.toFixed(3)})`);
    g.addColorStop(0.45, `rgba(${lit[0]|0},${lit[1]|0},${lit[2]|0},${(A * 0.62).toFixed(3)})`);
    g.addColorStop(1, "rgba(132,112,142,0)");
    fctx.save();
    fctx.translate(c.x, cy);
    fctx.scale(1, c.h / c.w);
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(0, 0, c.w, 0, 6.3); fctx.fill();
    fctx.restore();
  }
  fctx.restore();

  /* ---- once the sun is up, the odd bird crosses a long way off ---- */
  if (dawnDone) {
    dawnPost += dt;
    if (birds.length < 5 && Math.random() < 0.14 * dt) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      birds.push({ x: dir > 0 ? -30 : W + 30, y: S.hz - H * (0.18 + Math.random() * 0.42),
                   v: dir * (16 + Math.random() * 26), ph: Math.random() * 6.3,
                   s: 3.5 + Math.random() * 4.5, a: 0.20 + Math.random() * 0.28 });
    }
    fctx.save();
    fctx.strokeStyle = "rgba(46,32,30,0.85)";
    fctx.lineCap = "round";
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.x += b.v * dt;
      b.y -= dt * 1.6;
      if (b.x < -60 || b.x > W + 60) { birds.splice(i, 1); continue; }
      const flap = Math.sin(nightT * 5.2 + b.ph) * 0.55;
      fctx.globalAlpha = b.a;
      fctx.lineWidth = Math.max(1, b.s * 0.22);
      fctx.beginPath();
      fctx.moveTo(b.x - b.s, b.y + flap * b.s * 0.5);
      fctx.quadraticCurveTo(b.x - b.s * 0.35, b.y - flap * b.s * 0.4, b.x, b.y);
      fctx.quadraticCurveTo(b.x + b.s * 0.35, b.y - flap * b.s * 0.4, b.x + b.s, b.y + flap * b.s * 0.5);
      fctx.stroke();
    }
    fctx.restore();
  }

  /* ---- something comes in on the tide ---- */
  if (dawnDone && botT < 0 && dawnPost > 5.5) botT = 0;
  if (botT >= 0) drawBottle(dt);

  /* ---- the name, traced back on in light ---- */
  if (!nameTrace) nameTrace = buildNameTrace();
  const NT = nameTrace;
  const rv = Math.max(0, Math.min(1, (u - 0.34) / 0.60));
  if (NT && rv > 0) {
    const bw = NT.maxX - NT.minX, bh = NT.maxY - NT.minY;
    /* clear the sun's final resting place by a comfortable margin, and if
       that pushes the name off the top, shrink it instead of clipping */
    const sunTop = S.hz - S.R * 2.44;
    const top = H * 0.055, bottom = sunTop - H * 0.05;
    let sc = Math.min(W * 0.80 / bw, H * 0.24 / bh, (bottom - top) / bh);
    const ox = W / 2 - (NT.minX + bw / 2) * sc;
    const oy = bottom - NT.maxY * sc;
    let budget = rv * NT.total;
    fctx.save();
    fctx.lineCap = "round"; fctx.lineJoin = "round";
    for (const seg of NT.segs) {
      if (budget <= 0) break;
      const take = Math.min(1, budget / seg.len);
      budget -= seg.len;
      const n = Math.max(2, Math.round(seg.pts.length * take));
      const path = () => {
        fctx.beginPath();
        for (let i = 0; i < n; i++) {
          const p = seg.pts[i];
          const x = ox + p.x * sc, y = oy + p.y * sc;
          i ? fctx.lineTo(x, y) : fctx.moveTo(x, y);
        }
      };
      fctx.globalCompositeOperation = "lighter";
      fctx.strokeStyle = `rgba(255,178,112,${(0.16 * rv).toFixed(3)})`;
      fctx.lineWidth = 15 * sc; path(); fctx.stroke();
      fctx.strokeStyle = `rgba(255,214,158,${(0.30 * rv).toFixed(3)})`;
      fctx.lineWidth = 7 * sc; path(); fctx.stroke();
      fctx.globalCompositeOperation = "source-over";
      fctx.strokeStyle = `rgba(255,248,232,${(0.55 + 0.40 * rv).toFixed(3)})`;
      fctx.lineWidth = 2.4 * sc; path(); fctx.stroke();
    }
    fctx.restore();
  }
}

/* --------- dragging the sun --------- */
function dawnHit(x, y) {
  const S = sunGeom();
  const grab = Math.max(S.R * 1.9, 64 * UIS);
  return Math.hypot(x - S.x, y - S.y) < grab ||
         (y > S.hz - S.R * 0.5 && Math.abs(x - S.x) < grab * 1.6);
}

function dawnDown(e) {
  if (dawnPhase !== 1 && dawnPhase !== 2) return;
  const x = e.clientX, y = e.clientY;
  if (!dawnHit(x, y)) return;
  dawnGrab = { y, u0: dawnU };
  dawnPhase = 2;
  dawnIdle = 0;
  /* taps raise it too, same as the pump */
  const bump = Math.min(1, dawnU + 0.11);
  if (bump > dawnU) { sunRise(bump - dawnU); dawnU = bump; }
  if (dawnU >= 1 && !dawnDone) { dawnDone = 1; dawnPhase = 3; dawnGrab = null; sunUp(); }
  finCanvas.style.cursor = "grabbing";
  if (e.cancelable) e.preventDefault();
}

function dawnMove(e) {
  if (dawnPhase === 1 && dawnHit(e.clientX, e.clientY)) finCanvas.style.cursor = "grab";
  else if (dawnPhase === 1) finCanvas.style.cursor = "";
  if (!dawnGrab) return;
  const H = window.innerHeight;
  const nu = Math.max(0, Math.min(1, dawnGrab.u0 + (dawnGrab.y - e.clientY) / (H * 0.46)));
  if (nu > dawnU) sunRise(nu - dawnU);
  dawnU = Math.max(dawnU, nu);
  dawnIdle = 0;
  if (dawnU >= 1 && !dawnDone) { dawnDone = 1; dawnPhase = 3; dawnGrab = null; sunUp(); }
  if (e.cancelable) e.preventDefault();
}

function dawnUp() {
  dawnGrab = null;
  if (dawnPhase === 2 && !dawnDone) dawnPhase = 1;
  finCanvas.style.cursor = "";
}

window.addEventListener("pointerdown", dawnDown, { passive: false });
window.addEventListener("pointermove", dawnMove, { passive: false });
window.addEventListener("pointerup", dawnUp);
window.addEventListener("pointercancel", dawnUp);

/* --------- sound: the pad opens up as the light does --------- */
let riseVoice = null, lastRise = 0;
function sunRise(d) {
  const ac = audio(); if (!ac || d < 0.004) return;
  const t0 = ac.currentTime;
  if (t0 - lastRise < 0.09) return;
  lastRise = t0;
  const o = ac.createOscillator(); o.type = "triangle";
  const base = 196 * Math.pow(2, Math.floor(dawnU * 7) / 7);   // climbs with the sun
  o.frequency.setValueAtTime(base, t0);
  o.frequency.linearRampToValueAtTime(base * 1.02, t0 + 0.5);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.030 + 0.03 * dawnU, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  o.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 1.0);
}

function sunUp() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [261.6, 329.6, 392, 523.3, 659.3].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 2 ? "sine" : "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.10);
    g.gain.exponentialRampToValueAtTime(0.055, t0 + i * 0.10 + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 5.5);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.10); o.stop(t0 + 5.8);
  });
}

/* ================= the bottle =================
   The site is an elaborate lock. This is what is behind it.
   Once the sun is properly up, something comes in on the tide: a bottle,
   riding the swell, small at the horizon and closer every wave. Pull the
   cork — the same pull the chest taught you — and the note unrolls. */

/* What is in the bottle is not a sign-off. It is a chart, and it is blank
   until the sun gets at it — old citrus ink only shows once it is warmed.
   The X on it is where this goes next. */
let botT = -1, botPull = 0, botGrab = null, botOpen = 0, botLand = 0, corkFloat = 0;
const botEl = () => document.getElementById("note");

function bottleGeom() {
  const W = window.innerWidth, H = window.innerHeight, hz = HORIZ();
  const t = Math.max(0, Math.min(1, botT / 22));
  const e = t * t * (3 - 2 * t);
  /* it comes in from the glare under the sun and lands centre-low */
  const x = W * (0.5 + (0.06 - 0.06 * e));
  const y = hz + (H - hz) * (0.06 + 0.44 * e);
  const s = Math.min(W, H) * (0.045 + 0.235 * e);
  /* the swell keeps working on it right up until it grounds */
  const rest = 1 - botLand;
  const bob = Math.sin(nightT * 1.35 + 0.6) * s * 0.055 * rest;
  const roll = Math.sin(nightT * 0.95) * 0.16 * rest - 0.34;
  return { x, y: y + bob, s, roll, hz };
}

function drawBottle(dt) {
  if (botT < 0) return;
  botT += dt;
  const B = bottleGeom();
  if (botT > 22) botLand = Math.min(1, botLand + dt * 0.6);
  const W = window.innerWidth;

  fctx.save();
  fctx.translate(B.x, B.y);
  fctx.rotate(B.roll);
  const L = B.s, w = L * 0.30;                 // length and barrel width

  /* what it sits in: a dark wet shadow and a wake on the water */
  fctx.save();
  fctx.rotate(-B.roll);
  fctx.fillStyle = "rgba(24,18,14,0.20)";
  fctx.beginPath();
  fctx.ellipse(0, L * 0.16, L * 0.52, L * 0.08, 0, 0, 6.3);
  fctx.fill();
  fctx.restore();

  const body = (inset, col) => {
    fctx.beginPath();
    fctx.moveTo(-L * 0.50 + inset, -w / 2 + inset);
    fctx.lineTo(L * 0.06 - inset, -w / 2 + inset);
    fctx.quadraticCurveTo(L * 0.20, -w / 2 + inset, L * 0.24, -w * 0.22);
    fctx.lineTo(L * 0.44 - inset, -w * 0.20);
    fctx.lineTo(L * 0.44 - inset, w * 0.20);
    fctx.lineTo(L * 0.24, w * 0.22);
    fctx.quadraticCurveTo(L * 0.20, w / 2 - inset, L * 0.06 - inset, w / 2 - inset);
    fctx.lineTo(-L * 0.50 + inset, w / 2 - inset);
    fctx.quadraticCurveTo(-L * 0.58 + inset, 0, -L * 0.50 + inset, -w / 2 + inset);
    fctx.closePath();
    if (col) { fctx.fillStyle = col; fctx.fill(); }
  };

  /* the glass: dark bottle-green, lit through from the sun side */
  const gg = fctx.createLinearGradient(0, -w / 2, 0, w / 2);
  gg.addColorStop(0, "rgba(96,132,104,0.72)");
  gg.addColorStop(0.42, "rgba(44,74,58,0.80)");
  gg.addColorStop(1, "rgba(20,38,30,0.86)");
  body(0, null); fctx.fillStyle = gg; fctx.fill();

  /* the rolled note inside, warm against the green */
  fctx.save();
  body(0, null); fctx.clip();
  fctx.fillStyle = "rgba(226,206,168,0.80)";
  fctx.beginPath();
  fctx.roundRect ? fctx.roundRect(-L * 0.34, -w * 0.20, L * 0.52, w * 0.40, w * 0.20)
                 : fctx.rect(-L * 0.34, -w * 0.20, L * 0.52, w * 0.40);
  fctx.fill();
  fctx.strokeStyle = "rgba(150,124,86,0.55)";
  fctx.lineWidth = Math.max(0.6, L * 0.006);
  for (let i = 0; i < 3; i++) {
    const x = -L * 0.30 + i * L * 0.16;
    fctx.beginPath(); fctx.moveTo(x, -w * 0.19); fctx.lineTo(x, w * 0.19); fctx.stroke();
  }
  /* a band of daylight across the glass */
  fctx.fillStyle = "rgba(255,240,205,0.20)";
  fctx.fillRect(-L * 0.55, -w * 0.5, L * 1.2, w * 0.16);
  fctx.restore();

  /* rim light down the top edge, and a hard specular */
  fctx.strokeStyle = "rgba(224,246,224,0.55)";
  fctx.lineWidth = Math.max(1, L * 0.014);
  body(L * 0.012, null); fctx.stroke();
  fctx.fillStyle = "rgba(255,255,255,0.60)";
  fctx.beginPath();
  fctx.ellipse(-L * 0.18, -w * 0.30, L * 0.16, w * 0.055, -0.05, 0, 6.3);
  fctx.fill();

  /* the cork, pulling free — and once it is out it goes in the water */
  const out = botPull * L * 0.26;
  if (botOpen) {
    fctx.restore();
    corkFloat += dt;
    const cx2 = B.x + B.s * (0.62 + Math.min(1, corkFloat * 0.28) * 0.30);
    const cy2 = B.y + B.s * 0.10 + Math.sin(nightT * 1.9) * B.s * 0.022;
    fctx.save();
    fctx.translate(cx2, cy2);
    fctx.rotate(Math.sin(nightT * 1.2) * 0.22 + 0.5);
    const cg2 = fctx.createLinearGradient(0, -w * 0.19, 0, w * 0.19);
    cg2.addColorStop(0, "#c99a63"); cg2.addColorStop(0.45, "#a9743f");
    cg2.addColorStop(1, "#7c4f28");
    fctx.fillStyle = cg2;
    fctx.beginPath();
    fctx.roundRect ? fctx.roundRect(-L * 0.065, -w * 0.19, L * 0.13, w * 0.38, w * 0.06)
                   : fctx.rect(-L * 0.065, -w * 0.19, L * 0.13, w * 0.38);
    fctx.fill();
    fctx.restore();
    /* the ring it leaves on the water */
    fctx.fillStyle = "rgba(255,232,196,0.10)";
    fctx.beginPath();
    fctx.ellipse(cx2, cy2 + B.s * 0.03, B.s * 0.13, B.s * 0.035, 0, 0, 6.3);
    fctx.fill();
    return;
  }
  const cg = fctx.createLinearGradient(0, -w * 0.20, 0, w * 0.20);
  cg.addColorStop(0, "#c99a63"); cg.addColorStop(0.45, "#a9743f");
  cg.addColorStop(1, "#7c4f28");
  fctx.fillStyle = cg;
  fctx.beginPath();
  fctx.roundRect ? fctx.roundRect(L * 0.40 + out, -w * 0.19, L * 0.13, w * 0.38, w * 0.06)
                 : fctx.rect(L * 0.40 + out, -w * 0.19, L * 0.13, w * 0.38);
  fctx.fill();
  fctx.fillStyle = "rgba(255,255,255,0.16)";
  fctx.fillRect(L * 0.41 + out, -w * 0.15, L * 0.11, w * 0.07);
  fctx.restore();

  /* below the waterline it goes soft and dark, the way things do in water */
  fctx.save();
  fctx.beginPath();
  fctx.rect(0, B.y + B.s * 0.06, W, window.innerHeight);
  fctx.clip();
  fctx.globalAlpha = 0.30;
  fctx.fillStyle = "rgba(12,22,30,0.9)";
  fctx.beginPath();
  fctx.ellipse(B.x, B.y + B.s * 0.14, B.s * 0.46, B.s * 0.12, B.roll, 0, 6.3);
  fctx.fill();
  fctx.restore();
}

/* --- pulling the cork --- */
function bottleHit(x, y) {
  if (botT < 0 || botLand < 0.9 || botOpen) return false;
  const B = bottleGeom();
  return Math.hypot(x - B.x, y - B.y) < Math.max(B.s * 0.55, 48 * UIS);
}

window.addEventListener("pointerdown", (e) => {
  if (!bottleHit(e.clientX, e.clientY)) return;
  botGrab = { y: e.clientY, p0: botPull };
  botPull = Math.min(1, botPull + 0.20);
  squeakCork();
  if (botPull >= 1 && !botOpen) { botOpen = 1; botGrab = null; openNote(); }
  if (e.cancelable) e.preventDefault();
}, { passive: false });

window.addEventListener("pointermove", (e) => {
  if (nightPhase && dawnDone && !botOpen && botLand >= 0.9)
    finCanvas.style.cursor = bottleHit(e.clientX, e.clientY) ? "grab" : "";
  if (!botGrab) return;
  const H = window.innerHeight;
  const np = Math.max(0, Math.min(1, botGrab.p0 + (botGrab.y - e.clientY) / (H * 0.22)));
  if (np > botPull && Math.random() < 0.4) squeakCork();
  botPull = Math.max(botPull, np);
  if (botPull >= 1 && !botOpen) { botOpen = 1; botGrab = null; openNote(); }
  if (e.cancelable) e.preventDefault();
}, { passive: false });

window.addEventListener("pointerup", () => { botGrab = null; });

/* click off the paper and it rolls back up, so the sunrise is not lost
   behind it; the bottle opens it again */
window.addEventListener("pointerdown", (e) => {
  if (!botOpen) return;
  const el = botEl();
  if (!el || el.contains(e.target)) return;
  const open = el.classList.contains("on");
  const B = bottleGeom();
  const onBottle = Math.hypot(e.clientX - B.x, e.clientY - B.y) < Math.max(B.s * 0.55, 48 * UIS);
  if (open && !onBottle) {
    el.classList.remove("on");
    document.getElementById("scrim").classList.remove("on");
  } else if (!open && onBottle) {
    el.classList.add("on");
    document.getElementById("scrim").classList.add("on");
  }
});

let lastSqueak = 0;
function squeakCork() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastSqueak < 0.11) return;
  lastSqueak = t0;
  const o = ac.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(150 + botPull * 260, t0);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 900 + botPull * 900; bp.Q.value = 6;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.020, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
  o.connect(bp); bp.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.15);
}

function openNote() {
  corkPopSound();
  const el = botEl(), sc = document.getElementById("scrim");
  if (!el) return;
  el.style.display = "block";
  if (sc) sc.style.display = "block";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.classList.add("on");
    if (sc) sc.classList.add("on");
    buildChart();
  }));
  el.addEventListener("pointerdown", chartClick);
  const ac = audio();
  if (ac) {                       /* paper coming unrolled */
    const t0 = ac.currentTime + 0.18;
    const s = ac.createBufferSource(); s.buffer = noise(ac);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass";
    bp.frequency.setValueAtTime(2600, t0);
    bp.frequency.linearRampToValueAtTime(1500, t0 + 1.0);
    bp.Q.value = 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(0.045, t0 + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.2);
    s.connect(bp); bp.connect(g); g.connect(BUS);
    s.start(t0); s.stop(t0 + 1.3);
  }
}

function buildNote() {
  const el = document.createElement("div");
  el.id = "note";
  el.innerHTML = '<div class="paper"><canvas id="chart"></canvas></div>';
  document.body.appendChild(el);
}
buildNote();

/* ---- the chart, developing ----
   Citrus ink is invisible until it is heated, and then it browns before it
   darkens. So the paper comes out blank and a warm front sweeps across it,
   scorching the lines up out of nothing as it goes. */
let chartC = null, chartX = null, chartT = -1, chartGeo = null, chartDone = 0;

function buildChart() {
  const c = document.getElementById("chart");
  if (!c) return;
  const el = botEl();
  const W = Math.round(el.getBoundingClientRect().width) || 480;
  const H = Math.round(W * 0.62);
  c.width = W * 2; c.height = H * 2;
  c.style.height = H + "px";
  chartC = c; chartX = c.getContext("2d");
  chartX.setTransform(2, 0, 0, 2, 0, 0);

  /* a coastline that is recognisably the one outside the window: a long
     shore with a bay bitten out of it, and the X inland of the point */
  const shore = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const y = H * (0.30 + 0.30 * Math.sin(t * 4.1 + 0.7)
                        + 0.09 * Math.sin(t * 9.3 + 2.2)
                        + 0.04 * Math.sin(t * 17.0));
    shore.push({ x: W * (0.06 + t * 0.88), y });
  }
  const px = W * 0.66, py = H * 0.70;
  /* the dotted walk from where you land to where you dig */
  const path = [];
  const from = { x: W * 0.17, y: H * 0.80 };
  for (let i = 0; i <= 26; i++) {
    const t = i / 26;
    path.push({
      x: from.x + (px - from.x) * t + Math.sin(t * 5.6) * W * 0.045,
      y: from.y + (py - from.y) * t + Math.cos(t * 4.2) * H * 0.05,
    });
  }
  chartGeo = { W, H, shore, path, X: { x: px, y: py }, rose: { x: W * 0.855, y: H * 0.845 } };
  chartT = 0;
  chartDone = 0;
}

/* everything is drawn behind a sweeping front, so it browns into being */
function developed(g, x, y) {
  const d = Math.hypot(x - g.W * 0.42, (y - g.H * 0.42) * 1.15);
  const max = Math.hypot(g.W * 0.68, g.H * 0.72);
  return (chartT * 0.34) * max - d;      /* >0 developed, near 0 = the scorch */
}

function drawChart(dt) {
  if (!chartX || chartT < 0) return;
  const g = chartGeo, x = chartX;
  chartT += dt;
  if (chartT > 4.6) chartDone = 1;
  x.clearRect(0, 0, g.W, g.H);

  const seg = (a, b, col, w) => {
    const dA = developed(g, a.x, a.y);
    if (dA <= 0) return;
    const heat = Math.max(0, 1 - dA / 26);            /* the scorch edge */
    x.strokeStyle = heat > 0.02
      ? `rgba(${164 + 60 * heat | 0},${96 - 20 * heat | 0},${40 - 22 * heat | 0},${(0.55 + 0.45 * (1 - heat)).toFixed(2)})`
      : col;
    x.lineWidth = w * (1 + heat * 0.5);
    x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
  };

  x.lineCap = "round"; x.lineJoin = "round";
  const INK = "rgba(112,64,26,0.86)", FAINT = "rgba(126,84,44,0.42)";

  /* the sea side, hatched the way old charts are */
  for (let i = 0; i < g.shore.length - 1; i++) {
    const a = g.shore[i], b = g.shore[i + 1];
    seg(a, b, INK, 1.6);
    if (i % 2 === 0) {
      const nx = -(b.y - a.y), ny = b.x - a.x;
      const nl = Math.hypot(nx, ny) || 1;
      const L = 7 + 4 * Math.sin(i * 1.3);
      seg(a, { x: a.x - nx / nl * L, y: a.y - ny / nl * L }, FAINT, 0.9);
    }
  }

  /* the walk, dotted */
  for (let i = 0; i < g.path.length - 1; i += 2) {
    seg(g.path[i], g.path[i + 1], FAINT, 1.5);
  }

  /* the compass rose */
  const R = g.rose, rr = g.W * 0.055;
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4, l = k % 2 ? rr * 0.5 : rr;
    seg(R, { x: R.x + Math.cos(a) * l, y: R.y + Math.sin(a) * l }, INK, k % 2 ? 0.9 : 1.5);
  }
  if (developed(g, R.x, R.y - rr) > 0) {
    x.fillStyle = INK;
    x.beginPath();
    x.moveTo(R.x, R.y - rr * 1.42);
    x.lineTo(R.x - rr * 0.16, R.y - rr * 1.05);
    x.lineTo(R.x + rr * 0.16, R.y - rr * 1.05);
    x.closePath(); x.fill();
  }

  /* the X — the last thing to come up, and then it will not sit still */
  const XG = g.X, xr = g.W * 0.032;
  const xd = developed(g, XG.x, XG.y);
  if (xd > 0) {
    const puls = chartDone ? 0.72 + 0.28 * Math.sin(nightT * 3.4) : 1;
    x.strokeStyle = `rgba(166,32,26,${(0.90 * puls).toFixed(2)})`;
    x.lineWidth = 3.4;
    x.beginPath();
    x.moveTo(XG.x - xr, XG.y - xr); x.lineTo(XG.x + xr, XG.y + xr);
    x.moveTo(XG.x + xr, XG.y - xr); x.lineTo(XG.x - xr, XG.y + xr);
    x.stroke();
    if (chartDone) {
      x.strokeStyle = `rgba(166,32,26,${(0.30 * (1 - puls)).toFixed(2)})`;
      x.lineWidth = 1.4;
      x.beginPath();
      x.arc(XG.x, XG.y, xr * (2.0 + 1.4 * (1 - puls)), 0, 6.3);
      x.stroke();
    }
  }
}

/* clicking the X is what starts the dig */
function chartClick(e) {
  if (!chartDone || !chartC || digPhase) return;
  const r = chartC.getBoundingClientRect();
  const g = chartGeo;
  const px = (e.clientX - r.left) / r.width * g.W;
  const py = (e.clientY - r.top) / r.height * g.H;
  if (Math.hypot(px - g.X.x, py - g.X.y) > g.W * 0.09) return;
  e.stopPropagation();
  const el = botEl(), sc = document.getElementById("scrim");
  /* grab the paper before it goes, because the sand is made out of it */
  const src = chartC;
  release("night", 2.2); nightPad = null;      /* the night ends at the beach */
  natRun("sand", () => startDig(), 3.2, { src, at: 0.88 });
  setTimeout(() => {
    if (el) { el.classList.remove("on"); el.style.display = "none"; }
    if (sc) sc.classList.remove("on");
  }, 40);
}

/* ================= the dig =================
   The X said here. So: a shovel, and sand that behaves like sand — what
   you scoop out of the pit has to go somewhere, so it piles on the lip,
   and the pile slumps whenever it gets steeper than sand can stand. Dig
   far enough and the blade stops on something that is not sand. */

let digPhase = 0, sandH = null, sandBase = null, digN = 0, digCol = 0;
let grains = [], digT = 0, lidSeen = 0, digging = null, lastScrape = 0, lidClear = 0;
/* Dry sand will not stand steeper than about thirty degrees, which is why
   you cannot dig a narrow deep hole at the top of a beach. Go down far
   enough and it is damp, and damp sand will stand almost vertically — so
   the pit starts out shallow and bowl-shaped and gets steeper the deeper
   it goes, exactly the way a real one does. */
const REPOSE_DRY = 0.55, REPOSE_WET = 1.45;
function reposeAt(i) {
  const d = Math.max(sandH[i] - sandBase[i], sandH[i + 1] - sandBase[i + 1]);
  return REPOSE_DRY + (REPOSE_WET - REPOSE_DRY) * Math.min(1, Math.max(0, d) / 70);
}

function digGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const top = H * 0.42;                                  /* where sand starts */
  return {
    W, H, top,
    water: top + (H - top) * 0.62,
    lidX: W * 0.5,
    lidY: top + (H - top) * 0.20,
    lidR: Math.min(W * 0.105, (H - top) * 0.30),
  };
}

let sandTile = null, sandPat = null;
function buildSandTile() {
  const S = 128, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d");
  for (let i = 0; i < 5200; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.5 ? `rgba(255,246,222,${(0.05 + v * 0.16).toFixed(3)})`
                          : `rgba(96,72,42,${(0.04 + (0.5 - v) * 0.18).toFixed(3)})`;
    g.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  sandTile = c;
  sandPat = null;
}

function buildSand() {
  const G = digGeom();
  digCol = Math.max(3, Math.round(4 * UIS));
  digN = Math.ceil(G.W / digCol) + 1;
  sandBase = new Float32Array(digN);
  sandH = new Float32Array(digN);
  for (let i = 0; i < digN; i++) {
    const t = i / (digN - 1);
    /* a beach, not a table: a slope off the water with dune noise on it */
    const y = G.top + (G.H - G.top) * 0.02
            + Math.sin(t * 7.2) * 5 + Math.sin(t * 3.1 + 1.4) * 9
            + Math.sin(t * 19.0 + 0.3) * 2;
    sandBase[i] = y; sandH[i] = y;
  }
  grains = [];
}

/* the top of the buried lid at a given x, or Infinity where there is none */
function lidTopAt(x) {
  const G = digGeom();
  const dx = (x - G.lidX) / G.lidR;
  if (Math.abs(dx) >= 1) return Infinity;
  return G.lidY - Math.cos(dx * Math.PI * 0.5) * G.lidR * 0.16 + G.lidR * 0.16;
}

function startDig() {
  mark("beach");
  if (digPhase) return;
  digPhase = 1; digT = 0; lidSeen = 0; lidClear = 0;
  bed('sand');
  buildSand();
  const el = botEl(), sc = document.getElementById("scrim");
  if (el) { el.classList.remove("on"); setTimeout(() => { el.style.display = "none"; }, 900); }
  if (sc) { sc.classList.remove("on"); setTimeout(() => { sc.style.display = "none"; }, 900); }
  botT = -1;                                   /* the beach we are on now */
  const sh = document.getElementById("shovel");
  if (sh && !("ontouchstart" in window)) finCanvas.style.cursor = "none";
  if (sh) sh.style.display = "block";
  digWhoosh();
}

/* --- scooping --- */
function digAt(x, y, dx, dt) {
  const G = digGeom();
  const R = Math.max(30, 48 * UIS);
  const i0 = Math.max(0, Math.floor((x - R) / digCol));
  const i1 = Math.min(digN - 1, Math.ceil((x + R) / digCol));
  let moved = 0, clank = 0;
  for (let i = i0; i <= i1; i++) {
    const cx = i * digCol;
    const f = 1 - Math.abs(cx - x) / R;
    if (f <= 0) continue;
    if (y < sandH[i] - R * 1.35) continue;             /* blade is in the air */
    const want = 1150 * f * dt;
    const floor = lidTopAt(cx);
    const room = floor - sandH[i];
    if (room <= 0.4) { clank += f; continue; }         /* that is not sand */
    const take = Math.min(want, room);
    sandH[i] += take; moved += take;
    if (take < want) clank += f * 0.5;
  }
  if (moved > 0) {
    /* it has to go somewhere: onto the lip, on the side you are pulling to */
    /* It goes on the rim, not in front of the blade. Depositing at a fixed
       offset from the shovel turns the beach into a conveyor: you dig the
       spoil straight back up on the next stroke and bulldoze the whole pile
       downwind. So walk out to where the sand is still undisturbed on each
       side, and throw it there. */
    const c = Math.max(0, Math.min(digN - 1, Math.round(x / digCol)));
    let li = c, ri = c;
    while (li > 0 && sandH[li] > sandBase[li] + 2) li--;
    while (ri < digN - 1 && sandH[ri] > sandBase[ri] + 2) ri++;
    const span = Math.max(2, Math.round(R / digCol));
    let wsum = 0;
    for (let k = -span; k <= span; k++) wsum += Math.max(0, 1 - Math.abs(k) / span);
    const G2 = digGeom();
    /* piles are not mountains, and they are certainly not out at sea —
       spoil thrown above the waterline stood up as hard triangles against
       the water behind it */
    const ceil = G2.top + 4;
    const side = dx >= 0 ? 1 : -1;
    for (const [j0, share] of [[li, side < 0 ? 0.6 : 0.4], [ri, side > 0 ? 0.6 : 0.4]]) {
      for (let k = -span; k <= span; k++) {
        const j = j0 + k;
        if (j < 0 || j >= digN) continue;
        const add = moved * share * Math.max(0, 1 - Math.abs(k) / span) / (wsum || 1);
        sandH[j] = Math.max(ceil, sandH[j] - add);
      }
    }
    if (grains.length < 260) {
      for (let n = 0; n < 3; n++)
        grains.push({ x: x + (Math.random() - 0.5) * R, y: y - Math.random() * 8,
                      vx: side * (90 + Math.random() * 210) + dx * 0.4,
                      vy: -120 - Math.random() * 190, life: 1,
                      s: 0.9 + Math.random() * 1.8 });
    }
    scrape(Math.min(1, moved / 10), x);
  }
  if (clank > 0.35) thud();
}

/* sand will not stand steeper than it will stand */
function slump(passes) {
  for (let p = 0; p < passes; p++) {
    for (let i = 0; i < digN - 1; i++) {
      const d = sandH[i + 1] - sandH[i], lim = reposeAt(i) * digCol;
      if (d > lim) { const m = (d - lim) * 0.5; sandH[i] += m; sandH[i + 1] -= m; }
      else if (d < -lim) { const m = (-d - lim) * 0.5; sandH[i] -= m; sandH[i + 1] += m; }
    }
    for (let i = digN - 2; i >= 0; i--) {
      const d = sandH[i + 1] - sandH[i], lim = reposeAt(i) * digCol;
      if (d > lim) { const m = (d - lim) * 0.5; sandH[i] += m; sandH[i + 1] -= m; }
      else if (d < -lim) { const m = (-d - lim) * 0.5; sandH[i] -= m; sandH[i + 1] += m; }
    }
    /* nothing gets pushed through the lid */
    for (let i = 0; i < digN; i++) {
      const f = lidTopAt(i * digCol);
      if (sandH[i] > f) sandH[i] = f;
    }
  }
}

function drawDig(dt) {
  const G = digGeom();
  if (!sandH || sandH.length !== digN) buildSand();
  digT += dt;
  if (digPhase === 2) {
    /* found — the rest of it comes off on its own, and the walls stop
       creeping back in over what you just uncovered */
    lidClear = Math.min(1, lidClear + dt * 0.55);
    const k = Math.min(1, dt * 2.6);
    for (let i = 0; i < digN; i++) {
      const cx2 = i * digCol;
      const f = lidTopAt(cx2);
      if (f === Infinity) continue;
      if (Math.abs(cx2 - digGeom().lidX) > digGeom().lidR * 0.98) continue;
      if (sandH[i] < f) sandH[i] += (f - sandH[i]) * k;
    }
  } else slump(2);
  hardClear(finCanvas, fctx);
  const W = G.W, H = G.H;

  /* ---- the morning, an hour on from the sunrise ---- */
  const sky = fctx.createLinearGradient(0, 0, 0, G.top);
  sky.addColorStop(0, "#7fa8d6");
  sky.addColorStop(0.55, "#bcd2e6");
  sky.addColorStop(1, "#f0dcc0");
  fctx.fillStyle = sky; fctx.fillRect(0, 0, W, H);

  /* the sea, running in behind us. It is drawn well past the sand line so
     a dune or a spoil heap never opens a gap onto the background. */
  const seaTop = G.top - H * 0.14, seaBot = G.top + H * 0.10;
  const sg = fctx.createLinearGradient(0, seaTop, 0, seaBot);
  sg.addColorStop(0, "#3f6f92");
  sg.addColorStop(0.7, "#96b6c0");
  sg.addColorStop(1, "#bcd2cf");
  fctx.fillStyle = sg; fctx.fillRect(0, seaTop, W, seaBot - seaTop);
  for (let i = 0; i < 7; i++) {
    const y = seaTop + (i + 0.5) * (G.top - seaTop) / 7;
    const ph = Math.sin(digT * (0.55 + i * 0.17) + i * 2.1);
    const x0 = W * (0.5 + 0.42 * Math.sin(digT * 0.22 + i * 1.3)) - W * 0.55;
    const wid = W * (0.5 + 0.35 * Math.abs(Math.sin(i * 2.3)));
    const lg = fctx.createLinearGradient(x0, 0, x0 + wid, 0);
    const a = (0.10 + 0.06 * i).toFixed(2);
    lg.addColorStop(0, "rgba(255,255,255,0)");
    lg.addColorStop(0.5, `rgba(255,255,255,${a})`);
    lg.addColorStop(1, "rgba(255,255,255,0)");
    fctx.fillStyle = lg;
    fctx.fillRect(x0, y + ph * 2.2, wid, 1.2 + i * 0.25);
  }
  /* the last of the swash sliding up the sand and soaking in */
  const swash = 0.5 + 0.5 * Math.sin(digT * 0.55);
  fctx.fillStyle = `rgba(214,232,236,${(0.26 + 0.16 * swash).toFixed(2)})`;
  fctx.fillRect(0, G.top - 6, W, 10 + swash * 12);

  /* ---- the sand ---- */
  const surf = () => {
    fctx.beginPath();
    fctx.moveTo(-2, sandH[0]);
    for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, sandH[i]);
    fctx.lineTo(W + 2, sandH[digN - 1]);
    fctx.lineTo(W + 2, H + 2); fctx.lineTo(-2, H + 2);
    fctx.closePath();
  };
  const dry = fctx.createLinearGradient(0, G.top, 0, H);
  dry.addColorStop(0, T.sand);
  dry.addColorStop(0.35, "#dcc194");
  dry.addColorStop(1, "#c2a274");
  surf(); fctx.fillStyle = dry; fctx.fill();

  /* the inside of the pit: everything between where the sand was and where
     it is now, darkening as it goes down because it is wetter down there */
  fctx.save();
  fctx.beginPath();
  fctx.moveTo(-2, sandBase[0]);
  for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, sandBase[i]);
  fctx.lineTo(W + 2, sandBase[digN - 1]);
  for (let i = digN - 1; i >= 0; i--) fctx.lineTo(i * digCol, sandH[i]);
  fctx.closePath();
  const wet = fctx.createLinearGradient(0, G.top, 0, H);
  wet.addColorStop(0, "#a98a5e");
  wet.addColorStop(0.4, "#79603c");
  wet.addColorStop(1, "#463522");
  fctx.fillStyle = wet; fctx.fill();
  fctx.restore();

  /* ---- what the blade found ---- */
  let exposed = 0, total = 0;
  for (let i = 0; i < digN; i++) {
    const cx2 = i * digCol;
    if (Math.abs(cx2 - G.lidX) > G.lidR * 0.60) continue;
    total++;
    if (sandH[i] >= lidTopAt(cx2) - 1.4) exposed++;
  }
  lidSeen = total ? exposed / total : 0;
  if (lidSeen > 0.42 && digPhase === 1) {
    digPhase = 2; foundIt();
    const sh = document.getElementById("shovel");
    if (sh) { sh.style.transition = "opacity 0.8s ease"; sh.style.opacity = "0";
              setTimeout(() => { sh.style.display = "none"; }, 900); }
    finCanvas.style.cursor = "";
  }

  /* it is only visible where the sand has actually come off it, so clip to
     the runs of columns that have been dug down to the wood. Once it is
     found, drawLift owns it — hinge, hasp and all. */
  if (digPhase !== 2) {
  fctx.save();
  fctx.beginPath();
  let run = -1;
  for (let i = 0; i < digN; i++) {
    const cx2 = i * digCol;
    const f = lidTopAt(cx2);
    const up = f !== Infinity && sandH[i] >= f - 1.4;
    if (up && run < 0) run = cx2;
    if (!up && run >= 0) { fctx.rect(run - 1, 0, cx2 - run + 2, H); run = -1; }
  }
  if (run >= 0) fctx.rect(run - 1, 0, W - run + 2, H);
  fctx.clip();
  const wood = fctx.createLinearGradient(0, G.lidY - G.lidR * 0.20, 0, G.lidY + G.lidR * 0.6);
  wood.addColorStop(0, "#7a5530");
  wood.addColorStop(0.45, "#54391f");
  wood.addColorStop(1, "#2d1e10");
  fctx.fillStyle = wood;
  fctx.beginPath();
  fctx.moveTo(G.lidX - G.lidR, G.lidY + G.lidR * 0.46);
  for (let k = -1; k <= 1.0001; k += 0.04) {
    fctx.lineTo(G.lidX + k * G.lidR, lidTopAt(G.lidX + k * G.lidR));
  }
  fctx.lineTo(G.lidX + G.lidR, G.lidY + G.lidR * 0.46);
  fctx.closePath(); fctx.fill();
  /* planks, and the iron that holds them */
  fctx.strokeStyle = "rgba(18,11,5,0.42)";
  fctx.lineWidth = Math.max(1, G.lidR * 0.014);
  for (let k = -0.8; k < 0.85; k += 0.22) {
    const x2 = G.lidX + k * G.lidR;
    fctx.beginPath();
    fctx.moveTo(x2, lidTopAt(x2)); fctx.lineTo(x2, G.lidY + G.lidR * 0.46);
    fctx.stroke();
  }
  fctx.fillStyle = "#403830";
  for (const k of [-0.62, 0.62]) {
    const x2 = G.lidX + k * G.lidR;
    fctx.fillRect(x2 - G.lidR * 0.04, lidTopAt(x2) - 1, G.lidR * 0.08, G.lidR * 0.46);
  }
  /* morning coming down into the hole and catching the top of it */
  const sun2 = fctx.createLinearGradient(0, G.lidY - G.lidR * 0.20, 0, G.lidY + G.lidR * 0.22);
  sun2.addColorStop(0, "rgba(255,224,170,0.34)");
  sun2.addColorStop(1, "rgba(255,214,150,0)");
  fctx.fillStyle = sun2;
  fctx.beginPath();
  fctx.moveTo(G.lidX - G.lidR, G.lidY + G.lidR * 0.46);
  for (let k = -1; k <= 1.0001; k += 0.06) fctx.lineTo(G.lidX + k * G.lidR, lidTopAt(G.lidX + k * G.lidR));
  fctx.lineTo(G.lidX + G.lidR, G.lidY + G.lidR * 0.46);
  fctx.closePath(); fctx.fill();

  /* damp sand still lying in the seams */
  fctx.fillStyle = "rgba(150,124,86,0.28)";
  for (let k = -0.9; k < 0.95; k += 0.11) {
    const x2 = G.lidX + k * G.lidR;
    fctx.fillRect(x2 - G.lidR * 0.05, lidTopAt(x2) - 1, G.lidR * 0.10, 2.5 + Math.sin(k * 9) * 1.4);
  }
  /* it goes down into sand again — a dark seam so it does not read as a
     hole cut through the world */
  const bg2 = fctx.createLinearGradient(0, G.lidY + G.lidR * 0.30, 0, G.lidY + G.lidR * 0.62);
  bg2.addColorStop(0, "rgba(30,20,10,0)");
  bg2.addColorStop(0.55, "rgba(28,19,10,0.85)");
  bg2.addColorStop(1, "rgba(70,54,34,0)");
  fctx.fillStyle = bg2;
  fctx.fillRect(G.lidX - G.lidR, G.lidY + G.lidR * 0.30, G.lidR * 2, G.lidR * 0.34);
  fctx.restore();
  }

  /* grain — a beach is not a flat fill, and at this size the eye wants tooth */
  if (!sandTile) buildSandTile();
  if (!sandPat) sandPat = fctx.createPattern(sandTile, "repeat");
  fctx.save();
  fctx.beginPath();
  fctx.moveTo(-2, Math.min(sandBase[0], sandH[0]));
  for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, Math.min(sandBase[i], sandH[i]));
  fctx.lineTo(W + 2, Math.min(sandBase[digN - 1], sandH[digN - 1]));
  fctx.lineTo(W + 2, H + 2); fctx.lineTo(-2, H + 2);
  fctx.closePath();
  fctx.clip();
  fctx.globalAlpha = 0.55;
  fctx.fillStyle = sandPat;
  fctx.fillRect(0, G.top - 40, W, H - G.top + 40);
  fctx.globalAlpha = 1;
  /* wind ripples, but only where the sand has not been turned over */
  fctx.strokeStyle = "rgba(160,132,88,0.22)";
  fctx.lineWidth = 1;
  for (let r = 0; r < 9; r++) {
    const off = 12 + r * (H - G.top) * 0.105;
    fctx.beginPath();
    let pen = false;
    for (let i = 0; i < digN; i += 2) {
      const cx2 = i * digCol;
      if (sandH[i] > sandBase[i] + 3) { pen = false; continue; }
      const y = sandH[i] + off + Math.sin(cx2 * 0.035 + r * 1.7) * (2 + r * 0.5);
      if (!pen) { fctx.moveTo(cx2, y); pen = true; } else fctx.lineTo(cx2, y);
    }
    fctx.stroke();
  }
  fctx.restore();

  /* The X. You have just followed a map with an X on it to this beach, and
     the beach used to arrive with no mark on it at all — a thousand pixels
     of identical sand and a chest buried in the middle of it with nothing to
     say so. On a phone you tend to dig in the middle anyway. On a desktop
     there is three times as much beach to miss, which is why this read as
     impossible rather than merely hard.

     So the X came with you: scratched in the sand, where it was on the
     paper, and it goes as you dig it away. */
  {
    const mx = G.lidX, my = sandH[Math.max(0, Math.min(digN - 1, Math.round(mx / digCol)))];
    const gone = Math.min(1, lidSeen * 2.6 + lidClear);
    if (gone < 1) {
      const xr = G.lidR * 0.30;
      const puls = 0.5 + 0.5 * Math.sin(digT * 2.0);
      /* a stronger pulse if they have not started, then it settles down */
      const call = digT > 3.5 && lidSeen < 0.02 ? 0.30 * puls : 0.10 * puls;
      const a = (1 - gone) * (0.34 + call);
      fctx.save();
      fctx.translate(mx, my + xr * 1.05);
      fctx.scale(1, 0.46);                       /* it lies on the ground */
      fctx.strokeStyle = `rgba(126,92,52,${a.toFixed(3)})`;
      fctx.lineWidth = Math.max(3, G.lidR * 0.055);
      fctx.lineCap = "round";
      fctx.beginPath();
      fctx.moveTo(-xr, -xr); fctx.lineTo(xr, xr);
      fctx.moveTo(xr, -xr); fctx.lineTo(-xr, xr);
      fctx.stroke();
      /* the light catching the edge of the scratch */
      fctx.strokeStyle = `rgba(255,244,214,${(a * 0.5).toFixed(3)})`;
      fctx.lineWidth = Math.max(1.4, G.lidR * 0.022);
      fctx.beginPath();
      fctx.moveTo(-xr, -xr - 2); fctx.lineTo(xr, xr - 2);
      fctx.moveTo(xr, -xr - 2); fctx.lineTo(-xr, xr - 2);
      fctx.stroke();
      fctx.restore();
    }
  }

  /* a rim of shadow where the pit wall meets the light */
  fctx.strokeStyle = "rgba(70,48,24,0.30)";
  fctx.lineWidth = 2;
  fctx.beginPath();
  for (let i = 0; i < digN; i++) {
    if (sandH[i] <= sandBase[i] + 0.5) { fctx.moveTo(i * digCol, sandH[i]); continue; }
    fctx.lineTo(i * digCol, sandBase[i]);
  }
  fctx.stroke();

  /* the surface itself, catching the low sun */
  fctx.strokeStyle = "rgba(255,246,222,0.55)";
  fctx.lineWidth = 1.6;
  fctx.beginPath();
  fctx.moveTo(-2, sandH[0] - 1);
  for (let i = 1; i < digN; i++) fctx.lineTo(i * digCol, sandH[i] - 1);
  fctx.stroke();

  /* ---- grains in the air ---- */
  fctx.fillStyle = "#d9bd8c";
  for (let i = grains.length - 1; i >= 0; i--) {
    const g2 = grains[i];
    g2.vy += 1500 * dt;
    g2.x += g2.vx * dt; g2.y += g2.vy * dt;
    g2.life -= dt * 0.9;
    const col = Math.max(0, Math.min(digN - 1, Math.round(g2.x / digCol)));
    if (g2.life <= 0 || g2.y > sandH[col]) {
      if (g2.y > sandH[col] && g2.y < H) sandH[col] -= 0.35;   /* it lands somewhere */
      grains.splice(i, 1); continue;
    }
    fctx.globalAlpha = Math.min(1, g2.life * 1.4);
    fctx.fillRect(g2.x, g2.y, g2.s, g2.s);
  }
  fctx.globalAlpha = 1;

  if (digPhase === 2) drawLift(dt, G);
}

/* --- the shovel --- */
/* Where the sand actually is under a given x, taking the highest point the
   blade would touch across its width. */
function sandUnder(x) {
  if (!sandH) return null;
  const span = Math.max(2, Math.round(Math.max(30, 48 * UIS) / digCol));
  const c = Math.max(0, Math.min(digN - 1, Math.round(x / digCol)));
  let lo = -1e9;
  for (let i = c - span; i <= c + span; i++)
    if (i >= 0 && i < digN) lo = Math.max(lo, sandH[i]);
  return lo > -1e8 ? lo : null;
}

/* THE BUG THIS FIXES, because it is worth writing down: the blade was
   ignored if it sat more than about sixty pixels above the sand, and digging
   is the act of moving the sand DOWN and away from where your hand is. So
   you got one bite, the hole dropped out from under the shovel, and every
   stroke after that was through thin air. On a phone you chase the hole with
   your finger without thinking about it. On a mouse it read as broken, and
   it was.

   The blade goes where the sand is now, not where your hand was when you
   started. Sweep anywhere over the beach and it bites. */
function digBlade(e) {
  const G = digGeom();
  const floorY = sandUnder(e.clientX);
  if (floorY === null) return null;
  if (e.clientY < G.top - (G.H - G.top) * 0.30) return null;   /* that is sky */
  return Math.max(e.clientY, floorY - 4);
}

function digPointer(e) {
  if (digPhase !== 1) return;
  const by = digBlade(e);
  const sh = document.getElementById("shovel");
  /* the shovel rests on the sand, so you can see it is in contact */
  if (sh) { sh.style.left = e.clientX + "px"; sh.style.top = (by === null ? e.clientY : by) + "px"; }
  if (!digging || by === null) return;
  const dx = e.clientX - digging.x;
  digAt(e.clientX, by, dx, Math.min(0.05, Math.max(0.008, (performance.now() - digging.t) / 1000)));
  digging = { x: e.clientX, y: by, t: performance.now() };
  if (e.cancelable) e.preventDefault();
}
window.addEventListener("pointerdown", (e) => {
  if (digPhase !== 1) return;
  /* Every pull on this site advances on a tap. A tap anywhere on the beach
     takes a shovelful out of it — it used to do that only if you happened to
     press on the buried lid, which nobody can see. */
  const by = digBlade(e);
  if (by !== null) {
    /* A press is one shovelful, and a shovelful is a scoop across the width
       of the blade — not a poke at one column. Pressing used to clear a
       narrow slot in the middle of a lid three blades wide, so the sand
       either side slumped straight back into it and you could press all day
       without ever uncovering anything. */
    const R = Math.max(30, 48 * UIS);
    for (let k = -2; k <= 2; k++) {
      const x = e.clientX + k * R * 0.62;
      const y2 = digBlade({ clientX: x, clientY: e.clientY });
      if (y2 !== null) digAt(x, y2, k * 12, 0.042);
    }
  }
  digging = { x: e.clientX, y: by === null ? e.clientY : by, t: performance.now() };
  const sh = document.getElementById("shovel");
  if (sh) sh.classList.add("dig");
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", digPointer, { passive: false });
window.addEventListener("pointerup", () => {
  digging = null;
  const sh = document.getElementById("shovel");
  if (sh) sh.classList.remove("dig");
});

/* --- sound --- */
function scrape(v, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastScrape < 0.055) return;
  lastScrape = t0;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  s.playbackRate.value = 0.7 + Math.random() * 0.6;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2400 + Math.random() * 2600; bp.Q.value = 0.9;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.035 * (0.4 + v), t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
  s.connect(bp); bp.connect(g); g.connect(at(px) || BUS);
  s.start(t0); s.stop(t0 + 0.16);
}

let lastThud = 0;
function thud() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastThud < 0.16) return;
  lastThud = t0;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(190, t0);
  o.frequency.exponentialRampToValueAtTime(74, t0 + 0.14);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.14, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  o.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.24);
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1800;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.05, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
  s.connect(hp); hp.connect(g2); g2.connect(BUS);
  s.start(t0); s.stop(t0 + 0.1);
}

function digWhoosh() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.setValueAtTime(300, t0);
  bp.frequency.exponentialRampToValueAtTime(2400, t0 + 0.5);
  bp.Q.value = 0.7;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.10, t0 + 0.22);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 1.0);
}

function foundIt() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [196, 261.6, 329.6].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.13);
    g.gain.exponentialRampToValueAtTime(0.05, t0 + i * 0.13 + 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.13); o.stop(t0 + 3.8);
  });
}

/* ================= the lid =================
   The sand is off it. Now it has to be opened, and it is held by an iron
   hasp with a pin through it — pull the pin, then lift. The lid swings on
   its hinges, the last of the sand slides off it, and what is inside is
   light. */
let pinOut = 0, pinGrab = null, lidLift = 0, liftGrab = null, liftT = -1, whiteOut = 0;

function hasp(G) {
  const y = lidTopAt(G.lidX);
  return { x: G.lidX, y: y + G.lidR * 0.10, r: Math.max(22, G.lidR * 0.26) };
}

function drawLift(dt, G) {
  const W = window.innerWidth, H = window.innerHeight;
  if (liftT < 0) liftT = 0; else liftT += dt;
  const ready = liftT > 1.2;

  /* the opening under the lid, and the light in it */
  const open = lidLift;
  if (open > 0.004) {
    const cx = G.lidX, top = lidTopAt(cx);
    fctx.save();
    /* the mouth */
    const ry = G.lidR * 0.10 + open * G.lidR * 0.18;
    const mg = fctx.createRadialGradient(cx, top + G.lidR * 0.06, 0,
                                         cx, top + G.lidR * 0.06, G.lidR * 0.86);
    mg.addColorStop(0, `rgba(${255},${228 - 40 * (1 - open) | 0},${168 - 60 * (1 - open) | 0},${(0.10 + 0.85 * open).toFixed(3)})`);
    mg.addColorStop(0.55, `rgba(120,78,32,${(0.30 + 0.30 * open).toFixed(3)})`);
    mg.addColorStop(1, "#150d06");
    fctx.fillStyle = mg;
    fctx.beginPath();
    fctx.ellipse(cx, top + G.lidR * 0.06, G.lidR * 0.86, ry, 0, 0, 6.3);
    fctx.fill();
    /* light coming up out of it, widening as it opens */
    fctx.globalCompositeOperation = "lighter";
    const rise = H * (0.20 + 0.80 * open);
    const spread = G.lidR * (0.45 + 1.9 * open);
    const a = 0.42 * open;
    const N = 26;
    for (let i = 0; i < N; i++) {
      const u0 = i / N * 2 - 1, u1 = (i + 1) / N * 2 - 1;
      const fall = Math.pow(Math.cos(((u0 + u1) / 2) * Math.PI / 2), 1.6);
      const lg2 = fctx.createLinearGradient(cx, top, cx, top - rise);
      lg2.addColorStop(0, `rgba(255,240,202,${(a * fall).toFixed(4)})`);
      lg2.addColorStop(0.40, `rgba(255,216,146,${(a * fall * 0.40).toFixed(4)})`);
      lg2.addColorStop(1, "rgba(255,198,112,0)");
      fctx.fillStyle = lg2;
      fctx.beginPath();
      fctx.moveTo(cx + u0 * G.lidR * 0.74, top);
      fctx.lineTo(cx + u1 * G.lidR * 0.74, top);
      fctx.lineTo(cx + u1 * spread * 1.55, top - rise);
      fctx.lineTo(cx + u0 * spread * 1.55, top - rise);
      fctx.closePath(); fctx.fill();
    }
    /* motes turning over in the beam */
    fctx.fillStyle = `rgba(255,244,214,${(0.5 * open).toFixed(3)})`;
    for (let i = 0; i < 26; i++) {
      const t = ((digT * (0.10 + (i % 5) * 0.035) + i * 0.137) % 1);
      const yy = top - t * rise;
      const xx = cx + Math.sin(digT * 0.6 + i * 2.3) * spread * t * 1.2;
      const s = 1 + (1 - t) * 1.8;
      fctx.globalAlpha = (1 - t) * open;
      fctx.fillRect(xx, yy, s, s);
    }
    fctx.globalAlpha = 1;
    fctx.restore();
  }

  /* the lid itself, swinging back on its hinges */
  const cx = G.lidX, hy = lidTopAt(cx + G.lidR * 0.98);
  fctx.save();
  fctx.translate(cx + G.lidR * 0.92, hy);
  fctx.rotate(lidLift * 1.55);
  fctx.translate(-(cx + G.lidR * 0.92), -hy);
  /* A chest lid is a curved plank with thickness. Drawing it as the dome
     down to a flat chord made it a sliver the moment it swung up — edge on,
     you have to actually see how thick it is. */
  const TH = Math.max(7, G.lidR * 0.155);
  const wood2 = fctx.createLinearGradient(0, G.lidY - G.lidR * 0.24, 0, G.lidY + TH * 1.4);
  wood2.addColorStop(0, "#9a6d3d");
  wood2.addColorStop(0.45, "#6b4a28");
  wood2.addColorStop(1, "#3c2914");
  fctx.fillStyle = wood2;
  fctx.beginPath();
  for (let k = -1; k <= 1.0001; k += 0.04) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR));
  for (let k = 1; k >= -1.0001; k -= 0.04) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH);
  fctx.closePath(); fctx.fill();
  /* the underside is in its own shadow */
  fctx.fillStyle = "rgba(24,14,6,0.42)";
  fctx.beginPath();
  for (let k = -1; k <= 1.0001; k += 0.06) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH * 0.52);
  for (let k = 1; k >= -1.0001; k -= 0.06) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH);
  fctx.closePath(); fctx.fill();
  /* a highlight along the crown */
  fctx.strokeStyle = "rgba(255,226,178,0.30)";
  fctx.lineWidth = Math.max(1.2, TH * 0.16);
  fctx.beginPath();
  for (let k = -0.94; k <= 0.94; k += 0.05) fctx.lineTo(cx + k * G.lidR, lidTopAt(cx + k * G.lidR) + TH * 0.14);
  fctx.stroke();
  fctx.strokeStyle = "rgba(18,11,5,0.40)";
  fctx.lineWidth = Math.max(1, G.lidR * 0.012);
  for (let k = -0.8; k < 0.85; k += 0.22) {
    const x2 = cx + k * G.lidR;
    fctx.beginPath(); fctx.moveTo(x2, lidTopAt(x2)); fctx.lineTo(x2, lidTopAt(x2) + TH); fctx.stroke();
  }
  fctx.fillStyle = "#4a4038";
  for (const k of [-0.62, 0.62]) {
    const x2 = cx + k * G.lidR;
    fctx.fillRect(x2 - G.lidR * 0.045, lidTopAt(x2) - 1, G.lidR * 0.09, TH + 2);
  }
  /* the hasp, and the pin through it */
  const Hs = hasp(G);
  fctx.strokeStyle = "#5d564c"; fctx.lineWidth = Math.max(2, Hs.r * 0.30);
  fctx.beginPath();
  fctx.arc(Hs.x, Hs.y, Hs.r * 0.62, Math.PI * 0.15, Math.PI * 0.85);
  fctx.stroke();
  const pg = fctx.createLinearGradient(0, Hs.y - Hs.r * 0.2, 0, Hs.y + Hs.r * 0.2);
  pg.addColorStop(0, "#b9b2a6"); pg.addColorStop(0.5, "#7d766a"); pg.addColorStop(1, "#4a443b");
  fctx.fillStyle = pg;
  fctx.fillRect(Hs.x - Hs.r * 1.1 + pinOut * Hs.r * 2.6, Hs.y - Hs.r * 0.17,
                Hs.r * 2.2, Hs.r * 0.34);
  if (ready && pinOut < 1) {
    const p2 = 0.5 + 0.5 * Math.sin(digT * 2.6);
    fctx.strokeStyle = `rgba(255,226,170,${(0.24 + 0.36 * p2).toFixed(2)})`;
    fctx.lineWidth = Math.max(2, Hs.r * 0.10);
    fctx.beginPath(); fctx.arc(Hs.x, Hs.y, Hs.r * (1.8 + 0.55 * p2), 0, 6.3); fctx.stroke();
    /* and the pin itself works itself loose, so the eye goes to it */
    fctx.fillStyle = `rgba(255,240,206,${(0.35 + 0.4 * p2).toFixed(2)})`;
    fctx.fillRect(Hs.x + Hs.r * (1.05 + 0.10 * p2), Hs.y - Hs.r * 0.06, Hs.r * 0.5, Hs.r * 0.12);
  }
  fctx.restore();

  /* it floods at the end, and then it fades back — into somewhere else */
  if (lidLift >= 0.995) whiteOut = Math.min(2.4, whiteOut + dt * 0.42);
  if (whiteOut > 1.05 && !winOn && !jellyOn) startWindow();
  if (whiteOut > 0) {
    const a = whiteOut <= 1 ? whiteOut * whiteOut : Math.max(0, 1 - (whiteOut - 1) / 1.2);
    fctx.fillStyle = `rgba(255,250,238,${a.toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
  }
}

/* The whole lid is the target, not a 70px circle on the hasp — you should
   not have to find the pin to grab the pin. */
function liftHit(x, y) {
  const G = digGeom(), Hs = hasp(G);
  if (Math.abs(x - G.lidX) < G.lidR * 1.05 &&
      y > lidTopAt(G.lidX) - G.lidR * 0.55 && y < G.lidY + G.lidR * 0.75) return true;
  return Math.hypot(x - Hs.x, y - Hs.y) < Math.max(Hs.r * 2.4, 54 * UIS);
}
window.addEventListener("pointerdown", (e) => {
  if (digPhase !== 2 || liftT < 1.2 || whiteOut > 0) return;
  if (!liftHit(e.clientX, e.clientY)) return;
  /* Every other pull on this site advances on a tap — the pump, the dot.
     This one only moved on a drag, so a click did nothing at all and the
     chest read as broken. It takes taps now as well as drags. */
  if (pinOut < 1) {
    pinGrab = { x: e.clientX, p0: pinOut };
    pinOut = Math.min(1, pinOut + 0.26);
    pinScrape();
    if (pinOut >= 1) thud();
  } else {
    liftGrab = { y: e.clientY, l0: lidLift };
    lidLift = Math.min(1, lidLift + 0.20);
    creak(lidLift);
  }
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => {
  if (digPhase === 2 && liftT >= 1.2 && !whiteOut)
    finCanvas.style.cursor = liftHit(e.clientX, e.clientY) ? "grab" : "";
  const W = window.innerWidth, H = window.innerHeight;
  if (pinGrab) {
    const np = Math.max(0, Math.min(1, pinGrab.p0 + (e.clientX - pinGrab.x) / (W * 0.11)));
    if (np > pinOut) pinScrape();
    pinOut = Math.max(pinOut, np);
    if (pinOut >= 1) { pinGrab = null; thud(); }
    if (e.cancelable) e.preventDefault();
  } else if (liftGrab) {
    const nl = Math.max(0, Math.min(1, liftGrab.l0 + (liftGrab.y - e.clientY) / (H * 0.34)));
    if (nl > lidLift) creak(nl);
    lidLift = Math.max(lidLift, nl);
    if (e.cancelable) e.preventDefault();
  }
}, { passive: false });
window.addEventListener("pointerup", () => { pinGrab = null; liftGrab = null; });

let lastPin = 0;
function pinScrape() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastPin < 0.08) return;
  lastPin = t0;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 3600 + Math.random() * 2200; bp.Q.value = 9;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.026, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
  s.connect(bp); bp.connect(g); g.connect(BUS);
