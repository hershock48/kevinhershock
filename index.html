<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kevin Hershock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fdfdfb;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;           /* the whole page is ours — no browser gestures */
    overscroll-behavior: none;
  }
  .pumpHit, #tapWheel, #screwWheel, #key, #chest, #dot {
    touch-action: none;           /* circular drags belong to us, not the browser */
  }
  body.shake { animation: bodyshake 0.4s ease-out; }
  @keyframes bodyshake {
    0% { transform: translate(0, 0); }
    15% { transform: translate(7px, -5px); }
    30% { transform: translate(-6px, 4px); }
    45% { transform: translate(5px, 3px); }
    60% { transform: translate(-4px, -3px); }
    78% { transform: translate(3px, 2px); }
    100% { transform: translate(0, 0); }
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6vh;
    transition: opacity 1.4s ease;
  }
  #stage.gone { opacity: 0; pointer-events: none; }
  #heroSvg { width: 100%; height: auto; max-height: 88vh; display: block; }
  #glitter {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #goo {
    position: fixed;
    inset: 0;
    z-index: 8;
    opacity: 0;
    transition: opacity 2.5s ease;
    display: none;
    pointer-events: none;
  }
  #goo.on { opacity: 1; }
  #goo.falling {
    transition: transform 1.3s ease-in, opacity 1.1s ease;
    transform: translateY(90px);
    opacity: 0;
  }
  #glue {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 7;
  }
  #veil {
    position: fixed;
    inset: 0;
    background: #0f0e13;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.3s ease;
  }
  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,0.11) 100%);
  }
  #grain {
    position: fixed;
    inset: -80px;
    pointer-events: none;
    z-index: 41;
    opacity: 0.55;
    animation: graindance 0.7s steps(8) infinite;
  }
  @keyframes graindance {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-28px, 16px); }
    50% { transform: translate(14px, -32px); }
    75% { transform: translate(-10px, -12px); }
    100% { transform: translate(22px, 24px); }
  }
  .dotring {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid;
    pointer-events: none;
    z-index: 8;
    animation: ringout 0.7s ease-out forwards;
  }
  @keyframes ringout {
    from { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    to { opacity: 0; transform: translate(-50%, -50%) scale(1.55); }
  }
  #dot.jelly { animation: dotjelly 0.55s cubic-bezier(.36,.07,.19,.97); }
  @keyframes dotjelly {
    0% { transform: translate(-50%, -50%) scale(1, 1); }
    30% { transform: translate(-50%, -50%) scale(1.1, 0.9); }
    55% { transform: translate(-50%, -50%) scale(0.95, 1.05); }
    78% { transform: translate(-50%, -50%) scale(1.03, 0.98); }
    100% { transform: translate(-50%, -50%) scale(1, 1); }
  }
  .pumpHit { cursor: pointer; }
  .noselect { user-select: none; -webkit-user-select: none; }
  #tap {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    opacity: 0;
    transition: opacity 1.2s ease;
    display: none;
    pointer-events: none;   /* a faded tap must not be secretly grabbable */
  }
  #tap.on { opacity: 1; pointer-events: auto; }
  #tapWheel { cursor: grab; }
  #tapWheel.grabbing { cursor: grabbing; }
  #chest {
    position: fixed;
    bottom: calc(4px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    opacity: 0;
    transition: opacity 1.5s ease;
    display: none;
    cursor: inherit;
  }
  #chest.on { opacity: 1; }
  #chest.shake { animation: chestshake 0.4s ease; }
  @keyframes chestshake {
    0%, 100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% - 7px)); }
    55% { transform: translateX(calc(-50% + 7px)); }
    80% { transform: translateX(calc(-50% - 4px)); }
  }
  /* the lid is animated with the SVG transform attribute (JS tween) —
     CSS transform-origin on scaled inner SVG elements is not reliable
     across browsers and detached the lid on mobile */
  #chest svg, #screw svg { overflow: visible; }
  #tap.on, #screw { cursor: grab; }
  #chestInterior { opacity: 0; transition: opacity 0.4s ease 0.3s; }
  #chest.open #chestInterior { opacity: 1; }
  #key {
    position: fixed;
    z-index: 9;
    display: none;
    cursor: pointer;
  }
  #key.held {
    pointer-events: none;   /* the held key rides along; taps pass through to the chest */
    z-index: 30;
  }
  #broom {
    position: fixed;
    z-index: 30;
    display: none;
    pointer-events: none;
    transform: translate(-30%, -80%);
    animation: broombob 1.6s ease-in-out infinite;
  }
  @keyframes broombob {
    0%, 100% { margin-top: 0; }
    50% { margin-top: 10px; }
  }
  #cork {
    position: fixed;
    z-index: 9;
    display: none;
    transition: transform 1.1s ease;
  }
  #screw {
    position: fixed;
    z-index: 9;
    display: none;
  }
  #screwWheel { cursor: grab; }
  #screwWheel.grabbing { cursor: grabbing; }
  #cork.out { animation: corkbob 2.4s ease-in-out infinite; }
  @keyframes corkbob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }
  #dot {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    border-radius: 50%;
    background: #e63950;
    cursor: pointer;
    z-index: 8;
    display: none;
  }
</style>
</head>
<body>
<div id="stage" class="noselect"></div>
<div id="veil"></div>
<canvas id="glue"></canvas>
<canvas id="glitter"></canvas>
<div id="dot"></div>
<canvas id="goo"></canvas>
<div id="tap">
  <svg width="140" height="120" viewBox="0 0 140 120">
    <rect x="63" y="0" width="14" height="48" rx="2" fill="#8d9296"/>
    <rect x="63" y="0" width="4" height="48" fill="#b9bec4"/>
    <rect x="55" y="44" width="30" height="26" rx="6" fill="#7d8288"/>
    <rect x="58" y="47" width="6" height="20" rx="3" fill="#9aa0a5"/>
    <rect x="66" y="36" width="8" height="10" rx="2" fill="#5f6468"/>
    <rect x="63" y="68" width="14" height="16" fill="#6b7075"/>
    <rect x="60" y="82" width="20" height="9" rx="3" fill="#54585c"/>
    <g id="tapWheel" transform="translate(70 40)">
      <circle r="30" fill="rgba(0,0,0,0)"/>
      <circle r="20" fill="none" stroke="#c0392b" stroke-width="7"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
      <circle r="6" fill="#96281b"/>
    </g>
  </svg>
</div>
<div id="cork">
  <svg width="34" height="42" viewBox="0 0 34 42">
    <path d="M8 40 L5 10 Q5 4 17 4 Q29 4 29 10 L26 40 Q26 42 17 42 Q8 42 8 40 Z" fill="#8b5a2b" stroke="#59371a" stroke-width="2"/>
    <ellipse cx="17" cy="8" rx="12" ry="4" fill="#74471f"/>
    <line x1="10" y1="16" x2="11" y2="34" stroke="#59371a" stroke-width="1.4" opacity="0.8"/>
    <line x1="22" y1="14" x2="21" y2="35" stroke="#59371a" stroke-width="1.4" opacity="0.8"/>
    <circle cx="14" cy="24" r="1.3" fill="#5d3a1c"/>
    <circle cx="20" cy="30" r="1" fill="#5d3a1c"/>

<div id="chest">
  <!-- headroom baked into the viewBox: the open lid stays inside the svg,
       so no browser can clip it -->
  <svg width="200" height="200" viewBox="-28 -94 200 200">
    <rect id="chestInterior" x="18" y="34" width="114" height="24" rx="4" fill="#2e1d0e"/>
    <g id="chestLid">
      <path d="M15 52 Q15 12 75 12 Q135 12 135 52 Z" fill="#9a662f" stroke="#5f3d1a" stroke-width="3"/>
      <path d="M33 52 Q33 22 75 20 L75 12 Q15 12 15 52 Z" fill="#8a5a2b" opacity="0.5"/>
      <rect x="28" y="20" width="11" height="32" fill="#d9a441" stroke="#8a6a1e" stroke-width="1.5" transform="rotate(-14 33 36)"/>
      <rect x="111" y="20" width="11" height="32" fill="#d9a441" stroke="#8a6a1e" stroke-width="1.5" transform="rotate(14 117 36)"/>
    </g>
    <rect x="15" y="52" width="120" height="54" rx="8" fill="#8a5a2b" stroke="#5f3d1a" stroke-width="3"/>
    <line x1="15" y1="70" x2="135" y2="70" stroke="#5f3d1a" stroke-width="1.5" opacity="0.6"/>
    <line x1="15" y1="88" x2="135" y2="88" stroke="#5f3d1a" stroke-width="1.5" opacity="0.6"/>
    <rect x="28" y="52" width="11" height="54" fill="#d9a441" stroke="#8a6a1e" stroke-width="1.5"/>
    <rect x="111" y="52" width="11" height="54" fill="#d9a441" stroke="#8a6a1e" stroke-width="1.5"/>
    <rect x="64" y="48" width="22" height="24" rx="4" fill="#e2b84f" stroke="#8a6a1e" stroke-width="2"/>
    <circle cx="75" cy="57" r="3.4" fill="#3a2413"/>
    <rect x="73.4" y="57" width="3.2" height="8" fill="#3a2413"/>
  </svg>
</div>
<div id="broom">
  <svg width="52" height="52" viewBox="0 0 30 30">
    <line x1="26" y1="3" x2="13" y2="19" stroke="#8a5a2b" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M13 19 L3 27 L9 28.5 L15.5 21.5 Z" fill="#d9a44a"/>
    <path d="M15.5 21.5 L9 28.5 L17 29 L18 22.5 Z" fill="#c8923d"/>
    <rect x="11.6" y="17.6" width="7" height="4" rx="1.6" transform="rotate(40 15 19.5)" fill="#a06a2c"/>

</div>
<div id="key">
  <svg width="58" height="28" viewBox="0 0 58 28">
    <circle cx="12" cy="14" r="8.5" fill="none" stroke="#d9a441" stroke-width="5"/>
    <rect x="20" y="11.5" width="28" height="5" rx="2" fill="#d9a441"/>
    <rect x="41" y="15" width="5" height="9" rx="1.5" fill="#d9a441"/>
    <rect x="49" y="15" width="5" height="7" rx="1.5" fill="#d9a441"/>
  </svg>
</div>
<div id="screw">
  <svg width="160" height="160" viewBox="0 0 160 160">
    <g id="screwWheel">
      <circle cx="80" cy="22" r="48" fill="rgba(0,0,0,0)"/>
      <rect x="80" y="17" width="58" height="10" rx="5" fill="#c0392b"/>
      <rect x="132" y="2" width="13" height="40" rx="6.5" fill="#17181a"/>
      <rect x="135" y="5" width="4" height="34" rx="2" fill="#4a4d50"/>
      <circle cx="80" cy="22" r="9" fill="#b8860b" stroke="#8a6a1e" stroke-width="2"/>
      <circle cx="80" cy="22" r="3.4" fill="#8a6a1e"/>
    </g>
    <rect x="74" y="42" width="12" height="12" rx="2" fill="#b8860b"/>
    <rect x="77" y="52" width="6" height="44" rx="2" fill="#d9a441"/>
    <path d="M80 96 L72 103 L88 110 L72 117 L88 124 L72 131 L88 138 L79 145 L80 153"
          fill="none" stroke="#e0b04f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 96 L72 103 L88 110 L72 117 L88 124 L72 131 L88 138 L79 145 L80 153"
          fill="none" stroke="#8a6a1e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(1 1.5)" opacity="0.6"/>
  </svg>
</div>
<div id="flash"></div>
<div id="vignette"></div>
<div id="grain"></div>

<script>
"use strict";

/* ================= letter definitions =================
   Monoline "balloon" letters. Coordinates: y 0 (top) to 100 (baseline).
   Each letter = one or more subpaths (each subpath is one thin balloon). */
const LETTERS = {
  K: { w: 58, subs: ["M10 96 L10 4", "M52 4 L14 50 L52 96"] },
  E: { w: 52, subs: ["M48 4 L12 4 L12 96 L48 96", "M12 50 L40 50"] },
  V: { w: 60, subs: ["M8 4 L30 96 L52 4"] },
  I: { w: 20, subs: ["M10 4 L10 96"] },
  N: { w: 60, subs: ["M10 96 L10 4 L50 96 L50 4"] },
  H: { w: 58, subs: ["M10 4 L10 96", "M48 4 L48 96", "M10 50 L48 50"] },
  R: { w: 56, subs: ["M12 96 L12 4 L32 4 C52 4 52 48 32 48 L12 48", "M31 48 L50 96"] },
  S: { w: 52, subs: ["M44 13 C37 1 13 0 11 20 C8 41 44 44 46 68 C48 92 17 103 8 83"] },
  O: { w: 60, subs: ["M30 4 C7 4 7 96 30 96 C53 96 53 4 30 4 Z"] },
  C: { w: 54, subs: ["M46 15 C35 -1 10 8 10 50 C10 92 35 101 46 85"] },
};
const PALETTE = ["#e63950","#ff8c00","#ffcf00","#00b869","#0f7fb5","#8b46d9",
                 "#ff5d9e","#00a8e8","#d92645","#6cb520","#e8a013","#2aa8b8","#a95fe0"];
const SPACE_W = 34;
const LETTER_GAP = 10;

/* latex color helper: amt>0 lighten toward white, amt<0 darken */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/* ================= state ================= */
const PUMP_STEP = 0.085;
const EXPLODE_AT = 1.8;        // strain limit — burst
const IDLE_MS = 950;
const DECAY_PER_S = 0.30;

let target = 0;
let inf = 0;
let vel = 0;
let lastPump = -1e9;
let exploded = false;
let pumpPressT = 0;
let letters = [];
let layoutW = 0, layoutH = 0;
let heroSvg = null, pumpPlunger = null, hoseInfo = null;
let UIS = 1;   // global prop scale: 1.0 at ~laptop size, bigger on TVs, smaller on phones
const stage = document.getElementById("stage");
const flashEl = document.getElementById("flash");
const veilEl = document.getElementById("veil");

/* ================= layout / svg build ================= */
function currentLines() {
  return (window.innerWidth < 720)
    ? ["KEVIN", "HERSHOCK"]
    : ["KEVIN HERSHOCK"];
}

function lineWidth(line) {
  let w = 0;
  for (const ch of line) {
    w += (ch === " ") ? SPACE_W : LETTERS[ch].w + LETTER_GAP;
  }
  return w;
}

function buildSvg() {
  const lines = currentLines();
  const PUMP_ZONE = 165;
  const widest = Math.max(...lines.map(lineWidth));
  const W = PUMP_ZONE + widest + 50;
  const lineGap = 140;
  const firstBase = 190;
  const lastBase = firstBase + (lines.length - 1) * lineGap;
  const H = lastBase + 45;
  layoutW = W; layoutH = H;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", "heroSvg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMin meet");

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML =
    `<linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0" stop-color="#7d8288"/>
       <stop offset="0.28" stop-color="#d7dade"/>
       <stop offset="0.5" stop-color="#f2f4f5"/>
       <stop offset="0.72" stop-color="#b9bec3"/>
       <stop offset="1" stop-color="#6b7075"/>
     </linearGradient>
     <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0" stop-color="#8d9296"/>
       <stop offset="0.45" stop-color="#d3d6d9"/>
       <stop offset="1" stop-color="#63676c"/>
     </linearGradient>
     <filter id="soft" x="-50%" y="-50%" width="200%" height="300%">
       <feGaussianBlur stdDeviation="3"/>
     </filter>`;
  svg.appendChild(defs);

  /* soft ground shadows — light comes from the upper left, matching the
     balloon speculars, so shadows fall just right of each letter */
  const shadowGroup = document.createElementNS(NS, "g");
  shadowGroup.setAttribute("filter", "url(#soft)");
  svg.appendChild(shadowGroup);

  const mkPath = (d) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    return p;
  };

  letters = [];
  let ci = 0;
  lines.forEach((line, li) => {
    const base = firstBase + li * lineGap;
    let x = PUMP_ZONE + (widest - lineWidth(line)) / 2;
    for (const ch of line) {
      if (ch === " ") { x += SPACE_W; continue; }
      const def = LETTERS[ch];
      const g = document.createElementNS(NS, "g");
      const color = PALETTE[ci % PALETTE.length];

      /* two-phase latex tube: a thin dull uninflated "tail" layer, plus a
         5-layer glossy stack for the inflated phase (dark rim, latex body,
         light band, broad specular streak, hard hairline streak) */
      const dark = [], main = [], tint = [], gloss = [], gloss2 = [], tail = [];
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, -0.30)); p.setAttribute("opacity", "0.95"); g.appendChild(p); tail.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, -0.32)); g.appendChild(p); dark.push(p); }
      for (const d of def.subs) { const p = mkPath(d); g.appendChild(p); main.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, 0.45)); g.appendChild(p); tint.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", "#ffffff"); g.appendChild(p); gloss.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", "#ffffff"); g.appendChild(p); gloss2.push(p); }

      const shadow = document.createElementNS(NS, "ellipse");
      shadow.setAttribute("cx", x + def.w / 2 + 6);
      shadow.setAttribute("cy", base + 7);
      shadow.setAttribute("rx", def.w * 0.6);
      shadow.setAttribute("ry", 4);
      shadow.setAttribute("fill", "#1a1a18");
      shadow.setAttribute("opacity", "0.05");
      shadowGroup.appendChild(shadow);
      /* glossy latex throws a wash of its own color onto the floor */
      const refl = document.createElementNS(NS, "ellipse");
      refl.setAttribute("cx", x + def.w / 2);
      refl.setAttribute("cy", base + 6);
      refl.setAttribute("rx", def.w * 0.5);
      refl.setAttribute("ry", 3);
      refl.setAttribute("fill", color);
      refl.setAttribute("opacity", "0");
      shadowGroup.appendChild(refl);

      svg.appendChild(g);
      letters.push({
        g, dark, main, tint, gloss, gloss2, tail, shadow, refl,
        subDs: def.subs, subs: null,
        x, base, w: def.w, color,
        phase: Math.random() * Math.PI * 2,
      });
      x += def.w + LETTER_GAP;
      ci++;
    }
  });

  buildPump(svg, NS, firstBase, letters[0], shadowGroup);
  stage.innerHTML = "";
  stage.appendChild(svg);
  heroSvg = svg;
  sampleAll();
  if (hoseInfo) hoseInfo.len = hoseInfo.el.getTotalLength();
}

/* sample every balloon tube into points so it can flop, drape, and fill */
function sampleAll() {
  for (const L of letters) {
    L.subs = L.subDs.map((d, j) => {
      const el = L.dark[j];
      el.setAttribute("d", d);
      const len = el.getTotalLength();
      const N = Math.max(16, Math.min(40, Math.round(len / 7)));
      const pts = [];
      let minX = 1e9, maxX = -1e9;
      for (let i = 0; i < N; i++) {
        const p = el.getPointAtLength(len * i / (N - 1));
        pts.push({ x: p.x, y: p.y });
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
      }
      const closed = /z\s*$/i.test(d);
      const spillLen = Math.min(len * 0.5, L.w * 1.25);
      let spillX = (minX + maxX) / 2 - spillLen / 2;
      spillX = Math.max(-4, Math.min(spillX, L.w + 4 - spillLen));
      return {
        pts, N, closed, spillLen, spillX,
        ground: 95 + Math.random() * 3,
        ampY: 4 + Math.random() * 4,
        humps: 1.5 + Math.random() * 1.6,
        ph1: Math.random() * Math.PI * 2,
        ph2: Math.random() * Math.PI * 2,
      };
    });
  }
}

function buildPump(svg, NS, base, firstLetter, shadowGroup) {
  const px = 62;
  const ground = base + 8;
  const NSrect = (x, y, w, h, rx, fill) => {
    const r = document.createElementNS(NS, "rect");

/* ================= sound (synthesized, no assets) =================
   Every sound routes through one master bus: BUS -> global lowpass
   (underwater muffling) -> compressor -> speakers, with a parallel
   small-room reverb so everything shares the same space. */
let AC = null, noiseBuf = null, BUS = null, GLP = null, REVG = null;
let hissNode = null, swellNode = null;
function audio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    if (!BUS) {
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      comp.attack.value = 0.003; comp.release.value = 0.25;
      comp.connect(AC.destination);   // master chain terminus — NOT the bus
      GLP = AC.createBiquadFilter();
      GLP.type = "lowpass"; GLP.frequency.value = 19000;
      GLP.connect(comp);
      BUS = AC.createGain();
      BUS.gain.value = 0.9;
      BUS.connect(GLP);
      /* small room */
      const rev = AC.createConvolver();
      const len = (AC.sampleRate * 0.9) | 0;
      const ir = AC.createBuffer(2, len, AC.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.exp(-6 * i / len);
        }
      }
      rev.buffer = ir;
      REVG = AC.createGain(); REVG.gain.value = 0.14;
      BUS.connect(rev); rev.connect(REVG); REVG.connect(GLP);
    }
    return AC;
  } catch (e) { return null; }
}
/* the deeper the water, the more the world muffles */
function setUnderwater(v) {
  if (!AC || !GLP) return;
  const t = AC.currentTime;
  const k = Math.max(0, Math.min(1, (v - 0.15) / 0.55));
  GLP.frequency.setTargetAtTime(19000 - (19000 - 680) * k, t, 0.25);
  REVG.gain.setTargetAtTime(0.14 + k * 0.12, t, 0.3);
}
/* faint air-room hiss while the balloons are alive */
function startHiss() {
  const ac = audio(); if (!ac || hissNode) return;
  const src = ac.createBufferSource(); src.buffer = noise(ac); src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
  const g = ac.createGain(); g.gain.value = 0.012;
  src.connect(lp); lp.connect(g); g.connect(BUS);
  src.start();
  hissNode = { src, g };
}
function stopHiss() {
  if (!hissNode || !AC) return;
  hissNode.g.gain.setTargetAtTime(0, AC.currentTime, 0.2);
  const h = hissNode; hissNode = null;
  setTimeout(() => { try { h.src.stop(); } catch (e) {} }, 800);
}
/* slow sub swells once the room is deep */
function updateSwell(v) {
  if (!AC) return;
  if (v > 0.5 && !swellNode) {
    const osc = AC.createOscillator(); osc.type = "sine"; osc.frequency.value = 42;
    const g = AC.createGain(); g.gain.value = 0.016;
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.11;
    const lg = AC.createGain(); lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(g.gain);
    osc.connect(g); g.connect(BUS);
    osc.start(); lfo.start();
    swellNode = { osc, lfo, g };
  } else if (v < 0.3 && swellNode) {
    swellNode.g.gain.setTargetAtTime(0, AC.currentTime, 0.4);
    const s = swellNode; swellNode = null;
    setTimeout(() => { try { s.osc.stop(); s.lfo.stop(); } catch (e) {} }, 1600);
  }
}
function noise(ac) {
  if (noiseBuf) return noiseBuf;
  const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noiseBuf = b;
  return b;
}
function pumpSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* the sound climbs with the air: every pump sits a little higher than
     the last, so you can hear yourself going somewhere */
  const level = Math.max(0, Math.min(1, inf / EXPLODE_AT));
  const src = ac.createBufferSource(); src.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(550 + 1150 * level, t0);
  bp.frequency.exponentialRampToValueAtTime(240 + 520 * level, t0 + 0.16);
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(0.34 + 0.16 * level, t0 + 0.035);
  gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
  src.connect(bp); bp.connect(gn); gn.connect(BUS);
  src.start(t0); src.stop(t0 + 0.2);
  /* a soft note under the whoosh, walking up a pentatonic ladder —
     the last steps before the limit go a half-step sour (dread) */
  const PENT = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24, 27];
  let semis = PENT[Math.min(PENT.length - 1, Math.floor(level * PENT.length))];
  if (level > 0.86) semis += 1;
  const f = 165 * Math.pow(2, semis / 12);
  const osc = ac.createOscillator(); osc.type = "triangle";
  osc.frequency.setValueAtTime(f, t0);
  osc.frequency.exponentialRampToValueAtTime(f * 1.08, t0 + 0.09);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.19);
  osc.connect(g2); g2.connect(BUS);
  osc.start(t0); osc.stop(t0 + 0.2);
  /* a quieter octave above for shine */
  const osc2 = ac.createOscillator(); osc2.type = "sine";
  osc2.frequency.setValueAtTime(f * 2, t0);
  osc2.frequency.exponentialRampToValueAtTime(f * 2.16, t0 + 0.09);
  const g3 = ac.createGain();
  g3.gain.setValueAtTime(0.0001, t0);
  g3.gain.exponentialRampToValueAtTime(0.09, t0 + 0.02);
  g3.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
  osc2.connect(g3); g3.connect(BUS);
  osc2.start(t0); osc2.stop(t0 + 0.17);
}
/* past working size: a rising tension drone that tightens toward the pop */
let drone = null;
function updateDrone(over) {
  if (!AC) return;
  const t = AC.currentTime;
  if (over > 0.02 && !exploded) {
    if (!drone) {
      const osc = AC.createOscillator(); osc.type = "sawtooth";
      const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
      const g = AC.createGain(); g.gain.value = 0;
      osc.connect(lp); lp.connect(g); g.connect(BUS);
      osc.start();
      drone = { osc, lp, g };
    }
    drone.osc.frequency.setTargetAtTime(110 + over * 360, t, 0.08);
    drone.lp.frequency.setTargetAtTime(550 + over * 1500, t, 0.1);
    drone.g.gain.setTargetAtTime(0.022 + over * 0.115, t, 0.12);
  } else if (drone) {
    drone.g.gain.setTargetAtTime(0, t, 0.12);
  }
}
function squeakSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const over = Math.max(0, inf - 1);
  const f0 = 240 + over * 520 + Math.random() * 180;
  const osc = ac.createOscillator(); osc.type = "sawtooth";
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.linearRampToValueAtTime(f0 * 1.5, t0 + 0.07);
  osc.frequency.linearRampToValueAtTime(f0 * 0.85, t0 + 0.15);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(0.05, t0 + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
  osc.connect(lp); lp.connect(gn); gn.connect(BUS);
  osc.start(t0); osc.stop(t0 + 0.18);
}
function popSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* everything routes through a compressor so it can be LOUD without shredding */
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  comp.attack.value = 0.001; comp.release.value = 0.2;
  comp.connect(BUS);
  /* crack — the latex letting go */
  const s1 = ac.createBufferSource(); s1.buffer = noise(ac);
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1500;
  const g1 = ac.createGain();
  g1.gain.setValueAtTime(1.4, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
  s1.connect(hp); hp.connect(g1); g1.connect(comp);
  s1.start(t0); s1.stop(t0 + 0.07);
  /* snap layer — a second, higher crack right on top */
  const s3 = ac.createBufferSource(); s3.buffer = noise(ac);
  const bp2 = ac.createBiquadFilter(); bp2.type = "bandpass"; bp2.frequency.value = 4200; bp2.Q.value = 1.2;
  const g4 = ac.createGain();
  g4.gain.setValueAtTime(1.2, t0);
  g4.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);
  s3.connect(bp2); bp2.connect(g4); g4.connect(comp);
  s3.start(t0); s3.stop(t0 + 0.05);
  /* body — the air getting out all at once */
  const s2 = ac.createBufferSource(); s2.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(4200, t0);
  lp.frequency.exponentialRampToValueAtTime(90, t0 + 0.7);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(1.1, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.75);
  s2.connect(lp); lp.connect(g2); g2.connect(comp);
  s2.start(t0); s2.stop(t0 + 0.8);
  /* impact punch */
  const sq = ac.createOscillator(); sq.type = "square";
  sq.frequency.setValueAtTime(150, t0);
  sq.frequency.exponentialRampToValueAtTime(55, t0 + 0.09);
  const g5 = ac.createGain();
  g5.gain.setValueAtTime(0.5, t0);
  g5.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
  sq.connect(g5); g5.connect(comp);
  sq.start(t0); sq.stop(t0 + 0.11);
  /* deep boom */
  const osc = ac.createOscillator(); osc.type = "sine";
  osc.frequency.setValueAtTime(75, t0);
  osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.55);
  const g3 = ac.createGain();
  g3.gain.setValueAtTime(1.0, t0);
  g3.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
  osc.connect(g3); g3.connect(comp);
  osc.start(t0); osc.stop(t0 + 0.62);
  /* long rumble tail under the falling glitter */
  const s4 = ac.createBufferSource(); s4.buffer = noise(ac);
  const lp2 = ac.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.value = 160;
  const g6 = ac.createGain();
  g6.gain.setValueAtTime(0.45, t0 + 0.05);
  g6.gain.exponentialRampToValueAtTime(0.001, t0 + 1.4);
  s4.connect(lp2); lp2.connect(g6); g6.connect(comp);
  s4.start(t0 + 0.05); s4.stop(t0 + 1.45);
  /* glitter shimmer: a drift of tiny high pings while the curtain falls */
  for (let i = 0; i < 34; i++) {
    const at = t0 + 0.15 + Math.random() * 3.4;
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.value = 2600 + Math.random() * 5400;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.035, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.28);
    o.connect(g); g.connect(BUS);
    o.start(at); o.stop(at + 0.3);
  }
}

/* ================= pumping ================= */
function doPump(e) {
  if (e) e.preventDefault();
  if (exploded) return;
  target += PUMP_STEP;
  vel += 0.55;
  lastPump = performance.now();
  pumpPressT = 1;
  if (hoseInfo && hoseInfo.len) hoseInfo.pulses.push(0);
  startHiss();
  pumpSound();
  if (inf > 1) squeakSound();     // latex creaks past its working size
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") doPump(e);
});

/* iOS Safari ignores touch-action for double-tap smart zoom in places —
   kill it directly. All interaction here is pointerdown-driven, so
   suppressing the synthesized events after a fast second tap is safe. */
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const n = Date.now();
  if (n - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = n;
}, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ================= animation loop ================= */
const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
let prevT = performance.now();

function frame(now) {
  /* clamp at ~11fps so weak devices drop frames instead of running slow-motion */
  const dt = Math.min(0.09, (now - prevT) / 1000);
  prevT = now;

  if (!exploded) {
    if (now - lastPump > IDLE_MS && target > 0) {
      target = Math.max(0, target - DECAY_PER_S * dt);
    }
    const k = 60, damp = 8.5;
    vel += (target - inf) * k * dt;
    vel *= Math.exp(-damp * dt);
    inf += vel * dt;
    if (inf < 0) { inf = 0; vel = 0; }

    if (inf >= EXPLODE_AT) { explode(); }
    else { renderLetters(now); renderPump(dt); updateDrone(Math.max(0, inf - 1)); }
  }

  tickParticles(dt * timeScale);
  if (tapShown) { waterStep(dt); waterDraw(); updateScrew(dt); updateLid(dt); gooFrame(dt); }
  requestAnimationFrame(frame);
}

/* Two-phase balloon physics (like a real 260): behind the fill front the
   tube is at full working diameter; ahead of it the latex is a thin limp
   tail. Extra air LENGTHENS the inflated phase — the front advances.
   Overpumping stretches the whole thing: it swells (decelerating — strain
   stiffening), pales (the membrane thins), and shakes (tension climbs). */
function renderLetters(now) {
  const p = Math.min(1, inf);
  const over = Math.max(0, inf - 1);
  const f = p * 1.38;
  const ts = now / 1000;
  const overN = 1 - Math.exp(-over * 2.0);
  const thin = 0.30 * overN;

  for (const L of letters) {
    if (!L.subs) continue;
    let mSum = 0;

    for (let j = 0; j < L.subs.length; j++) {
      const S = L.subs[j];
      const iF = Math.min(S.N - 1, Math.floor((f - 0.165) * (S.N - 1)));
      let dIn = "", dTail = "", sum = 0;
      const tailStart = Math.max(0, iF);
      for (let i = 0; i < S.N; i++) {
        const t = i / (S.N - 1);
        const li = clamp01((f - t) / 0.33);
        const sm = li * li * (3 - 2 * li);
        sum += sm;
        const P = S.pts[i];
        const flop = 1 - sm;
        let xF = S.spillX + t * S.spillLen
                 + Math.sin(t * 6.3 + S.ph1 + ts * 1.1) * 2.5 * flop;
        let yF = S.ground
                 - Math.abs(Math.sin(t * Math.PI * S.humps + S.ph2)) * S.ampY
                 + Math.sin(ts * 1.4 + S.ph1 + t * 5) * 1.4 * flop;
        /* the first balloon's mouth is tied onto the pump nozzle */
        if (L === letters[0] && j === 0) {
          const pin = Math.max(0, 1 - t / 0.22);
          const P0 = S.pts[0];
          xF += (P0.x - xF) * pin;
          yF += (P0.y - yF) * pin;
        }
        const X = xF + (P.x - xF) * sm;
        const Y = yF + (P.y - yF) * sm;
        const pt = X.toFixed(1) + " " + Y.toFixed(1);
        if (i <= iF) dIn += (i ? "L" : "M") + pt;
        if (i >= tailStart) dTail += (i > tailStart ? "L" : "M") + pt;
      }
      const m = sum / S.N;
      mSum += m;
      const hasIn = iF >= 1;
      const hasTail = iF < S.N - 1;
      if (S.closed && !hasTail) dIn += "Z";

      /* working diameter arrives almost at once (pressure peaks early),
         then only overpumping swells it further */
      const Ws = 23 * (0.7 + 0.3 * clamp01(m * 2.5)) * (1 + 0.42 * overN);

      if (hasIn) {
        L.dark[j].setAttribute("d", dIn);
        L.main[j].setAttribute("d", dIn);
        L.tint[j].setAttribute("d", dIn);
        L.gloss[j].setAttribute("d", dIn);
        L.gloss2[j].setAttribute("d", dIn);
        L.dark[j].setAttribute("opacity", "1");
        L.dark[j].setAttribute("stroke-width", Ws);
        L.dark[j].setAttribute("stroke", shade(L.color, -0.34 + 0.5 * thin));
        L.main[j].setAttribute("opacity", "1");
        L.main[j].setAttribute("stroke-width", Ws * 0.80);
        L.main[j].setAttribute("stroke", shade(L.color, thin));
        L.tint[j].setAttribute("opacity", "0.85");
        L.tint[j].setAttribute("stroke-width", Ws * 0.45);
        L.tint[j].setAttribute("transform", `translate(${-Ws * 0.09} ${-Ws * 0.12})`);
        /* stretch striations surface as the latex thins */
        L.tint[j].setAttribute("stroke-dasharray", overN > 0.12 ? "7 6" : "none");
        L.gloss[j].setAttribute("opacity", "0.95");
        L.gloss[j].setAttribute("stroke-width", Ws * 0.18 * (1 + 0.3 * overN));
        L.gloss[j].setAttribute("transform", `translate(${-Ws * 0.16} ${-Ws * 0.20})`);
        L.gloss2[j].setAttribute("opacity", "0.9");
        L.gloss2[j].setAttribute("stroke-width", Math.max(0.5, Ws * 0.08));
        L.gloss2[j].setAttribute("transform", `translate(${-Ws * 0.26} ${-Ws * 0.30})`);
      } else {
        L.dark[j].setAttribute("opacity", "0");
        L.main[j].setAttribute("opacity", "0");
        L.tint[j].setAttribute("opacity", "0");
        L.gloss[j].setAttribute("opacity", "0");
        L.gloss2[j].setAttribute("opacity", "0");

      if (hasTail) {

        L.tail[j].setAttribute("stroke-width", 3.4);
      } else {
        L.tail[j].setAttribute("opacity", "0");
      }
    }

    /* whole-balloon stretch: grows as it fills, keeps swelling overpumped,
       anchored at the nozzle for the first balloon, baseline for the rest */
    const mAvg = mSum / L.subs.length;
    const G = 0.86 + 0.14 * mAvg + 0.26 * overN;
    const tension = over > 0 ? Math.sin(now / 55 + L.phase) * over * 7 : 0;
    const ax = (L === letters[0]) ? L.subs[0].pts[0].x : L.w / 2;
    const ay = (L === letters[0]) ? L.subs[0].pts[0].y : 100;
    L.g.setAttribute("transform",
      `translate(${L.x} ${L.base - 100}) translate(${ax} ${ay}) scale(${G}) rotate(${tension}) translate(${-ax} ${-ay})`);

    /* ground shadow tracks how much balloon is standing over it */
    L.shadow.setAttribute("opacity", (0.04 + 0.10 * mAvg).toFixed(3));
    L.shadow.setAttribute("rx", (L.w * (0.72 - 0.17 * mAvg) * G).toFixed(1));
    L.refl.setAttribute("opacity", (0.10 * mAvg).toFixed(3));
    L.refl.setAttribute("rx", (L.w * 0.5 * G).toFixed(1));
  }
}

const GLUE_TEXT = "fuck you";
function buildGlue() {
  const W = window.innerWidth, H = window.innerHeight;
  glueW = W; glueH = H;
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  glueCanvas.width = W * dpr;
  glueCanvas.height = H * dpr;
  glueCanvas.style.width = W + "px";     // same dpr>1 sizing fix as the glitter canvas
  glueCanvas.style.height = H + "px";
  glueCtx = glueCanvas.getContext("2d");
  glueCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* offscreen pass to find every pixel of glue */
  const mc = document.createElement("canvas");
  mc.width = W; mc.height = H;
  const m = mc.getContext("2d");
  const fam = `"Segoe Script","Bradley Hand","Brush Script MT","Comic Sans MS",cursive`;
  let size = Math.round(Math.min(H * 0.30, W * 0.28));
  m.textAlign = "center"; m.textBaseline = "middle";
  while (size > 40) {
    m.font = `600 ${size}px ${fam}`;
    if (m.measureText(GLUE_TEXT).width <= W * 0.78) break;
    size -= 8;

  const cx = W / 2, cy = H * 0.46;
  m.lineJoin = m.lineCap = "round";

  m.strokeStyle = "#fff"; m.lineWidth = size * 0.10;

  m.fillStyle = "#fff";
  m.fillText(GLUE_TEXT, cx, cy);

  const img = m.getImageData(0, 0, W, H).data;
  glueMask = new Uint8Array(W * H);
  for (let i = 0; i < glueMask.length; i++) glueMask[i] = img[i * 4 + 3] > 60 ? 1 : 0;

function tickParticles(dt) {

  if ((sweepMode || sweepDone) && driftAlpha > 0) driftAlpha = Math.max(0, driftAlpha - dt * 0.5);
  const driftLive = driftCanvas && driftAlpha > 0.01;
  if (!scraps.length && !glitterAlive && !stuckPts.length && !swept.length && !driftLive) { ctx.clearRect(0, 0, W, H); return; }

    ctx.globalAlpha = driftAlpha;
    ctx.drawImage(driftCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  let k = 0;
  for (let i = 0; i < scraps.length; i++) {
    const pt = scraps[i];
    pt.life -= dt;
    if (pt.life <= 0) continue;
    pt.vy += 900 * dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.rot += pt.vr * dt;

  for (const bucket of buckets) {
    const arr = bucket.arr;
    if (slow && arr.length > 400) arr.length = (arr.length * 0.93) | 0;
    ctx.fillStyle = bucket.dim;
    bucket.glints.length = 0;
    let j = 0;
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      p.life -= dt;
      p.ph += p.swayF * dt;
      p.phi += p.w1 * dt;
      p.x += (p.vx + Math.sin(p.ph) * p.sway) * dt;
      p.y += p.vy * dt;

          driftCtx.fillStyle = bucket.dim;

          && Math.random() < 0.06) {   /* low per-frame odds = even coat top to bottom */

      const c = Math.cos(p.phi);
      const c2 = c * c, c4 = c2 * c2;
      const b8 = c4 * c4;                       // sharp specular lobe
      const fore = Math.abs(Math.sin(p.phi));   // face turns away -> sliver
      ctx.globalAlpha = (0.2 + 0.55 * fore) * (p.za || 1);
      const w = p.s * (0.25 + 0.75 * fore);
      ctx.fillRect(p.x - w / 2, p.y - p.s * 0.4, w, p.s * 0.8);
