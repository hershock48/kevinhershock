  const g = c.createRadialGradient(d.x - d.r * 0.34, d.y - d.r * 0.40, d.r * 0.04,
                                   d.x + d.r * 0.10, d.y + d.r * 0.18, d.r * 1.25);
  g.addColorStop(0, `hsl(${d.hue},${sat}%,${Math.min(92, light + 26)}%)`);
  g.addColorStop(0.42, `hsl(${d.hue},${sat}%,${light}%)`);
  g.addColorStop(1, `hsl(${(d.hue + 12) % 360},${sat}%,${Math.max(12, light - 30)}%)`);
  c.fillStyle = g;
  c.fill();
  /* a bright rim where the surface curves away, and one hard specular */
  c.save();
  c.clip();
  c.strokeStyle = `hsla(${d.hue},92%,90%,${(0.34 + 0.30 * (near || 0) + (d.mine ? 0.2 : 0)).toFixed(2)})`;
  c.lineWidth = Math.max(1.5, d.r * 0.10);
  poolPath(c, d, t, 0.995); c.stroke();
  c.fillStyle = `rgba(255,255,255,${d.mine ? 0.62 : 0.44})`;
  c.beginPath();
  c.ellipse(d.x - d.r * 0.34, d.y - d.r * 0.42, d.r * 0.24, d.r * 0.15, -0.6, 0, 6.3);
  c.fill();
  c.restore();
  /* yours carries a halo so you never lose track of which one you are */
  if (d.mine) {
    c.save();
    c.globalCompositeOperation = "lighter";
    const h = c.createRadialGradient(d.x, d.y, d.r * 0.85, d.x, d.y, d.r * 1.7);
    h.addColorStop(0, `hsla(${d.hue},95%,80%,0.22)`);
    h.addColorStop(1, "hsla(0,0%,0%,0)");
    c.fillStyle = h;
    c.fillRect(d.x - d.r * 1.8, d.y - d.r * 1.8, d.r * 3.6, d.r * 3.6);
    c.restore();
  } else if ((near || 0) > 0.02) {
    /* it knows you are coming */
    c.save();
    c.globalCompositeOperation = "lighter";
    const h2 = c.createRadialGradient(d.x, d.y, d.r * 0.8, d.x, d.y, d.r * 1.9);
    h2.addColorStop(0, `hsla(${d.hue},95%,82%,${(0.20 * near).toFixed(3)})`);
    h2.addColorStop(1, "hsla(0,0%,0%,0)");
    c.fillStyle = h2;
    c.fillRect(d.x - d.r * 2, d.y - d.r * 2, d.r * 4, d.r * 4);
    c.restore();
  }
}

/* liquid does not meet at a point — it necks between two surfaces before
   it lets go, and that neck is most of why this reads as liquid */
function neck(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const D = Math.hypot(dx, dy) || 1;
  const reach = (a.r + b.r) * 1.34;
  if (D > reach || D < 0.001) return;
  const f = 1 - (D - (a.r + b.r) * 0.7) / (reach - (a.r + b.r) * 0.7);
  if (f <= 0) return;
  const nx = -dy / D, ny = dx / D;
  const wa = a.r * 0.62 * f, wb = b.r * 0.62 * f;
  const c = pctx;
  c.beginPath();
  c.moveTo(a.x + nx * wa, a.y + ny * wa);
  c.quadraticCurveTo((a.x + b.x) / 2 + nx * Math.min(wa, wb) * 0.35,
                     (a.y + b.y) / 2 + ny * Math.min(wa, wb) * 0.35,
                     b.x + nx * wb, b.y + ny * wb);
  c.lineTo(b.x - nx * wb, b.y - ny * wb);
  c.quadraticCurveTo((a.x + b.x) / 2 - nx * Math.min(wa, wb) * 0.35,
                     (a.y + b.y) / 2 - ny * Math.min(wa, wb) * 0.35,
                     a.x - nx * wa, a.y - ny * wa);
  c.closePath();
  const g = c.createLinearGradient(a.x, a.y, b.x, b.y);
  g.addColorStop(0, `hsl(${a.hue},70%,52%)`);
  g.addColorStop(1, `hsl(${b.hue},70%,52%)`);
  c.fillStyle = g;
  c.fill();
}

function poolFrame(dt) {
  if (!poolOn) return;
  const W = window.innerWidth, H = window.innerHeight;
  poolT += dt;
  if (poolCanvas.width !== Math.round(W * Math.min(2, devicePixelRatio || 1))) sizePool();
  hardClear(poolCanvas, pctx);

  /* somewhere for them to be: a dark bath with light moving across the
     bottom of it, so the drops read as lit objects rather than stickers */
  const bgh = (RUN.hueShift + 190) % 360;
  const bg = pctx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.8);
  bg.addColorStop(0, `hsl(${bgh},34%,17%)`);
  bg.addColorStop(0.55, `hsl(${bgh},40%,11%)`);
  bg.addColorStop(1, `hsl(${(bgh + 20) % 360},46%,6%)`);
  pctx.fillStyle = bg; pctx.fillRect(0, 0, W, H);
  pctx.save();
  pctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 5; i++) {
    const cx2 = W * (0.5 + 0.42 * Math.sin(poolT * (0.13 + i * 0.05) + i * 1.9));
    const cy2 = H * (0.5 + 0.34 * Math.cos(poolT * (0.11 + i * 0.043) + i * 2.4));
    const rr2 = Math.max(W, H) * (0.22 + 0.10 * Math.sin(poolT * 0.2 + i));
    const cg2 = pctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, rr2);
    cg2.addColorStop(0, `hsla(${(bgh + i * 26) % 360},70%,52%,0.055)`);
    cg2.addColorStop(1, "hsla(0,0%,0%,0)");
    pctx.fillStyle = cg2;
    pctx.fillRect(cx2 - rr2, cy2 - rr2, rr2 * 2, rr2 * 2);
  }
  pctx.restore();

  /* ---- the flood at the end ---- */
  if (poolDone) {
    poolFlood = Math.min(1, poolFlood + dt * 0.5);
    const diag = Math.hypot(W, H);
    you.r = you.r + (diag * 0.62 - you.r) * Math.min(1, dt * 2.2);
    you.hue = you.hue;
    drawBlob(you, poolT, 1);
    if (poolFlood >= 1) finishPool();
    return;
  }

  /* ---- move ---- */
  for (const d of pool) {
    if (d === you && poolGrab) {
      const k = Math.min(1, dt * 16);
      d.x += (poolGrab.x - d.x) * k;
      d.y += (poolGrab.y - d.y) * k;
    } else if (d === you && poolTarget) {
      const dx = poolTarget.x - d.x, dy = poolTarget.y - d.y;
      const D = Math.hypot(dx, dy);
      if (D < 3) poolTarget = null;
      else { d.x += dx / D * Math.min(D, 420 * dt); d.y += dy / D * Math.min(D, 420 * dt); }
    } else {
      const dx2 = you.x - d.x, dy2 = you.y - d.y;
      const D2 = Math.hypot(dx2, dy2) || 1;
      /* a weak pull from anywhere on the field on top of the close-range
         one, so it always converges — the scene should reward moving, not
         demand a route */
      const pull = Math.max(0, 1 - D2 / (you.r * 3.4 + d.r)) + 0.16;
      d.x += (d.vx + dx2 / D2 * pull * 190) * dt;
      d.y += (d.vy + dy2 / D2 * pull * 190) * dt;
      if (d.x < d.r || d.x > W - d.r) d.vx *= -1;
      if (d.y < d.r || d.y > H - d.r) d.vy *= -1;
      if (pull > 0.05) { d.w1 = Math.max(d.w1, pull * 0.09); }
    }
    d.x = Math.max(d.r * 0.4, Math.min(W - d.r * 0.4, d.x));
    d.y = Math.max(d.r * 0.4, Math.min(H - d.r * 0.4, d.y));
    d.w1 *= Math.exp(-2.6 * dt);
    d.w2 *= Math.exp(-3.4 * dt);
  }

  /* ---- contact ---- */
  for (let i = pool.length - 1; i >= 0; i--) {
    const d = pool[i];
    if (d === you) continue;
    const dx = d.x - you.x, dy = d.y - you.y;
    const D = Math.hypot(dx, dy);
    if (D > d.r + you.r * 0.88) continue;
    /* areas add, so the merge conserves liquid */
    const a1 = you.r * you.r, a2 = d.r * d.r;
    you.hue = mixHue(you.hue, d.hue, a2 / (a1 + a2));
    you.r = Math.sqrt(a1 + a2);
    you.w1 = 0.16; you.w2 = 0.10;
    pool.splice(i, 1);
    mergeSound(you.r / (Math.min(W, H) * 0.03), d.x);
    if (pool.length <= 1) { poolDone = true; swellSound(); }
  }

  /* ---- draw: necks first so they sit under the bodies ---- */
  for (const d of pool) if (d !== you) neck(you, d);
  const sorted = pool.slice().sort((a, b) => a.r - b.r);
  for (const d of sorted) {
    if (d === you) continue;
    const D3 = Math.hypot(d.x - you.x, d.y - you.y);
    drawBlob(d, poolT, Math.max(0, 1 - D3 / (you.r * 3.4 + d.r)));
  }
  drawBlob(you, poolT, 1);
}

const mixHue = (a, b, t) => {
  let dd = ((b - a + 540) % 360) - 180;
  return (a + dd * t + 360) % 360;
};

function finishPool() {
  if (!poolOn) return;
  poolOn = false;
  poolCanvas.style.transition = "opacity 0.8s ease";
  poolCanvas.style.opacity = "0";
  setTimeout(() => { poolCanvas.style.display = "none"; }, 900);
  /* hand the filled screen to the old dot element, which is what the water
     stage reads its background colour from */
  dotSize = Math.hypot(window.innerWidth, window.innerHeight) * 1.3;
  dotEl.style.display = "block";
  dotEl.style.transition = "none";
  dotEl.style.width = dotSize + "px";
  dotEl.style.height = dotSize + "px";
  dotEl.style.background =
    `radial-gradient(circle at 46% 38%, ${shade(DOT_FINAL, 0.30)} 0%, ${DOT_FINAL} 52%, ${shade(DOT_FINAL, -0.34)} 100%)`;
  dotDone = true;
  dotEl.style.cursor = "default";
  setTimeout(showTap, 1100);
}

/* --- input: drag it, or tap where you want it to go --- */
function poolHit(x, y) {
  return poolOn && !poolDone &&
    Math.hypot(x - you.x, y - you.y) < Math.max(you.r * 1.5, 42 * UIS);
}
window.addEventListener("pointerdown", (e) => {
  if (!poolOn || poolDone) return;
  if (poolHit(e.clientX, e.clientY)) poolGrab = { x: you.x, y: you.y };
  else poolTarget = { x: e.clientX, y: e.clientY };   /* tapping works too */
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => {
  if (!poolOn || poolDone) return;
  poolCanvas.style.cursor = poolHit(e.clientX, e.clientY) ? "grab" : "crosshair";
  if (poolGrab) { poolGrab.x = e.clientX; poolGrab.y = e.clientY; if (e.cancelable) e.preventDefault(); }
}, { passive: false });
window.addEventListener("pointerup", () => { poolGrab = null; });

/* --- sound --- */
function mergeSound(scale, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const f = 190 + Math.min(9, scale) * 62;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(f * 0.65, t0);
  o.frequency.exponentialRampToValueAtTime(f, t0 + 0.09);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.085, t0 + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
  const dest = at(px) || BUS;
  o.connect(g); g.connect(dest);
  o.start(t0); o.stop(t0 + 0.55);
  /* a little wet click on top */
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.05, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.10);
  s.connect(lp); lp.connect(g2); g2.connect(dest);
  s.start(t0); s.stop(t0 + 0.12);
}
let lastReject = 0;
function rejectSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastReject < 0.28) return;
  lastReject = t0;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(112, t0);
  o.frequency.exponentialRampToValueAtTime(66, t0 + 0.18);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.075, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  o.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.28);
}
function swellSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [130.8, 196, 261.6, 392].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 1 ? "sine" : "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.07);
    g.gain.exponentialRampToValueAtTime(0.06, t0 + i * 0.07 + 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.4);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.07); o.stop(t0 + 3.6);
  });
}

/* ================= the tap =================
   Liquid engine ported from the Griffin Claw pour: causal falling front
   that must land before the pool starts, stream necking via continuity,
   specular core, multi-sine surface with slosh, splash droplets, churn
   froth at the impact point, bubbles from fixed nucleation points. */
const tapEl = document.getElementById("tap");
const wheelEl = document.getElementById("tapWheel");
let tapShown = false, tapRot = 0, valveFlow = 0, lastSqueakRot = 0, dripT = 1.2;
let wT = 0, wFlow = 0, frontY = null, frontV = 0, wLanded = false, wMotes = [], wLastT = 0;
let breakY = null, breakV = 0, wasFlowing = false;
let vol = 0, slosh = 0, sloshV = 0, gooHanded = false;
let wDrops = [], wFoam = [], wBub = [], wNucl = [];
let waterSnd = null, splashed = false;

/* the spout's real position on screen, read from the tap itself — survives
   the bigger tap, the entrance animation, notches and rotation */
const MOUTH_Y = 92;
const TAP_VB_H = 120, TAP_SPOUT_VB = 91;
let spoutYv = MOUTH_Y;
function measureSpout() {
  const r = tapEl.getBoundingClientRect();
  spoutYv = r.height ? r.top + r.height * (TAP_SPOUT_VB / TAP_VB_H) : spoutYv;
  return spoutYv;
}
function mouthX() { return window.innerWidth / 2; }
function levelOf() { return window.innerHeight * (1 - Math.min(1, vol)); }
let drainDip = 0;
function surfaceY(x, level, agit) {
  return level
    + Math.sin(x * 0.0121 + wT * 1.75) * (1.7 + agit * 3.2)
    + Math.sin(x * 0.0263 - wT * 2.61) * (1.05 + agit * 1.8)
    + Math.sin(x * 0.0533 + wT * 3.9) * (0.42 + agit * 0.8)
    + slosh * (x / window.innerWidth - 0.5) * 26
    + drainDip * 74 * Math.exp(-Math.pow((x - window.innerWidth / 2) / 120, 2));
}

function clankSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [520, 780, 1180].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = "triangle";
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 0.86, t0 + 0.4);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.16 / (i + 1), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.connect(g); g.connect(BUS);
    o.start(t0); o.stop(t0 + 0.52);
  });
}
function plinkSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(1500 + Math.random() * 500, t0);
  o.frequency.exponentialRampToValueAtTime(620, t0 + 0.09);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
  o.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.18);
}

function showTap() {
  mark("tap");
  if (tapShown) return;
  tapShown = true;
  bed('water');
  tapEl.style.display = "block";
  requestAnimationFrame(() => {
    tapEl.classList.add("on");
    measureSpout();
  });
  setTimeout(clankSound, 600);          // it lands with a pipe clank
  const W = window.innerWidth;
  wNucl = [];
  for (let i = 0; i < Math.round(W / 44); i++) {
    wNucl.push({ x: Math.random() * W, t: Math.random() * 3, rate: 0.35 + Math.random() * 1.15 });
  }
}

/* twist the handle — a real spigot takes a few full turns.
   The whole tap is the grab target (a finger needs more than a 48px wheel),
   and once grabbed you can circle anywhere on the screen. */
let wheelDrag = null;
tapEl.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  tapEl.setPointerCapture(e.pointerId);
  wheelEl.classList.add("grabbing");
  const r = wheelEl.getBoundingClientRect();
  wheelDrag = {
    cx: r.left + r.width / 2, cy: r.top + r.height / 2,
    last: Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)),
  };
  /* Every pull on this site advances on a tap. A wheel you can only turn by
     circling it is a wheel that does nothing at all when you click it, and a
     thing that does nothing when clicked reads as broken. */
  if (screwState === "none") turnWheel(132);
});
function turnWheel(deg) {
  tapRot = Math.max(0, Math.min(1080, tapRot + deg));
  wheelEl.setAttribute("transform", `translate(70 40) rotate(${tapRot})`);
  valveFlow = Math.max(0, Math.min(1, (tapRot - 90) / 990));
  if (Math.abs(tapRot - lastSqueakRot) > 130) { lastSqueakRot = tapRot; tapSqueak(); }
}
tapEl.addEventListener("pointermove", (e) => {
  if (!wheelDrag || screwState !== "none") return;   // the tap retired when the corkscrew took over
  const a = Math.atan2(e.clientY - wheelDrag.cy, e.clientX - wheelDrag.cx);
  let d = a - wheelDrag.last;
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  wheelDrag.last = a;
  turnWheel(d * 57.2958);
});
const endDrag = () => { wheelDrag = null; wheelEl.classList.remove("grabbing"); };
tapEl.addEventListener("pointerup", endDrag);
tapEl.addEventListener("pointercancel", endDrag);

function tapSqueak() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const osc = ac.createOscillator(); osc.type = "sawtooth";
  const f0 = 480 + Math.random() * 320;
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.linearRampToValueAtTime(f0 * 1.3, t0 + 0.05);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1600;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.045, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.11);
  osc.connect(lp); lp.connect(g); g.connect(BUS);
  osc.start(t0); osc.stop(t0 + 0.12);
}
function splashSound(depth) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  /* shallow water splatters bright; deep water lands low and round */
  lp.frequency.value = 1500 - (depth || 0) * 1100;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.4 + (1 - (depth || 0)) * 0.1, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.5);
}
let lastSputter = 0;
function sputterSound() {
  const ac = audio(); if (!ac) return;
  const nw = performance.now();
  if (nw - lastSputter < 240) return;
  lastSputter = nw;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 900 + Math.random() * 500; bp.Q.value = 1.1;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.13, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.1);
}
function ensureWaterSound() {
  if (waterSnd || !AC) return;
  const src = AC.createBufferSource(); src.buffer = noise(AC); src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 750; bp.Q.value = 0.7;
  const g = AC.createGain(); g.gain.value = 0;
  src.connect(bp); bp.connect(g); g.connect(BUS);
  src.start();
  waterSnd = { src, bp, g };
  hold("water", { gain: g, src });
}

function waterStep(dt) {
  wT += dt;
  measureSpout();
  const H = window.innerHeight;
  wFlow += (valveFlow - wFlow) * (1 - Math.exp(-5 * dt));
  const mx = mouthX();

  /* An unopened tap drips. It is the only hint this site gives: motion at
     the top of the screen, and a falling drop that says there's water in
     here. The wheel rocks a little too, the way the corkscrew idles. */
  if (valveFlow < 0.02 && screwState === "none" && !drainOpen) {
    dripT -= dt;
    if (dripT <= 0) {
      dripT = 1.9 + Math.random() * 1.3;
      wDrops.push({ x: mx, y: spoutYv + 4, vx: 0, vy: 25,
                    r: 4.6 * UIS, life: 4 });
      const floor = (vol > 0.01 ? levelOf() : H) - spoutYv;
      const tFall = Math.sqrt(Math.max(0, 2 * floor) / 1450);
      setTimeout(plinkSound, Math.min(3000, tFall * 1000));
    }
    if (!wheelDrag) {
      const rock = Math.sin(wT * 1.7) * 6;
      wheelEl.setAttribute("transform", `translate(70 40) rotate(${tapRot + rock})`);
    }
  }

  /* a barely-cracked valve sputters air and spit before it runs clean */
  if (wFlow > 0.02 && wFlow < 0.22 && Math.random() < 10 * dt) {
    for (let i = 0; i < 2; i++) {
      wDrops.push({ x: mx + (Math.random() - 0.5) * 10, y: spoutYv + 6,
        vx: (Math.random() - 0.5) * 90, vy: 90 + Math.random() * 200,
        r: 0.8 + Math.random() * 1.4, life: 0.5 + Math.random() * 0.5 });
    }
    sputterSound();
  }

  /* causal fall: the first water must physically arrive before any pool */
  if (wFlow > 0.03) {
    if (frontY === null) { frontY = spoutYv; frontV = 60; wLanded = false; splashed = false; }
    if (!wLanded) {
      frontV += 1500 * dt; frontY += frontV * dt;
      if (frontY >= levelOf() - 1) {
        wLanded = true;
        if (!splashed) {
          splashed = true;
          splashSound(vol);
          for (let q = 0; q < 10; q++) {
            wDrops.push({ x: mx + (Math.random() - 0.5) * 16, y: levelOf(),
              vx: (Math.random() - 0.5) * 300, vy: -60 - Math.random() * 130,
              r: 1 + Math.random() * 1.8, life: 0.35 + Math.random() * 0.55 });
          }
        }
      }
    }
    wasFlowing = true; breakY = null;
  } else if (wasFlowing && breakY === null) {
    breakY = spoutYv; breakV = 110;
    wasFlowing = false;
  }
  if (breakY !== null) { breakV += 1500 * dt; breakY += breakV * dt; if (breakY > H + 40) breakY = null; }
  if (wFlow <= 0.03 && breakY === null) frontY = null;

  /* the pool rises only after landing */
  if (wLanded && wFlow > 0.03) vol = Math.min(1, vol + wFlow * dt * 0.045);

  /* full room: the chest arrives, the key floats free */
  if (vol >= 0.999 && !chestShown) showChest();
  if (chestShown) updateKey(dt);

  /* the chest goes down its own drain with the last of the water */
  if (drainOpen && !chestGone && vol < 0.1) {
    chestGone = true;
    chestEl.style.transition = "transform 1.8s ease-in, opacity 1.3s ease 0.5s";
    chestEl.style.transform = "translateX(-50%) translateY(160px) rotate(6deg)";
    chestEl.style.opacity = "0";
    setTimeout(() => { chestEl.style.display = "none"; }, 1900);
  }

  /* cork pulled: the water drains out faster than any tap can fill it */
  if (drainOpen && vol > 0) {
    vol = Math.max(0, vol - dt * 0.16);
    sloshV += (Math.random() - 0.5) * 1.4 * dt * 60;
    if (gurgle && AC) {
      const t = AC.currentTime;
      gurgle.bp.frequency.setTargetAtTime(230 + vol * 620 + Math.sin(wT * 7) * 90, t, 0.08);
      gurgle.g.gain.setTargetAtTime(vol > 0.02 ? 0.16 : 0, t, 0.1);
    }
    if (vol <= 0 && gurgle) {
      gurgle.g.gain.setTargetAtTime(0, AC.currentTime, 0.05);
      const gg = gurgle; gurgle = null;
      setTimeout(() => { try { gg.src.stop(); } catch (e) {} }, 400);
    }
    /* and when the last of it has gone, you go down after it */
    if (vol <= 0 && !gooHanded) {
      gooHanded = true;
      /* belt and braces on the stage everyone gets to */
      setTimeout(() => { if (!gooActive) activateGoo(); }, 7000);
      setTimeout(() => {
        finCanvas.style.background = "transparent";
        finCanvas.style.display = "block";
        sizeFinale();
        /* you do not cut away from a drain, you go down it */
        release("water", 1.6); waterSnd = null;
        natRun("drain", () => activateGoo(), 2.9, { travel: true });
        travelOnly = true;
      }, 900);
    }
  }

  sloshV += (-slosh * 44 - sloshV * 5.2) * dt + wFlow * (Math.random() - 0.5) * 0.7 * dt * 60;
  slosh += sloshV * dt;
  slosh = Math.max(-0.5, Math.min(0.5, slosh));

  const level = levelOf(), agit = Math.min(1, wFlow * 1.2);

  /* bubbles rise in streams from fixed nucleation points */
  if (vol > 0.01) {
    for (const nu of wNucl) {
      nu.t += dt * nu.rate * (1 + wFlow * 1.4);
      if (nu.t > 0.35) {
        nu.t = 0;
        if (wBub.length < Math.min(200, (window.innerWidth * H) / 2600)) wBub.push({ x: nu.x + (Math.random() - 0.5) * 6, y: H + Math.random() * 6,
          r: 0.5 + Math.random(), v: 16 + Math.random() * 18, ph: Math.random() * 6.3, w: 0.3 + Math.random() * 0.8 });
      }
    }
  }
  /* the funnel forms over the chest as the drain opens */
  drainDip += ((drainOpen && vol > 0.02 ? 1 : 0) - drainDip) * (1 - Math.exp(-2 * dt));
  for (let i = wBub.length - 1; i >= 0; i--) {
    const b = wBub[i];
    b.v += 42 * dt; b.y -= b.v * dt; b.r += dt * 0.6; b.ph += dt * 2.2;
    if (drainOpen) b.x += (window.innerWidth / 2 - b.x) * 0.7 * dt;   // pulled to the drain
    if (b.y <= surfaceY(b.x + Math.sin(b.ph) * b.w * 3, level, agit)) wBub.splice(i, 1);
  }
  /* churn froth where the stream lands */
  if (wFlow > 0.05 && wLanded && vol > 0.004) {
    for (let i = 0; i < Math.round(wFlow * 3); i++) {
      if (wFoam.length < 220) wFoam.push({ x: mx + (Math.random() - 0.5) * 34, r: 1.5 + Math.random() * 4.5,
        vx: (Math.random() - 0.5) * 60, life: 1.2 + Math.random() * 2.2 });
    }
    if (Math.random() < wFlow * 0.8) {
      wDrops.push({ x: mx + (Math.random() - 0.5) * 12, y: surfaceY(mx, level, agit),
        vx: (Math.random() - 0.5) * 220, vy: -50 - Math.random() * 110,
        r: 0.8 + Math.random() * 1.6, life: 0.35 + Math.random() * 0.5 });
    }
  }
  for (let i = wFoam.length - 1; i >= 0; i--) {
    const f = wFoam[i];
    f.life -= dt; f.x += f.vx * dt; f.vx *= Math.pow(0.5, dt);
    if (f.life <= 0) wFoam.splice(i, 1);
  }
  for (let i = wDrops.length - 1; i >= 0; i--) {
    const d = wDrops[i];
    d.life -= dt;
    if (d.life <= 0) { wDrops.splice(i, 1); continue; }
    d.vy += 1450 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    /* a drop stops at the floor, or at the water it falls into */
    const stop = vol > 0.01 ? surfaceY(d.x, level, agit) : H + 14;
    if (d.y > stop) wDrops.splice(i, 1);
  }

  /* the whole soundscape sinks underwater as the room floods */
  setUnderwater(vol);
  updateSwell(vol);
  /* the rising water washes the settled glitter drift away — for good */
  if (driftAlpha > 0) driftAlpha = Math.min(driftAlpha, Math.max(0, 1 - vol * 9));

  /* running-water sound follows the flow, muffling as the room floods */
  ensureWaterSound();
  if (waterSnd) {
    const t = AC.currentTime;
    const full = vol >= 1;
    waterSnd.bp.frequency.setTargetAtTime(
      (650 - vol * 380) + Math.sin(wT * 3) * 120 + wFlow * 320, t, 0.12);
    waterSnd.g.gain.setTargetAtTime(
      Math.min(0.32, wFlow * (wLanded ? 0.3 : 0.2)) * (full ? 0.45 : 1), t, 0.15);
  }
}

function waterDraw() {
  const W = window.innerWidth, H = window.innerHeight;
  const level = levelOf(), agit = Math.min(1, wFlow * 1.2);
  /* NB: don't bail before the drips — an unopened tap still has a bead
     swelling and drops falling, and that is the only cue the site gives */
  const beadLive = tapShown && valveFlow < 0.02 && screwState === "none"
                   && !drainOpen && dripT < 0.95;
  if (vol <= 0.0008 && wFlow <= 0.02 && breakY === null && frontY === null
      && !wDrops.length && !beadLive) return;

  /* ---------- stream: translucent, necking, with a specular core ---------- */
  const mx = mouthX();
  const sTop = breakY !== null ? breakY : spoutYv;
  const sBot = (frontY !== null && !wLanded) ? Math.min(frontY, level - 1) : level - 1;
  if ((wFlow > 0.02 || breakY !== null) && sBot > sTop + 2) {
    const span = sBot - sTop;
    let w0 = 13.5 * UIS * (0.45 + wFlow * 0.7);
    if (breakY !== null) w0 *= 0.4;
    /* a sputtering stream flickers before it runs solid */
    if (wFlow > 0.02 && wFlow < 0.22 && breakY === null) {
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(wT * 35));
    }
    ctx.beginPath();
    const Ls = [], Rs = [];
    for (let y = 0; y <= span; y += 4) {
      const kk = y / Math.max(span, 1);
      const vv = Math.sqrt(1 + kk * 7.5);            // continuity: faster = thinner
      const ww = (w0 / vv) * (1 + Math.sin(kk * 9 + wT * 7) * 0.06);
      const xx = mx + Math.sin(kk * 5 + wT * 4) * 1.2;
      Ls.push([xx - ww, sTop + y]); Rs.push([xx + ww, sTop + y]);
    }
    ctx.moveTo(Ls[0][0], Ls[0][1]);
    for (const p of Ls) ctx.lineTo(p[0], p[1]);
    for (let i = Rs.length - 1; i >= 0; i--) ctx.lineTo(Rs[i][0], Rs[i][1]);
    ctx.closePath();
    ctx.fillStyle = "rgba(165,210,245,0.55)";
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.75)";
    ctx.lineWidth = Math.max(1, w0 * 0.28);
    ctx.beginPath();
    ctx.moveTo(mx, sTop);
    ctx.lineTo(mx, sTop + span);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ---------- pool ---------- */
  if (vol > 0.0008) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, surfaceY(x, level, agit));
    ctx.lineTo(W, H);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, Math.max(0, level - 10), 0, H);
    grad.addColorStop(0, "rgba(176,226,250,0.40)");
    grad.addColorStop(0.32, "rgba(52,146,192,0.62)");
    grad.addColorStop(1, "rgba(8,52,98,0.80)");
    ctx.fillStyle = grad;
    ctx.fill();

    /* light coming through the surface — the shafts sway with the swell and
       are what makes a body of water read as deep rather than as a fill */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, surfaceY(x, level, agit));
    ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    const shafts = W < 620 ? 4 : 7;
    for (let i = 0; i < shafts; i++) {
      const px = (i + 0.5) / shafts;
      const sx = W * px + Math.sin(wT * 0.5 + i * 1.9) * W * 0.05;
      const sy = surfaceY(sx, level, agit);
      const lean = Math.sin(wT * 0.32 + i * 2.4) * W * 0.10 + W * 0.05;
      const wide = W * (0.020 + 0.016 * Math.abs(Math.sin(i * 1.7)));
      const g2 = ctx.createLinearGradient(sx, sy, sx + lean, H);
      const a = 0.055 + 0.035 * Math.abs(Math.sin(wT * 0.7 + i));
      g2.addColorStop(0, `rgba(206,240,255,${a.toFixed(3)})`);
      g2.addColorStop(0.55, `rgba(150,215,245,${(a * 0.45).toFixed(3)})`);
      g2.addColorStop(1, "rgba(120,190,235,0)");
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.moveTo(sx - wide, sy);
      ctx.lineTo(sx + wide, sy);
      ctx.lineTo(sx + lean + wide * 3.2, H);
      ctx.lineTo(sx + lean - wide * 3.2, H);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    /* caustics — the surface is not flat, so the light coming through it
       is not even. This is the single thing that stops a body of water
       looking like a coloured rectangle. */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, surfaceY(x, level, agit));
    ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    const bands = W < 620 ? 4 : 9;
    for (let i = 0; i < bands; i++) {
      const d = (i + 0.5) / bands;
      const y = level + (H - level) * d * d;
      const a = 0.075 * (1 - d) * (1 - d);
      if (a < 0.004) continue;
      ctx.strokeStyle = `rgba(206,240,255,${a.toFixed(3)})`;
      ctx.lineWidth = 1 + (1 - d) * 3.4;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 16) {
        const yy = y
          + Math.sin(x * 0.011 + wT * (0.9 + i * 0.13) + i) * (6 + (1 - d) * 16)
          + Math.sin(x * 0.027 - wT * (0.6 + i * 0.09)) * (3 + (1 - d) * 7);
        x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();

    /* motes turning over in the shafts */
    if (!wMotes.length) {
      for (let i = 0; i < (W < 620 ? 30 : 80); i++)
        wMotes.push({ x: Math.random() * W, d: Math.random(),
                      r: 0.5 + Math.random() * 1.5, ph: Math.random() * 6.3,
                      sp: 0.25 + Math.random() * 0.7 });
    }
    const mdt = Math.max(0, Math.min(0.1, wT - wLastT));
    wLastT = wT;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, surfaceY(x, level, agit));
    ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
    for (const m of wMotes) {
      const my = level + (H - level) * m.d;
      const mx = m.x + Math.sin(wT * m.sp + m.ph) * 14;
      ctx.fillStyle = `rgba(226,246,255,${(0.10 + 0.24 * Math.abs(Math.sin(wT * 0.7 + m.ph))).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(mx, my + Math.sin(wT * 0.35 + m.ph) * 8, m.r, 0, 6.3); ctx.fill();
      m.d -= mdt * 0.006 * m.sp;
      if (m.d < 0) { m.d = 1; m.x = Math.random() * W; }
    }
    ctx.restore();

    /* a bright band of refraction just under the surface */
    if (W >= 620) {
    ctx.save();
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = surfaceY(x, level, agit);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let x = W; x >= 0; x -= 8) ctx.lineTo(x, surfaceY(x, level, agit) + 16);
    ctx.closePath();
    ctx.fillStyle = "rgba(214,244,255,0.16)";
    ctx.fill();
    ctx.restore();
    }

    /* surface light */
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = surfaceY(x, level, agit);
      x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    /* froth */
    for (const f of wFoam) {
      ctx.globalAlpha = Math.min(0.85, f.life * 0.6);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(f.x, surfaceY(f.x, level, agit) - 1.5, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    /* bubbles */
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.lineWidth = 1;
    for (const b of wBub) {
      ctx.beginPath();
      ctx.arc(b.x + Math.sin(b.ph) * b.w * 3, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    /* caustic light playing over everything submerged */
    if (vol > 0.15 && H - level > 90) {
      ctx.globalCompositeOperation = "lighter";
      const nCaustics = W < 700 ? 6 : 10;
      for (let i = 0; i < nCaustics; i++) {
        const cx2 = ((i * 0.104 + 0.05) * W) + Math.sin(wT * 0.7 + i * 2.4) * 70;
        const cy2 = level + 50 + ((i * 173) % Math.max(1, H - level - 80));
        ctx.globalAlpha = 0.035 + 0.03 * Math.abs(Math.sin(wT * 1.3 + i * 1.7));
        ctx.fillStyle = "#bfe4ff";
        ctx.beginPath();
        ctx.ellipse(cx2, cy2, 58, 13, Math.sin(wT * 0.4 + i) * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    /* the whirlpool: water funnels down into the open chest and out its bottom */
    if (drainDip > 0.03 && vol > 0.01) {
      const cxx = W / 2;
      const sy = surfaceY(cxx, level, agit) + 4;
      const mouthY = H - 78 * UIS;
      if (mouthY > sy + 24) {
        ctx.beginPath();
        ctx.moveTo(cxx - 54, sy - 4);
        ctx.quadraticCurveTo(cxx - 22, sy + (mouthY - sy) * 0.55, cxx - 11, mouthY);
        ctx.lineTo(cxx + 11, mouthY);
        ctx.quadraticCurveTo(cxx + 22, sy + (mouthY - sy) * 0.55, cxx + 54, sy - 4);
        ctx.closePath();
        ctx.fillStyle = `rgba(25,85,145,${0.5 * drainDip})`;
        ctx.fill();
        ctx.strokeStyle = `rgba(255,255,255,${0.32 * drainDip})`;
        ctx.lineWidth = 1.6;
        for (let k = 0; k < 3; k++) {
          const ph = wT * 5.5 + k * 2.1;
          ctx.beginPath();
          let first = true;
          for (let yy = sy + 6; yy < mouthY; yy += 7) {
            const tt = (yy - sy) / (mouthY - sy);
            const wdt = 46 * (1 - tt) + 9;
            const xx = cxx + Math.sin(ph + tt * 7) * wdt * 0.8;
            first ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy);
            first = false;
          }
          ctx.stroke();
        }
      }
    }

    /* the quote, written down the wall, readable only underwater —
       the rising water finds the "e" first and climbs the sentence */
    const QUOTE = "Proster says patience is a virtue";
    const rows = QUOTE.length;
    const rowH = Math.min(30, (H - 90) / rows);
    const qx = Math.max(70, W * 0.13);
    ctx.font = `italic ${Math.round(rowH * 0.95)}px Georgia, "Times New Roman", serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < rows; i++) {
      const q = QUOTE[i];
      if (q === " ") continue;
      const qy = 55 + rowH / 2 + i * rowH;
      const depth = qy - surfaceY(qx, level, agit);
      if (depth <= 0) continue;
      ctx.globalAlpha = Math.min(1, depth / 32);
      const jx = qx + Math.sin(wT * 1.2 + qy * 0.045) * 2.4;
      /* a dark halo first, or white letters vanish into the bright shafts */
      ctx.shadowColor = "rgba(4,26,50,0.85)";
      ctx.shadowBlur = rowH * 0.55;
      ctx.fillStyle = "rgba(238,250,255,0.96)";
      ctx.fillText(q, jx, qy);
      ctx.shadowBlur = 0;
      ctx.fillText(q, jx, qy);
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  }
  /* a bead swells at the spout before it lets go — motion exactly where
     the eye needs to land */
  if (tapShown && valveFlow < 0.02 && screwState === "none" && !drainOpen && dripT < 0.95) {
    const t = (0.95 - dripT) / 0.95;
    const br = 4.6 * UIS * t;
    if (br > 0.5) {
      ctx.beginPath();
      ctx.arc(mx, spoutYv + br * 0.5, br, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(150,205,245,0.9)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }

  /* droplets — bright core, dark rim, so they read on any colour */
  for (const d of wDrops) {
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r * 0.86, d.r * 1.25, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(175,220,250,0.92)";
    ctx.fill();
    ctx.strokeStyle = "rgba(20,60,100,0.35)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(d.x - d.r * 0.28, d.y - d.r * 0.35, Math.max(0.6, d.r * 0.3), 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fill();
  }
}

/* ================= the chest, the key, the cork ================= */
const chestEl = document.getElementById("chest");
const keyEl = document.getElementById("key");
const corkEl = document.getElementById("cork");
const KEY_CURSOR = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='16'><circle cx='7' cy='8' r='4.5' fill='none' stroke='%23d9a441' stroke-width='3'/><rect x='11' y='6.5' width='15' height='3' fill='%23d9a441'/><rect x='22' y='9' width='3' height='5' fill='%23d9a441'/><rect x='27' y='9' width='3' height='4' fill='%23d9a441'/></svg>") 29 8, auto`;
let chestShown = false, keyState = "none", keyY = 0, keyBaseX = 0;
let chestOpen = false, corkOut = false, drainOpen = false, gurgle = null, chestGone = false;
/* lid hinge: SVG attribute transform, tweened — reliable on every browser */
const chestLidEl = document.getElementById("chestLid");
let lidA = 0, lidTarget = 0;
function updateLid(dt) {
  if (Math.abs(lidA - lidTarget) < 0.05) return;
  lidA += (lidTarget - lidA) * (1 - Math.exp(-5.5 * dt));
  chestLidEl.setAttribute("transform", `rotate(${lidA.toFixed(2)} 15 52)`);
}

function showChest() {
  mark("chest");
  chestShown = true;
  chestEl.style.display = "block";
  requestAnimationFrame(() => chestEl.classList.add("on"));
  keyState = "floating";
  keyBaseX = window.innerWidth / 2 + 130 * UIS;
  keyY = window.innerHeight - 150 * UIS;
  keyEl.style.display = "block";
}

function updateKey(dt) {
  if (keyState === "floating") {
    keyY -= 30 * dt;                        // buoyant — it rises
    if (keyY <= 22) keyState = "atTop";
  } else if (keyState === "atTop") {
    keyY = 18 + SAFE_TOP + Math.sin(wT * 1.6) * 6;   // bobbing at the surface, clear of the notch
  } else return;
  const kx = keyBaseX + Math.sin(wT * 1.25) * 42 * UIS;
  keyEl.style.left = (kx - 29 * UIS) + "px";
  keyEl.style.top = keyY + "px";
  keyEl.style.transform = `rotate(${Math.sin(wT * 1.7) * 14}deg)`;
}

/* the dot covers the whole screen at this stage, so a body-only cursor
   never shows — set it on everything that can sit under the pointer */
function setGlobalCursor(c) {
  document.body.style.cursor = c;
  dotEl.style.cursor = c || "default";
  chestEl.style.cursor = c || "pointer";   // the key stays a key over the chest
}

keyEl.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (keyState !== "floating" && keyState !== "atTop") return;
  keyState = "held";
  if (TOUCHY) {
    /* on touch the key stays visible and rides the finger */
    keyEl.classList.add("held");
    keyEl.style.left = (e.clientX - 18) + "px";
    keyEl.style.top = (e.clientY - 44) + "px";
  } else {
    keyEl.style.display = "none";
    setGlobalCursor(KEY_CURSOR);
  }
});

function thunkSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.35, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.15);
}
function corkPopSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const osc = ac.createOscillator(); osc.type = "sine";
  osc.frequency.setValueAtTime(380, t0);
  osc.frequency.exponentialRampToValueAtTime(950, t0 + 0.07);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.4, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
  osc.connect(g); g.connect(BUS);
  osc.start(t0); osc.stop(t0 + 0.13);
}

chestEl.addEventListener("pointerdown", () => {
  if (chestOpen || !chestShown) return;
  if (keyState !== "held") {
    chestEl.classList.remove("shake");
    void chestEl.offsetWidth;               // restart the animation
    chestEl.classList.add("shake");
    thunkSound();
    return;
  }
  /* the key fits */
  keyState = "used";
  keyEl.style.display = "none";
  keyEl.classList.remove("held");
  setGlobalCursor("");
  chestOpen = true;
  tapSqueak();                              // old hinges
  chestEl.classList.add("open");            // interior fade
  lidTarget = -108;                         // lid swings on its real hinge
  setTimeout(() => {
    corkOut = true;
    /* the cork is the plug: seated snug in the chest, clogging it up */
    const r = chestEl.getBoundingClientRect();
    corkEl.style.left = (r.left + r.width / 2 - 17 * UIS) + "px";
    corkEl.style.top = (r.top + 110 * UIS) + "px";    // down IN the chest, plugging it
    corkEl.style.transform = "translateY(0px)";       // body hidden behind the front wall
    corkEl.style.display = "block";
    setTimeout(startScrew, 2000);
  }, 1000);
});

/* ---- the spigot becomes a corkscrew ---- */
const screwEl = document.getElementById("screw");
const screwWheelEl = document.getElementById("screwWheel");
let screwState = "none", screwY = 0, screwTargetY = 0, screwSpin = 0;
let extractDeg = 0, screwDrag = null;

function startScrew() {
  if (screwState !== "none") return;
  screwState = "descending";
  valveFlow = 0; tapRot = 0;                 // the tap gives itself up
  tapEl.classList.remove("on");              // and fades away
  corkEl.style.transition = "none";
  corkEl.style.transform = "translateY(0px)";
  screwTargetY = window.innerHeight - 235 * UIS;
  screwY = -180 * UIS;
  screwEl.style.left = (window.innerWidth / 2 - 80 * UIS) + "px";
  screwEl.style.top = screwY + "px";
  screwEl.style.display = "block";
}

function updateScrew(dt) {
  if (screwState === "descending" || screwState === "in") {
    /* recompute against the live viewport so rotation/resize can't strand it */
    screwTargetY = window.innerHeight - 235 * UIS;
  }
  if (screwState === "descending") {
    screwY += 150 * UIS * dt;
    screwSpin += 300 * dt;                   // it screws its way down
    if (screwY >= screwTargetY) {
      screwY = screwTargetY;
      screwState = "in";
      thunkSound();                          // bit into the cork
    }
    screwEl.style.top = screwY + "px";
    screwWheelEl.setAttribute("transform", `rotate(${screwSpin} 80 22)`);
  } else if (screwState === "in") {
    if (!screwDrag) screwSpin += 46 * dt;    // idles in circles — an invitation
    const ext = Math.min(1, extractDeg / 720);
    screwEl.style.top = (screwTargetY - ext * 70 * UIS) + "px";
    corkEl.style.transform = `translateY(${-ext * 70 * UIS}px)`;
    screwWheelEl.setAttribute("transform", `rotate(${screwSpin + extractDeg} 80 22)`);
    if (ext >= 1) {
      screwState = "done";
      corkPopSound();
      drainOpen = true;
      startGurgle();
      /* unplugged — the corkscrew rises up and away with its prize */
      screwEl.style.transition = "top 1.4s ease-in, opacity 0.6s ease 1.3s";
      screwEl.style.top = (screwTargetY - 390 * UIS) + "px";
      screwEl.style.opacity = "0";
      corkEl.style.transition = "transform 1.4s ease-in, opacity 0.6s ease 1.3s";
      corkEl.style.transform = `translateY(${-390 * UIS}px) rotate(14deg)`;
      corkEl.style.opacity = "0";
      setTimeout(() => { screwEl.style.display = "none"; corkEl.style.display = "none"; }, 2100);
    }
  }
}

/* twist the corkscrew to pull the cork — grab it anywhere, circle anywhere */
screwEl.addEventListener("pointerdown", (e) => {
  if (screwState !== "in") return;
  e.preventDefault();
  screwEl.setPointerCapture(e.pointerId);
  screwWheelEl.classList.add("grabbing");
  const r = screwWheelEl.getBoundingClientRect();
  screwDrag = {
    cx: r.left + r.width / 2, cy: r.top + r.height / 2,
    last: Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)),
  };
  twistScrew(96);                     /* a tap is a turn, same as everything else */
});
function twistScrew(deg) {
  const before = extractDeg;
  extractDeg = Math.min(720, extractDeg + Math.abs(deg));
  if (((before / 150) | 0) !== ((extractDeg / 150) | 0)) tapSqueak();
}
screwEl.addEventListener("pointermove", (e) => {
  if (!screwDrag || screwState !== "in") return;
  const a = Math.atan2(e.clientY - screwDrag.cy, e.clientX - screwDrag.cx);
  let d = a - screwDrag.last;
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  screwDrag.last = a;
  twistScrew(d * 57.2958);
});
const endScrewDrag = () => { screwDrag = null; screwWheelEl.classList.remove("grabbing"); };
screwEl.addEventListener("pointerup", endScrewDrag);
screwEl.addEventListener("pointercancel", endScrewDrag);

/* ================= the goo =================
   What the water was hiding: rainbow slime over everything. Push on it
   and it gushes out from under your finger — like those gel shoes. */
const gooCanvas = document.getElementById("goo");
const gtx = gooCanvas.getContext("2d");
let gooIdle = 0;
let gooActive = false, gooBlobs = [], gooGush = [], gooSpecks = [], lastSquelch = 0;
let tearCanvas = null, tearCtx = null, gooFringes = [], gooStrands = [], gooScraps = [], gooSmears = [], gooFinished = false, dotWhitened = false, ripCount = 0;

let gooLow = null, gooLowCtx = null;
function sizeGoo() {
  gooCanvas.width = window.innerWidth;
  gooCanvas.height = window.innerHeight;
  gooCanvas.style.width = window.innerWidth + "px";
  gooCanvas.style.height = window.innerHeight + "px";
  /* the soft layers render at half resolution — goo is blur, blur upscales free */
  gooLow = document.createElement("canvas");
  gooLow.width = Math.max(2, window.innerWidth >> 1);
  gooLow.height = Math.max(2, window.innerHeight >> 1);
  gooLowCtx = gooLow.getContext("2d");
  gooLowCtx.setTransform(0.5, 0, 0, 0.5, 0, 0);
  tearCanvas = document.createElement("canvas");
  tearCanvas.width = gooCanvas.width;
  tearCanvas.height = gooCanvas.height;
  tearCtx = tearCanvas.getContext("2d", { willReadFrequently: true });
}
function activateGoo() {
  mark("goo");
  if (gooActive) return;
  const W = window.innerWidth, H = window.innerHeight;
  sizeGoo();
  gooBlobs = [];
  const N = Math.max(12, Math.min(26, Math.round((W * H) / 38000)));
  for (let i = 0; i < N; i++) {
    gooBlobs.push({
      bx: Math.random() * W, by: Math.random() * H,
      x: 0, y: 0, vx: 0, vy: 0,
      r: 150 + Math.random() * 200,
      hue: (i * 360 / N + Math.random() * 24) % 360,
      f1: 0.1 + Math.random() * 0.25, p1: Math.random() * 6.3,
      f2: 0.1 + Math.random() * 0.25, p2: Math.random() * 6.3,
    });
  }
  gooSpecks = [];
  for (let i = 0; i < 150; i++) {
    gooSpecks.push({ x: Math.random() * W, y: Math.random() * H, r: 0.8 + Math.random() * 1.8 });
  }
  gooCanvas.style.display = "block";
  requestAnimationFrame(() => gooCanvas.classList.add("on"));
  gooActive = true;
  bed('goo');
}

function gooPress(x, y, str) {
  for (const b of gooBlobs) {
    const dx = b.x - x, dy = b.y - y;
    const d = Math.hypot(dx, dy);
    if (d < 300 && d > 0.01) {
      const f = (1 - d / 300) * 950 * str;
      b.vx += (dx / d) * f;
      b.vy += (dy / d) * f;
    }
  }
  if (gooGush.length < 24) gooGush.push({ x, y, r: 8, vr: 260 * (0.6 + str * 0.6), life: 1 });
  if (str > 0.5 && gooSmears.length < 40) gooSmears.push({ x, y, r: 34 + Math.random() * 26, life: 5 });
  const nw = performance.now();
  if (nw - lastSquelch > 160) { lastSquelch = nw; squelchSound(str); }
}
window.addEventListener("pointerdown", (e) => {
  if (!gooActive || gooFinished) return;
  if (vol <= 0.02) {
    makeRip(e.clientX, e.clientY);   // once it's dry, the gel tears like tissue paper
    gooPress(e.clientX, e.clientY, 0.8);
  } else {
    gooPress(e.clientX, e.clientY, 1);
  }
});
window.addEventListener("pointermove", (e) => { if (gooActive && !gooFinished && e.buttons) gooPress(e.clientX, e.clientY, 0.35); });

/* rip a jagged tissue-paper hole through to the white underneath */
function makeRip(x, y) {
  if (!dotWhitened) { dotWhitened = true; dotEl.style.background = "#fdfdfb"; }
  const N = 16;
  /* every tear weakens the sheet — later ones open wider */
  ripCount++; gooIdle = 0;
  const base = (58 + Math.random() * 58) * (1 + ripCount * 0.09);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    let rad = base * (0.55 + Math.random() * 0.6);
    if (Math.random() < 0.22) rad *= 1.4;          // deeper snags
    pts.push([x + Math.cos(a) * rad, y + Math.sin(a) * rad]);
  }
  const path = new Path2D();
  path.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < N; i++) path.lineTo(pts[i][0], pts[i][1]);
  path.closePath();
  tearCtx.fillStyle = "#fff";
  tearCtx.fill(path);
  if (gooFringes.length < 120) gooFringes.push(path);
  /* fibrous strands sticking out of the tear like real torn tissue */
  const strands = new Path2D();
  for (let k = 0; k < 7; k++) {
    const p = pts[(Math.random() * N) | 0];
    let dx = p[0] - x, dy = p[1] - y;
    const dl = Math.hypot(dx, dy) || 1;
    dx /= dl; dy /= dl;
    const ln = 4 + Math.random() * 9;
    strands.moveTo(p[0], p[1]);
    strands.lineTo(p[0] + dx * ln + (Math.random() - 0.5) * 3,
                   p[1] + dy * ln + (Math.random() - 0.5) * 3);
  }
  if (gooStrands.length < 120) gooStrands.push(strands);
  /* shreds flutter off the tear */
  for (let i = 0; i < 7; i++) {
    if (gooScraps.length > 90) break;
    gooScraps.push({
      x: x + (Math.random() - 0.5) * base, y: y + (Math.random() - 0.5) * base,
      vx: (Math.random() - 0.5) * 240, vy: -60 - Math.random() * 100,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 10,
      w: 10 + Math.random() * 16, h: 7 + Math.random() * 9,
      hue: Math.random() * 360, life: 1.5 + Math.random() * 0.7,
    });
  }
  ripSound();
  /* torn enough? the rest gives way */
  const d = tearCtx.getImageData(0, 0, tearCanvas.width, tearCanvas.height).data;
  let hit = 0, tot = 0;
  for (let yy = 0; yy < tearCanvas.height; yy += 40) {
    for (let xx = 0; xx < tearCanvas.width; xx += 40) {
      tot++;
      if (d[(yy * tearCanvas.width + xx) * 4 + 3] > 10) hit++;
    }
  }
  /* don't make it a chore: once it's mostly gone, or you've torn enough
     holes in it, the rest of the sheet lets go on its own */
  if (hit / tot > 0.55 || ripCount >= 13) finishGoo();
}

function finishGoo() {
  if (gooFinished) return;
  gooFinished = true;
  ripSound(); ripSound();                        // the whole sheet lets go
  /* it doesn't slide off — it tears into pieces and tumbles */
  const W = window.innerWidth, H = window.innerHeight;
  const cuts = [0, 0.22 + Math.random() * 0.15, 0.5 + Math.random() * 0.12, 0.78 + Math.random() * 0.1, 1];
  for (let k = 0; k < 4; k++) {
    const x0 = Math.round(cuts[k] * W), x1 = Math.round(cuts[k + 1] * W);
    const pw = x1 - x0;
    if (pw < 4) continue;
    const pc = document.createElement("canvas");
    pc.width = pw; pc.height = H;
    pc.getContext("2d").drawImage(gooCanvas, x0, 0, pw, H, 0, 0, pw, H);
    pc.style.cssText = `position:fixed;left:${x0}px;top:0;width:${pw}px;height:${H}px;`
      + `z-index:8;pointer-events:none;`
      + `transition:transform ${1.0 + k * 0.18}s var(--ease-fall) ${k * 0.09}s,`
      + `opacity 0.5s ease ${0.7 + k * 0.2}s;`;
    document.body.appendChild(pc);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      pc.style.transform = `translateY(${H * 1.3}px) rotate(${Math.random() * 36 - 18}deg)`;
      pc.style.opacity = "0";
    }));
    setTimeout(() => pc.remove(), 2800);
  }
  gooActive = false;
  /* what was holding the sheet up is still there, and it runs — down the
     frame, darkening as it goes, until it is the ink of the next scene */
  setTimeout(() => {
    finCanvas.style.background = "transparent";
    finCanvas.style.display = "block";
    sizeFinale();
    natRun("drip", () => { gooCanvas.style.display = "none"; startFinale(); },
           2.8, { travel: true });
    travelOnly = true;
  }, 1500);
}

function ripSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  for (let k = 0; k < 2; k++) {
    const s = ac.createBufferSource(); s.buffer = noise(ac);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(3400 - k * 900, t0 + k * 0.03);
    bp.frequency.exponentialRampToValueAtTime(1200 - k * 300, t0 + 0.2 + k * 0.03);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + k * 0.03);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015 + k * 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22 + k * 0.03);
    s.connect(bp); bp.connect(g); g.connect(BUS);
    s.start(t0 + k * 0.03); s.stop(t0 + 0.26 + k * 0.03);
  }
}

function squelchSound(v) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(520, t0);
  lp.frequency.exponentialRampToValueAtTime(160, t0 + 0.22);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.22 * v, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.28);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(130, t0);
  o.frequency.exponentialRampToValueAtTime(55, t0 + 0.16);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.12 * v, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
  o.connect(g2); g2.connect(BUS);
  o.start(t0); o.stop(t0 + 0.2);
}

let gooTile = null, gooPat = null;
function buildGooTile() {
  const S = 96, c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d");
  for (let i = 0; i < 2400; i++) {
    const v = Math.random();
    g.fillStyle = v > 0.5 ? `rgba(255,255,255,${(v * 0.16).toFixed(3)})`
                          : `rgba(40,20,60,${((0.5 - v) * 0.16).toFixed(3)})`;
    g.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  gooTile = c;
}

function gooFrame(dt) {
  if (!gooActive) return;
  const W = window.innerWidth, H = window.innerHeight;
  const lg = gooLowCtx;   /* soft layers render at half res */

  /* base: a slow-cycling rainbow wash */
  const ang = wT * 0.12;
  const gx = Math.cos(ang), gy = Math.sin(ang);
  const grad = lg.createLinearGradient(
    W / 2 - gx * W * 0.6, H / 2 - gy * H * 0.6,
    W / 2 + gx * W * 0.6, H / 2 + gy * H * 0.6);
  for (let k = 0; k <= 6; k++) {
    grad.addColorStop(k / 6, `hsl(${((wT * 7 * RUN.gooSpin) + RUN.hueShift + k * 60) % 360},84%,50%)`);
  }
  lg.fillStyle = grad;
  lg.fillRect(0, 0, W, H);

  /* the blobs ooze around their drifting homes, shoved aside by presses */
  for (const b of gooBlobs) {
    const hx = b.bx + Math.sin(wT * b.f1 + b.p1) * 55;
    const hy = b.by + Math.sin(wT * b.f2 + b.p2) * 45;
    if (!b.x && !b.y) { b.x = hx; b.y = hy; }
    b.vx += (hx - b.x) * 2.1 * dt * 60 * 0.016;
    b.vy += (hy - b.y) * 2.1 * dt * 60 * 0.016;
    const damp = Math.exp(-1.7 * dt);
    b.vx *= damp; b.vy *= damp;
    b.x += b.vx * dt; b.y += b.vy * dt;
    const rg = lg.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
    rg.addColorStop(0, `hsla(${(b.hue + RUN.hueShift + wT * 5 * RUN.gooSpin) % 360},92%,56%,0.80)`);
    rg.addColorStop(1, "hsla(0,0%,100%,0)");
    lg.fillStyle = rg;
    lg.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    /* the film catches the light along the top of every bulge */
    const rim = lg.createRadialGradient(b.x, b.y, b.r * 0.52, b.x, b.y, b.r * 0.92);
    rim.addColorStop(0, "rgba(255,255,255,0)");
    rim.addColorStop(0.72, "rgba(255,255,255,0.10)");
    rim.addColorStop(1, "rgba(255,255,255,0)");
    lg.fillStyle = rim;
    lg.beginPath(); lg.arc(b.x, b.y, b.r * 0.95, 0, 6.3); lg.fill();
    if (W >= 700) {
    const hot = lg.createRadialGradient(
      b.x - b.r * 0.34, b.y - b.r * 0.38, 0,
      b.x - b.r * 0.34, b.y - b.r * 0.38, b.r * 0.30);
    hot.addColorStop(0, "rgba(255,255,255,0.30)");
    hot.addColorStop(1, "rgba(255,255,255,0)");
    lg.fillStyle = hot;
    lg.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
  }

  /* trapped-air specks + a plastic-sheen streak, so it reads as goo under film */
  lg.fillStyle = "rgba(255,255,255,0.10)";
  for (const sp of gooSpecks) {
    lg.beginPath();
    lg.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
    lg.fill();
  }
  /* oil-slick iridescence: two rainbow washes sliding against the drift */
  lg.globalCompositeOperation = "overlay";
  const passes = W < 700 ? 1 : 2;
  for (let k = 0; k < passes; k++) {
    const a2 = (k ? -1 : 1) * (wT * (0.09 + k * 0.05)) + k * 2.2;
    const dx2 = Math.cos(a2), dy2 = Math.sin(a2);
    const og = lg.createLinearGradient(
      W / 2 - dx2 * W * 0.55, H / 2 - dy2 * H * 0.55,
      W / 2 + dx2 * W * 0.55, H / 2 + dy2 * H * 0.55);
    for (let st = 0; st <= 4; st++) {
      og.addColorStop(st / 4, `hsla(${((wT * 16 * (k + 1)) + st * 90) % 360},95%,60%,0.16)`);
    }
    lg.fillStyle = og;
    lg.fillRect(0, 0, W, H);
  }
  lg.globalCompositeOperation = "source-over";

  /* a hard little reflection sliding over the plastic — a broad sheen alone
     reads as fog; it takes one crisp highlight to read as a surface */
  const hx2 = W * (0.24 + 0.06 * Math.sin(wT * 0.23));
  const hy2 = H * (0.20 + 0.05 * Math.sin(wT * 0.31 + 1.1));
  const hr = Math.min(W, H) * 0.16;
  const spec2 = lg.createRadialGradient(hx2, hy2, 0, hx2, hy2, hr);
  spec2.addColorStop(0, "rgba(255,255,255,0.30)");
  spec2.addColorStop(0.45, "rgba(255,255,255,0.09)");
  spec2.addColorStop(1, "rgba(255,255,255,0)");
  lg.save();
  lg.translate(hx2, hy2); lg.scale(1.7, 1); lg.translate(-hx2, -hy2);
  lg.fillStyle = spec2;
  lg.fillRect(hx2 - hr * 1.2, hy2 - hr, hr * 2.4, hr * 2);
  lg.restore();

  /* tooth, and the roll-off at the edges that makes it sit in the frame
     like an object — both on the half-res canvas, four times cheaper and
     indistinguishable once it is blown back up */
  if (!gooTile) buildGooTile();
  if (!gooPat) gooPat = lg.createPattern(gooTile, "repeat");
  lg.globalAlpha = 0.16;
  lg.fillStyle = gooPat;
  lg.fillRect(0, 0, W, H);
  lg.globalAlpha = 1;
  const vg = lg.createRadialGradient(W * 0.5, H * 0.46, Math.min(W, H) * 0.28,
                                     W * 0.5, H * 0.46, Math.max(W, H) * 0.78);
  vg.addColorStop(0, "rgba(24,12,34,0)");
  vg.addColorStop(1, "rgba(20,8,30,0.46)");
  lg.fillStyle = vg;
  lg.fillRect(0, 0, W, H);

  /* composite the soft stack up to full res in one blit */
  gtx.drawImage(gooLow, 0, 0, W, H);

  /* pressed spots stay smudged for a while, then heal */
  for (let i = gooSmears.length - 1; i >= 0; i--) {
    const sm = gooSmears[i];
    sm.life -= dt;
    if (sm.life <= 0) { gooSmears.splice(i, 1); continue; }
    const sg = gtx.createRadialGradient(sm.x, sm.y, 0, sm.x, sm.y, sm.r);
    sg.addColorStop(0, `rgba(30,20,40,${0.10 * Math.min(1, sm.life / 4)})`);
    sg.addColorStop(1, "rgba(30,20,40,0)");
    gtx.fillStyle = sg;
    gtx.fillRect(sm.x - sm.r, sm.y - sm.r, sm.r * 2, sm.r * 2);
  }

  gtx.save();
  gtx.translate(W * 0.5, H * 0.4);
  gtx.rotate(-0.5 + Math.sin(wT * 0.3) * 0.06);
  const sheen = gtx.createLinearGradient(0, -60, 0, 60);
  sheen.addColorStop(0, "rgba(255,255,255,0)");
  sheen.addColorStop(0.5, "rgba(255,255,255,0.12)");
  sheen.addColorStop(1, "rgba(255,255,255,0)");
  gtx.fillStyle = sheen;
  gtx.fillRect(-W, -60, W * 2, 120);
  gtx.restore();

  /* Nothing here says the sheet can be torn. If they have not tried, the
     surface starts to give on its own — a seam opening and healing, in the
     middle of the frame, where they are already looking. */
  gooIdle += dt;
  if (ripCount === 0 && gooIdle > 4.5) {
    const p = (gooIdle - 4.5) % 3.2;
    const a = Math.sin(Math.min(1, p / 1.6) * Math.PI) * Math.min(1, (gooIdle - 4.5) / 2.5);
    if (a > 0.01) {
      const cx = W * 0.5, cy = H * 0.47, len = Math.min(W, H) * 0.13 * (0.4 + 0.6 * a);
      gtx.save();
      gtx.globalCompositeOperation = "lighter";
      gtx.strokeStyle = `rgba(255,255,255,${(a * 0.5).toFixed(3)})`;
      gtx.lineWidth = 2.2 + a * 3.4;
      gtx.lineCap = "round";
      gtx.beginPath();
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const x = cx + (t - 0.5) * 2 * len;
        const y = cy + Math.sin(t * 9 + gooIdle) * len * 0.09 * a;
        i ? gtx.lineTo(x, y) : gtx.moveTo(x, y);
      }
      gtx.stroke();
      gtx.restore();
    }
  }



  /* the tears: punch through to the white, leave frayed edges */
  if (gooFringes.length) {
    gtx.globalCompositeOperation = "destination-out";
    gtx.drawImage(tearCanvas, 0, 0);
    gtx.globalCompositeOperation = "source-over";
    gtx.strokeStyle = "rgba(255,255,255,0.85)";
    gtx.lineWidth = 4;
    for (const f of gooFringes) gtx.stroke(f);
    gtx.strokeStyle = "rgba(255,255,255,0.7)";
    gtx.lineWidth = 1.3;
    for (const sPath of gooStrands) gtx.stroke(sPath);
  }

  /* shreds fluttering off fresh rips */
  for (let i = gooScraps.length - 1; i >= 0; i--) {
    const sc = gooScraps[i];
    sc.life -= dt;
    if (sc.life <= 0) { gooScraps.splice(i, 1); continue; }
    sc.vy += 420 * dt;
    sc.x += sc.vx * dt; sc.y += sc.vy * dt;
    sc.vx *= 1 - Math.min(1, 1.5 * dt);
    sc.rot += sc.vr * dt;
    gtx.save();
    gtx.translate(sc.x, sc.y);
    gtx.rotate(sc.rot);
    gtx.globalAlpha = Math.min(1, sc.life);
    gtx.fillStyle = `hsl(${sc.hue},80%,62%)`;
    gtx.fillRect(-sc.w / 2, -sc.h / 2, sc.w, sc.h);
    gtx.restore();
  }
  gtx.globalAlpha = 1;

  /* gushes: the squish rippling out from under your press */
  for (let i = gooGush.length - 1; i >= 0; i--) {
    const gsh = gooGush[i];
    gsh.life -= dt * 1.5;
    if (gsh.life <= 0) { gooGush.splice(i, 1); continue; }
    gsh.r += gsh.vr * dt;
    /* the bulge: goo squeezed bright at the center, compressed dark at the rim */
    gtx.beginPath();
    gtx.arc(gsh.x, gsh.y, Math.max(1, gsh.r * 0.45), 0, Math.PI * 2);
    gtx.fillStyle = `rgba(255,255,255,${0.28 * gsh.life})`;
    gtx.fill();
    gtx.beginPath();
    gtx.arc(gsh.x, gsh.y, gsh.r, 0, Math.PI * 2);
    gtx.strokeStyle = `rgba(255,255,255,${0.45 * gsh.life})`;
    gtx.lineWidth = 7 * gsh.life + 1;
    gtx.stroke();
    gtx.beginPath();
    gtx.arc(gsh.x, gsh.y, gsh.r * 0.75, 0, Math.PI * 2);
    gtx.strokeStyle = `rgba(0,0,0,${0.10 * gsh.life})`;
    gtx.lineWidth = 10 * gsh.life + 1;
    gtx.stroke();
  }
}

function startGurgle() {
  const ac = audio(); if (!ac) return;
  const src = ac.createBufferSource(); src.buffer = noise(ac); src.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.6;
  const g = ac.createGain(); g.gain.value = 0.16;
  src.connect(bp); bp.connect(g); g.connect(BUS);
  src.start();
  gurgle = { src, bp, g };
}

/* ================= the finale =================
   The white paper takes an ink drop, the drop splatters, and then the ink
   lets go: it floods the frame and the weather comes in. */
const finCanvas = document.getElementById("finale");
const fctx = finCanvas.getContext("2d");
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let finActive = false, fT = 0;
let inkY = 0, inkV = 0, splatT = -1, splatBlobs = [], splatDots = [], splatArms = [];

function sizeFinale() {
  /* the storm is thousands of thin strokes over full-screen fills — it is
     entirely fill-rate bound, so it renders at 1x and lets the browser
     upscale. Costs 2.25x less than 1.5x and is invisible in motion. */
  const dpr = 1;
  finCanvas.width = window.innerWidth * dpr;
  finCanvas.height = window.innerHeight * dpr;
  finCanvas.style.width = window.innerWidth + "px";
  finCanvas.style.height = window.innerHeight + "px";
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildRain();
}

/* ================= the storm =================
   The ink does not spin. It lets go: the blot creeps outward with a ragged
   edge, runs stream down the paper the way wet ink does, and the whole
   frame floods to black. Then it rains — three parallax layers sheared by
   gusts that never repeat, drops that part around your cursor, splashes
   coming back off the ground. Lightning is a real channel, built by
   recursive midpoint displacement with its own branches, and the thunder
   arrives late by however far away the strike was. Near ones shake the
   frame. Then the cord drops out of the dark. */

let inkRuns = [], inkEdge = [], inkLag = [];
const INK_N = 72;
function buildInk(cx, cy) {
  /* correlated noise, not white noise — smoothing the ring a few times is
     what turns a spiky polygon into something that reads as spreading ink */
  inkEdge = [];
  for (let i = 0; i < INK_N; i++) inkEdge.push(Math.random());
  for (let pass = 0; pass < 4; pass++) {
    const s = inkEdge.slice();
    for (let i = 0; i < INK_N; i++)
      inkEdge[i] = (s[(i - 1 + INK_N) % INK_N] + s[i] * 2 + s[(i + 1) % INK_N]) / 4;
  }
  /* each lobe sets off at its own moment, so it creeps rather than balloons */
  inkLag = [];
  for (let i = 0; i < INK_N; i++) inkLag.push(0.10 + Math.random() * 0.34);
  for (let pass = 0; pass < 3; pass++) {
    const s = inkLag.slice();
    for (let i = 0; i < INK_N; i++)
      inkLag[i] = (s[(i - 1 + INK_N) % INK_N] + s[i] + s[(i + 1) % INK_N]) / 3;
  }
  inkRuns = [];
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, d = 20 + Math.random() * 190;
    inkRuns.push({
      x0: Math.cos(a) * d, y0: Math.sin(a) * d * 0.7,
      len: 200 + Math.random() * 780, w: 3 + Math.random() * 13,
      wob: (Math.random() - 0.5) * 34, ph: Math.random() * 6.3,
      d: Math.random() * 0.16,
    });
  }
}

let rainL = null, drops = null, splashes = [];
function buildRain() {
  const W = window.innerWidth, H = window.innerHeight;
  const tier = Math.max(0.42, Math.min(1, (W * H) / (1500 * 860)));
  rainL = [
    { n: Math.round(240 * tier), v: 640, len: 15, w: 0.9, a: 0.30, par: 0.42 },
    { n: Math.round(150 * tier), v: 1020, len: 28, w: 1.35, a: 0.52, par: 0.72 },
    { n: Math.round(78 * tier), v: 1520, len: 48, w: 2.1, a: 0.80, par: 1.0 },
  ];
  drops = rainL.map(L => {
    const a = [];
    for (let i = 0; i < L.n; i++)
      a.push({ x: Math.random() * W * 1.5 - W * 0.25, y: Math.random() * H, vx: 0 });
    return a;
  });
  splashes = [];
}

let wind = 0, windT = 0, gust = 0;
let ptrX = 0, ptrY = 0, ptrVX = 0, ptrT = 0, lastPX = 0, lastPT = 0;
let bolt = null, boltT = 0, nextBolt = 0.9, flashA = 0, shake = 0;
const BOLT_SEQ = [1, 0.22, 0.95, 0.14, 0.62, 0.08, 0.34, 0.06, 0.18];

/* the storm reads your cursor as wind — drops part around a fast swipe */
window.addEventListener("pointermove", (e) => {
  if (!finActive || nightPhase) return;
  const now = performance.now();
  const dtp = Math.max(8, now - lastPT);
  ptrVX = (e.clientX - lastPX) / dtp * 1000;
  lastPX = e.clientX; lastPT = now;
  ptrX = e.clientX; ptrY = e.clientY; ptrT = 0.35;
}, { passive: true });

function makeBolt(W, H, dist) {
  const x0 = W * (0.06 + Math.random() * 0.88);
  let list = [{ x: x0, y: -30 },
              { x: x0 + (Math.random() - 0.5) * W * 0.55, y: H * (0.52 + Math.random() * 0.55) }];
  let disp = W * 0.10;
  for (let it = 0; it < 6; it++) {
    const out = [list[0]];
    for (let i = 1; i < list.length; i++) {
      const a = list[i - 1], b = list[i];
      const nx = -(b.y - a.y), ny = b.x - a.x;
      const nl = Math.hypot(nx, ny) || 1;
      const o = (Math.random() - 0.5) * disp;
      out.push({ x: (a.x + b.x) / 2 + nx / nl * o, y: (a.y + b.y) / 2 + ny / nl * o });
      out.push(b);
    }
    list = out; disp *= 0.56;
  }
  const branches = [];
  const nb = 1 + (Math.random() * (1 + 4 * RUN.forky) | 0);
  for (let k = 0; k < nb; k++) {
    const i = 6 + (Math.random() * (list.length - 12) | 0);
    const p = list[i];
    let a = Math.atan2(list[i + 1].y - p.y, list[i + 1].x - p.x) + (Math.random() - 0.5) * 1.6;
    const steps = 6 + (Math.random() * 7 | 0);
    const seg = H * (0.08 + Math.random() * 0.20) / steps;
    const bl = [p];
    let bx = p.x, by = p.y;
    for (let s = 0; s < steps; s++) {
      a += (Math.random() - 0.5) * 0.7;
      bx += Math.cos(a) * seg; by += Math.abs(Math.sin(a)) * seg * 0.9 + seg * 0.3;
      bl.push({ x: bx, y: by });
    }
    branches.push(bl);
  }
  return { main: list, branches, life: 0.38 + Math.random() * 0.22,
           power: 1 - dist * 0.72 };
}

function drawBolt(b, vis) {
  const trace = (pts) => {
    fctx.beginPath();
    for (let i = 0; i < pts.length; i++)
      i ? fctx.lineTo(pts[i].x, pts[i].y) : fctx.moveTo(pts[i].x, pts[i].y);
    fctx.stroke();
  };
  fctx.save();
  fctx.lineCap = "round"; fctx.lineJoin = "round";
  fctx.globalCompositeOperation = "lighter";
  const p = vis * b.power;
  /* glow, channel, then a hard white core — that stack is what makes it
     read as light rather than a drawn line */
  fctx.strokeStyle = `rgba(120,160,255,${(0.16 * p).toFixed(3)})`;
  fctx.lineWidth = 16; trace(b.main);
  fctx.strokeStyle = `rgba(180,205,255,${(0.34 * p).toFixed(3)})`;
  fctx.lineWidth = 6; trace(b.main);
  for (const br of b.branches) { fctx.lineWidth = 3; trace(br); }
  fctx.strokeStyle = `rgba(255,255,255,${(0.95 * p).toFixed(3)})`;
  fctx.lineWidth = 1.8; trace(b.main);
  fctx.lineWidth = 1.0;
  for (const br of b.branches) trace(br);
  fctx.restore();
}

/* --- sound: a rain bed, wind, and thunder that arrives when it should --- */
let stormAudio = null;
function startStorm() {
  const ac = audio(); if (!ac || stormAudio) return;
  const nb = noise(ac);
  const mk = (type, freq, q) => {
    const s = ac.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type;
    f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain(); g.gain.value = 0.0001;
    s.connect(f); f.connect(g); g.connect(BUS);
    s.start();
    return { s, f, g };
  };
  const rain = mk("highpass", 1400, 0.6);
  const wnd = mk("bandpass", 340, 0.55);
  /* the wind breathes rather than sitting flat */
  const lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.16;
  const lg = ac.createGain(); lg.gain.value = 0.055;
  lfo.connect(lg); lg.connect(wnd.g.gain); lfo.start();
  stormAudio = { rain, wnd, lfo };
}

function stormLevel(v) {
  if (!stormAudio || !AC) return;
  const t = AC.currentTime;
  stormAudio.rain.g.gain.setTargetAtTime(0.055 * v, t, 0.4);
  stormAudio.wnd.g.gain.setTargetAtTime(0.075 * v, t, 0.6);
  stormAudio.rain.f.frequency.setTargetAtTime(1400 - 500 * v, t, 0.5);
}

function stopStorm() {
  if (!stormAudio || !AC) return;
  const t = AC.currentTime;
  const S = stormAudio; stormAudio = null;
  S.rain.g.gain.setTargetAtTime(0.0001, t, 0.35);
  S.wnd.g.gain.setTargetAtTime(0.0001, t, 0.5);
  setTimeout(() => {
    try { S.rain.s.stop(); S.wnd.s.stop(); S.lfo.stop(); } catch (e) {}
  }, 2200);
}

function thunder(power, dist, px) {
  const ac = audio(); if (!ac) return;
  /* sound is slow: the further off the strike, the later and duller it lands */
  const t0 = ac.currentTime + 0.12 + dist * 3.4;
  const dur = 2.2 + dist * 3.2;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(Math.max(70, 420 - dist * 300), t0);
  lp.frequency.exponentialRampToValueAtTime(52, t0 + dur);
  const g = ac.createGain();
  const peak = Math.max(0.02, 0.26 * power);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.05 + dist * 0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  const dst = at(px) || BUS;
  s.connect(lp); lp.connect(g); g.connect(dst);
  s.start(t0); s.stop(t0 + dur + 0.4);
  /* close strikes crack before they rumble */
  if (dist < 0.36) {
    const c = ac.createBufferSource(); c.buffer = noise(ac);
    const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const cg = ac.createGain();
    cg.gain.setValueAtTime(0.30 * (1 - dist / 0.36), t0);
    cg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
    c.connect(hp); hp.connect(cg); cg.connect(dst);
    c.start(t0); c.stop(t0 + 0.3);
  }
}

function startFinale() {
  if (finActive) return;
  finCanvas.style.background = "#fdfdfb";     /* the paper is back */
  sizeFinale();
  finActive = true;
  mark("storm");
  fT = 0; inkY = 0; inkV = 0; splatT = -1;
  finCanvas.style.display = "block";

  /* every earlier layer is spent by now. They were still full-screen
     canvases the compositor had to blend on every single frame, for
     nothing — that is pure GPU cost, and it is worst on phones. */
  for (const id of ["glue", "glitter", "goo", "dot", "stage", "veil"]) {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  }

  const rnd = (a, b) => a + Math.random() * (b - a);
  splatBlobs = []; splatDots = []; splatArms = [];
  for (let i = 0; i < 15; i++) {
    const a = rnd(0, Math.PI * 2), d = rnd(0, 46);
    splatBlobs.push({ a, d, r: rnd(16, 54), sq: rnd(0.6, 1.3), rot: rnd(0, 6.3) });
  }
  for (let i = 0; i < 34; i++) {
    const a = rnd(0, Math.PI * 2);
    splatDots.push({ a, d: rnd(55, 235), r: rnd(1.6, 9) });
  }
  for (let i = 0; i < 9; i++) {
    const a = rnd(0, Math.PI * 2);
    splatArms.push({ a, len: rnd(60, 190), w: rnd(4, 14), curl: rnd(-0.5, 0.5) });
  }

  inkRuns = []; splashes = [];
  bolt = null; boltT = 0; nextBolt = 1.0; flashA = 0; shake = 0;
  windT = 0; wind = 0;
}

/* --- pieces --- */
function capsule(x1, y1, x2, y2, w, col) {
  fctx.strokeStyle = col; fctx.lineWidth = w; fctx.lineCap = "round";
  fctx.beginPath(); fctx.moveTo(x1, y1); fctx.lineTo(x2, y2); fctx.stroke();
}

/* a limb with the same three-layer treatment as the balloons:
   dark rim, body, highlight offset toward the light */
function limb(x1, y1, x2, y2, w, base, dark, light) {
  fctx.lineCap = "round";
  fctx.strokeStyle = dark; fctx.lineWidth = w;
  fctx.beginPath(); fctx.moveTo(x1, y1); fctx.lineTo(x2, y2); fctx.stroke();
  fctx.strokeStyle = base; fctx.lineWidth = w * 0.82;
  fctx.beginPath(); fctx.moveTo(x1, y1); fctx.lineTo(x2, y2); fctx.stroke();
  fctx.strokeStyle = light; fctx.lineWidth = w * 0.3;
  fctx.beginPath();
  fctx.moveTo(x1 - w * 0.16, y1 - w * 0.18);
  fctx.lineTo(x2 - w * 0.16, y2 - w * 0.18);
  fctx.stroke();
}
function ball(x, y, r, base, dark, light) {
  const g = fctx.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.05, x, y, r * 1.08);
  g.addColorStop(0, light);
  g.addColorStop(0.55, base);
  g.addColorStop(1, dark);
  fctx.fillStyle = g;
  fctx.beginPath(); fctx.arc(x, y, r, 0, 6.3); fctx.fill();
}

/* The 1996 baby: chunky, rendered, and doing the cha-cha. Weight shifts
   on every beat, arms pump on the off-beat, knees bend under the weight,
   and every eight beats it turns all the way around. */
const sstep = (a, b, t) => { const x = Math.max(0, Math.min(1, (t-a)/(b-a))); return x*x*(3-2*x); };

function finaleFrame(dt) {
  if (!finActive) return;
  if (nightPhase) { drawNight(dt); return; }   // the party is over
  fT += dt;
  if (fT > 15.5) showCord();
  const W = window.innerWidth, H = window.innerHeight;
  const cx = W / 2, cy = H * 0.46;


  const ink = "#0b0b0d";
  hardClear(finCanvas, fctx);

  /* ---- 1. the ink drop ---- */
  if (splatT < 0) {
    const swell = Math.min(1, fT / 1.0);
    if (fT < 1.0) {
      fctx.fillStyle = ink;
      const r = 6 + swell * 15;
      fctx.beginPath();
      fctx.ellipse(cx, r * 0.7, r * 0.8, r * (0.9 + swell * 0.35), 0, 0, 6.3);
      fctx.fill();
    } else {
      inkV += 2400 * dt; inkY += inkV * dt;
      const y = 18 + inkY;
      fctx.fillStyle = ink;
      const st = Math.min(1, inkV / 900);
      fctx.beginPath();
      fctx.ellipse(cx, y, 17 - st * 6, 20 + st * 30, 0, 0, 6.3);
      fctx.fill();
      fctx.globalAlpha = 0.5;
      capsule(cx, y - 30 - st * 60, cx, y, 6 - st * 3, ink);
      fctx.globalAlpha = 1;
      if (y >= cy) { splatT = fT; splatSound(); }
    }
  }

  /* ---- 2. the splatter ---- */
  if (splatT >= 0) {
    const age = fT - splatT;
    const g = 1 - Math.pow(1 - Math.min(1, age / 0.45), 3);
    fctx.fillStyle = ink;
    for (const b of splatBlobs) {
      fctx.save(); fctx.translate(cx + Math.cos(b.a)*b.d*g, cy + Math.sin(b.a)*b.d*g);
      fctx.rotate(b.rot);
      fctx.beginPath(); fctx.ellipse(0, 0, b.r*g, b.r*b.sq*g, 0, 0, 6.3); fctx.fill();
      fctx.restore();
    }
    for (const a of splatArms) {
      const ex = cx + Math.cos(a.a + a.curl) * a.len * g;
      const ey = cy + Math.sin(a.a + a.curl) * a.len * g;
      capsule(cx + Math.cos(a.a)*20*g, cy + Math.sin(a.a)*20*g, ex, ey, a.w*g, ink);
      fctx.beginPath(); fctx.arc(ex, ey, a.w*0.7*g, 0, 6.3); fctx.fill();
    }
    for (const d of splatDots) {
      fctx.beginPath();
      fctx.arc(cx + Math.cos(d.a)*d.d*g, cy + Math.sin(d.a)*d.d*g, d.r*g, 0, 6.3);
      fctx.fill();
    }
  }

  /* ---- 3. the ink lets go and floods the frame ---- */
  const fl = sstep(1.8, 6.6, fT);
  if (fl > 0) {
    if (!inkRuns.length) buildInk(cx, cy);
    fctx.fillStyle = ink;
    /* the blot creeps outward with a ragged edge */
    const R = Math.max(W, H) * 0.82;
    const P = [];
    for (let i = 0; i < INK_N; i++) {
      const a = i / INK_N * Math.PI * 2;
      const g = Math.max(0, (fl - inkLag[i]) / (1 - inkLag[i]));
      const r = R * Math.pow(g, 2.6) * (0.60 + inkEdge[i] * 0.62);
      P.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.86 });
    }
    /* through the midpoints, so the outline is a curve and not a polygon */
    fctx.beginPath();
    fctx.moveTo((P[INK_N - 1].x + P[0].x) / 2, (P[INK_N - 1].y + P[0].y) / 2);
    for (let i = 0; i < INK_N; i++) {
      const c = P[i], n = P[(i + 1) % INK_N];
      fctx.quadraticCurveTo(c.x, c.y, (c.x + n.x) / 2, (c.y + n.y) / 2);
    }
    fctx.closePath(); fctx.fill();
    /* and runs down the paper the way wet ink actually does */
    fctx.lineCap = "round"; fctx.strokeStyle = ink;
    for (const r of inkRuns) {
      const g = Math.max(0, Math.min(1, (fl - r.d) / (1 - r.d * 0.7)));
      if (g <= 0) continue;
      const L = r.len * g * g;
      fctx.lineWidth = r.w * (1 - g * 0.45);
      fctx.beginPath();
      fctx.moveTo(cx + r.x0, cy + r.y0);
      for (let s = 1; s <= 5; s++) {
        const t = s / 5;
        fctx.lineTo(cx + r.x0 + Math.sin(t * 5 + r.ph) * r.wob * t,
                    cy + r.y0 + L * t);
      }
      fctx.stroke();
      fctx.beginPath();     // the bead at the head of the run
      fctx.arc(cx + r.x0 + Math.sin(5 + r.ph) * r.wob, cy + r.y0 + L,
               r.w * 0.62 * (1 - g * 0.3), 0, 6.3);
      fctx.fill();
    }
    /* whatever is left goes under */
    if (fl > 0.66) {
      fctx.globalAlpha = sstep(0.66, 1.0, fl);
      fctx.fillStyle = T.ink;
      fctx.fillRect(-40, -40, W + 80, H + 80);
      fctx.globalAlpha = 1;
    }
  }

  /* everything from here on is the storm, and it gets knocked about
     by the near strikes */
  const inten = sstep(3.2, 8.8, fT);
  if (inten > 0) {
    if (!drops) buildRain();
    startStorm();
    stormLevel(inten);

    shake *= Math.exp(-dt * 4.2);
