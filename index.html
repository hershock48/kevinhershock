<style>
  /* ================= tokens =================
     Twenty-two scenes built over months drift: six near-identical browns for
     the same piece of wood, five easing curves for the same kind of movement.
     That is what makes stages made in different weeks feel like different
     hands made them. Everything that recurs is named once here.

     What is NOT in here, deliberately: the star colours. Rigel is a blue
     supergiant and Vega is not, and the constellations carry real spectral
     values. Collapsing those into a token would delete information rather
     than remove drift. Same for a gradient's own stops — a metal needs three
     values to look like metal. The rule is: name what recurs, leave what
     means something. */
  :root {
    /* --- the four movements. Everything moves in one of these four ways. --- */
    --ease-gentle: cubic-bezier(.19, 1, .22, 1);      /* arriving, settling, drifting */
    --ease-mech:   cubic-bezier(.36, .07, .19, .97);  /* the pump, the key, the switch */
    --ease-burst:  cubic-bezier(.22, 1.4, .36, 1);    /* the pop, and anything springing back */
    --ease-fall:   cubic-bezier(.45, 0, .9, .6);      /* gravity — the only one that accelerates */

    /* --- duration bands --- */
    --t-tick:   0.18s;   /* a click, a flick */
    --t-beat:   0.50s;   /* a thing acknowledging you */
    --t-settle: 1.15s;   /* a thing coming to rest */
    --t-arrive: 2.40s;   /* a thing entering the piece */

    /* --- the materials --- */
    --ink:        #05060a;   /* the dark the back half sits on */
    --paper:      #fdfdfb;   /* the sheet the front half sits on */
    --brass:      #d9a441;
    --brass-dim:  #8a6a1e;
    --brass-lit:  #f4dc9a;
    --wood:       #8a5a2b;
    --wood-edge:  #5f3d1a;
    --sand:       #e8d5ac;
    --starlight:  #e6efff;   /* an anonymous star; the named ones keep their own */
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    /* paper, not a browser default: a warm sheet with a little light on it */
    background: #f7f3ec;
    background-image:
      radial-gradient(ellipse 120% 90% at 50% 22%, #ffffff 0%, rgba(255,255,255,0) 62%),
      linear-gradient(180deg, #fbf8f3 0%, #f4f0e8 62%, #ece7dc 100%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;           /* the whole page is ours — no browser gestures */
    overscroll-behavior: none;
  }
  .pumpHit, #tapWheel, #screwWheel, #key, #chest, #dot {
    touch-action: none;           /* circular drags belong to us, not the browser */
  }
  body.shake { animation: bodyshake 0.4s ease-out; }
  @keyframes bodyshake {
    0% { transform: translate(0, 0); }
    15% { transform: translate(7px, -5px); }
    30% { transform: translate(-6px, 4px); }
    45% { transform: translate(5px, 3px); }
    60% { transform: translate(-4px, -3px); }
    78% { transform: translate(3px, 2px); }
    100% { transform: translate(0, 0); }
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6vh;
    transition: opacity 1.4s ease;
  }
  #stage.gone { opacity: 0; pointer-events: none; }
  #heroSvg { width: 100%; height: auto; max-height: 88vh; display: block; }
  #glitter {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  #goo {
    position: fixed;
    inset: 0;
    z-index: 8;
    opacity: 0;
    transition: opacity 2.5s ease;
    display: none;
    pointer-events: none;
  }
  #goo.on { opacity: 1; }
  #goo.falling {
    transition: transform 1.3s ease-in, opacity 1.1s ease;
    transform: translateY(90px);
    opacity: 0;
  }
  #glue {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 7;
  }
  #veil {
    position: fixed;
    inset: 0;
    background: #0f0e13;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.3s ease;
  }
  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 20;
  }
  #finale {
    position: fixed;
    inset: 0;
    z-index: 12;
    pointer-events: none;
    display: none;
    background: #fdfdfb;   /* the paper, so the canvas only clears */
  }
  #cord {
    position: fixed;
    top: 0;
    right: 16%;
    z-index: 14;
    display: none;
    cursor: grab;
    touch-action: none;
    transform: translateY(-120%);
    transition: transform var(--t-arrive) var(--ease-burst);
  }
  #cord.on { transform: translateY(0); }
  #cord.grabbing { cursor: grabbing; }
  #cord svg { overflow: visible; filter: drop-shadow(0 5px 12px rgba(0,0,0,0.55)); }
  /* it hangs in a downpour lit only by lightning — it has to move to be seen */
  #cordSwing {
    transform-origin: 30px -240px;
    animation: cordsway 3.2s ease-in-out infinite;
  }
  @keyframes cordsway {
    0%, 100% { transform: rotate(-1.3deg); }
    50%      { transform: rotate(1.3deg); }
  }
  #cord.grabbing #cordSwing { animation: none; }
  /* If it has hung there a while unpulled, it tugs itself — the one gesture
     that says "down", made by the thing that wants it. */
  #cord.nudge { animation: cordtug 4.2s ease-in-out infinite; }
  @keyframes cordtug {
    0%, 62%, 100% { transform: translateY(0); }
    70%           { transform: translateY(30px); }
    78%           { transform: translateY(6px); }
    84%           { transform: translateY(17px); }
    92%           { transform: translateY(0); }
  }
  #cord.grabbing { animation: none; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
    background: radial-gradient(ellipse at 50% 44%, rgba(38,26,14,0) 52%, rgba(38,26,14,0.16) 100%);
  }
  /* The only control on the site. It has to be reachable — this is mostly
     sound — without ever being part of the picture, so it sits quiet in the
     corner and comes up when you go near it. */
  #mute {
    position: fixed;
    right: 14px; bottom: 14px;
    width: 40px; height: 40px;
    z-index: 60;
    border: 0; padding: 0; margin: 0;
    background: none;
    color: #6d6a63;
    opacity: 0.16;
    cursor: pointer;
    transition: opacity 0.5s ease, color 0.5s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #mute svg { display: block; margin: auto; overflow: visible; }
  #mute svg path { fill: none; stroke: currentColor; stroke-width: 1.7;
                   stroke-linecap: round; stroke-linejoin: round; }
  #mute #spk { fill: currentColor; stroke-width: 1.2; }
  #mute:hover, #mute:focus-visible { opacity: 0.75; outline: none; }
  #mute.off { opacity: 0.55; }
  @media (hover: none) { #mute { opacity: 0.34; } }

  /* Its opposite number: if you have been here before and got somewhere,
     this takes you back to it. Same corner language as the sound, on the
     other side, and it only exists while you are still at the pump — it
     must never sit on top of a scene. */
  #resume {
    position: fixed;
    left: 14px; bottom: 14px;
    width: 40px; height: 40px;
    z-index: 60;
    border: 0; padding: 0; margin: 0;
    background: none;
    color: #6d6a63;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
    transition: opacity 0.9s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #resume svg { display: block; margin: auto; overflow: visible; }
  #resume svg path { fill: currentColor; stroke: none; }
  #resume.there { opacity: 0.16; pointer-events: auto; }
  #resume.there:hover, #resume.there:focus-visible { opacity: 0.75; outline: none; }
  @media (hover: none) { #resume.there { opacity: 0.34; } }

  #grain {
    position: fixed;
    inset: -80px;
    pointer-events: none;
    z-index: 41;
    opacity: 0.55;
    animation: graindance 0.7s steps(8) infinite;
  }
  @keyframes graindance {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-28px, 16px); }
    50% { transform: translate(14px, -32px); }
    75% { transform: translate(-10px, -12px); }
    100% { transform: translate(22px, 24px); }
  }
  .dotring {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 3px solid;
    pointer-events: none;
    z-index: 8;
    animation: ringout 0.7s ease-out forwards;
  }
  @keyframes ringout {
    from { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    to { opacity: 0; transform: translate(-50%, -50%) scale(1.55); }
  }
  #dot.jelly { animation: dotjelly var(--t-beat) var(--ease-mech); }
  @keyframes dotjelly {
    0% { transform: translate(-50%, -50%) scale(1, 1); }
    30% { transform: translate(-50%, -50%) scale(1.1, 0.9); }
    55% { transform: translate(-50%, -50%) scale(0.95, 1.05); }
    78% { transform: translate(-50%, -50%) scale(1.03, 0.98); }
    100% { transform: translate(-50%, -50%) scale(1, 1); }
  }
  .pumpHit { cursor: pointer; }
  .noselect { user-select: none; -webkit-user-select: none; }
  #tap {
    position: fixed;
    top: env(safe-area-inset-top, 0px);   /* never hide under a notch */
    left: 50%;
    z-index: 9;
    opacity: 0;
    display: none;
    pointer-events: none;   /* a faded tap must not be secretly grabbable */
    transform: translateX(-50%) translateY(-115%);
    transition: opacity var(--t-beat) var(--ease-gentle), transform var(--t-settle) var(--ease-burst);
    filter: drop-shadow(0 6px 14px rgba(0,0,0,0.32));
  }
  #tap.on {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  #tapWheel { cursor: grab; }
  #tapWheel.grabbing { cursor: grabbing; }
  #chest {
    position: fixed;
    bottom: calc(4px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    opacity: 0;
    transition: opacity 1.5s ease;
    display: none;
    cursor: inherit;
    /* it sits at the bottom of deep water, which is nearly black down
       there — this is the light that reaches it */
    filter: drop-shadow(0 0 40px rgba(255,204,132,0.44))
            drop-shadow(0 6px 16px rgba(0,0,0,0.5))
            saturate(1.55) brightness(1.34) contrast(1.08);
  }
  #chest.on { opacity: 1; }
  #chest.shake { animation: chestshake 0.4s ease; }
  @keyframes chestshake {
    0%, 100% { transform: translateX(-50%); }
    25% { transform: translateX(calc(-50% - 7px)); }
    55% { transform: translateX(calc(-50% + 7px)); }
    80% { transform: translateX(calc(-50% - 4px)); }
  }
  /* the lid is animated with the SVG transform attribute (JS tween) —
     CSS transform-origin on scaled inner SVG elements is not reliable
     across browsers and detached the lid on mobile */
  #chest svg, #screw svg { overflow: visible; }
  #tap.on, #screw { cursor: grab; }
  #chestInterior { opacity: 0; transition: opacity 0.4s ease 0.3s; }
  #chest.open #chestInterior { opacity: 1; }
  #key {
    position: fixed;
    z-index: 9;
    display: none;
    cursor: pointer;
  }
  #key.held {
    pointer-events: none;   /* the held key rides along; taps pass through to the chest */
    z-index: 30;
  }
  #shovel {
    position: fixed;
    z-index: 30;
    display: none;
    pointer-events: none;
    transform: translate(-24%, -76%) rotate(0deg);
    transition: transform 0.12s ease;
  }
  #shovel.dig { transform: translate(-24%, -70%) rotate(16deg); }
  #broom {
    position: fixed;
    z-index: 30;
    display: none;
    pointer-events: none;
    transform: translate(-30%, -80%);
    animation: broombob 1.6s ease-in-out infinite;
  }
  @keyframes broombob {
    0%, 100% { margin-top: 0; }
    50% { margin-top: 10px; }
  }
  /* the desktop hint: it sweeps the air until you take over */
  #broom.hint {
    opacity: 0.72;
    animation: broomhint 2.4s ease-in-out infinite;
  }
  @keyframes broomhint {
    0%, 100% { transform: translate(-30%, -80%) translateX(-90px) rotate(-11deg); }
    50%      { transform: translate(-30%, -80%) translateX(90px) rotate(11deg); }
  }
  #cork {
    position: fixed;
    z-index: 9;
    display: none;
    transition: transform 1.1s ease;
  }
  #screw {
    position: fixed;
    z-index: 9;
    display: none;
  }
  #screwWheel { cursor: grab; }
  #screwWheel.grabbing { cursor: grabbing; }
  #cork.out { animation: corkbob 2.4s ease-in-out infinite; }
  @keyframes corkbob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
  }
  #pool {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: none;
    opacity: 0;
    transition: opacity 0.9s ease;
    touch-action: none;
  }
  #dot {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 0;
    height: 0;
    border-radius: 50%;
    background: #e63950;
    cursor: pointer;
    z-index: 8;
    display: none;
  }
  /* a 14px dot is not a thumb target — this pad keeps it tappable
     while it is still small, without changing what you see */
  /* the note out of the bottle: it unrolls from the top, so the paper
     scales down to nothing about its own top edge and comes back */
  /* the sunrise stays visible round the edges — it is the whole payoff —
     but it steps back far enough for the paper to read */
  #scrim {
    position: fixed; inset: 0; z-index: 29;
    display: none; opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
    background: radial-gradient(ellipse at 50% 47%,
      rgba(8,6,14,0.62) 0%, rgba(8,6,14,0.40) 38%, rgba(8,6,14,0) 74%);
  }
  #scrim.on { opacity: 1; }
  #note {
    position: fixed;
    left: 50%; top: 46%;
    /* the paper takes clicks so the X on it can be found */
    transform: translate(-50%, -50%);
    z-index: 30;
    display: none;
    pointer-events: none;
    width: min(560px, 84vw);
  }
  #note.on .paper { pointer-events: auto; cursor: crosshair; }
  #note .paper {
    position: relative;
    background: linear-gradient(168deg, #fdf6e4 0%, #f4e8cd 55%, #e8d8b4 100%);
    border-radius: 3px;
    padding: clamp(22px, 5vw, 44px) clamp(20px, 5vw, 46px);
    box-shadow: 0 26px 60px rgba(60,36,14,0.42), 0 2px 0 rgba(255,255,255,0.5) inset;
    transform: scaleY(0.02) rotate(-0.5deg);
    transform-origin: 50% 0%;
    transition: transform var(--t-settle) var(--ease-gentle);
  }
  #note .paper::after {            /* the roll still curled at the foot */
    content: "";
    position: absolute; left: 0; right: 0; bottom: -7px; height: 14px;
    border-radius: 0 0 7px 7px;
    background: linear-gradient(180deg, #e2d0a8, #c9b183);
    box-shadow: 0 5px 12px rgba(60,36,14,0.35);
  }
  #note.on .paper { transform: scaleY(1) rotate(-0.5deg); }
  #note canvas { display: block; width: 100%; height: auto; }
  #dot::before {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 54px; height: 54px;
    border-radius: 50%;
  }
</style>
</head>
<body>
<div id="stage" class="noselect"></div>
<div id="veil"></div>
<div id="scrim"></div>
<canvas id="glue"></canvas>
<canvas id="glitter"></canvas>
<div id="dot"></div>
<canvas id="goo"></canvas>
<div id="tap">
  <svg width="140" height="120" viewBox="0 0 140 120">
    <defs>
      <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#6d5220"/>
        <stop offset="0.22" stop-color="#c8a24e"/>
        <stop offset="0.42" stop-color="#f4dc9a"/>
        <stop offset="0.62" stop-color="#b98f3c"/>
        <stop offset="1" stop-color="#5b4319"/>
      </linearGradient>
      <linearGradient id="brassDim" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4f3a16"/>
        <stop offset="0.35" stop-color="#a98637"/>
        <stop offset="0.6" stop-color="#d8bb6b"/>
        <stop offset="1" stop-color="#3f2f11"/>
      </linearGradient>
    </defs>
    <rect x="62" y="0" width="16" height="48" rx="2" fill="url(#brass)"/>
    <rect x="59" y="10" width="22" height="6" rx="2" fill="url(#brassDim)"/>
    <rect x="54" y="42" width="32" height="28" rx="7" fill="url(#brass)"/>
    <rect x="57" y="46" width="5" height="21" rx="2.5" fill="#fff0c0" opacity="0.45"/>
    <rect x="66" y="35" width="8" height="10" rx="2" fill="var(--brass-dim)"/>
    <rect x="62" y="68" width="16" height="16" fill="url(#brassDim)"/>
    <rect x="58" y="81" width="24" height="10" rx="3" fill="url(#brass)"/>
    <rect x="58" y="81" width="24" height="3" rx="1.5" fill="#fff2c8" opacity="0.35"/>
    <path d="M56 44 Q62 58 58 68" stroke="#6f8f5e" stroke-width="2.4" fill="none" opacity="0.35"/>
    <path d="M84 46 Q80 58 83 66" stroke="#6f8f5e" stroke-width="2" fill="none" opacity="0.28"/>
    <g id="tapWheel" transform="translate(70 40)">
      <circle r="30" fill="rgba(0,0,0,0)"/>
      <circle r="20" fill="none" stroke="#b8402f" stroke-width="7"/>
      <circle r="20" fill="none" stroke="#ffb9a4" stroke-width="2" opacity="0.35"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
      <circle r="6" fill="#96281b"/>
    </g>
  </svg>
</div>
<div id="cork">
  <svg width="34" height="42" viewBox="0 0 34 42">
    <path d="M8 40 L5 10 Q5 4 17 4 Q29 4 29 10 L26 40 Q26 42 17 42 Q8 42 8 40 Z" fill="var(--wood)" stroke=T.woodEdge stroke-width="2"/>
    <ellipse cx="17" cy="8" rx="12" ry="4" fill="#74471f"/>
    <line x1="10" y1="16" x2="11" y2="34" stroke=T.woodEdge stroke-width="1.4" opacity="0.8"/>
    <line x1="22" y1="14" x2="21" y2="35" stroke=T.woodEdge stroke-width="1.4" opacity="0.8"/>
    <circle cx="14" cy="24" r="1.3" fill=T.woodEdge/>
    <circle cx="20" cy="30" r="1" fill=T.woodEdge/>
  </svg>
</div>
<div id="chest">
  <!-- headroom baked into the viewBox: the open lid stays inside the svg,
       so no browser can clip it -->
  <svg width="200" height="200" viewBox="-28 -94 200 200">
    <rect id="chestInterior" x="18" y="34" width="114" height="24" rx="4" fill="#2e1d0e"/>
    <g id="chestLid">
      <path d="M15 52 Q15 12 75 12 Q135 12 135 52 Z" fill="#9a662f" stroke=T.woodEdge stroke-width="3"/>
      <path d="M33 52 Q33 22 75 20 L75 12 Q15 12 15 52 Z" fill="var(--wood)" opacity="0.5"/>
      <rect x="28" y="20" width="11" height="32" fill="var(--brass)" stroke="var(--brass-dim)" stroke-width="1.5" transform="rotate(-14 33 36)"/>
      <rect x="111" y="20" width="11" height="32" fill="var(--brass)" stroke="var(--brass-dim)" stroke-width="1.5" transform="rotate(14 117 36)"/>
    </g>
    <rect x="15" y="52" width="120" height="54" rx="8" fill="var(--wood)" stroke=T.woodEdge stroke-width="3"/>
    <line x1="15" y1="70" x2="135" y2="70" stroke=T.woodEdge stroke-width="1.5" opacity="0.6"/>
    <line x1="15" y1="88" x2="135" y2="88" stroke=T.woodEdge stroke-width="1.5" opacity="0.6"/>
    <rect x="28" y="52" width="11" height="54" fill="var(--brass)" stroke="var(--brass-dim)" stroke-width="1.5"/>
    <rect x="111" y="52" width="11" height="54" fill="var(--brass)" stroke="var(--brass-dim)" stroke-width="1.5"/>
    <rect x="64" y="48" width="22" height="24" rx="4" fill="#e2b84f" stroke="var(--brass-dim)" stroke-width="2"/>
    <circle cx="75" cy="57" r="3.4" fill="#3a2413"/>
    <rect x="73.4" y="57" width="3.2" height="8" fill="#3a2413"/>
  </svg>
</div>
<div id="shovel">
  <svg width="78" height="78" viewBox="0 0 32 32">
    <line x1="27" y1="3" x2="14" y2="18" stroke="#8a5a2b" stroke-width="3.4" stroke-linecap="round"/>

<script>
"use strict";

/* The canvas half of the tokens above. Same values, same names, so a colour
   changed in one place changes everywhere it means the same thing. */
const T = {
  ink:       "#05060a",
  paper:     "#fdfdfb",
  brass:     "#d9a441",
  brassDim:  "#8a6a1e",
  brassLit:  "#f4dc9a",
  wood:      "#8a5a2b",
  woodEdge:  "#5f3d1a",
  sand:      "#e8d5ac",
  starlight: "#e6efff",
};

/* ================= letter definitions =================
   Monoline "balloon" letters. Coordinates: y 0 (top) to 100 (baseline).
   Each letter = one or more subpaths (each subpath is one thin balloon). */
const LETTERS = {
  K: { w: 58, subs: ["M10 96 L10 4", "M52 4 L14 50 L52 96"] },
  E: { w: 52, subs: ["M48 4 L12 4 L12 96 L48 96", "M12 50 L40 50"] },
  V: { w: 60, subs: ["M8 4 L30 96 L52 4"] },
  I: { w: 20, subs: ["M10 4 L10 96"] },
  N: { w: 60, subs: ["M10 96 L10 4 L50 96 L50 4"] },
  H: { w: 58, subs: ["M10 4 L10 96", "M48 4 L48 96", "M10 50 L48 50"] },
  R: { w: 56, subs: ["M12 96 L12 4 L32 4 C52 4 52 48 32 48 L12 48", "M31 48 L50 96"] },
  S: { w: 52, subs: ["M44 13 C37 1 13 0 11 20 C8 41 44 44 46 68 C48 92 17 103 8 83"] },
  O: { w: 60, subs: ["M30 4 C7 4 7 96 30 96 C53 96 53 4 30 4 Z"] },
  C: { w: 54, subs: ["M46 15 C35 -1 10 8 10 50 C10 92 35 101 46 85"] },
};
const PALETTE = ["#e63950","#ff8c00","#ffcf00","#00b869","#0f7fb5","#8b46d9",
                 "#ff5d9e","#00a8e8","#d92645","#6cb520","#e8a013","#2aa8b8","#a95fe0"];
const SPACE_W = 34;
const LETTER_GAP = 10;

/* latex color helper: amt>0 lighten toward white, amt<0 darken */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/* ================= state ================= */
const PUMP_STEP = 0.085;
const EXPLODE_AT = 1.8;        // strain limit — burst
let pumpIdle = 0;
const IDLE_MS = 2600;      /* long enough to look at it before it sags */
const DECAY_PER_S = 0.14;  /* and it sags gently, it does not empty */

let target = 0;
let inf = 0;
let vel = 0;
let lastPump = -1e9;
let exploded = false;
let pumpPressT = 0;
let letters = [];
let layoutW = 0, layoutH = 0;
let heroSvg = null, pumpPlunger = null, hoseInfo = null;
let UIS = 1;   // global prop scale: 1.0 at ~laptop size, bigger on TVs, smaller on phones
const stage = document.getElementById("stage");
const flashEl = document.getElementById("flash");
const veilEl = document.getElementById("veil");

/* ================= layout / svg build ================= */
function currentLines() {
  return (window.innerWidth < 720)
    ? ["KEVIN", "HERSHOCK"]
    : ["KEVIN HERSHOCK"];
}

function lineWidth(line) {
  let w = 0;
  for (const ch of line) {
    w += (ch === " ") ? SPACE_W : LETTERS[ch].w + LETTER_GAP;
  }
  return w;
}

function buildSvg() {
  const lines = currentLines();
  const PUMP_ZONE = 165;
  const widest = Math.max(...lines.map(lineWidth));
  const W = PUMP_ZONE + widest + 50;
  const lineGap = 140;
  const firstBase = 190;
  const lastBase = firstBase + (lines.length - 1) * lineGap;
  const H = lastBase + 45;
  layoutW = W; layoutH = H;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", "heroSvg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMin meet");

  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML =
    `<linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0" stop-color="#7d8288"/>
       <stop offset="0.28" stop-color="#d7dade"/>
       <stop offset="0.5" stop-color="#f2f4f5"/>
       <stop offset="0.72" stop-color="#b9bec3"/>
       <stop offset="1" stop-color="#6b7075"/>
     </linearGradient>
     <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0" stop-color="#8d9296"/>
       <stop offset="0.45" stop-color="#d3d6d9"/>
       <stop offset="1" stop-color="#63676c"/>
     </linearGradient>
     <filter id="soft" x="-50%" y="-50%" width="200%" height="300%">
       <feGaussianBlur stdDeviation="3"/>
     </filter>`;
  svg.appendChild(defs);

  /* soft ground shadows — light comes from the upper left, matching the
     balloon speculars, so shadows fall just right of each letter */
  const shadowGroup = document.createElementNS(NS, "g");
  shadowGroup.setAttribute("filter", "url(#soft)");
  svg.appendChild(shadowGroup);

  const mkPath = (d) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    return p;
  };

  letters = [];
  let ci = 0;
  lines.forEach((line, li) => {
    const base = firstBase + li * lineGap;
    let x = PUMP_ZONE + (widest - lineWidth(line)) / 2;
    for (const ch of line) {
      if (ch === " ") { x += SPACE_W; continue; }
      const def = LETTERS[ch];
      const g = document.createElementNS(NS, "g");
      const color = PALETTE[(ci + RUN.palRot) % PALETTE.length];

      /* two-phase latex tube: a thin dull uninflated "tail" layer, plus a
         5-layer glossy stack for the inflated phase (dark rim, latex body,
         light band, broad specular streak, hard hairline streak) */
      const dark = [], main = [], tint = [], gloss = [], gloss2 = [], tail = [];
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, -0.30)); p.setAttribute("opacity", "0.95"); g.appendChild(p); tail.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, -0.32)); g.appendChild(p); dark.push(p); }
      for (const d of def.subs) { const p = mkPath(d); g.appendChild(p); main.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, 0.45)); g.appendChild(p); tint.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", "#ffffff"); g.appendChild(p); gloss.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", "#ffffff"); g.appendChild(p); gloss2.push(p); }

      const shadow = document.createElementNS(NS, "ellipse");
      shadow.setAttribute("cx", x + def.w / 2 + 6);
      shadow.setAttribute("cy", base + 7);
      shadow.setAttribute("rx", def.w * 0.6);
      shadow.setAttribute("ry", 4);
      shadow.setAttribute("fill", "#1a1a18");
      shadow.setAttribute("opacity", "0.05");
      shadowGroup.appendChild(shadow);
      /* glossy latex throws a wash of its own color onto the floor */
      const refl = document.createElementNS(NS, "ellipse");
      refl.setAttribute("cx", x + def.w / 2);
      refl.setAttribute("cy", base + 6);
      refl.setAttribute("rx", def.w * 0.5);
      refl.setAttribute("ry", 3);
      refl.setAttribute("fill", color);
      refl.setAttribute("opacity", "0");
      shadowGroup.appendChild(refl);

      svg.appendChild(g);
      letters.push({
        g, dark, main, tint, gloss, gloss2, tail, shadow, refl,
        subDs: def.subs, subs: null,
        x, base, w: def.w, color,
        phase: Math.random() * Math.PI * 2,
      });
      x += def.w + LETTER_GAP;
      ci++;
    }
  });

  buildPump(svg, NS, firstBase, letters[0], shadowGroup);
  stage.innerHTML = "";
  stage.appendChild(svg);
  heroSvg = svg;
  sampleAll();
  if (hoseInfo) hoseInfo.len = hoseInfo.el.getTotalLength();
}

/* sample every balloon tube into points so it can flop, drape, and fill */
function sampleAll() {
  for (const L of letters) {
    L.subs = L.subDs.map((d, j) => {
      const el = L.dark[j];
      el.setAttribute("d", d);
      const len = el.getTotalLength();
      const N = Math.max(16, Math.min(40, Math.round(len / 7)));
      const pts = [];
      let minX = 1e9, maxX = -1e9;
      for (let i = 0; i < N; i++) {
        const p = el.getPointAtLength(len * i / (N - 1));
        pts.push({ x: p.x, y: p.y });
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
      }
      const closed = /z\s*$/i.test(d);
      const spillLen = Math.min(len * 0.5, L.w * 1.25);
      let spillX = (minX + maxX) / 2 - spillLen / 2;
      spillX = Math.max(-4, Math.min(spillX, L.w + 4 - spillLen));
      return {
        pts, N, closed, spillLen, spillX,
        ground: 95 + Math.random() * 3,
        ampY: 4 + Math.random() * 4,
        humps: 1.5 + Math.random() * 1.6,
        ph1: Math.random() * Math.PI * 2,
        ph2: Math.random() * Math.PI * 2,
      };
    });
  }
}

function buildPump(svg, NS, base, firstLetter, shadowGroup) {
  const px = 62;
  const ground = base + 8;
  const NSrect = (x, y, w, h, rx, fill) => {
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x); r.setAttribute("y", y);
    r.setAttribute("width", w); r.setAttribute("height", h);
    r.setAttribute("rx", rx); r.setAttribute("fill", fill);
    return r;
  };

  /* pump's ground shadow */
  const psh = document.createElementNS(NS, "ellipse");
  psh.setAttribute("cx", px + 8); psh.setAttribute("cy", ground + 4);
  psh.setAttribute("rx", 62); psh.setAttribute("ry", 5);
  psh.setAttribute("fill", "#1a1a18"); psh.setAttribute("opacity", "0.13");
  shadowGroup.appendChild(psh);

  /* rubber hose: out of the brass fitting, down onto the floor with a
     little slack, then up to the nozzle the first balloon is tied onto. */
  const ox = px + 28, oy = ground - 12;
  const A = { x: firstLetter.x + 10, y: base - 4 };
  const th = -30 * Math.PI / 180;
  const B = { x: A.x - Math.cos(th) * 14, y: A.y - Math.sin(th) * 14 };
  const mid = (ox + B.x) / 2;
  const hoseD = `M${ox} ${oy}`
    + ` C ${ox + 24} ${oy + 26}, ${mid - 20} ${ground + 7}, ${mid + 10} ${ground + 6}`
    + ` S ${B.x - 18} ${ground + 4}, ${B.x} ${B.y}`;
  const hoseOutline = document.createElementNS(NS, "path");
  hoseOutline.setAttribute("d", hoseD);
  hoseOutline.setAttribute("fill", "none");
  hoseOutline.setAttribute("stroke", "#202225");
  hoseOutline.setAttribute("stroke-width", "8");
  hoseOutline.setAttribute("stroke-linecap", "round");
  svg.appendChild(hoseOutline);
  const hose = document.createElementNS(NS, "path");
  hose.setAttribute("d", hoseD);
  hose.setAttribute("fill", "none");
  hose.setAttribute("stroke", "#3a3d40");
  hose.setAttribute("stroke-width", "6");
  hose.setAttribute("stroke-linecap", "round");
  svg.appendChild(hose);
  const hoseHi = document.createElementNS(NS, "path");
  hoseHi.setAttribute("d", hoseD);
  hoseHi.setAttribute("fill", "none");
  hoseHi.setAttribute("stroke", "#84898e");
  hoseHi.setAttribute("stroke-width", "1.6");
  hoseHi.setAttribute("stroke-linecap", "round");
  hoseHi.setAttribute("opacity", "0.8");
  hoseHi.setAttribute("transform", "translate(-0.7 -1.6)");
  svg.appendChild(hoseHi);

  /* air pulses that travel down the hose on each pump */
  hoseInfo = { el: hose, len: 0, pulses: [], circles: [] };
  for (let i = 0; i < 4; i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("r", 4.2);
    c.setAttribute("fill", "#6e7377");
    c.setAttribute("opacity", "0");
    svg.appendChild(c);
    hoseInfo.circles.push(c);
  }

  /* nozzle: steel ferrule, tapered brass tip, balloon's rolled neck over it */
  const ng = document.createElementNS(NS, "g");
  ng.setAttribute("transform", `translate(${A.x} ${A.y}) rotate(-30)`);
  ng.appendChild(NSrect(-15, -4, 8, 8, 1.5, "#8d9296"));
  const cone = document.createElementNS(NS, "polygon");
  cone.setAttribute("points", "-8,-3.6 0,-1.5 0,1.5 -8,3.6");
  cone.setAttribute("fill", "#b08d57");
  ng.appendChild(cone);
  ng.appendChild(NSrect(-2.5, -2.7, 7, 5.4, 2.7, shade(firstLetter.color, -0.30)));
  svg.appendChild(ng);

  const pump = document.createElementNS(NS, "g");
  pump.appendChild(NSrect(px - 52, ground - 10, 104, 10, 5, "#2e3134"));
  pump.appendChild(NSrect(px - 58, ground - 4, 30, 6, 3, "#232527"));
  pump.appendChild(NSrect(px + 28, ground - 4, 30, 6, 3, "#232527"));
  pump.appendChild(NSrect(px - 17, ground - 92, 34, 84, 6, "url(#barrel)"));
  pump.appendChild(NSrect(px - 21, ground - 100, 42, 11, 4, "#43474c"));
  pump.appendChild(NSrect(px - 21, ground - 12, 42, 8, 3, "#43474c"));
  pump.appendChild(NSrect(px + 14, ground - 18, 16, 9, 2, "#b08d57"));

  const plunger = document.createElementNS(NS, "g");
  plunger.appendChild(NSrect(px - 3.5, ground - 148, 7, 56, 2, "url(#rod)"));
  plunger.appendChild(NSrect(px - 14, ground - 158, 28, 12, 3, "#3a3d40"));
  plunger.appendChild(NSrect(px - 47, ground - 160, 35, 15, 7.5, "#17181a"));
  plunger.appendChild(NSrect(px + 12, ground - 160, 35, 15, 7.5, "#17181a"));
  plunger.appendChild(NSrect(px - 43, ground - 157, 27, 3, 1.5, "#4a4d50"));
  plunger.appendChild(NSrect(px + 16, ground - 157, 27, 3, 1.5, "#4a4d50"));
  pump.appendChild(plunger);
  pumpPlunger = { el: plunger, travel: 40 };

  /* invisible hit area — no arrow, no words. figure it out. */
  const hit = NSrect(px - 62, ground - 170, 190, 185, 0, "transparent");
  hit.setAttribute("class", "pumpHit");
  hit.addEventListener("pointerdown", doPump);
  pump.appendChild(hit);

  svg.appendChild(pump);
}

/* ================= sound (synthesized, no assets) =================
   Every sound routes through one master bus: BUS -> global lowpass
   (underwater muffling) -> compressor -> speakers, with a parallel
   small-room reverb so everything shares the same space. */
let AC = null, noiseBuf = null, BUS = null, GLP = null, REVG = null;
let hissNode = null, swellNode = null;

/* ---- the one control ----
   Sound is most of this, so muting it has to be one press and has to stick.
   The bus gain is eased rather than switched, because a hard cut on a room
   tone is a click, and a click is the opposite of the whole idea. */
const KEEP = (() => { try { return window.localStorage; } catch (e) { return null; } })();
let MUTED = KEEP && KEEP.getItem("kh.muted") === "1";
function setMuted(v) {
  MUTED = v;
  try { if (KEEP) KEEP.setItem("kh.muted", v ? "1" : "0"); } catch (e) {}
  const b = document.getElementById("mute");
  if (b) {
    b.classList.toggle("off", v);
    b.setAttribute("aria-label", v ? "sound on" : "sound off");
    const w = b.querySelector("#waves"), x = b.querySelector("#xout");
    if (w) w.style.display = v ? "none" : "";
    if (x) x.style.display = v ? "" : "none";
  }
  if (BUS && AC) {
    try { BUS.gain.setTargetAtTime(v ? 0.0001 : 0.9, AC.currentTime, 0.09); } catch (e) {}
  }
}
/* ---- picking it up again ----
   This runs about twenty minutes end to end, and until now closing the tab
   put you back at the pump. It does not resume automatically — you always
   land at the beginning, because the beginning is the best bit — but if
   you have been further before, there is a way back to it in the corner.
   One entry per chapter, in order, so "furthest" means something. */
const CHAPTERS = [
  { k: "pool",   go: () => { skipIntro(); showDot(); } },
  { k: "tap",    go: () => { skipIntro(); showTap(); } },
  { k: "chest",  go: () => { skipIntro(); showTap(); turnWheel(1080); vol = 1; } },
  { k: "goo",    go: () => { skipIntro(); tapShown = true; vol = 0; activateGoo(); } },
  { k: "storm",  go: () => { skipIntro(); startFinale(); } },
  { k: "night",  go: () => { skipIntro(); startFinale(); fT = 20; lightsOut(); } },
  { k: "dawn",   go: () => { skipIntro(); startFinale(); fT = 20; lightsOut();
                             nightT = 12.5; dawnPhase = 1; dawnIdle = 0; bed("sea"); } },
  { k: "beach",  go: () => { openCanvas(); startDig(); } },
  { k: "window", go: () => { openCanvas(); startWindow(); whiteOut = 2.4; } },
  { k: "jelly",  go: () => { openCanvas(); startJelly(196); } },
  { k: "lake",   go: () => { openCanvas(); startSurface(); } },
  { k: "beacon", go: () => { openCanvas(); startBeacon(); } },
  { k: "wood",   go: () => { openCanvas(); startWood(); } },
  { k: "river",  go: () => { openCanvas(); startRiver(); } },
  { k: "pan",    go: () => { openCanvas(); startPan(); } },
  { k: "bingo",  go: () => { openCanvas(); startBingo(); } },
];
const CHAPTER_AT = (k) => CHAPTERS.findIndex(c => c.k === k);

function mark(k) {
  try {
    if (!KEEP) return;
    const cur = KEEP.getItem("kh.at");
    if (cur !== null && CHAPTER_AT(cur) >= CHAPTER_AT(k)) return;
    KEEP.setItem("kh.at", k);
  } catch (e) {}
}

/* the pump and everything it left behind */
function skipIntro() {
  exploded = true; glueActive = false; sweepMode = false; sweepDone = true;
  stuckPts = []; scraps = []; swept = [];
  try { stopHiss(); } catch (e) {}
  document.body.style.cursor = "";
  /* the glue is finished with, but the glitter canvas is what the water is
     drawn on later — clear it, do not take it away */
  for (const id of ["glue", "broom"]) {
    const el = document.getElementById(id);
    if (el) el.style.display = "none";
  }
  try { hardClear(canvas, ctx); } catch (e) {}
  const st = document.getElementById("stage");
  if (st) { st.style.transition = "none"; st.style.opacity = "0"; }
}

/* everything from the ink onward lives on one canvas — hand it the frame */

function offerResume() {
  const btn = document.getElementById("resume");
  if (!btn || !KEEP) return;
  let at = null;
  try { at = KEEP.getItem("kh.at"); } catch (e) {}
  const i = at === null ? -1 : CHAPTER_AT(at);
  if (i < 0) return;
  /* let them look at it first — this is not a menu, it is an offer */
  setTimeout(() => { if (!exploded) btn.classList.add("there"); }, 2600);
  const jump = (e) => {
    e.stopPropagation(); e.preventDefault();
    btn.classList.remove("there");
    audio();
    try { CHAPTERS[i].go(); } catch (err) {}

function audio() {

         opposite of what this should feel like — long attack, long
         release, low ratio, so nothing ever grabs at you. */
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -20; comp.ratio.value = 2.4;
      comp.attack.value = 0.030; comp.release.value = 0.55;
      const air = AC.createBiquadFilter();          // a little top, close-mic'd
      air.type = "highshelf"; air.frequency.value = 6500; air.gain.value = 2.5;
      air.connect(comp);
      comp.connect(AC.destination);   // master chain terminus — NOT the bus
      GLP = AC.createBiquadFilter();
      GLP.type = "lowpass"; GLP.frequency.value = 19000;
      GLP.connect(air);
      BUS = AC.createGain();
      BUS.gain.value = 0.9;
      BUS.connect(GLP);

      const rev = AC.createConvolver();
      const len = (AC.sampleRate * 1.8) | 0;
      const ir = AC.createBuffer(2, len, AC.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.exp(-4.2 * i / len);
        }
      }
      rev.buffer = ir;
      REVG = AC.createGain(); REVG.gain.value = 0.20;
      BUS.connect(rev); rev.connect(REVG); REVG.connect(GLP);
      if (MUTED) BUS.gain.value = 0.0001;
    }
    return AC;
  } catch (e) { return null; }
}
/* Where a sound happens on the screen is where it should happen in your
   ears. Everything with a position on it goes through here, which is most
   of what makes this feel close rather than flat. */
function at(x, wet) {
  const ac = audio(); if (!ac) return null;
  const g = ac.createGain();
  if (ac.createStereoPanner) {
    const p = ac.createStereoPanner();
    p.pan.value = Math.max(-0.85, Math.min(0.85,
      ((x === undefined ? window.innerWidth / 2 : x) / window.innerWidth - 0.5) * 1.7));
    g.connect(p); p.connect(BUS);
  } else g.connect(BUS);
  return g;
}

/* Anything a scene starts, the scene has to be able to stop. Voices go in
   here on the way out and get faded and killed when the scene ends. */
const LIVE = {};
function hold(scene, node) {
  (LIVE[scene] = LIVE[scene] || []).push(node);
  return node;
}
function release(scene, fade) {
  const arr = LIVE[scene]; if (!arr || !AC) return;
  delete LIVE[scene];
  const t = AC.currentTime, f = fade === undefined ? 1.2 : fade;
  for (const n of arr) {
    try { if (n.gain) n.gain.setTargetAtTime(0.0001, t, f * 0.35); } catch (e) {}
  }
  setTimeout(() => {
    for (const n of arr) { try { (n.src || n.osc || n).stop(); } catch (e) {} }
  }, f * 1000 + 900);
}

/* a bed of room tone under every scene, crossfaded, so the quiet is never
   dead air — the thing that makes headphones worth wearing */
let bedSrc = null, bedG = null, bedLP = null, bedHP = null, bedKind = "";
const BEDS = {
  paper:  { lp: 380,   hp: 20,   g: 0.020 },
  glitter:{ lp: 2600,  hp: 400,  g: 0.026 },
  water:  { lp: 520,   hp: 30,   g: 0.034 },
  goo:    { lp: 260,   hp: 20,   g: 0.030 },
  night:  { lp: 300,   hp: 40,   g: 0.022 },
  sea:    { lp: 900,   hp: 90,   g: 0.030 },
  sand:   { lp: 1600,  hp: 200,  g: 0.026 },
  glass:  { lp: 3200,  hp: 700,  g: 0.024 },
  deep:   { lp: 220,   hp: 20,   g: 0.038 },
};
function bed(kind) {
  const ac = audio(); if (!ac || kind === bedKind) return;
  bedKind = kind;
  const B = BEDS[kind] || BEDS.paper;
  if (!bedSrc) {
    bedSrc = ac.createBufferSource(); bedSrc.buffer = noise(ac); bedSrc.loop = true;
    bedHP = ac.createBiquadFilter(); bedHP.type = "highpass";
    bedLP = ac.createBiquadFilter(); bedLP.type = "lowpass";
    bedG = ac.createGain(); bedG.gain.value = 0.0001;
    bedSrc.connect(bedHP); bedHP.connect(bedLP); bedLP.connect(bedG); bedG.connect(BUS);
    bedSrc.start();
  }
  const t = ac.currentTime;
  bedHP.frequency.setTargetAtTime(B.hp, t, 1.4);
  bedLP.frequency.setTargetAtTime(B.lp, t, 1.4);
  bedG.gain.setTargetAtTime(B.g, t, 1.8);

/* the deeper the water, the more the world muffles */
function setUnderwater(v) {
  if (!AC || !GLP) return;
  const t = AC.currentTime;
  const k = Math.max(0, Math.min(1, (v - 0.15) / 0.55));
  GLP.frequency.setTargetAtTime(19000 - (19000 - 680) * k, t, 0.25);
  REVG.gain.setTargetAtTime(0.20 + k * 0.14, t, 0.3);
}
/* faint air-room hiss while the balloons are alive */
function startHiss() {
  const ac = audio(); if (!ac || hissNode) return;
  bed('paper');
  const src = ac.createBufferSource(); src.buffer = noise(ac); src.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 240;
  const g = ac.createGain(); g.gain.value = 0.012;
  src.connect(lp); lp.connect(g); g.connect(BUS);
  src.start();

}
function stopHiss() {
  if (!hissNode || !AC) return;
  hissNode.g.gain.setTargetAtTime(0, AC.currentTime, 0.2);
  const h = hissNode; hissNode = null;
  setTimeout(() => { try { h.src.stop(); } catch (e) {} }, 800);
}
/* slow sub swells once the room is deep */
function updateSwell(v) {
  if (!AC) return;
  if (v > 0.5 && !swellNode) {
    const osc = AC.createOscillator(); osc.type = "sine"; osc.frequency.value = 42;
    const g = AC.createGain(); g.gain.value = 0.016;
    const lfo = AC.createOscillator(); lfo.frequency.value = 0.11;
    const lg = AC.createGain(); lg.gain.value = 0.012;
    lfo.connect(lg); lg.connect(g.gain);
    osc.connect(g); g.connect(BUS);
    osc.start(); lfo.start();
    swellNode = { osc, lfo, g };
  } else if (v < 0.3 && swellNode) {
    swellNode.g.gain.setTargetAtTime(0, AC.currentTime, 0.4);
    const s = swellNode; swellNode = null;
    setTimeout(() => { try { s.osc.stop(); s.lfo.stop(); } catch (e) {} }, 1600);
  }
}
function noise(ac) {
  if (noiseBuf) return noiseBuf;
  const b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  noiseBuf = b;
  return b;
}
function pumpSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* the sound climbs with the air: every pump sits a little higher than
     the last, so you can hear yourself going somewhere */
  const level = Math.max(0, Math.min(1, inf / EXPLODE_AT));
  const src = ac.createBufferSource(); src.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8;
  bp.frequency.setValueAtTime(550 + 1150 * level, t0);
  bp.frequency.exponentialRampToValueAtTime(240 + 520 * level, t0 + 0.16);
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(0.34 + 0.16 * level, t0 + 0.035);
  gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
  src.connect(bp); bp.connect(gn); gn.connect(BUS);
  src.start(t0); src.stop(t0 + 0.2);
  /* a soft note under the whoosh, walking up a pentatonic ladder —
     the last steps before the limit go a half-step sour (dread) */
  const PENT = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24, 27];
  let semis = PENT[Math.min(PENT.length - 1, Math.floor(level * PENT.length))];
  if (level > 0.86) semis += 1;
  const f = 165 * Math.pow(2, semis / 12);
  const osc = ac.createOscillator(); osc.type = "triangle";
  osc.frequency.setValueAtTime(f, t0);
  osc.frequency.exponentialRampToValueAtTime(f * 1.08, t0 + 0.09);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.19);
  osc.connect(g2); g2.connect(BUS);
  osc.start(t0); osc.stop(t0 + 0.2);
  /* a quieter octave above for shine */
  const osc2 = ac.createOscillator(); osc2.type = "sine";
  osc2.frequency.setValueAtTime(f * 2, t0);
  osc2.frequency.exponentialRampToValueAtTime(f * 2.16, t0 + 0.09);
  const g3 = ac.createGain();
  g3.gain.setValueAtTime(0.0001, t0);
  g3.gain.exponentialRampToValueAtTime(0.09, t0 + 0.02);
  g3.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
  osc2.connect(g3); g3.connect(BUS);
  osc2.start(t0); osc2.stop(t0 + 0.17);
}
/* past working size: a rising tension drone that tightens toward the pop */
let drone = null;
function updateDrone(over) {
  if (!AC) return;
  const t = AC.currentTime;
  if (over > 0.02 && !exploded) {
    if (!drone) {
      const osc = AC.createOscillator(); osc.type = "sawtooth";
      const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
      const g = AC.createGain(); g.gain.value = 0;
      osc.connect(lp); lp.connect(g); g.connect(BUS);
      osc.start();
      drone = { osc, lp, g };
    }
    drone.osc.frequency.setTargetAtTime(110 + over * 360, t, 0.08);
    drone.lp.frequency.setTargetAtTime(550 + over * 1500, t, 0.1);
    drone.g.gain.setTargetAtTime(0.022 + over * 0.115, t, 0.12);
  } else if (drone) {
    /* and when it is over it is over — a stopped oscillator, not a silent one */
    drone.g.gain.setTargetAtTime(0, t, 0.12);
    const d = drone; drone = null;
    setTimeout(() => { try { d.osc.stop(); } catch (e) {} }, 900);
  }
}
function squeakSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const over = Math.max(0, inf - 1);
  const f0 = 240 + over * 520 + Math.random() * 180;
  const osc = ac.createOscillator(); osc.type = "sawtooth";
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.linearRampToValueAtTime(f0 * 1.5, t0 + 0.07);
  osc.frequency.linearRampToValueAtTime(f0 * 0.85, t0 + 0.15);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1300;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(0.05, t0 + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
  osc.connect(lp); lp.connect(gn); gn.connect(BUS);
  osc.start(t0); osc.stop(t0 + 0.18);
}
function popSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* everything routes through a compressor so it can be LOUD without shredding */
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 8;
  comp.attack.value = 0.001; comp.release.value = 0.2;
  comp.connect(BUS);
  /* crack — the latex letting go */
  const s1 = ac.createBufferSource(); s1.buffer = noise(ac);
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1500;
  const g1 = ac.createGain();
  g1.gain.setValueAtTime(1.4, t0);
  g1.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
  s1.connect(hp); hp.connect(g1); g1.connect(comp);
  s1.start(t0); s1.stop(t0 + 0.07);
  /* snap layer — a second, higher crack right on top */
  const s3 = ac.createBufferSource(); s3.buffer = noise(ac);
  const bp2 = ac.createBiquadFilter(); bp2.type = "bandpass"; bp2.frequency.value = 4200; bp2.Q.value = 1.2;
  const g4 = ac.createGain();
  g4.gain.setValueAtTime(1.2, t0);
  g4.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);
  s3.connect(bp2); bp2.connect(g4); g4.connect(comp);
  s3.start(t0); s3.stop(t0 + 0.05);
  /* body — the air getting out all at once */
  const s2 = ac.createBufferSource(); s2.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(4200, t0);
  lp.frequency.exponentialRampToValueAtTime(90, t0 + 0.7);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(1.1, t0);
  g2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.75);
  s2.connect(lp); lp.connect(g2); g2.connect(comp);
  s2.start(t0); s2.stop(t0 + 0.8);
  /* impact punch */
  const sq = ac.createOscillator(); sq.type = "square";
  sq.frequency.setValueAtTime(150, t0);
  sq.frequency.exponentialRampToValueAtTime(55, t0 + 0.09);
  const g5 = ac.createGain();
  g5.gain.setValueAtTime(0.5, t0);
  g5.gain.exponentialRampToValueAtTime(0.001, t0 + 0.1);
  sq.connect(g5); g5.connect(comp);
  sq.start(t0); sq.stop(t0 + 0.11);
  /* deep boom */
  const osc = ac.createOscillator(); osc.type = "sine";
  osc.frequency.setValueAtTime(75, t0);
  osc.frequency.exponentialRampToValueAtTime(30, t0 + 0.55);
  const g3 = ac.createGain();
  g3.gain.setValueAtTime(1.0, t0);
  g3.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
  osc.connect(g3); g3.connect(comp);
  osc.start(t0); osc.stop(t0 + 0.62);
  /* long rumble tail under the falling glitter */
  const s4 = ac.createBufferSource(); s4.buffer = noise(ac);
  const lp2 = ac.createBiquadFilter(); lp2.type = "lowpass"; lp2.frequency.value = 160;
  const g6 = ac.createGain();
  g6.gain.setValueAtTime(0.45, t0 + 0.05);
  g6.gain.exponentialRampToValueAtTime(0.001, t0 + 1.4);
  s4.connect(lp2); lp2.connect(g6); g6.connect(comp);
  s4.start(t0 + 0.05); s4.stop(t0 + 1.45);
  /* glitter shimmer: a drift of tiny high pings while the curtain falls */
  for (let i = 0; i < 34; i++) {
    const at = t0 + 0.15 + Math.random() * 3.4;
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.value = 2600 + Math.random() * 5400;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.035, at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.28);
    o.connect(g); g.connect(BUS);
    o.start(at); o.stop(at + 0.3);
  }
}

/* ================= pumping ================= */
function doPump(e) {
  if (e) e.preventDefault();
  if (exploded) return;
  target += PUMP_STEP;
  vel += 0.55;
  lastPump = performance.now();
  pumpPressT = 1;
  if (hoseInfo && hoseInfo.len) hoseInfo.pulses.push(0);
  startHiss();
  pumpSound();
  if (inf > 1) squeakSound();     // latex creaks past its working size
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") doPump(e);
});

/* iOS Safari ignores touch-action for double-tap smart zoom in places —
   kill it directly. All interaction here is pointerdown-driven, so
   suppressing the synthesized events after a fast second tap is safe. */
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const n = Date.now();
  if (n - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = n;
}, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

/* ================= animation loop ================= */
const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
let prevT = performance.now();

function frame(now) {
  /* clamp at ~11fps so weak devices drop frames instead of running slow-motion */
  const dt = Math.min(0.09, (now - prevT) / 1000);
  prevT = now;

  if (poolOn) poolFrame(dt);
  /* a transition can be in flight with no scene behind it — between the
     torn paper and the ink, there is nothing else running */
  if (travelOnly) {
    hardClear(finCanvas, fctx);
    const carrying = natFrame(dt);
    if (!carrying && travelOnly) {
      travelOnly = false;
      if (!finActive) finCanvas.style.display = "none";
    }
  }

  if (!exploded) {
    if (now - lastPump > IDLE_MS && target > 0) {
      target = Math.max(0, target - DECAY_PER_S * dt);
    }
    const k = 60, damp = 8.5;
    vel += (target - inf) * k * dt;
    vel *= Math.exp(-damp * dt);
    inf += vel * dt;
    if (inf < 0) { inf = 0; vel = 0; }

    if (inf >= EXPLODE_AT) { explode(); }
    else { renderLetters(now); renderPump(dt); updateDrone(Math.max(0, inf - 1)); }
  }

  tickParticles(dt * timeScale);
  if (tapShown) { waterStep(dt); waterDraw(); updateScrew(dt); updateLid(dt); gooFrame(dt); }
  finaleFrame(dt);
  requestAnimationFrame(frame);
}

/* Two-phase balloon physics (like a real 260): behind the fill front the
   tube is at full working diameter; ahead of it the latex is a thin limp
   tail. Extra air LENGTHENS the inflated phase — the front advances.
   Overpumping stretches the whole thing: it swells (decelerating — strain
   stiffening), pales (the membrane thins), and shakes (tension climbs). */
function renderLetters(now) {
  const p = Math.min(1, inf);
  const over = Math.max(0, inf - 1);
  const f = p * 1.38;
  const ts = now / 1000;
  const overN = 1 - Math.exp(-over * 2.0);
  const thin = 0.30 * overN;

  for (const L of letters) {
    if (!L.subs) continue;
    let mSum = 0;

    for (let j = 0; j < L.subs.length; j++) {
      const S = L.subs[j];
      const iF = Math.min(S.N - 1, Math.floor((f - 0.165) * (S.N - 1)));
      let dIn = "", dTail = "", sum = 0;
      const tailStart = Math.max(0, iF);
      for (let i = 0; i < S.N; i++) {
        const t = i / (S.N - 1);
        const li = clamp01((f - t) / 0.33);
        const sm = li * li * (3 - 2 * li);
        sum += sm;
        const P = S.pts[i];
        const flop = 1 - sm;
        let xF = S.spillX + t * S.spillLen
                 + Math.sin(t * 6.3 + S.ph1 + ts * 1.1) * 2.5 * flop;
        let yF = S.ground
                 - Math.abs(Math.sin(t * Math.PI * S.humps + S.ph2)) * S.ampY
                 + Math.sin(ts * 1.4 + S.ph1 + t * 5) * 1.4 * flop;
        /* the first balloon's mouth is tied onto the pump nozzle */
        if (L === letters[0] && j === 0) {
          const pin = Math.max(0, 1 - t / 0.22);
          const P0 = S.pts[0];
          xF += (P0.x - xF) * pin;
          yF += (P0.y - yF) * pin;
        }
        const X = xF + (P.x - xF) * sm;
        const Y = yF + (P.y - yF) * sm;
        const pt = X.toFixed(1) + " " + Y.toFixed(1);
        if (i <= iF) dIn += (i ? "L" : "M") + pt;
        if (i >= tailStart) dTail += (i > tailStart ? "L" : "M") + pt;
      }
      const m = sum / S.N;
      mSum += m;
      const hasIn = iF >= 1;
      const hasTail = iF < S.N - 1;
      if (S.closed && !hasTail) dIn += "Z";

      /* working diameter arrives almost at once (pressure peaks early),
         then only overpumping swells it further */
      const Ws = 23 * (0.7 + 0.3 * clamp01(m * 2.5)) * (1 + 0.42 * overN);

      if (hasIn) {
        L.dark[j].setAttribute("d", dIn);
        L.main[j].setAttribute("d", dIn);
        L.tint[j].setAttribute("d", dIn);
        L.gloss[j].setAttribute("d", dIn);
        L.gloss2[j].setAttribute("d", dIn);
        L.dark[j].setAttribute("opacity", "1");
        L.dark[j].setAttribute("stroke-width", Ws);
        L.dark[j].setAttribute("stroke", shade(L.color, -0.34 + 0.5 * thin));
        L.main[j].setAttribute("opacity", "1");
        L.main[j].setAttribute("stroke-width", Ws * 0.80);
        L.main[j].setAttribute("stroke", shade(L.color, thin));
        L.tint[j].setAttribute("opacity", "0.85");
        L.tint[j].setAttribute("stroke-width", Ws * 0.45);
        L.tint[j].setAttribute("transform", `translate(${-Ws * 0.09} ${-Ws * 0.12})`);
        /* stretch striations surface as the latex thins */
        L.tint[j].setAttribute("stroke-dasharray", overN > 0.12 ? "7 6" : "none");
        L.gloss[j].setAttribute("opacity", "0.95");
        L.gloss[j].setAttribute("stroke-width", Ws * 0.18 * (1 + 0.3 * overN));
        L.gloss[j].setAttribute("transform", `translate(${-Ws * 0.16} ${-Ws * 0.20})`);
        L.gloss2[j].setAttribute("opacity", "0.9");
        L.gloss2[j].setAttribute("stroke-width", Math.max(0.5, Ws * 0.08));
        L.gloss2[j].setAttribute("transform", `translate(${-Ws * 0.26} ${-Ws * 0.30})`);
      } else {
        L.dark[j].setAttribute("opacity", "0");
        L.main[j].setAttribute("opacity", "0");
        L.tint[j].setAttribute("opacity", "0");
        L.gloss[j].setAttribute("opacity", "0");
        L.gloss2[j].setAttribute("opacity", "0");
      }
      if (hasTail) {
        L.tail[j].setAttribute("d", dTail);
        L.tail[j].setAttribute("opacity", "0.95");
        L.tail[j].setAttribute("stroke-width", 3.4);
      } else {
        L.tail[j].setAttribute("opacity", "0");
      }
    }

    /* whole-balloon stretch: grows as it fills, keeps swelling overpumped,
       anchored at the nozzle for the first balloon, baseline for the rest */
    const mAvg = mSum / L.subs.length;
    const G = 0.86 + 0.14 * mAvg + 0.26 * overN;
    const tension = over > 0 ? Math.sin(now / 55 + L.phase) * over * 7 : 0;
    const ax = (L === letters[0]) ? L.subs[0].pts[0].x : L.w / 2;
    const ay = (L === letters[0]) ? L.subs[0].pts[0].y : 100;
    L.g.setAttribute("transform",
      `translate(${L.x} ${L.base - 100}) translate(${ax} ${ay}) scale(${G}) rotate(${tension}) translate(${-ax} ${-ay})`);

    /* ground shadow tracks how much balloon is standing over it */
    L.shadow.setAttribute("opacity", (0.04 + 0.10 * mAvg).toFixed(3));
    L.shadow.setAttribute("rx", (L.w * (0.72 - 0.17 * mAvg) * G).toFixed(1));
    L.refl.setAttribute("opacity", (0.10 * mAvg).toFixed(3));
    L.refl.setAttribute("rx", (L.w * 0.5 * G).toFixed(1));
  }
}

function renderPump(dt) {
  if (!pumpPlunger) return;
  pumpPressT = Math.max(0, pumpPressT - dt * 5);
  let down = Math.sin(Math.min(1, pumpPressT) * Math.PI) * pumpPlunger.travel;
  /* Nothing on this screen says what to do, and the first thing a visitor
     sees is a still picture. So if they have not touched it, the handle
     starts breathing on its own — small, slow, and impossible to read as
     anything but "press me". */
  pumpIdle = (performance.now() - lastPump > 2600) ? pumpIdle + dt : 0;
  if (pumpIdle > 0.6 && pumpPressT <= 0.02) {
    const w = Math.min(1, (pumpIdle - 0.6) / 1.4);
    const beat = (pumpIdle * 0.72) % 1;
    down += Math.sin(Math.min(1, beat / 0.34) * Math.PI)
            * pumpPlunger.travel * 0.24 * w * (beat < 0.34 ? 1 : 0);
  }
  pumpPlunger.el.setAttribute("transform", `translate(0 ${down})`);

  if (hoseInfo && hoseInfo.len) {
    hoseInfo.pulses = hoseInfo.pulses
      .map(p => p + dt * hoseInfo.len * 2.8)
      .filter(p => p < hoseInfo.len);
    hoseInfo.circles.forEach((c, i) => {
      const p = hoseInfo.pulses[i];
      if (p === undefined) { c.setAttribute("opacity", "0"); return; }
      const pt = hoseInfo.el.getPointAtLength(p);
      c.setAttribute("cx", pt.x);
      c.setAttribute("cy", pt.y);
      c.setAttribute("opacity", "0.55");
    });
  }
}

function sweepStroke(x, y) {
  if (lastSweep) {
    const dx = x - lastSweep.x, dy = y - lastSweep.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.5) {
      sweepDist += dist;
      glueCtx.globalCompositeOperation = "destination-out";
      glueCtx.fillStyle = "#000";
      const BR = 30 * UIS;              // a finger is not a precision instrument
      const steps = Math.max(1, Math.min(14, (dist / 8) | 0));
      for (let i = 0; i <= steps; i++) {
        const px = lastSweep.x + dx * i / steps;
        const py = lastSweep.y + dy * i / steps;
        glueCtx.beginPath();
        glueCtx.arc(px, py, BR, 0, Math.PI * 2);
        glueCtx.fill();

      glueCtx.globalCompositeOperation = "source-over";
      /* fling the freed flakes in the direction of the stroke */
      const keep = [];
      let flung = 0;
      const fvx = Math.max(-600, Math.min(600, dx * 15));
      const fvy = Math.max(-600, Math.min(600, dy * 15));
      const PR = (40 * UIS) * (40 * UIS);
      for (const q of stuckPts) {
        const ddx = q.x - x, ddy = q.y - y;
        if (ddx * ddx + ddy * ddy < PR) {
          if (flung < 26 && swept.length < 900) {
            swept.push({
              x: q.x, y: q.y,
              vx: fvx + (Math.random() - 0.5) * 140,
              vy: fvy - 40 - Math.random() * 90,
              c: q.c, s: 1.6 + Math.random() * 2,
              life: 0.9 + Math.random() * 0.5,
            });

        } else keep.push(q);
      }
      stuckPts = keep;
      /* the last few crumbs aren't a scavenger hunt — past ~98.5% swept,
         the remainder gives up and dissolves */
      /* Nobody sweeps a screen perfectly, and hunting the last few specks
         is not the game. Once most of it is gone — or you've simply put in
         the work — the rest lets go on its own. */
      const crumbs = Math.max(40, stuckCount * 0.18);
      if (stuckPts.length <= crumbs || sweepDist > 4200) {
        stuckPts = [];
        glueCanvas.style.transition = "opacity 0.8s ease";
        glueCanvas.style.opacity = "0";
        document.body.style.cursor = "";        // all clean
        broomEl.style.display = "none";

/* the message, written in glue, waiting for the glitter to find it */
const GLUE_TEXT = "fuck you";
function buildGlue() {
  const W = window.innerWidth, H = window.innerHeight;
  glueW = W; glueH = H;
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  glueCanvas.width = W * dpr;
  glueCanvas.height = H * dpr;
  glueCanvas.style.width = W + "px";     // same dpr>1 sizing fix as the glitter canvas
  glueCanvas.style.height = H + "px";
  glueCtx = glueCanvas.getContext("2d");
  glueCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* offscreen pass to find every pixel of glue */
  const mc = document.createElement("canvas");
  mc.width = W; mc.height = H;
  const m = mc.getContext("2d");
  const fam = `"Segoe Script","Bradley Hand","Brush Script MT","Comic Sans MS",cursive`;
  /* narrow screens stack the words so each one is HUGE and readable */
  const lines = W < 700 ? GLUE_TEXT.split(" ") : [GLUE_TEXT];
  let size = Math.round(Math.min(H * 0.34 / lines.length, W * (lines.length > 1 ? 0.5 : 0.30)));
  m.textAlign = "center"; m.textBaseline = "middle";
  while (size > 40) {
    m.font = `700 ${size}px ${fam}`;
    if (Math.max(...lines.map(t => m.measureText(t).width)) <= W * 0.86) break;
    size -= 8;
  }
  const cx = W / 2, cy = H * 0.46;
  const lh = size * 1.2;
  m.lineJoin = m.lineCap = "round";
  m.filter = "blur(1.5px)";               // squeezed-from-the-bottle edges
  m.strokeStyle = "#fff"; m.lineWidth = size * 0.07;
  m.fillStyle = "#fff";
  lines.forEach((t, i) => {
    const ly = cy - ((lines.length - 1) * lh) / 2 + i * lh;
    m.strokeText(t, cx, ly);
    m.fillText(t, cx, ly);
  });
  m.filter = "none";
  const img = m.getImageData(0, 0, W, H).data;
  glueMask = new Uint8Array(W * H);
  for (let i = 0; i < glueMask.length; i++) glueMask[i] = img[i * 4 + 3] > 60 ? 1 : 0;

  /* no sheen, no hint — the glue is invisible until the glitter finds it */
}

/* The viewport can change under us at any moment (iOS toolbar, rotation).
   These canvases are built once, so rescale them and their contents rather
   than leaving a stale, never-cleared rectangle on screen. */
function resizeGlue() {
  if (!glueCtx) return;
  const W = window.innerWidth, H = window.innerHeight;
  const oldW = parseFloat(glueCanvas.style.width) || W;
  const oldH = parseFloat(glueCanvas.style.height) || H;
  if (Math.abs(oldW - W) < 1 && Math.abs(oldH - H) < 1) return;
  const dpr = Math.min(1.5, window.devicePixelRatio || 1);
  const tmp = document.createElement("canvas");
  tmp.width = glueCanvas.width; tmp.height = glueCanvas.height;
  tmp.getContext("2d").drawImage(glueCanvas, 0, 0);
  glueCanvas.width = W * dpr; glueCanvas.height = H * dpr;
  glueCanvas.style.width = W + "px"; glueCanvas.style.height = H + "px";
  glueCtx = glueCanvas.getContext("2d");
  glueCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  glueCtx.drawImage(tmp, 0, 0, W, H);
  const sx = W / oldW, sy = H / oldH;
  for (const q of stuckPts) { q.x *= sx; q.y *= sy; }

function resizeGoo() {
  if (!gooActive || !tearCanvas) return;

/* a flake lands in the glue and becomes part of the art —

function stickFlake(p, bucket) {
  const s = p.s * 1.35;

  glueCtx.globalAlpha = 1;
  glueCtx.fillStyle = bucket.dim;
  glueCtx.fillRect(p.x - s / 2, p.y - s / 2, s * 0.95, s * 0.8);
  if (Math.random() < 0.6) {
    glueCtx.globalAlpha = 0.9;
    glueCtx.fillStyle = bucket.glint;
    const g = s * 0.5;
    glueCtx.fillRect(p.x - g / 2, p.y - g / 2, g, g);

/* Clear a canvas by its OWN bitmap, ignoring the current transform.

function hardClear(c, x) {
  x.save();
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.clearRect(0, 0, c.width, c.height);
  x.restore();

  canvas.style.width = window.innerWidth + "px";

}

function svgToScreen(x, y) {
  const r = heroSvg.getBoundingClientRect();
  const s = r.width / layoutW;

let timeScale = 1;

    const c = svgToScreen(L.x + L.w / 2, L.base - 50);
    letterCenters.push(c);

      const a = Math.random() * Math.PI * 2;
      const sp = 220 + Math.random() * 420;

        x: c.x, y: c.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 180,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 14,
        w: 6 + Math.random() * 12, h: 3 + Math.random() * 4,
        color: L.color, life: 2.2 + Math.random() * 1.2,

    { dim: "#9aa0a5", glint: "#ffffff", wt: 0.25 },

  /* a small screen can't resolve desktop flake density anyway — spend the

    /* Real glitter is mostly tiny and mostly dark — what you see is the
       flash when a face turns into the light, not the chip itself. Big
       coloured chips read as confetti, which is exactly what this looked
       like. So: small bodies, dim, and let the glints do the work. */
    const s = (Math.random() < 0.05 ? 2.8 + Math.random() * 2.0 : 0.9 + Math.random() * 1.6) * z;
    const pt = {
      x: 0, y: 0, vx: 0, vy: 0,
      phi: Math.random() * Math.PI * 2,
      w1: 3 + Math.random() * 7,          // tumble rate
      sway: 12 + Math.random() * 40,
      swayF: 1.5 + Math.random() * 4,
      ph: Math.random() * Math.PI * 2,
      s, life: 16,
      za: Math.min(1, 0.45 + 0.55 * z),
      zz: z >= 0.8,                       // near enough to land and stay

      /* the first wave erupts from the letters themselves */
      const c = letterCenters[(Math.random() * letterCenters.length) | 0];
      const a = Math.random() * Math.PI * 2;
      const sp = 150 + Math.random() * 550;
      pt.x = c.x; pt.y = c.y;
      pt.vx = Math.cos(a) * sp;
      pt.vy = Math.sin(a) * sp * 0.6;
    } else {
      /* the wall: three screens of curtain above the viewport */
      pt.x = Math.random() * W;
      pt.y = H * 0.1 - Math.random() * H * 3.2;
      pt.vx = (Math.random() - 0.5) * 40;
      pt.vy = (200 + s * 50 + Math.random() * 160) * z;
    }
    buckets[bi].arr.push(pt);
  }
  glitterAlive = COUNT;

  setTimeout(() => stage.classList.add("gone"), 400);
}

function tickParticles(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  /* the broom stage cleans the floor too — no gritty band left behind */
  if ((sweepMode || sweepDone) && driftAlpha > 0) driftAlpha = Math.max(0, driftAlpha - dt * 0.5);
  const driftLive = driftCanvas && driftAlpha > 0.01;
  if (!scraps.length && !glitterAlive && !stuckPts.length && !swept.length && !driftLive) { hardClear(canvas, ctx); return; }
  hardClear(canvas, ctx);
  if (driftLive) {
    ctx.globalAlpha = driftAlpha;
    ctx.drawImage(driftCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  /* latex scraps */
  let k = 0;
  for (let i = 0; i < scraps.length; i++) {
    const pt = scraps[i];
    pt.life -= dt;
    if (pt.life <= 0) continue;
    pt.vy += 900 * dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.rot += pt.vr * dt;
    ctx.save();
    ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.min(1, pt.life);
    ctx.beginPath();
    ctx.ellipse(0, 0, pt.w, pt.h, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    scraps[k++] = pt;
  }
  scraps.length = k;

  const slow = dt > 0.034;   // shed glitter early and gently, never chug
  let alive = 0;

  /* pass 1: the dark bodies of tumbling flakes (foreshortened as they turn) */
  for (const bucket of buckets) {
    const arr = bucket.arr;
    if (slow && arr.length > 400) arr.length = (arr.length * 0.93) | 0;
    ctx.fillStyle = bucket.dim;
    bucket.glints.length = 0;
    let j = 0;
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      p.life -= dt;
      p.ph += p.swayF * dt;
      p.phi += p.w1 * dt;
      p.x += (p.vx + Math.sin(p.ph) * p.sway) * dt;
      p.y += p.vy * dt;
      /* burst flakes decelerate into a gentle fall */
      if (p.vy < 160) p.vy += 500 * dt;
      p.vx *= 1 - Math.min(1, 1.6 * dt);
      if (p.life <= 0) continue;
      if (p.y > H - 5) {
        /* near flakes land in the drift at the bottom and stay.
           Draw in the drift canvas's OWN coordinates — mobile toolbars
           change innerHeight mid-storm and a mixed-space Y painted a
           glitter stripe across the middle of the screen */
        if (p.zz && driftCtx && driftCount < 5200) {
          driftCtx.globalAlpha = 0.85;
          driftCtx.fillStyle = bucket.dim;
          driftCtx.fillRect(
            (p.x / W) * driftCanvas.width - p.s / 2,
            driftCanvas.height - 3 - Math.random() * 5,
            p.s, p.s * 0.6);
          driftCount++;
        }
        continue;
      }
      /* glue check: flakes crossing the wet writing get caught in it —
         but only once the storm has been falling a while */
      /* sample the mask proportionally, so it stays aligned even if the
         viewport resized after the mask was built */
      const mx = (p.x / W * glueW) | 0, my = (p.y / H * glueH) | 0;
      if (glueActive && glueMask && stuckCount < STUCK_MAX
          && mx > 0 && mx < glueW && my > 0 && my < glueH
          && glueMask[my * glueW + mx]
          && Math.random() < 0.10) {   /* low per-frame odds = even coat, denser now */
        stickFlake(p, bucket);
        continue;
      }
      arr[j++] = p;
      if (p.y < -30) continue;
      const c = Math.cos(p.phi);
      const c2 = c * c, c4 = c2 * c2;
      const b8 = c4 * c4;                       // sharp specular lobe
      const fore = Math.abs(Math.sin(p.phi));   // face turns away -> sliver
      ctx.globalAlpha = (0.13 + 0.40 * fore) * (p.za || 1);
      const w = p.s * (0.25 + 0.75 * fore);
      ctx.fillRect(p.x - w / 2, p.y - p.s * 0.4, w, p.s * 0.8);
      if (b8 > 0.58) bucket.glints.push(p.x, p.y, p.s, b8 * (p.za || 1));
    }
    arr.length = j;
    alive += j;
  }

  /* pass 2: additive glints — the mirror faces catching the light */
  ctx.globalCompositeOperation = "lighter";
  for (const bucket of buckets) {
    const gl = bucket.glints;
    if (!gl.length) continue;
    ctx.fillStyle = bucket.glint;
    for (let i = 0; i < gl.length; i += 4) {
      const x = gl[i], y = gl[i + 1], s = gl[i + 2], b = gl[i + 3];
      const a = (b - 0.58) / 0.42;
      ctx.globalAlpha = a * a;
      const gs = s * (1.5 + 2.2 * a);
      ctx.fillRect(x - gs / 2, y - gs / 2, gs, gs);
      if (a > 0.70) {
        /* the brightest faces flare into little star rays */
        ctx.globalAlpha = (a - 0.70) * 2.4;
        const r = gs * 3.4, t = gs * 0.20;
        ctx.fillRect(x - r / 2, y - t / 2, r, t);
        ctx.fillRect(x - t / 2, y - r / 2, t, r);
      }
    }
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  glitterAlive = alive;

  /* the storm is over and the message is made: hand them the broom */
  if (exploded && !sweepMode && alive === 0 && stuckCount > 0) enableSweep();

  /* freed flakes tumbling away from the broom */
  if (swept.length) {
    let w2 = 0;
    for (let i = 0; i < swept.length; i++) {
      const q = swept[i];
      q.life -= dt;
      if (q.life <= 0) continue;
      q.vy += 900 * dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vx *= 1 - Math.min(1, 2.5 * dt);
      ctx.globalAlpha = Math.min(1, q.life * 1.4);
      ctx.fillStyle = q.c;
      ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s * 0.8);
      swept[w2++] = q;
    }
    swept.length = w2;
    ctx.globalAlpha = 1;
  }

  /* the glitter caught in the glue keeps catching the light forever */
  if (stuckPts.length) {
    ctx.globalCompositeOperation = "lighter";
    const n = Math.max(6, (stuckPts.length * 0.004) | 0);
    for (let i = 0; i < n; i++) {
      const q = stuckPts[(Math.random() * stuckPts.length) | 0];
      const a = Math.random();
      if (a < 0.5) continue;
      ctx.globalAlpha = (a - 0.5) * 1.6;
      ctx.fillStyle = q.c;
      const s = 1.5 + a * 3;
      ctx.fillRect(q.x - s / 2, q.y - s * 0.14, s, s * 0.28);
      ctx.fillRect(q.x - s * 0.14, q.y - s / 2, s * 0.28, s);
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
}

/* ================= the dot ================= */
const dotEl = document.getElementById("dot");
/* A curated walk rather than a hue step. Rotating the hue by a fixed
   amount marches straight through lime and mustard, and the last one is
   the one that becomes the whole screen — it has to be a colour you would
   choose, and it has to be a colour that looks like water when the tap
   fills it. So the walk warms and cools but converges on deep sea. */
const DOT_COLORS = ["#e6394f", "#ff7a1f", "#f5b800", "#3fbf72", "#00a3d9",
                    "#7d4bd6", "#e0407f", "#17a89b", "#c9333f", "#e58a1c",
                    "#2f9fd4", "#1c7f96"];
const DOT_FINAL = "#0d5468";
function mixHex(a, b, t) {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const r = ((A >> 16 & 255) * (1 - t) + (B >> 16 & 255) * t) | 0;
  const g = ((A >> 8 & 255) * (1 - t) + (B >> 8 & 255) * t) | 0;
  const bl = ((A & 255) * (1 - t) + (B & 255) * t) | 0;
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}
let dotShown = false, dotN = 0, dotSize = 0, dotDone = false;

function bloopSound(n) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const f = 200 * Math.pow(2, n * 0.12);
  const osc = ac.createOscillator(); osc.type = "sine";
  osc.frequency.setValueAtTime(f * 0.9, t0);
  osc.frequency.exponentialRampToValueAtTime(f, t0 + 0.06);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  osc.connect(g); g.connect(BUS);
  osc.start(t0); osc.stop(t0 + 0.24);
}

function showDot() {
  if (dotShown) return;
  dotShown = true;
  startPool();
}

let dotHue = 348;
function dotTap() {
  if (dotDone || !dotShown) return;
  dotN++;
  dotSize *= 1.55;
  const diagN = Math.hypot(window.innerWidth, window.innerHeight);
  const near = Math.max(0, Math.min(1, (dotSize / diagN - 0.42) / 0.58));
  const base = DOT_COLORS[(dotN - 1 + RUN.palRot) % DOT_COLORS.length];
  const color = mixHex(base, DOT_FINAL, near * near);
  const dur = Math.min(2.8, 0.4 + dotN * 0.16);
  dotEl.style.transition = `width ${dur}s ease, height ${dur}s ease, background ${dur * 0.7}s ease`;
  dotEl.style.width = dotSize + "px";
  dotEl.style.height = dotSize + "px";
  dotEl.style.background =
    `radial-gradient(circle at 42% 36%, ${shade(color, 0.34)} 0%, ${color} 46%, ${shade(color, -0.34)} 100%)`;
  dotEl.dataset.col = color;
  /* jelly wobble + a ripple ring */
  dotEl.classList.remove("jelly");
  void dotEl.offsetWidth;
  dotEl.classList.add("jelly");
  const ring = document.createElement("div");
  ring.className = "dotring";
  ring.style.width = ring.style.height = dotSize + "px";
  ring.style.borderColor = color;
  document.body.appendChild(ring);
  setTimeout(() => ring.remove(), 760);
  bloopSound(dotN);
  /* done the moment it visually covers the screen — never demand an
     extra tap after the thing already looks finished */
  const diag = Math.hypot(window.innerWidth, window.innerHeight);
  if (dotSize > diag * 1.02) {
    dotDone = true;                 // it is the screen now
    dotEl.style.cursor = "default";
    /* wait for the colour to finish filling, THEN drop the tap in, so the
       two moments don't step on each other */
    setTimeout(showTap, dur * 1000 + 250);
  }
}
dotEl.addEventListener("pointerdown", (e) => { e.preventDefault(); dotTap(); });
/* a 14px dot is no tap target: anything near the center counts while it's small */
window.addEventListener("pointerdown", (e) => {
  if (!dotShown || dotDone || tapShown || e.target === dotEl) return;
  const dx = e.clientX - window.innerWidth / 2;
  const dy = e.clientY - window.innerHeight / 2;
  const r = Math.max(dotSize / 2 + 16, 30);
  if (dx * dx + dy * dy <= r * r) dotTap();
});

/* ================= the pool =================
   A field of liquid drops, one of them yours. Move yours through them and
   they come in — surface tension does most of the work, they lean toward
   you as you get close and let go of their own shape when they touch. No
   rules to work out and nothing to get wrong: it is a gathering, and the
   only thing it asks of you is to move. It ends by filling the frame. */

const poolCanvas = document.createElement("canvas");
poolCanvas.id = "pool";
document.body.appendChild(poolCanvas);
const pctx = poolCanvas.getContext("2d");

let pool = [], you = null, poolOn = false, poolT = 0, poolGrab = null;
let poolTarget = null, poolFlood = 0, poolDone = false;

function sizePool() {
  const W = window.innerWidth, H = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  poolCanvas.width = W * dpr; poolCanvas.height = H * dpr;
  poolCanvas.style.width = W + "px"; poolCanvas.style.height = H + "px";
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function buildPool() {
  const W = window.innerWidth, H = window.innerHeight;
  const unit = Math.min(W, H) * 0.030;
  pool = [];
  const N = W < 620 ? 13 : 17;
  for (let i = 0; i < N; i++) {
    const r = unit * (0.55 + Math.pow(i / N, 1.25) * 2.1 + rnd() * 0.3);
    /* placed off-centre and spread out, biggest furthest away */
    const a = rnd() * Math.PI * 2;
    const spread = 0.16 + 0.34 * (i / N) + rnd() * 0.14;
    pool.push({
      x: W * 0.5 + Math.cos(a) * W * spread * 0.82,
      y: H * 0.5 + Math.sin(a) * H * spread * 0.86,
      r, hue: (RUN.hueShift + i * 37) % 360,
      vx: (rnd() - 0.5) * 8, vy: (rnd() - 0.5) * 8,
      w1: 0, w2: 0, p1: rnd() * 6.3, p2: rnd() * 6.3,
      mine: false,
    });
  }
  you = { x: W * 0.5, y: H * 0.5, r: unit * 1.06, hue: (RUN.hueShift + 200) % 360,
          vx: 0, vy: 0, w1: 0, w2: 0, p1: 0, p2: 1.7, mine: true };
  pool.push(you);
  /* keep everyone inside the frame to start with */
  for (const d of pool) {
    d.x = Math.max(d.r + 12, Math.min(W - d.r - 12, d.x));
    d.y = Math.max(d.r + 12, Math.min(H - d.r - 12, d.y));
  }
}

function startPool() {
  mark("pool");
  if (poolOn) return;
  sizePool();
  buildPool();
  poolOn = true; poolT = 0; poolFlood = 0; poolDone = false;
  bed('water');
  poolCanvas.style.display = "block";
  requestAnimationFrame(() => poolCanvas.style.opacity = "1");
}

/* --- the wobbling outline: two harmonics, damped, kicked by contact --- */
function poolPath(c, d, t, scale) {
  const N = 30;
  c.beginPath();
  for (let i = 0; i <= N; i++) {
    const th = i / N * Math.PI * 2;
    const rr = d.r * (scale || 1) *
      (1 + d.w1 * Math.cos(2 * th + d.p1 + t * 5.2)
         + d.w2 * Math.cos(3 * th + d.p2 - t * 3.4));
    const x = d.x + Math.cos(th) * rr, y = d.y + Math.sin(th) * rr;
    i ? c.lineTo(x, y) : c.moveTo(x, y);
  }
  c.closePath();
}

function drawBlob(d, t, near) {
  const c = pctx;
  const light = d.mine ? 68 : 58 + (near || 0) * 10;
  const sat = d.mine ? 80 : 86;
  poolPath(c, d, t);
