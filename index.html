<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Hershock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fdfdfb;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6vh;
    transition: opacity 1.6s ease;
  }
  #stage.gone { opacity: 0; pointer-events: none; }
  #heroSvg { width: 100%; height: auto; max-height: 88vh; display: block; }
  #glitter {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .pumpHit { cursor: pointer; }
  .arrowGrp { animation: bounce 0.9s ease-in-out infinite; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(12px); }
  }
  .arrowTxt {
    font-family: "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive;
    font-weight: bold;
  }
  .noselect { user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<div id="stage" class="noselect"></div>
<canvas id="glitter"></canvas>

<script>
"use strict";

/* ================= letter definitions =================
   Monoline "balloon" letters. Coordinates: y 0 (top) to 100 (baseline).
   Each letter = one or more subpaths (each subpath is one thin balloon). */
const LETTERS = {
  K: { w: 58, subs: ["M10 4 L10 96", "M52 4 L14 50 L52 96"] },
  E: { w: 52, subs: ["M48 4 L12 4 L12 96 L48 96", "M12 50 L40 50"] },
  V: { w: 60, subs: ["M8 4 L30 96 L52 4"] },
  I: { w: 20, subs: ["M10 4 L10 96"] },
  N: { w: 60, subs: ["M10 96 L10 4 L50 96 L50 4"] },
  H: { w: 58, subs: ["M10 4 L10 96", "M48 4 L48 96", "M10 50 L48 50"] },
  R: { w: 56, subs: ["M12 96 L12 4 L32 4 C52 4 52 48 32 48 L12 48", "M31 48 L50 96"] },
  S: { w: 52, subs: ["M44 13 C37 1 13 0 11 20 C8 41 44 44 46 68 C48 92 17 103 8 83"] },
  O: { w: 60, subs: ["M30 4 C7 4 7 96 30 96 C53 96 53 4 30 4 Z"] },
  C: { w: 54, subs: ["M46 15 C35 -1 10 8 10 50 C10 92 35 101 46 85"] },
};
const PALETTE = ["#ff4d6d","#ff9f1c","#ffd60a","#06d6a0","#118ab2","#9b5de5",
                 "#ff70a6","#00bbf9","#ef476f","#8ac926","#f7b32b","#43bccd","#c77dff"];
const NAME = "KEVIN HERSHOCK";
const SPACE_W = 34;
const LETTER_GAP = 10;

/* ================= state ================= */
const PUMP_STEP = 0.085;        // air per pump
const EXPLODE_AT = 1.42;        // keep pumping past "full" -> boom
const IDLE_MS = 950;            // stop pumping this long -> deflate
const DECAY_PER_S = 0.30;       // deflate speed

let target = 0;                 // where the air wants to be
let inf = 0;                    // rendered inflation (springs toward target)
let vel = 0;
let lastPump = -1e9;
let exploded = false;
let pumpPressT = 0;             // 0..1 handle press animation
let letters = [];               // built per layout
let layoutW = 0, layoutH = 0;
let heroSvg = null, pumpPlunger = null;
const stage = document.getElementById("stage");

/* ================= layout / svg build ================= */
function currentLines() {
  return (window.innerWidth < 720)
    ? ["KEVIN", "HERSHOCK"]
    : ["KEVIN HERSHOCK"];
}

function lineWidth(line) {
  let w = 0;
  for (const ch of line) {
    w += (ch === " ") ? SPACE_W : LETTERS[ch].w + LETTER_GAP;
  }
  return w;
}

function buildSvg() {
  const lines = currentLines();
  const PUMP_ZONE = 165;
  const widest = Math.max(...lines.map(lineWidth));
  const W = PUMP_ZONE + widest + 50;
  const lineGap = 140;
  const firstBase = 190;
  const lastBase = firstBase + (lines.length - 1) * lineGap;
  const H = lastBase + 45;
  layoutW = W; layoutH = H;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", "heroSvg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMin meet");

  letters = [];
  let ci = 0;
  lines.forEach((line, li) => {
    const base = firstBase + li * lineGap;
    let x = PUMP_ZONE + (widest - lineWidth(line)) / 2;
    for (const ch of line) {
      if (ch === " ") { x += SPACE_W; continue; }
      const def = LETTERS[ch];
      const g = document.createElementNS(NS, "g");
      const color = PALETTE[ci % PALETTE.length];
      const paths = [], glosses = [];
      for (const d of def.subs) {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", color);
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("stroke-linejoin", "round");
        g.appendChild(p);
        paths.push(p);
      }
      for (const d of def.subs) {
        const p = document.createElementNS(NS, "path");
        p.setAttribute("d", d);
        p.setAttribute("fill", "none");
        p.setAttribute("stroke", "#ffffff");
        p.setAttribute("stroke-linecap", "round");
        p.setAttribute("stroke-linejoin", "round");
        p.setAttribute("opacity", "0");
        g.appendChild(p);
        glosses.push(p);
      }
      // knot: little tie-off at the base of the letter
      const knot = document.createElementNS(NS, "circle");
      knot.setAttribute("fill", color);
      knot.setAttribute("cx", def.w / 2);
      knot.setAttribute("cy", 99);
      knot.setAttribute("r", 0);
      g.appendChild(knot);

      svg.appendChild(g);
      const jitter = (Math.random() * 8 - 4);      // limp tilt when flat
      const phase = Math.random() * Math.PI * 2;   // wobble phase
      letters.push({ g, paths, glosses, knot, x, base, w: def.w, color, jitter, phase });
      x += def.w + LETTER_GAP;
      ci++;
    }
  });

  buildPump(svg, NS, firstBase, letters[0]);
  stage.innerHTML = "";
  stage.appendChild(svg);
  heroSvg = svg;
}

function buildPump(svg, NS, base, firstLetter) {
  const px = 62;                 // pump center x
  const ground = base + 8;

  // hose: from pump base over to the first balloon's knot
  const hx = firstLetter.x + firstLetter.w / 2;
  const hy = firstLetter.base + 6;
  const hose = document.createElementNS(NS, "path");
  hose.setAttribute("d",
    `M${px + 38} ${ground - 6} C ${px + 80} ${ground + 14}, ${hx - 60} ${hy + 26}, ${hx} ${hy}`);
  hose.setAttribute("fill", "none");
  hose.setAttribute("stroke", "#555");
  hose.setAttribute("stroke-width", "6");
  hose.setAttribute("stroke-linecap", "round");
  svg.appendChild(hose);

  const pump = document.createElementNS(NS, "g");

  // base plate
  const plate = document.createElementNS(NS, "rect");
  plate.setAttribute("x", px - 46); plate.setAttribute("y", ground - 10);
  plate.setAttribute("width", 92); plate.setAttribute("height", 12);
  plate.setAttribute("rx", 6); plate.setAttribute("fill", "#c0392b");
  pump.appendChild(plate);

  // cylinder
  const cyl = document.createElementNS(NS, "rect");
  cyl.setAttribute("x", px - 20); cyl.setAttribute("y", ground - 90);
  cyl.setAttribute("width", 40); cyl.setAttribute("height", 82);
  cyl.setAttribute("rx", 8); cyl.setAttribute("fill", "#e74c3c");
  pump.appendChild(cyl);
  const cylHi = document.createElementNS(NS, "rect");
  cylHi.setAttribute("x", px - 13); cylHi.setAttribute("y", ground - 84);
  cylHi.setAttribute("width", 7); cylHi.setAttribute("height", 70);
  cylHi.setAttribute("rx", 3.5); cylHi.setAttribute("fill", "#ff7f6e");
  pump.appendChild(cylHi);
  const collar = document.createElementNS(NS, "rect");
  collar.setAttribute("x", px - 24); collar.setAttribute("y", ground - 96);
  collar.setAttribute("width", 48); collar.setAttribute("height", 10);
  collar.setAttribute("rx", 5); collar.setAttribute("fill", "#96281b");
  pump.appendChild(collar);

  // plunger (rod + T-handle) — this part moves
  const plunger = document.createElementNS(NS, "g");
  const rod = document.createElementNS(NS, "rect");
  rod.setAttribute("x", px - 4); rod.setAttribute("y", ground - 138);
  rod.setAttribute("width", 8); rod.setAttribute("height", 46);
  rod.setAttribute("fill", "#7f8c8d");
  plunger.appendChild(rod);
  const handle = document.createElementNS(NS, "rect");
  handle.setAttribute("x", px - 42); handle.setAttribute("y", ground - 152);
  handle.setAttribute("width", 84); handle.setAttribute("height", 16);
  handle.setAttribute("rx", 8); handle.setAttribute("fill", "#2c3e50");
  plunger.appendChild(handle);
  pump.appendChild(plunger);
  pumpPlunger = { el: plunger, travel: 34 };

  // bouncing arrow + note
  const arrowWrap = document.createElementNS(NS, "g");
  arrowWrap.setAttribute("class", "arrowGrp");
  arrowWrap.setAttribute("style", `transform-origin: ${px + 52}px ${ground - 190}px;`);
  const arrow = document.createElementNS(NS, "path");
  const ax = px, ay = ground - 196; // arrow tip zone above handle
  arrow.setAttribute("d",
    `M${ax} ${ay} L${ax} ${ay + 26} M${ax - 11} ${ay + 15} L${ax} ${ay + 28} L${ax + 11} ${ay + 15}`);
  arrow.setAttribute("stroke", "#e74c3c");
  arrow.setAttribute("stroke-width", "7");
  arrow.setAttribute("stroke-linecap", "round");
  arrow.setAttribute("stroke-linejoin", "round");
  arrow.setAttribute("fill", "none");
  arrowWrap.appendChild(arrow);
  const note = document.createElementNS(NS, "text");
  note.setAttribute("x", px + 58); note.setAttribute("y", ay + 14);
  note.setAttribute("class", "arrowTxt");
  note.setAttribute("font-size", "24");
  note.setAttribute("fill", "#e74c3c");
  note.textContent = "push my handle!";
  arrowWrap.appendChild(note);
  pump.appendChild(arrowWrap);

  // big invisible hit area
  const hit = document.createElementNS(NS, "rect");
  hit.setAttribute("x", px - 60); hit.setAttribute("y", ground - 165);
  hit.setAttribute("width", 260); hit.setAttribute("height", 180);
  hit.setAttribute("fill", "transparent");
  hit.setAttribute("class", "pumpHit");
  hit.addEventListener("pointerdown", doPump);
  pump.appendChild(hit);

  svg.appendChild(pump);
}

/* ================= pumping ================= */
function doPump(e) {
  if (e) e.preventDefault();
  if (exploded) return;
  target += PUMP_STEP;
  vel += 0.55;                  // a gulp of air
  lastPump = performance.now();
  pumpPressT = 1;
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") doPump(e);
});

/* ================= animation loop ================= */
const easeOut = t => 1 - Math.pow(1 - t, 3);
let prevT = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000);
  prevT = now;

  if (!exploded) {
    // idle deflation
    if (now - lastPump > IDLE_MS && target > 0) {
      target = Math.max(0, target - DECAY_PER_S * dt);
    }
    // spring inf -> target (springy, slightly underdamped = jiggly balloons)
    const k = 60, damp = 8.5;
    vel += (target - inf) * k * dt;
    vel *= Math.exp(-damp * dt);
    inf += vel * dt;
    if (inf < 0) { inf = 0; vel = 0; }

    if (inf >= EXPLODE_AT) { explode(); }
    else { renderLetters(now); renderPump(dt); }
  }

  tickParticles(dt);
  requestAnimationFrame(frame);
}

function renderLetters(now) {
  const p = Math.min(1, inf);
  const over = Math.max(0, inf - 1);
  const ep = easeOut(p);
  const strokeW = 3 + 20 * ep + 13 * over;
  const glossW = Math.max(1.5, strokeW * 0.24);
  const glossOp = 0.55 * ep;

  for (const L of letters) {
    // squash: flat on the ground when deflated
    const sy = 0.09 + 0.91 * ep + over * 0.06;
    const sx = 1 + 0.14 * (1 - ep) + over * 0.05;
    const limp = L.jitter * (1 - ep);
    const wob = over > 0
      ? Math.sin(now / 60 + L.phase) * over * 9
      : Math.sin(now / 400 + L.phase) * (1 - ep) * 1.2;
    const cx = L.x + L.w / 2, by = L.base;
    L.g.setAttribute("transform",
      `translate(${cx} ${by}) scale(${sx} ${sy}) rotate(${limp + wob}) translate(${-L.w / 2} -100)`);
    for (const path of L.paths) path.setAttribute("stroke-width", strokeW);
    L.glosses.forEach((gp) => {
      gp.setAttribute("stroke-width", glossW);
      gp.setAttribute("opacity", glossOp);
      gp.setAttribute("transform", `translate(${-strokeW * 0.14} ${-strokeW * 0.18})`);
    });
    L.knot.setAttribute("r", 2 + 4 * ep);
  }
}

function renderPump(dt) {
  if (!pumpPlunger) return;
  pumpPressT = Math.max(0, pumpPressT - dt * 5);
  const down = Math.sin(Math.min(1, pumpPressT) * Math.PI) * pumpPlunger.travel;
  pumpPlunger.el.setAttribute("transform", `translate(0 ${down})`);
}

/* ================= explosion + glitter ================= */
const canvas = document.getElementById("glitter");
const ctx = canvas.getContext("2d");
let parts = [];
function sizeCanvas() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function svgToScreen(x, y) {
  const r = heroSvg.getBoundingClientRect();
  const s = r.width / layoutW;
  return { x: r.left + x * s, y: r.top + y * s };
}

function explode() {
  exploded = true;

  // balloon scraps burst from each letter
  for (const L of letters) {
    const c = svgToScreen(L.x + L.w / 2, L.base - 50);
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 220 + Math.random() * 420;
      parts.push({
        kind: "scrap", x: c.x, y: c.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 180,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 14,
        w: 6 + Math.random() * 12, h: 3 + Math.random() * 4,
        color: L.color, life: 2.2 + Math.random() * 1.2,
      });
    }
    L.g.style.display = "none";
  }

  // glitter curtain: born across the top, sweeps down the whole page
  const W = window.innerWidth;
  const GLITTER = ["#ffd700","#ffdf6b","#c0c0c0","#e8e8e8","#ff4d6d","#06d6a0",
                  "#118ab2","#9b5de5","#ff70a6","#ffd60a","#00bbf9","#f7b32b"];
  for (let i = 0; i < 950; i++) {
    parts.push({
      kind: "glitter",
      x: Math.random() * W,
      y: -20 - Math.random() * window.innerHeight * 0.9,
      vx: (Math.random() - 0.5) * 40,
      vy: 160 + Math.random() * 260,
      sway: 20 + Math.random() * 50,
      swayF: 2 + Math.random() * 4,
      ph: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 16,
      s: 3 + Math.random() * 5,
      color: GLITTER[(Math.random() * GLITTER.length) | 0],
      life: 7,
    });
  }

  // pump & remnants fade away under the glitter, revealing the (blank, for now) site
  setTimeout(() => stage.classList.add("gone"), 500);
}

let elapsed = 0;
function tickParticles(dt) {
  if (!parts.length) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
  elapsed += dt;
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  const H = window.innerHeight;
  parts = parts.filter(pt => {
    pt.life -= dt;
    if (pt.life <= 0) return false;
    if (pt.kind === "scrap") {
      pt.vy += 900 * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.rot += pt.vr * dt;
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.min(1, pt.life);
      ctx.beginPath();
      ctx.ellipse(0, 0, pt.w, pt.h, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      pt.ph += pt.swayF * dt;
      pt.x += (pt.vx + Math.sin(pt.ph) * pt.sway) * dt;
      pt.y += pt.vy * dt;
      pt.rot += pt.vr * dt;
      if (pt.y > H + 30) return false;
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
      const tw = 0.55 + 0.45 * Math.sin(pt.ph * 3 + pt.x); // twinkle
      ctx.globalAlpha = tw;
      ctx.fillStyle = pt.color;
      ctx.fillRect(-pt.s / 2, -pt.s / 2, pt.s, pt.s * 0.7);
      ctx.restore();
    }
    return true;
  });
}

/* ================= boot ================= */
function boot() {
  sizeCanvas();
  buildSvg();
}
let lastLines = "";
window.addEventListener("resize", () => {
  sizeCanvas();
  if (exploded) return;
  const l = currentLines().join("|");
  if (l !== lastLines) { lastLines = l; buildSvg(); }
});
lastLines = currentLines().join("|");
boot();
requestAnimationFrame(frame);

/* The rest of the site goes here one day. For now: pop the balloons. */
</script>
</body>
</html>
