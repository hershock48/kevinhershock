  s.start(t0); s.stop(t0 + 0.12);
}
let lastCreak = 0;
function creak(v) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastCreak < 0.16) return;
  lastCreak = t0;
  const o = ac.createOscillator(); o.type = "sawtooth";
  o.frequency.setValueAtTime(78 + v * 90, t0);
  o.frequency.linearRampToValueAtTime(94 + v * 130, t0 + 0.3);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 420 + v * 500; bp.Q.value = 7;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.030, t0 + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.42);
  o.connect(bp); bp.connect(g); g.connect(BUS);
  o.start(t0); o.stop(t0 + 0.45);
}


/* ================= carrying a transition on its own =================
   Sometimes there is no scene running to draw a transition over — between
   the torn sheet and the ink there is nothing else on screen — so the
   finale canvas is borrowed to carry it, and handed back afterwards. */
let travelOnly = false;

/* ================= the window =================
   The light out of the chest resolves into a pane of glass with rain on
   the far side of it and your breath on this one. There is nothing to
   work out and nothing to press: put a finger on it and wipe. The rain
   helps — every drop that runs cuts its own clear track down the glass.
   Behind it, out of focus, something is moving. */

let winOn = false, winT = 0, winClear = 0, winGone = 0, winWipe = null;
let fogC = null, fogX = null, rainDrops = [], bokeh = [];

function sizeFog() {
  const W = window.innerWidth, H = window.innerHeight;
  if (!fogC) {
    fogC = document.createElement("canvas");
    /* read back twice a second to see how clear it is — tell the browser so */
    fogX = fogC.getContext("2d", { willReadFrequently: true });
  }
  fogC.width = W; fogC.height = H;
  fogX.setTransform(1, 0, 0, 1, 0, 0);
  /* breath on glass is not flat — it is a field of tiny beads */
  fogX.clearRect(0, 0, W, H);
  const g = fogX.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
  g.addColorStop(0, "rgba(222,234,240,0.68)");
  g.addColorStop(1, "rgba(196,213,224,0.82)");
  fogX.fillStyle = g;
  fogX.fillRect(0, 0, W, H);
  for (let i = 0; i < 4200; i++) {
    const v = Math.random();
    fogX.fillStyle = v > 0.5 ? `rgba(255,255,255,${(v * 0.22).toFixed(3)})`
                             : `rgba(168,190,204,${((0.5 - v) * 0.26).toFixed(3)})`;
    const r = 0.6 + Math.random() * 2.2;
    fogX.beginPath();
    fogX.arc(Math.random() * W, Math.random() * H, r, 0, 6.3);
    fogX.fill();
  }
}

function startWindow() {
  mark("window");
  if (winOn) return;
  digPhase = 0;
  winOn = true; winT = 0; winClear = 0; winGone = 0;
  sizeFog();
  const W = window.innerWidth, H = window.innerHeight;
  bokeh = [];
  const N = W < 620 ? 20 : 32;
  for (let i = 0; i < N; i++) {
    bokeh.push({
      x: rnd() * W, y: rnd() * H,
      r: Math.min(W, H) * (0.045 + rnd() * 0.13),
      hue: 168 + rnd() * 60,
      a: 0.34 + rnd() * 0.46,
      vx: (rnd() - 0.5) * 9, vy: -3 - rnd() * 9,
      ph: rnd() * 6.3, sp: 0.3 + rnd() * 0.7,
    });
  }
  rainDrops = [];
  finCanvas.style.cursor = "";
  bed('glass');
  rainOnGlass();
}

function fogLeft() {
  /* coarse sample — reading every pixel each frame is not worth it */
  const W = fogC.width, H = fogC.height;
  const step = 24;
  const d = fogX.getImageData(0, 0, W, H).data;
  let on = 0, n = 0;
  for (let y = 0; y < H; y += step) {
    for (let x = 0; x < W; x += step) {
      n++;
      if (d[(y * W + x) * 4 + 3] > 90) on++;
    }
  }
  return n ? on / n : 1;
}

function wipeAt(x, y, r) {
  if (!fogX) return;
  fogX.save();
  fogX.globalCompositeOperation = "destination-out";
  const g = fogX.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(0.45, "rgba(0,0,0,0.94)");
  g.addColorStop(0.78, "rgba(0,0,0,0.42)");
  g.addColorStop(1, "rgba(0,0,0,0)");
  fogX.fillStyle = g;
  fogX.fillRect(x - r, y - r, r * 2, r * 2);
  fogX.restore();
}

function windowFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  winT += dt;
  if (!fogC || fogC.width !== W || fogC.height !== H) sizeFog();
  hardClear(finCanvas, fctx);

  /* ---- what is behind the glass: out of focus, and moving ---- */
  const dark = fctx.createLinearGradient(0, 0, 0, H);
  dark.addColorStop(0, "#0a1f2b");
  dark.addColorStop(0.55, "#0d3040");
  dark.addColorStop(1, "#061520");
  fctx.fillStyle = dark; fctx.fillRect(0, 0, W, H);
  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  for (const b of bokeh) {
    b.x += (b.vx + Math.sin(winT * b.sp + b.ph) * 6) * dt;
    b.y += b.vy * dt;
    if (b.y < -b.r * 2) { b.y = H + b.r * 2; b.x = Math.random() * W; }
    if (b.x < -b.r) b.x = W + b.r;
    if (b.x > W + b.r) b.x = -b.r;
    /* they tighten up as the glass clears — the world coming into focus */
    const focus = 0.35 + 0.65 * winGone;
    const rr = b.r * (1.25 - 0.45 * winGone);
    const g = fctx.createRadialGradient(b.x, b.y, rr * 0.05 * focus, b.x, b.y, rr);
    const pulse = 0.85 + 0.15 * Math.sin(winT * b.sp * 1.7 + b.ph);
    g.addColorStop(0, `hsla(${b.hue},78%,${68 + winGone * 14}%,${(b.a * pulse * (0.8 + 0.4 * winGone)).toFixed(3)})`);
    g.addColorStop(0.42, `hsla(${b.hue},82%,58%,${(b.a * 0.50 * pulse).toFixed(3)})`);
    g.addColorStop(1, "hsla(0,0%,0%,0)");
    fctx.fillStyle = g;
    fctx.fillRect(b.x - rr, b.y - rr, rr * 2, rr * 2);
  }
  fctx.restore();

  /* ---- rain on the far side, cutting its own tracks ---- */
  if (rainDrops.length < (W < 620 ? 22 : 40) && Math.random() < 8 * dt) {
    rainDrops.push({ x: Math.random() * W, y: -10,
                     r: 2.2 + Math.random() * 5.5,
                     v: 0, wob: (Math.random() - 0.5) * 22, ph: Math.random() * 6.3 });
  }
  for (let i = rainDrops.length - 1; i >= 0; i--) {
    const d = rainDrops[i];
    /* a bead only runs once it is heavy enough, then it accelerates and
       picks up whatever it passes through */
    d.v += (18 + d.r * 26) * dt;
    d.v *= Math.exp(-1.6 * dt);
    const dy = d.v * dt;
    d.y += dy;
    d.x += Math.sin(winT * 1.3 + d.ph) * d.wob * dt;
    if (d.y > H + 20) { rainDrops.splice(i, 1); continue; }
    if (dy > 0.4) { wipeAt(d.x, d.y, d.r * 0.72); d.r *= 0.9985; }
  }

  /* ---- the fog, and the clear glass under it ---- */
  fctx.drawImage(fogC, 0, 0);

  /* the beads themselves sit on the glass, catching what is behind them */
  for (const d of rainDrops) {
    const g = fctx.createRadialGradient(d.x - d.r * 0.3, d.y - d.r * 0.35, 0, d.x, d.y, d.r);
    g.addColorStop(0, "rgba(255,255,255,0.55)");
    g.addColorStop(0.5, "rgba(190,225,235,0.20)");
    g.addColorStop(1, "rgba(120,170,190,0.30)");
    fctx.fillStyle = g;
    fctx.beginPath(); fctx.arc(d.x, d.y, d.r, 0, 6.3); fctx.fill();
    fctx.strokeStyle = "rgba(255,255,255,0.35)";
    fctx.lineWidth = Math.max(0.7, d.r * 0.14);
    fctx.beginPath(); fctx.arc(d.x, d.y, d.r * 0.94, 2.4, 4.6); fctx.stroke();
  }

  /* the glass itself: a cold sheen across it, and a frame beyond the edges */
  const sh = fctx.createLinearGradient(0, 0, W * 0.8, H);
  sh.addColorStop(0, "rgba(255,255,255,0.05)");
  sh.addColorStop(0.4, "rgba(255,255,255,0.01)");
  sh.addColorStop(0.75, "rgba(255,255,255,0.04)");
  sh.addColorStop(1, "rgba(255,255,255,0)");
  fctx.fillStyle = sh; fctx.fillRect(0, 0, W, H);

  /* ---- how clear is it ---- */
  if (winT > 0.6 && (winT % 0.5) < dt) {
    const left = fogLeft();
    winClear = 1 - left;
    if (winClear > 0.52 && !winGone) { winGone = 0.0001; clearSigh(); }
  }
  if (winGone > 0) {
    /* the rest of it goes at once, like a held breath let go */
    winGone = Math.min(1, winGone + dt * 0.5);
    fogX.save();
    fogX.globalCompositeOperation = "destination-out";
    fogX.fillStyle = `rgba(0,0,0,${(dt * 3.4).toFixed(3)})`;
    fogX.fillRect(0, 0, W, H);
    fogX.restore();
    if (winGone >= 1 && !jellyOn && !nat) {
      release("window", 1.8); rainBed = null;
      natRun("frost", () => { winOn = false; startJelly(196); }, 3.4, { at: 0.66 });
    }
  }

  natFrame(dt);

  /* a nudge, if they have not touched it */
  if (winT > 4 && winClear < 0.04) {
    const p = 0.5 + 0.5 * Math.sin(winT * 2.0);
    const cx = W * 0.5, cy = H * 0.52;
    fctx.strokeStyle = `rgba(255,255,255,${(0.10 + 0.16 * p).toFixed(3)})`;
    fctx.lineWidth = Math.max(6, Math.min(W, H) * 0.018);
    fctx.lineCap = "round";
    fctx.beginPath();
    const sweep = Math.min(W, H) * 0.16;
    fctx.moveTo(cx - sweep, cy + Math.sin(winT * 2.0) * sweep * 0.25);
    fctx.quadraticCurveTo(cx, cy - sweep * 0.35,
                          cx + sweep, cy + Math.sin(winT * 2.0 + 1) * sweep * 0.25);
    fctx.stroke();
  }
}

/* --- wiping --- */
function winBrush() { return Math.max(26, Math.min(window.innerWidth, window.innerHeight) * 0.075); }
window.addEventListener("pointerdown", (e) => {
  if (!winOn || winGone) return;
  winWipe = { x: e.clientX, y: e.clientY };
  wipeAt(e.clientX, e.clientY, winBrush());
  squeak(0.4, e.clientX);
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => {
  if (!winOn || winGone) return;
  finCanvas.style.cursor = "cell";
  if (!winWipe) return;
  /* interpolate, or a fast swipe leaves gaps */
  const dx = e.clientX - winWipe.x, dy = e.clientY - winWipe.y;
  const D = Math.hypot(dx, dy), step = winBrush() * 0.34;
  const n = Math.max(1, Math.ceil(D / step));
  for (let i = 1; i <= n; i++)
    wipeAt(winWipe.x + dx * i / n, winWipe.y + dy * i / n, winBrush());
  winWipe = { x: e.clientX, y: e.clientY };
  squeak(Math.min(1, D / 90), e.clientX);
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointerup", () => { winWipe = null; });

/* --- sound --- */
let rainBed = null;
function rainOnGlass() {
  const ac = audio(); if (!ac || rainBed) return;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2600; bp.Q.value = 0.5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.linearRampToValueAtTime(0.038, ac.currentTime + 2.5);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start();
  rainBed = { s, g };
  hold("window", { gain: g, src: s });
  /* the odd fat drop hitting the pane */
  const tick = () => {
    if (!winOn) return;
    const ac2 = audio(); if (!ac2) return;
    const t0 = ac2.currentTime;
    const o = ac2.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(900 + Math.random() * 1600, t0);
    o.frequency.exponentialRampToValueAtTime(300, t0 + 0.06);
    const gg = ac2.createGain();
    gg.gain.setValueAtTime(0.020, t0);
    gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
    o.connect(gg); gg.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t0); o.stop(t0 + 0.1);
    setTimeout(tick, 300 + Math.random() * 1600);
  };
  setTimeout(tick, 800);
}
let lastSq = 0;
function squeak(v, px) {
  const ac = audio(); if (!ac || v < 0.05) return;
  const t0 = ac.currentTime;
  if (t0 - lastSq < 0.07) return;
  lastSq = t0;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(560 + v * 900, t0);
  o.frequency.exponentialRampToValueAtTime(420 + v * 500, t0 + 0.12);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 1400 + v * 1800; bp.Q.value = 5;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.016 * (0.3 + v), t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
  o.connect(bp); bp.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 0.18);
}
function clearSigh() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (rainBed) rainBed.g.gain.setTargetAtTime(0.012, t0, 1.2);
  [196, 261.6, 329.6, 392, 523.3].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 2 ? "sine" : "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.11);
    g.gain.exponentialRampToValueAtTime(0.048, t0 + i * 0.11 + 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 5.0);
    o.connect(g); g.connect(BUS);
    o.start(t0 + i * 0.11); o.stop(t0 + 5.2);
  });
}

/* ================= inside the jar =================
   Whatever was in it, this is it: deep water with things drifting in it,
   lit from nowhere in particular. There is nothing to work out. Touch one
   and it lights, and lighting them is the whole of it — when they are all
   awake they rise together and take the light with them. */

let jellyOn = false, jellyT = 0, jellies = [], motes = [], jellyHue = 200, jellyRise = 0, jellyLit = 0, jellyLast = 0;

function startJelly(hue) {
  mark("jelly");
  if (jellyOn) return;
  jellyOn = true; jellyT = 0; jellyRise = 0; jellyLit = 0; jellyLast = 0;
  jellyHue = hue === undefined ? 200 : hue;
  const W = window.innerWidth, H = window.innerHeight;
  const N = W < 620 ? 6 : 9;
  jellies = [];
  for (let i = 0; i < N; i++) {
    jellies.push({
      x: W * (0.10 + rnd() * 0.80),
      y: H * (0.12 + rnd() * 0.82),
      r: Math.min(W, H) * (0.055 + rnd() * 0.055),
      ph: rnd() * 6.3,
      sp: 0.55 + rnd() * 0.45,
      drift: (rnd() - 0.5) * 12,
      hue: (jellyHue + (rnd() - 0.5) * 70 + 360) % 360,
      lit: 0, flash: 0,
      arms: 5 + ((rnd() * 4) | 0),
      seed: rnd() * 100,
    });
  }
  motes = [];
  for (let i = 0; i < (W < 620 ? 60 : 120); i++)
    motes.push({ x: rnd() * W, y: rnd() * H, r: 0.4 + rnd() * 1.5,
                 v: 4 + rnd() * 14, ph: rnd() * 6.3 });
  bed('deep');
}

function drawJelly(j, t) {
  const c = fctx;
  /* the bell breathes: it contracts and springs back, and everything
     hanging off it lags behind by a beat */
  const beat = Math.sin(t * j.sp * 1.9 + j.ph);
  const squash = 1 + beat * 0.16;
  const rw = j.r * (1.06 / squash), rh = j.r * 0.86 * squash;
  const lag = Math.sin(t * j.sp * 1.9 + j.ph - 0.9);
  const L = 68 + j.lit * 22, S = 62 + j.lit * 34;
  const A = 0.30 + j.lit * 0.40 + j.flash * 0.5;

  c.save();
  c.translate(j.x, j.y);

  /* tentacles first, so the bell sits over them */
  c.strokeStyle = `hsla(${j.hue},${S}%,${L + 8}%,${(A * 0.55).toFixed(3)})`;
  c.lineWidth = Math.max(1, j.r * 0.028);
  c.lineCap = "round";
  for (let k = 0; k < 11; k++) {
    const u = (k / 10 - 0.5) * 1.7;
    const bx = u * rw * 0.86;
    c.beginPath();
    c.moveTo(bx, rh * 0.55);
    for (let s = 1; s <= 7; s++) {
      const f = s / 7;
      const sway = Math.sin(t * 1.5 + j.seed + k * 0.7 - f * 3.1) * j.r * 0.16 * f
                 - lag * j.r * 0.10 * f;
      c.lineTo(bx + sway + u * j.r * 0.10 * f, rh * 0.55 + f * j.r * (1.6 + 0.5 * Math.sin(j.seed + k)));
    }
    c.stroke();
  }
  /* four thicker oral arms, frilled */
  c.strokeStyle = `hsla(${j.hue},${S + 8}%,${L + 12}%,${(A * 0.72).toFixed(3)})`;
  c.lineWidth = Math.max(1.6, j.r * 0.075);
  for (let k = 0; k < 4; k++) {
    const u = (k / 3 - 0.5) * 0.9;
    c.beginPath();
    c.moveTo(u * rw * 0.4, rh * 0.4);
    for (let s = 1; s <= 6; s++) {
      const f = s / 6;
      const sway = Math.sin(t * 1.15 + j.seed * 2 + k * 1.3 - f * 2.4) * j.r * 0.22 * f
                 - lag * j.r * 0.16 * f;
      c.lineTo(u * rw * 0.4 + sway, rh * 0.4 + f * j.r * 1.15);
    }
    c.stroke();
  }

  /* the bell: translucent, brighter at the crown, with a hard rim */
  const g = c.createRadialGradient(0, -rh * 0.35, rh * 0.06, 0, rh * 0.1, rw * 1.25);
  g.addColorStop(0, `hsla(${j.hue},${S}%,${Math.min(95, L + 26)}%,${(A * 0.95).toFixed(3)})`);
  g.addColorStop(0.55, `hsla(${j.hue},${S}%,${L}%,${(A * 0.55).toFixed(3)})`);
  g.addColorStop(1, `hsla(${(j.hue + 20) % 360},${S}%,${L - 18}%,0)`);
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(0, 0, rw, rh, 0, Math.PI, 0);
  c.quadraticCurveTo(rw * 0.55, rh * 0.62, 0, rh * 0.44);
  c.quadraticCurveTo(-rw * 0.55, rh * 0.62, -rw, 0);
  c.closePath();
  c.fill();
  c.strokeStyle = `hsla(${j.hue},92%,${Math.min(94, L + 22)}%,${(A * 0.85).toFixed(3)})`;
  c.lineWidth = Math.max(1.2, j.r * 0.035);
  c.stroke();
  /* the radial canals across the bell */
  c.strokeStyle = `hsla(${j.hue},90%,${L + 16}%,${(A * 0.45).toFixed(3)})`;
  c.lineWidth = Math.max(1, j.r * 0.022);
  for (let k = 0; k < j.arms; k++) {
    const u = (k / (j.arms - 1) - 0.5) * 1.55;
    c.beginPath();
    c.moveTo(u * rw * 0.9, rh * 0.30);
    c.quadraticCurveTo(u * rw * 0.55, -rh * 0.35, u * rw * 0.24, -rh * 0.66);
    c.stroke();
  }
  c.restore();

  /* lit ones carry their own light */
  if (j.lit > 0.02 || j.flash > 0.02) {
    c.save();
    c.globalCompositeOperation = "lighter";
    const gl = c.createRadialGradient(j.x, j.y, 0, j.x, j.y, j.r * (3.2 + j.flash * 3));
    gl.addColorStop(0, `hsla(${j.hue},95%,80%,${(0.18 * j.lit + 0.34 * j.flash).toFixed(3)})`);
    gl.addColorStop(1, "hsla(0,0%,0%,0)");
    c.fillStyle = gl;
    c.fillRect(j.x - j.r * 6, j.y - j.r * 6, j.r * 12, j.r * 12);
    c.restore();
  }
}

function jellyFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  jellyT += dt;
  hardClear(finCanvas, fctx);

  /* the water */
  const deep = fctx.createLinearGradient(0, 0, 0, H);
  const lift = jellyRise;
  deep.addColorStop(0, `hsl(${(jellyHue + 200) % 360},${46 + lift * 30}%,${7 + lift * 40}%)`);
  deep.addColorStop(0.55, `hsl(${(jellyHue + 190) % 360},${52 + lift * 26}%,${11 + lift * 44}%)`);
  deep.addColorStop(1, `hsl(${(jellyHue + 180) % 360},${58}%,${4 + lift * 34}%)`);
  fctx.fillStyle = deep; fctx.fillRect(0, 0, W, H);

  /* marine snow going the other way */
  fctx.fillStyle = `rgba(210,232,255,${(0.20 + 0.2 * lift).toFixed(2)})`;
  for (const m of motes) {
    m.y -= m.v * dt;
    if (m.y < -4) { m.y = H + 4; m.x = Math.random() * W; }
    fctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(jellyT * 0.6 + m.ph));
    fctx.fillRect(m.x + Math.sin(jellyT * 0.4 + m.ph) * 6, m.y, m.r, m.r);
  }
  fctx.globalAlpha = 1;

  let allLit = true;
  for (const j of jellies) {
    j.flash *= Math.exp(-2.4 * dt);
    if (j.lit < 1 && j.lit > 0) j.lit = Math.min(1, j.lit + dt * 1.6);
    if (j.lit < 0.99) allLit = false;
    /* they always drift up a little; lit ones climb */
    const climb = 9 + j.lit * 46 + jellyRise * 260;
    j.y -= climb * dt;
    j.x += (j.drift + Math.sin(jellyT * 0.4 + j.ph) * 7) * dt;
    if (j.y < -j.r * 3.4) { j.y = H + j.r * 3.4; }
    if (j.x < -j.r * 2) j.x = W + j.r * 2;
    if (j.x > W + j.r * 2) j.x = -j.r * 2;
    drawJelly(j, jellyT);
  }
  jellyLit = jellies.filter(j => j.lit > 0.5).length;

  /* One creature you cannot reach — drifted behind something, sitting under
     the corner — would be a dead end, and there are no dead ends here. If a
     single one is left for long enough, it comes to you. */
  const dark = jellies.filter(j => j.lit < 0.99);
  if (!allLit && dark.length <= 2 && jellies.length > 2) {
    jellyLast += dt;
    if (jellyLast > 9) {
      jellyLast = 6;                       /* one at a time, three seconds apart */
      const j = dark[0];
      j.flash = 1; j.lit = 0.021;
      jellyPing(j.hue, false, j.x);
    }
  } else jellyLast = 0;

  if (allLit) {
    jellyRise = Math.min(1, jellyRise + dt * 0.22);
    if (jellyRise > 0.72 && !surfOn) { jellyOn = false; startSurface(); return; }
    if (jellyRise > 0.35) {
      fctx.save();
      fctx.globalCompositeOperation = "lighter";
      const f = (jellyRise - 0.35) / 0.65;
      fctx.fillStyle = `hsla(${jellyHue},80%,86%,${(f * f * 0.9).toFixed(3)})`;
      fctx.fillRect(0, 0, W, H);
      fctx.restore();
    }
  }
}

function jellyTouch(x, y) {
  if (!jellyOn) return;
  let best = null, bd = 1e9;
  for (const j of jellies) {
    const d = Math.hypot(x - j.x, y - j.y) / (j.r * 2.2);
    if (d < bd) { bd = d; best = j; }
  }
  if (!best || bd > 1.25) return;
  best.flash = 1;
  if (best.lit < 0.02) { best.lit = 0.02; jellyPing(best.hue, false, best.x); }
  else jellyPing(best.hue, true, best.x);
}
window.addEventListener("pointerdown", (e) => {
  if (!jellyOn) return;
  jellyTouch(e.clientX, e.clientY);
}, { passive: true });
window.addEventListener("pointermove", (e) => {
  if (!jellyOn) return;
  finCanvas.style.cursor = "pointer";
}, { passive: true });

function jellyPing(hue, again, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const SC = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3];
  const f = SC[Math.floor((hue / 360) * SC.length) % SC.length] * (again ? 2 : 1);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.value = f;
  const o2 = ac.createOscillator(); o2.type = "sine";
  o2.frequency.value = f * 2.004;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(again ? 0.028 : 0.055, t0 + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
  o.connect(g); o2.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 2.6);
  o2.start(t0); o2.stop(t0 + 2.6);
}
function jellySwell() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 340;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.045, t0 + 4);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0);
}

/* ================= the surface =================
   The jellyfish took the light up with them and you went too. This is
   what breaking through looks like from underneath: the underside of the
   surface sweeps down past you, water sheets off the lens, and the world
   un-muffles — the low-pass that has been on everything since you went
   under opens all the way up as your head clears.

   Above it: a still lake at night with mist lying on it, a far shore, and
   paper lanterns adrift on the black water, unlit. Touch one and it
   catches. Light them all and they go up together, and you go with them. */

let surfOn = false, surfT = 0, breach = 0, lanterns = [], lampRise = 0, lampLast = 0;
let lakeStars = [], mistBands = [], shoreLine = null, lensDrops = [];

function startSurface() {
  mark("lake");
  if (surfOn) return;
  surfOn = true; surfT = 0; breach = 0; lampRise = 0; lampLast = 0;
  const W = window.innerWidth, H = window.innerHeight;
  const hz = H * 0.42;

  lakeStars = [];
  for (let i = 0; i < (W < 620 ? 90 : 170); i++)
    lakeStars.push({ x: rnd() * W, y: rnd() * hz * 0.94,
                     r: 0.4 + rnd() * 1.3, b: 0.25 + rnd() * 0.75,
                     tw: 0.4 + rnd() * 1.8, ph: rnd() * 6.3 });

  /* a far shore: conifers, in silhouette, at the size distance makes them */
  shoreLine = [];
  let x = -30;
  while (x < W + 30) {
    const hgt = hz * (0.035 + Math.pow(rnd(), 1.6) * 0.09);
    const wid = hgt * (0.34 + rnd() * 0.26);
    shoreLine.push({ x, h: hgt, w: wid });
    x += wid * (0.55 + rnd() * 0.7);
  }

  mistBands = [];
  for (let i = 0; i < 5; i++)
    mistBands.push({ y: hz + (H - hz) * (0.02 + i * 0.055 + rnd() * 0.03),
                     h: (H - hz) * (0.02 + rnd() * 0.035),
                     sp: (4 + rnd() * 11) * (rnd() < 0.5 ? -1 : 1),
                     x: rnd() * W, a: 0.06 + rnd() * 0.10, bobp: rnd() * 6.3 });

  lanterns = [];
  const N = W < 620 ? 5 : 7;
  for (let i = 0; i < N; i++) {
    const d = 0.10 + (i / N) * 0.72 + rnd() * 0.10;      /* how near the shore */
    lanterns.push({
      d,
      x: W * (0.07 + (i + rnd() * 0.75) / N * 0.86),
      s: Math.min(W, H) * (0.030 + d * 0.055),
      lit: 0, flick: rnd() * 6.3,
      drift: (rnd() - 0.5) * 5,
      bob: rnd() * 6.3,
      hue: 34 + rnd() * 14,
    });
  }
  lanterns.sort((a, b) => a.d - b.d);

  lensDrops = [];
  for (let i = 0; i < 22; i++)
    lensDrops.push({ x: rnd() * W, y: rnd() * H * 0.5, r: 3 + rnd() * 11,
                     v: 40 + rnd() * 160, wob: rnd() * 6.3 });

  bed("sea");
  surfaceBreak();
}

const lakeHZ = () => window.innerHeight * 0.42;

function lanternY(l) {
  const H = window.innerHeight, hz = lakeHZ();
  return hz + (H - hz) * (0.10 + l.d * 0.72)
       + Math.sin(surfT * 0.7 + l.bob) * 2.2
       - lampRise * (H * 0.9) * (0.55 + l.d * 0.6);
}

function drawLantern(l, x, y, s, alpha) {
  const c = fctx;
  const lit = l.lit;
  const flame = 0.72 + 0.28 * Math.sin(surfT * 9 + l.flick)
                     + 0.12 * Math.sin(surfT * 23 + l.flick * 2);
  c.save();
  c.globalAlpha = alpha === undefined ? 1 : alpha;

  /* the paper: a soft-shouldered cylinder, warm from inside when it is lit */
  const paper = c.createLinearGradient(x - s, 0, x + s, 0);
  const L = 62 + lit * 26 * flame;
  const S = 12 + lit * 62;
  paper.addColorStop(0, `hsla(${l.hue},${S}%,${L * 0.44}%,${0.86})`);
  paper.addColorStop(0.34, `hsla(${l.hue},${S}%,${L}%,${0.94})`);
  paper.addColorStop(0.62, `hsla(${l.hue},${S}%,${L * 0.86}%,${0.92})`);
  paper.addColorStop(1, `hsla(${l.hue},${S}%,${L * 0.38}%,${0.86})`);
  c.fillStyle = paper;
  c.beginPath();
  c.moveTo(x - s * 0.80, y - s * 0.22);
  c.bezierCurveTo(x - s * 1.00, y - s * 1.20, x - s * 0.74, y - s * 1.98, x, y - s * 2.05);
  c.bezierCurveTo(x + s * 0.74, y - s * 1.98, x + s * 1.00, y - s * 1.20, x + s * 0.80, y - s * 0.22);
  c.quadraticCurveTo(x, y + s * 0.10, x - s * 0.80, y - s * 0.22);
  c.closePath();
  c.fill();
  /* the ribs of it */
  c.strokeStyle = `hsla(${l.hue},${S}%,${L * 0.55}%,0.34)`;
  c.lineWidth = Math.max(0.8, s * 0.035);
  for (let k = -2; k <= 2; k++) {
    const u = k / 2.4;
    c.beginPath();
    c.moveTo(x + u * s * 0.76, y - s * 0.24);
    c.quadraticCurveTo(x + u * s * 0.90, y - s * 1.10, x + u * s * 0.30, y - s * 1.94);
    c.stroke();
  }
  /* bamboo hoop and the little basket under it */
  c.strokeStyle = "rgba(96,72,42,0.85)";
  c.lineWidth = Math.max(1, s * 0.06);
  c.beginPath();
  c.ellipse(x, y - s * 0.20, s * 0.87, s * 0.15, 0, 0, 6.3);
  c.stroke();
  c.strokeStyle = "rgba(70,52,30,0.7)";
  c.lineWidth = Math.max(0.8, s * 0.04);
  c.beginPath();
  c.moveTo(x - s * 0.5, y - s * 0.18); c.lineTo(x, y + s * 0.10);
  c.moveTo(x + s * 0.5, y - s * 0.18); c.lineTo(x, y + s * 0.10);
  c.stroke();

  if (lit > 0.02) {
    /* the flame itself, small and never still */
    c.save();
    c.globalCompositeOperation = "lighter";
    const fy = y - s * 0.62;
    const fg = c.createRadialGradient(x, fy, 0, x, fy, s * 0.55 * flame);
    fg.addColorStop(0, `rgba(255,246,214,${(0.95 * lit).toFixed(3)})`);
    fg.addColorStop(0.4, `rgba(255,196,96,${(0.60 * lit).toFixed(3)})`);
    fg.addColorStop(1, "rgba(255,150,50,0)");
    c.fillStyle = fg;
    c.fillRect(x - s, fy - s, s * 2, s * 2);
    /* and the light it throws */
    const gg = c.createRadialGradient(x, y - s * 0.6, 0, x, y - s * 0.6, s * (5 + flame));
    gg.addColorStop(0, `rgba(255,206,130,${(0.24 * lit).toFixed(3)})`);
    gg.addColorStop(0.45, `rgba(255,170,80,${(0.09 * lit).toFixed(3)})`);
    gg.addColorStop(1, "rgba(255,150,60,0)");
    c.fillStyle = gg;
    c.fillRect(x - s * 6, y - s * 6.6, s * 12, s * 12);
    c.restore();
  } else if (surfT > 3.5) {
    /* unlit ones ask, quietly */
    const p = 0.5 + 0.5 * Math.sin(surfT * 1.8 + l.bob);
    c.strokeStyle = `rgba(240,232,214,${(0.07 + 0.10 * p).toFixed(3)})`;
    c.lineWidth = Math.max(1, s * 0.05);
    c.beginPath();
    c.ellipse(x, y - s * 0.55, s * (1.5 + 0.30 * p), s * (1.5 + 0.30 * p), 0, 0, 6.3);
    c.stroke();
  }
  c.restore();
}

function surfaceFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight, hz = lakeHZ();
  surfT += dt;
  hardClear(finCanvas, fctx);

  /* ---- the sky, and the far side of the water ---- */
  const sky = fctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, "#070b1c");
  sky.addColorStop(0.62, "#0d1730");
  sky.addColorStop(1, "#22283f");
  fctx.fillStyle = sky; fctx.fillRect(0, 0, W, hz + 1);

  fctx.fillStyle = T.starlight;
  for (const s of lakeStars) {
    fctx.globalAlpha = s.b * (0.55 + 0.45 * Math.sin(surfT * s.tw + s.ph)) * (1 - lampRise * 0.5);
    fctx.beginPath(); fctx.arc(s.x, s.y, s.r, 0, 6.3); fctx.fill();
  }
  fctx.globalAlpha = 1;

  /* a warm sit of light behind the trees, so the shore reads as far away */
  const glow = fctx.createLinearGradient(0, hz - H * 0.12, 0, hz);
  glow.addColorStop(0, "rgba(90,74,64,0)");
  glow.addColorStop(1, "rgba(148,116,86,0.22)");
  fctx.fillStyle = glow; fctx.fillRect(0, hz - H * 0.12, W, H * 0.12);

  fctx.fillStyle = T.ink;
  for (const t of shoreLine) {
    fctx.beginPath();
    fctx.moveTo(t.x - t.w, hz + 1);
    fctx.lineTo(t.x, hz - t.h);
    fctx.lineTo(t.x + t.w, hz + 1);
    fctx.closePath(); fctx.fill();
  }
  fctx.fillRect(0, hz - 1, W, 3);

  /* ---- the lake ---- */
  const lake = fctx.createLinearGradient(0, hz, 0, H);
  lake.addColorStop(0, "#0a1020");
  lake.addColorStop(0.4, "#070c18");
  lake.addColorStop(1, T.ink);
  fctx.fillStyle = lake; fctx.fillRect(0, hz, W, H - hz);

  /* reflections: the lantern light smeared straight down and broken up by
     the ripple, which is the whole reason to put them on water */
  fctx.save();
  fctx.beginPath(); fctx.rect(0, hz, W, H - hz); fctx.clip();
  fctx.globalCompositeOperation = "lighter";
  for (const l of lanterns) {
    if (l.lit < 0.02) continue;
    const y = lanternY(l);
    const base = Math.max(y, hz);
    const len = (H - base) * (0.5 + l.lit * 0.5);
    const rows = 46;
    for (let i = 0; i < rows; i++) {
      const f = i / (rows - 1);
      const ry = base + f * len;
      /* the column wanders and narrows as the ripple pulls it apart */
      const wob = Math.sin(surfT * 1.7 + f * 13 + l.bob) * l.s * 0.30 * (0.25 + f)
                + Math.sin(surfT * 2.9 - f * 21 + l.bob * 2) * l.s * 0.16 * f;
      const a = 0.115 * l.lit * Math.pow(1 - f, 1.7)
              * (0.55 + 0.45 * Math.abs(Math.sin(surfT * 2.2 + f * 17 + l.bob)));
      if (a < 0.003) continue;
      fctx.fillStyle = `rgba(255,${(190 - f * 46) | 0},${(104 - f * 34) | 0},${a.toFixed(3)})`;
      const rw = l.s * (0.85 - f * 0.42) * (0.7 + 0.3 * Math.sin(surfT * 1.3 + f * 9));
      fctx.fillRect(l.x + wob - rw, ry, rw * 2, len / rows + 1.2);
    }
  }
  fctx.restore();

  /* the ring each one sits in */
  for (const l of lanterns) {
    const y = lanternY(l);
    if (y < hz || lampRise > 0.02) continue;
    fctx.strokeStyle = `rgba(190,206,230,${(0.05 + 0.10 * l.lit).toFixed(3)})`;
    fctx.lineWidth = 1;
    for (let k = 0; k < 2; k++) {
      const rr = l.s * (1.2 + k * 0.9 + (surfT * 0.35 + k * 0.5) % 1.6);
      fctx.beginPath();
      fctx.ellipse(l.x, y + l.s * 0.06, rr, rr * 0.20, 0, 0, 6.3);
      fctx.stroke();
    }
  }

  /* ---- the lanterns ---- */
  for (const l of lanterns) {
    if (l.lit > 0 && l.lit < 1) l.lit = Math.min(1, l.lit + dt * 1.1);
    l.x += (l.drift + Math.sin(surfT * 0.3 + l.bob) * 3) * dt;
    if (l.x < -l.s * 3) l.x = W + l.s * 3;
    if (l.x > W + l.s * 3) l.x = -l.s * 3;
    drawLantern(l, l.x, lanternY(l), l.s);
  }

  /* ---- mist, lying on the water and drifting ---- */
  fctx.save();
  for (const m of mistBands) {
    m.x += m.sp * dt;
    if (m.x > W * 1.4) m.x = -W * 0.4;
    if (m.x < -W * 0.4) m.x = W * 1.4;
    /* a band has to fade both ways — along its length and across it — so
       it is drawn as thin rows with a horizontal gradient and a vertical
       falloff on the alpha */
    const gx = fctx.createLinearGradient(m.x - W * 0.55, 0, m.x + W * 0.75, 0);
    gx.addColorStop(0, "rgba(206,220,236,0)");
    gx.addColorStop(0.35, "rgba(210,224,238,0.75)");
    gx.addColorStop(0.62, "rgba(206,220,236,1)");
    gx.addColorStop(1, "rgba(206,220,236,0)");
    fctx.fillStyle = gx;
    const rows = 9;
    for (let k = 0; k < rows; k++) {
      const f = (k + 0.5) / rows;
      const yy = m.y - m.h + f * m.h * 2;
      fctx.globalAlpha = m.a * (1 - lampRise) * Math.sin(f * Math.PI)
                       * (0.75 + 0.25 * Math.sin(surfT * 0.4 + k + m.bobp));
      fctx.fillRect(m.x - W * 0.55, yy, W * 1.3, m.h * 2 / rows + 1);
    }
    fctx.globalAlpha = 1;
  }
  fctx.restore();

  /* ---- still coming up through it ---- */
  if (breach < 1) {
    breach = Math.min(1, breach + dt * 0.42);
    setUnderwater(1 - breach);
    const sy = -H * 0.15 + breach * (H * 1.25);
    /* everything below the line is still under */
    fctx.save();
    fctx.beginPath();
    fctx.moveTo(0, H + 2);
    fctx.lineTo(0, sy);
    for (let x = 0; x <= W; x += 12)
      fctx.lineTo(x, sy + Math.sin(x * 0.017 + surfT * 3.1) * 10
                       + Math.sin(x * 0.045 - surfT * 2.2) * 4);
    fctx.lineTo(W, H + 2);
    fctx.closePath();
    fctx.clip();
    const uw = fctx.createLinearGradient(0, sy, 0, H);
    uw.addColorStop(0, "rgba(70,150,170,0.86)");
    uw.addColorStop(0.5, "rgba(20,70,104,0.94)");
    uw.addColorStop(1, "rgba(4,26,48,0.98)");
    fctx.fillStyle = uw; fctx.fillRect(0, sy - 4, W, H - sy + 8);
    /* the underside of the surface, mirrored and bright */
    fctx.globalCompositeOperation = "lighter";
    fctx.fillStyle = "rgba(200,244,255,0.30)";
    fctx.fillRect(0, sy, W, 10);
    fctx.restore();
    /* the meniscus itself */
    fctx.strokeStyle = `rgba(226,250,255,${(0.55 * (1 - breach * 0.4)).toFixed(2)})`;
    fctx.lineWidth = 2.4;
    fctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const yy = sy + Math.sin(x * 0.017 + surfT * 3.1) * 10
                    + Math.sin(x * 0.045 - surfT * 2.2) * 4;
      x === 0 ? fctx.moveTo(x, yy) : fctx.lineTo(x, yy);
    }
    fctx.stroke();
  } else if (lensDrops.length) {
    /* water still running off the glass for a moment after */
    fctx.save();
    for (let i = lensDrops.length - 1; i >= 0; i--) {
      const d = lensDrops[i];
      d.y += d.v * dt; d.v += 260 * dt;
      if (d.y > H + 20) { lensDrops.splice(i, 1); continue; }
      const g = fctx.createRadialGradient(d.x - d.r * 0.3, d.y - d.r * 0.3, 0, d.x, d.y, d.r);
      g.addColorStop(0, "rgba(235,250,255,0.30)");
      g.addColorStop(0.7, "rgba(190,220,240,0.10)");
      g.addColorStop(1, "rgba(180,210,235,0)");
      fctx.fillStyle = g;
      fctx.beginPath();
      fctx.ellipse(d.x + Math.sin(d.wob + surfT * 4) * 2, d.y, d.r * 0.8, d.r * 1.25, 0, 0, 6.3);
      fctx.fill();
    }
    fctx.restore();
  }

  /* ---- all lit: up they go, and you with them ---- */
  const unlit = lanterns.filter(l => l.lit <= 0.98);
  if (lanterns.length && unlit.length && unlit.length <= 2) {
    lampLast += dt;
    if (lampLast > 9) {
      lampLast = 6;
      const l = unlit[0];
      l.lit = 0.021;
      lanternCatch(l.x, l.hue);
    }
  } else lampLast = 0;

  if (lanterns.length && lanterns.every(l => l.lit > 0.98)) {
    lampRise = Math.min(1, lampRise + dt * 0.10);
    if (lampRise > 0.55 && !nat && !surfHanded) {
      surfHanded = true;
      release("lake"); natRun("cloud", () => { surfOn = false; startBeacon(); }, 3.8, { at: 0.62 });
    }
  }
  natFrame(dt);
}
let surfHanded = false;

/* --- touching one --- */
window.addEventListener("pointerdown", (e) => {
  if (!surfOn || breach < 0.5 || lampRise > 0) return;
  let best = null, bd = 1e9;
  for (const l of lanterns) {
    const y = lanternY(l);
    const d = Math.hypot(e.clientX - l.x, e.clientY - (y - l.s * 0.6)) / (l.s * 2.4);
    if (d < bd) { bd = d; best = l; }
  }
  if (!best || bd > 1.2) return;
  if (best.lit > 0.01) return;
  best.lit = 0.02;
  lanternCatch(best.x, best.hue);
}, { passive: true });
window.addEventListener("pointermove", (e) => {
  if (!surfOn || breach < 0.5) return;
  let near = false;
  for (const l of lanterns) {
    if (l.lit > 0.01) continue;
    const y = lanternY(l);
    if (Math.hypot(e.clientX - l.x, e.clientY - (y - l.s * 0.6)) < l.s * 2.4) near = true;
  }
  finCanvas.style.cursor = near ? "pointer" : "";
}, { passive: true });

/* --- sound --- */
function surfaceBreak() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* the rush of coming up */
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
  bp.frequency.setValueAtTime(280, t0);
  bp.frequency.exponentialRampToValueAtTime(3200, t0 + 1.6);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.10, t0 + 0.9);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.6);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 2.7);
  /* and the drips off it afterwards, scattered across the stereo field */
  for (let i = 0; i < 14; i++) {
    const t = t0 + 1.5 + Math.random() * 2.4;
    const o = ac.createOscillator(); o.type = "sine";
    const f = 900 + Math.random() * 1800;
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.09);
    const dg = ac.createGain();
    dg.gain.setValueAtTime(0.030 + Math.random() * 0.020, t);
    dg.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(dg); dg.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t); o.stop(t + 0.18);
  }
  /* a wide, slow pad underneath the whole scene */
  [82.4, 123.5, 164.8, 246.9].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 1 ? "sine" : "triangle";
    o.frequency.value = f;
    const lfo = ac.createOscillator(); lfo.type = "sine";
    lfo.frequency.value = 0.06 + i * 0.017;
    const lg = ac.createGain(); lg.gain.value = 0.9;
    lfo.connect(lg); lg.connect(o.detune); lfo.start(t0);
    const pg = ac.createGain();
    pg.gain.setValueAtTime(0.0001, t0);
    pg.gain.linearRampToValueAtTime(0.020, t0 + 6 + i);
    o.connect(pg); pg.connect(BUS);
    o.start(t0);
    hold("lake", { gain: pg, src: o });
    hold("lake", { src: lfo });
  });
}

function lanternCatch(px, hue) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const dest = at(px) || BUS;
  /* paper taking: a short bright crackle */
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  s.playbackRate.value = 0.8 + Math.random() * 0.5;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2600;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.055, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
  s.connect(hp); hp.connect(g); g.connect(dest);
  s.start(t0); s.stop(t0 + 0.65);
  /* and a warm note off it, from a scale that cannot go wrong */
  const SC = [174.6, 220, 261.6, 329.6, 392, 440, 523.3];
  const n = Math.floor(((hue - 34) / 14) * SC.length) % SC.length;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.value = SC[(n + SC.length) % SC.length] * 2;
  const o2 = ac.createOscillator(); o2.type = "sine";
  o2.frequency.value = SC[(n + SC.length) % SC.length];
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(0.045, t0 + 0.10);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
  o.connect(g2); o2.connect(g2); g2.connect(dest);
  o.start(t0); o.stop(t0 + 3.8);
  o2.start(t0); o2.stop(t0 + 3.8);
}

/* ================= the light =================
   The lanterns take you up through the cloud and put you down on a headland
   at night, with a lighthouse out on the point and a lot of black water in
   front of it.

   The light is already turning, because that is what a light does, and that
   is the whole of the instruction: the one moving thing on the screen is the
   one you can take hold of. Swing it out over the water and there is
   something out there, dark, riding the swell. Hold the beam on it and it
   answers.

   This scene used to be the inside of the lamp room, looking at the back of
   the lens. It was a beautiful object and it read as a hamster wheel in a
   cage, because from in there you cannot see the sea, the tower, the boat,
   or the point of any of it. Outside, it explains itself. */

let beaconOn = false, beacT = 0, lampOn = 0;
let beamT = 0.5, beamV = 0.26, beamGrab = null, beacHanded = false;
let shipT = 0.5, shipLock = 0, shipSeen = 0, shipAnswer = 0, beacIdle = 0;
let swellRows = null, seaStars = null, beacFound = 0;

function beacGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  /* a tall screen gets more sea, because the sea is where everything is */
  const hz = H * (H > W * 1.25 ? 0.365 : 0.46);
  const tx = W * 0.115;                      /* the tower, off to one side */
  const base = hz + (H - hz) * 0.30;         /* where its rock meets the water */
  const th = Math.min(H * 0.40, W * 0.30);   /* how tall it stands */
  return {
    W, H, hz, tx, base, th,
    lamp: { x: tx, y: base - th },           /* the light itself */
    tw: Math.max(16, Math.min(W, H) * 0.030), /* tower width at the gallery */
  };
}

function startBeacon() {
  mark("beacon");
  if (beaconOn) return;
  beaconOn = true; beacT = 0; lampOn = 0; beacHanded = false;
  beamT = 0.5; beamV = 0.24; beamGrab = null;
  shipLock = 0; shipSeen = 0; shipAnswer = 0; beacIdle = 0; beacFound = 0;
  /* it is somewhere out there, and not in the middle, because the middle is
     where you are already looking */
  shipT = rnd() < 0.5 ? 0.10 + rnd() * 0.28 : 0.60 + rnd() * 0.30;

  const G = beacGeom();
  swellRows = [];
  for (let i = 0; i < 20; i++) {
    const d = i / 19;
    swellRows.push({ d, ph: rnd() * 6.3, sp: 0.25 + rnd() * 0.5,
                     amp: 0.4 + rnd() * 0.9 });
  }
  seaStars = [];
  for (let i = 0; i < 90; i++)
    seaStars.push({ x: rnd() * G.W, y: rnd() * G.hz * 0.92,
                    r: 0.4 + rnd() * 1.4, tw: 0.4 + rnd() * 2, ph: rnd() * 6.3 });

  bed("sea");
  seaBed();
  finCanvas.style.cursor = "grab";
}

/* --- where a bearing puts you on the water ---
   t runs 0 to 1 left to right. The beam lands on the horizon at hx(t), and
   anything at that bearing sits a little below the horizon, because it is
   nearer than the sky. */
const beamHX = (G, t) => G.W * 0.245 + t * G.W * 0.86;
const shipY = (G) => G.hz + (G.H - G.hz) * 0.34;

function drawBeam(G, t, a, spread, water) {
  if (a <= 0.004) return;
  const L = G.lamp, hx = beamHX(G, t);
  const M = Math.min(G.W, G.H);
  /* The beam and the light it lays on the water are one object, not two.
     They meet at the horizon: the wedge in the air narrows to that point,
     and the lane on the water opens out from it toward you. Drawn as two
     shapes that share a vertex, so the eye reads one cone. */
  const tipW = M * 0.020, w = M * spread;
  for (let k = 0; k < 3; k++) {
    const kk = 1 - k * 0.32, sp = 1 + k * 0.9;
    const g = fctx.createLinearGradient(L.x, L.y, hx, G.hz);
    g.addColorStop(0, `rgba(255,247,220,${(a * 0.34 * kk).toFixed(3)})`);
    g.addColorStop(0.45, `rgba(255,240,200,${(a * 0.15 * kk).toFixed(3)})`);
    g.addColorStop(1, `rgba(250,234,190,${(a * 0.07 * kk).toFixed(3)})`);
    fctx.fillStyle = g;
    fctx.beginPath();
    fctx.moveTo(L.x - w * 0.34 * sp, L.y - w * 0.10);
    fctx.lineTo(L.x + w * 0.34 * sp, L.y + w * 0.10);
    fctx.lineTo(hx + tipW * sp, G.hz);
    fctx.lineTo(hx - tipW * sp, G.hz);
    fctx.closePath();
    fctx.fill();
  }
  if (!water) return;
  /* The lane is not a triangle with edges — light on water has no edge. It
     is laid down as rows, each one soft across its width, brightest where
     the beam comes down and fading out toward you as the water takes it. */
  const rows = Math.max(24, Math.min(56, Math.round((G.H - G.hz) / 13)));
  for (let i = 0; i < rows; i++) {
    const d0 = i / rows, d1 = (i + 1) / rows;
    const dA = Math.pow(d0, 1.55), dB = Math.pow(d1, 1.55);
    const yA = G.hz + (G.H - G.hz) * dA, yB = G.hz + (G.H - G.hz) * dB;
    const hw = tipW + (w * 3.6 - tipW) * dA;
    const al = a * 0.80 * Math.pow(1 - dA, 1.15);
    if (al < 0.004) continue;
    const rg = fctx.createLinearGradient(hx - hw, 0, hx + hw, 0);
    rg.addColorStop(0, "rgba(255,238,196,0)");
    rg.addColorStop(0.30, `rgba(255,240,202,${(al * 0.55).toFixed(3)})`);
    rg.addColorStop(0.5, `rgba(255,246,214,${al.toFixed(3)})`);
    rg.addColorStop(0.70, `rgba(255,240,202,${(al * 0.55).toFixed(3)})`);
    rg.addColorStop(1, "rgba(255,238,196,0)");
    fctx.fillStyle = rg;
    fctx.fillRect(hx - hw, yA - 0.6, hw * 2, yB - yA + 2.4);
  }
  /* and the water in it breaks into a road of glints, which is the only
     reason a beam on the sea is worth looking at */
  const n = M < 560 ? 60 : 96;
  for (let i = 0; i < n; i++) {
    const j2 = Math.sin(i * 4.117 + 2.71) * 21301.7;
    /* jittered along the lane as well as across it, or they stack up into a
       ladder instead of scattering like water */
    const d = Math.pow(Math.min(0.999, (i + 0.15 + (j2 - Math.floor(j2)) * 0.8) / n), 1.75);
    const y = G.hz + (G.H - G.hz) * d;
    const hw = tipW + (w * 3.6 - tipW) * d;
    const j = Math.sin(i * 12.9898 + 7.233) * 43758.5453;
    const off = (j - Math.floor(j)) - 0.5;
    const fx = hx + off * 2 * hw;
    const edge = 1 - Math.min(1, Math.abs(off) * 2.1);        // dimmer at the sides
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(beacT * (1.1 + (i % 7) * 0.29) + i));
    const len = (2 + d * 26) * (0.5 + tw);
    const al = a * (0.08 + 0.40 * tw) * edge * Math.pow(1 - d, 0.5);
    if (al < 0.006) continue;
    fctx.fillStyle = `rgba(255,250,228,${al.toFixed(3)})`;
    fctx.fillRect(fx - len / 2, y, len, Math.max(0.8, 0.5 + d * 2.4));
  }
}

function beaconFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  const G = beacGeom();
  beacT += dt;
  hardClear(finCanvas, fctx);

  /* ---- sky ---- */
  const sky = fctx.createLinearGradient(0, 0, 0, G.hz);
  sky.addColorStop(0, "#070b18");
  sky.addColorStop(0.62, "#101a2c");
  sky.addColorStop(1, "#1d2b3e");
  fctx.fillStyle = sky;
  fctx.fillRect(0, 0, W, G.hz);
  for (const s of seaStars) {
    const tw = 0.5 + 0.5 * Math.sin(beacT * s.tw + s.ph);
    const alt = 1 - s.y / G.hz;
    fctx.fillStyle = `rgba(226,238,255,${(0.16 + 0.5 * tw * alt).toFixed(3)})`;
    fctx.beginPath(); fctx.arc(s.x, s.y, s.r, 0, 6.3); fctx.fill();
  }

  /* ---- sea ---- */
  const sea = fctx.createLinearGradient(0, G.hz, 0, H);
  sea.addColorStop(0, "#16233a");
  sea.addColorStop(0.35, "#0e1929");
  sea.addColorStop(1, "#070d17");
  fctx.fillStyle = sea;
  fctx.fillRect(0, G.hz, W, H - G.hz);

  /* the swell: rows further off are thinner, slower and closer together,
     which is the whole of sea perspective */
  /* swell, not ruled paper: rows get fainter and closer together with
     distance, and each one is a run of separate crests rather than a line
     ruled across the frame */
  for (const r of swellRows) {
    const y = G.hz + (H - G.hz) * Math.pow(r.d, 1.9);
    const th = 0.5 + r.d * 2.6;
    const amp = (0.6 + r.d * 8) * r.amp;
    const step = 60 + r.d * 190;
    fctx.strokeStyle = `rgba(150,182,218,${(0.010 + 0.135 * Math.pow(r.d, 1.6)).toFixed(3)})`;
    fctx.lineWidth = th;
    fctx.lineCap = "round";
    for (let x = -30; x <= W + 30; x += step) {
      const ph = x * (0.009 - r.d * 0.004) + beacT * r.sp + r.ph;
      const run = step * (0.42 + 0.40 * (0.5 + 0.5 * Math.sin(ph * 1.7 + r.ph)));
      fctx.beginPath();
      for (let k = 0; k <= 8; k++) {
        const xx = x + run * k / 8;
        const yy = y + Math.sin(xx * (0.009 - r.d * 0.004) + beacT * r.sp + r.ph) * amp;
        k ? fctx.lineTo(xx, yy) : fctx.moveTo(xx, yy);
      }
      fctx.stroke();
    }
  }
  /* a hard horizon, so the sea has an edge to be a sea against */
  fctx.fillStyle = "rgba(178,204,232,0.16)";
  fctx.fillRect(0, G.hz - 1, W, 1.6);

  /* ---- the light: it turns on its own until you take it ---- */
  lampOn = Math.min(1, lampOn + dt * 0.7);
  if (!beamGrab && !shipAnswer) {
    beamT += beamV * dt;
    if (beamT > 1) { beamT = 1; beamV = -Math.abs(beamV); }
    if (beamT < 0) { beamT = 0; beamV = Math.abs(beamV); }
  }

  /* is it on the boat? */
  const near = Math.abs(beamT - shipT);
  const onIt = near < 0.052;
  if (onIt && !shipAnswer) {
    shipLock = Math.min(1, shipLock + dt * 0.85);
    if (!beacFound) { beacFound = 1; glintSound(); }
  } else if (!shipAnswer) {
    shipLock = Math.max(0, shipLock - dt * 0.55);
    if (beacFound && near > 0.10) beacFound = 0;
  }
  shipSeen = Math.max(0, Math.min(1, 1 - Math.max(0, near - 0.052) / 0.075));

  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  drawBeam(G, beamT, lampOn * (0.88 + 0.12 * Math.sin(beacT * 9)), 0.075, true);
  /* the back beam, because a light has two and one of them is always going
     away from you */
  let bt = beamT + 0.5; if (bt > 1) bt -= 1;
  drawBeam(G, bt, lampOn * 0.13, 0.06, false);
  fctx.restore();

  /* ---- the boat ---- */
  const sy = shipY(G), sx = beamHX(G, shipT);
  const vis = shipAnswer ? 1 : shipSeen;
  if (vis > 0.01) {
    const bob = Math.sin(beacT * 1.15) * Math.min(W, H) * 0.010;
    const sc = Math.min(W, H) * 0.082;
    fctx.save();
    fctx.translate(sx, sy + bob);
    fctx.rotate(Math.sin(beacT * 0.9) * 0.06);
    fctx.globalAlpha = Math.min(1, 0.15 + vis * 0.95);
    /* It is lit by the beam, not by nothing. That is the whole scene: swing
       the light out, and what was a shape in the dark turns into a boat. */
    const lv = shipAnswer ? 1 : vis;
    const mix = (dark, bright) => `rgb(${Math.round(dark[0] + (bright[0] - dark[0]) * lv)},`
      + `${Math.round(dark[1] + (bright[1] - dark[1]) * lv)},`
      + `${Math.round(dark[2] + (bright[2] - dark[2]) * lv)})`;
    /* hull */
    fctx.fillStyle = mix([16, 22, 32], [96, 74, 50]);
    fctx.beginPath();
    fctx.moveTo(-sc, 0);
    fctx.quadraticCurveTo(-sc * 0.75, sc * 0.52, 0, sc * 0.56);
    fctx.quadraticCurveTo(sc * 0.75, sc * 0.52, sc, 0);
    fctx.closePath();
    fctx.fill();
    /* mast and a slack sail */
    fctx.strokeStyle = mix([22, 30, 42], [150, 124, 84]);
    fctx.lineWidth = Math.max(1.2, sc * 0.08);
    fctx.beginPath(); fctx.moveTo(0, 0); fctx.lineTo(0, -sc * 1.5); fctx.stroke();
    fctx.fillStyle = mix([32, 40, 54], [242, 226, 190]);
    fctx.beginPath();
    fctx.moveTo(0, -sc * 1.42);
    fctx.quadraticCurveTo(sc * 0.86, -sc * 0.72, 0, -sc * 0.10);
    fctx.closePath();
    fctx.fill();
    /* the light it puts up in reply */
    if (shipAnswer > 0.02) {
      const la = Math.min(1, shipAnswer * 1.6);
      const lg2 = fctx.createRadialGradient(0, -sc * 1.62, 0, 0, -sc * 1.62, sc * 2.6);
      lg2.addColorStop(0, `rgba(255,236,176,${(0.95 * la).toFixed(3)})`);
      lg2.addColorStop(0.2, `rgba(255,214,130,${(0.40 * la).toFixed(3)})`);
      lg2.addColorStop(1, "rgba(255,200,110,0)");
      fctx.fillStyle = lg2;
      fctx.beginPath(); fctx.arc(0, -sc * 1.62, sc * 2.6, 0, 6.3); fctx.fill();
    }
    fctx.restore();
    /* its reflection, broken by the swell */
    fctx.save();
    fctx.globalAlpha = Math.min(0.5, vis * 0.5);
    fctx.fillStyle = shipAnswer ? "rgba(255,222,150,0.55)" : `rgba(214,196,160,${(0.14 + 0.34 * lv).toFixed(3)})`;
    for (let i = 0; i < 9; i++) {
      const yy = sy + sc * (0.7 + i * 0.42);
      const ww = sc * (0.5 + i * 0.16) * (0.6 + 0.4 * Math.sin(beacT * 2.2 + i));
      fctx.fillRect(sx - ww / 2, yy, ww, Math.max(1, sc * 0.07));
    }
    fctx.restore();
  }

  /* the ring that says you have it — the only bit of language in the scene */
  if (shipLock > 0.01 && shipAnswer < 0.02) {
    fctx.strokeStyle = `rgba(255,238,190,${(0.20 + 0.45 * shipLock).toFixed(3)})`;
    fctx.lineWidth = Math.max(1.6, Math.min(W, H) * 0.004);
    fctx.beginPath();
    fctx.arc(sx, sy, Math.min(W, H) * 0.135, -Math.PI / 2,
             -Math.PI / 2 + 6.283 * shipLock);
    fctx.stroke();
  }

  /* ---- the tower ---- */
  drawTower(G, lampOn);

  /* ---- the headland you are standing on ---- */
  const fg = fctx.createLinearGradient(0, H * 0.86, 0, H);
  fg.addColorStop(0, "rgba(6,9,14,0.72)");
  fg.addColorStop(1, T.ink);
  fctx.fillStyle = fg;
  fctx.beginPath();
  fctx.moveTo(0, H);
  fctx.lineTo(0, H * 0.93);
  for (let x = 0; x <= W; x += 26) {
    fctx.lineTo(x, H * 0.93 + Math.sin(x * 0.006 + 1.2) * H * 0.018
                             + Math.sin(x * 0.021) * H * 0.008);
  }
  fctx.lineTo(W, H);
  fctx.closePath();
  fctx.fill();

  /* ---- a nudge, if they have not taken hold of it ---- */
  beacIdle += dt;
  if (beacIdle > 6 && !shipAnswer && !beamGrab) {
    const p = 0.5 + 0.5 * Math.sin(beacT * 2.0);
    const hx = beamHX(G, beamT);
    fctx.strokeStyle = `rgba(255,236,190,${(0.05 + 0.11 * p).toFixed(3)})`;
    fctx.lineWidth = Math.max(3, Math.min(W, H) * 0.008);
    fctx.lineCap = "round";
    const y = G.hz + (H - G.hz) * 0.30;
    fctx.beginPath();
    fctx.moveTo(hx - W * 0.12, y);
    fctx.quadraticCurveTo(hx, y - H * 0.02, hx + W * 0.12, y);
    fctx.stroke();
  }

  /* ---- and the answer ---- */
  if (shipLock >= 1 && !shipAnswer) {
    shipAnswer = 0.0001;
    shipBell();
    release("beacon", 2.6);
    hornAnswer();
  }
  if (shipAnswer) {
    shipAnswer = Math.min(1, shipAnswer + dt * 0.42);
    /* the whole frame warms as it comes about */
    fctx.fillStyle = `rgba(255,206,132,${(shipAnswer * 0.16).toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
    if (shipAnswer > 0.72 && !beacHanded) {
      beacHanded = true;
      natRun("rain", () => { beaconOn = false; startWood(); }, 3.8, { at: 0.56 });
    }
  }

  natFrame(dt);
}

function drawTower(G, lit) {
  const { tx, base, th, tw } = G;
  const top = base - th;
  /* the rock it stands on */
  fctx.fillStyle = T.ink;
  fctx.beginPath();
  fctx.moveTo(tx - tw * 2.6, G.H);
  fctx.lineTo(tx - tw * 1.75, base + tw * 0.5);
  fctx.quadraticCurveTo(tx, base - tw * 0.15, tx + tw * 1.75, base + tw * 0.5);
  fctx.lineTo(tx + tw * 2.6, G.H);
  fctx.closePath();
  fctx.fill();
  /* the tower, tapering, banded, catching a little of its own light */
  const g = fctx.createLinearGradient(tx - tw, 0, tx + tw, 0);
  g.addColorStop(0, "#0e131c");
  g.addColorStop(0.42, "#2e3644");
  g.addColorStop(0.62, "#3b4553");
  g.addColorStop(1, "#0b0f16");
  fctx.fillStyle = g;
  fctx.beginPath();
  fctx.moveTo(tx - tw * 1.55, base);
  fctx.lineTo(tx - tw * 0.72, top + tw * 0.9);
  fctx.lineTo(tx + tw * 0.72, top + tw * 0.9);
  fctx.lineTo(tx + tw * 1.55, base);
  fctx.closePath();
  fctx.fill();
  /* one band, because every lighthouse has one and it is what makes the
     silhouette read as a lighthouse and not a chimney */
  fctx.fillStyle = "rgba(120,66,52,0.55)";
  const by = top + th * 0.42, bh = th * 0.13;
  const wAt = (y) => tw * (0.72 + 0.83 * (y - (top + tw * 0.9)) / (base - top - tw * 0.9));
  fctx.beginPath();
  fctx.moveTo(tx - wAt(by), by);
  fctx.lineTo(tx + wAt(by), by);
  fctx.lineTo(tx + wAt(by + bh), by + bh);
  fctx.lineTo(tx - wAt(by + bh), by + bh);
  fctx.closePath();
  fctx.fill();
  /* the gallery rail under the lamp room */
  fctx.strokeStyle = "#2a3240";
  fctx.lineWidth = Math.max(1.4, tw * 0.10);
  fctx.beginPath();
  fctx.moveTo(tx - tw * 1.20, top + tw * 0.92);
  fctx.lineTo(tx + tw * 1.20, top + tw * 0.92);
  fctx.stroke();
  for (let i = -3; i <= 3; i++) {
    fctx.beginPath();
    fctx.moveTo(tx + i * tw * 0.36, top + tw * 0.92);
    fctx.lineTo(tx + i * tw * 0.36, top + tw * 0.52);
    fctx.stroke();
  }
  /* the lamp room and the lamp */
  fctx.fillStyle = "#151b26";
  fctx.fillRect(tx - tw * 0.78, top - tw * 0.42, tw * 1.56, tw * 1.0);
  fctx.fillStyle = "#0c1017";
  fctx.beginPath();
  fctx.moveTo(tx - tw * 0.95, top - tw * 0.42);
  fctx.lineTo(tx, top - tw * 1.25);
  fctx.lineTo(tx + tw * 0.95, top - tw * 0.42);
  fctx.closePath();
  fctx.fill();
  if (lit > 0.01) {
    const flick = 0.88 + 0.12 * Math.sin(beacT * 9);
    const lg = fctx.createRadialGradient(tx, top, 0, tx, top, tw * 4.0);
    lg.addColorStop(0, `rgba(255,248,222,${(0.95 * lit * flick).toFixed(3)})`);
    lg.addColorStop(0.12, `rgba(255,238,186,${(0.45 * lit).toFixed(3)})`);
    lg.addColorStop(1, "rgba(255,226,160,0)");
    fctx.fillStyle = lg;
    fctx.beginPath(); fctx.arc(tx, top, tw * 4.0, 0, 6.3); fctx.fill();
    fctx.fillStyle = `rgba(255,252,238,${(0.95 * lit).toFixed(3)})`;
    fctx.beginPath();
    fctx.ellipse(tx, top, tw * 0.40, tw * 0.30, 0, 0, 6.3);
    fctx.fill();
  }
}

/* --- taking hold of it ---
   Drag anywhere and the light follows your hand. Tap anywhere and it swings
   there on its own, because a tap has to do something. */
function beamAim(x) {
  const G = beacGeom();
  return Math.max(0, Math.min(1, (x - beamHX(G, 0)) / (beamHX(G, 1) - beamHX(G, 0))));
}
window.addEventListener("pointerdown", (e) => {
  if (!beaconOn || shipAnswer) return;
  beacIdle = 0;
  const want = beamAim(e.clientX);
  beamGrab = { want };
  /* a tap is a swing: go most of the way there at once */
  beamT += (want - beamT) * 0.55;
  gearTurn(Math.abs(want - beamT));
}, { passive: true });
window.addEventListener("pointermove", (e) => {
  if (!beaconOn || shipAnswer) return;
  if (!beamGrab) {
    finCanvas.style.cursor = "grab";
    return;
  }
  beacIdle = 0;
  finCanvas.style.cursor = "grabbing";
  const want = beamAim(e.clientX);
  const d = want - beamT;
  beamT = Math.max(0, Math.min(1, beamT + d * 0.32));
  beamGrab.want = want;
  gearTurn(Math.abs(d));
});
const beamLetGo = () => {
  if (!beamGrab) return;
  beamGrab = null;
  finCanvas.style.cursor = "grab";
  /* it picks its own rotation back up, going the way you left it going */
  beamV = (beamV < 0 ? -1 : 1) * 0.22;
};
window.addEventListener("pointerup", beamLetGo);
window.addEventListener("pointercancel", beamLetGo);

/* --- sound --- */
function seaBed() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* the sea: noise with a slow filter breathing over it, which is a swell */
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
  const bp = ac.createBiquadFilter(); bp.type = "highpass"; bp.frequency.value = 140;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.085, t0 + 4);
  const lfo = ac.createOscillator(); lfo.type = "sine"; lfo.frequency.value = 0.11;
  const lg = ac.createGain(); lg.gain.value = 380;
  lfo.connect(lg); lg.connect(lp.frequency); lfo.start(t0);
  s.connect(bp); bp.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0);
  hold("beacon", { gain: g, src: s });
  hold("beacon", { src: lfo });
  /* and the wind off it */
  const w = ac.createBufferSource(); w.buffer = noise(ac); w.loop = true;
  const wb = ac.createBiquadFilter(); wb.type = "bandpass";
  wb.frequency.value = 480; wb.Q.value = 0.5;
  const wg = ac.createGain(); wg.gain.value = 0.0001;
  const wl = ac.createOscillator(); wl.type = "sine"; wl.frequency.value = 0.07;
  const wlg = ac.createGain(); wlg.gain.value = 0.016;
  wl.connect(wlg); wlg.connect(wg.gain); wl.start(t0);
  wg.gain.linearRampToValueAtTime(0.030, t0 + 6);
  w.connect(wb); wb.connect(wg); wg.connect(BUS);
  w.start(t0);
  hold("beacon", { gain: wg, src: w });
  hold("beacon", { src: wl });
}

let lastGear = 0;
function gearTurn(amt) {
  const ac = audio(); if (!ac) return;
  const now = performance.now();
  if (now - lastGear < 90 || amt < 0.004) return;
  lastGear = now;
  const t0 = ac.currentTime;
  /* the machinery under a light: a low ratcheting, not a whine */
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.value = 300 + Math.min(1, amt * 9) * 500;
  const g = ac.createGain();
  const v = Math.min(0.05, 0.012 + amt * 0.5);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(v, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.20);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.24);
}

/* the moment the beam first finds it — one note, high, quiet */
function glintSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  for (const [f, d] of [[1568, 0], [2093, 0.06]]) {
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.linearRampToValueAtTime(0.045, t0 + d + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.9);
    o.connect(g); g.connect(BUS);
    o.start(t0 + d); o.stop(t0 + d + 1.0);
  }
}

/* it rings its bell */
function shipBell() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  for (let k = 0; k < 2; k++) {
    const t = t0 + k * 0.62;
    for (const [f, v] of [[784, 0.055], [1176, 0.030], [2093, 0.016], [2637, 0.010]]) {
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(f * (1 + (Math.random() - 0.5) * 0.004), t);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
      o.connect(g); g.connect(BUS);
      o.start(t); o.stop(t + 2.7);
    }
  }
}

/* and the light answers it, low, from the other side of the frame */
function hornAnswer() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + 1.5;
  for (const [f, v] of [[97, 0.075], [146, 0.040], [58, 0.055]]) {
    const o = ac.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(f, t0);
    o.frequency.linearRampToValueAtTime(f * 0.985, t0 + 1.8);
    const lp = ac.createBiquadFilter(); lp.type = "lowpass";
    lp.frequency.setValueAtTime(240, t0);
    lp.frequency.linearRampToValueAtTime(150, t0 + 2.0);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.35);
    g.gain.setValueAtTime(v, t0 + 1.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.4);
    o.connect(lp); lp.connect(g); g.connect(BUS);
    o.start(t0); o.stop(t0 + 2.5);
  }
}


/* ================= transitions that are things =================
   One effect used at every cut is a slide transition. These are events
   instead: frost taking a pane, cloud coming up a hillside, wind stripping
   a tree. Each one belongs to the two scenes it joins. */

let nat = null;   /* { kind, t, dur, after, seeds } */
let natC = null, natX = null;

/* Some of these need the outgoing scene as pixels — the chart has to
   become the sand it turns into, so the grains have to be the chart's own
   grains. Grab it once, at the start, off whatever canvas was drawing it. */
function natCapture(src) {
  const W = window.innerWidth, H = window.innerHeight;
  if (!natC) {
    natC = document.createElement("canvas");
    natX = natC.getContext("2d", { willReadFrequently: true });
  }
  natC.width = W; natC.height = H;
  natX.setTransform(1, 0, 0, 1, 0, 0);
  natX.clearRect(0, 0, W, H);
  if (src) {
    /* Put it back exactly where the eye last saw it, or the grains start
       from the wrong place and the join reads as a cut after all. The sheet
       is paper with ink on it — the paper is a CSS background, so it has to
       be laid down under the canvas or only the ink turns to sand. */
    let r = null, pr = null;
    try { r = src.getBoundingClientRect(); } catch (e) {}
    try {
      const sheet = src.closest ? src.closest(".paper") : null;
      if (sheet) pr = sheet.getBoundingClientRect();
    } catch (e) {}
    const box = (pr && pr.width > 4 && pr.height > 4) ? pr : r;
    if (box && box.width > 4 && box.height > 4) {
      const g = natX.createLinearGradient(box.left, box.top, box.right, box.bottom);
      g.addColorStop(0, "#fdf6e4");
      g.addColorStop(0.55, "#f4e8cd");
      g.addColorStop(1, T.sand);
      natX.fillStyle = g;
      natX.fillRect(box.left, box.top, box.width, box.height);
    }
    try {
      if (r && r.width > 4 && r.height > 4) natX.drawImage(src, r.left, r.top, r.width, r.height);
      else natX.drawImage(src, 0, 0, W, H);
    } catch (e) {}
  }
  return natC;
}

function natRun(kind, after, dur, opts) {
  const o = opts || {};
  /* The swap has to happen while the weather is thickest, or the audience
     sees the join. `at` is the point in the transition where the next scene
     is put up behind it; the rest of the effect then clears off the new one. */
  nat = { kind, t: 0, dur: dur || 2.6, after: after || null, seeds: null,
          travel: !!o.travel, cap: null, at: o.at === undefined ? 1 : o.at,
          fired: false };
  if (o.src !== undefined) nat.cap = natCapture(o.src);
  if (kind === "frost") frostSound();
  else if (kind === "cloud") cloudSound();
  else if (kind === "leaf") leafSound();
  else if (kind === "wash") washSound();
  else if (kind === "drain") drainSound();
  else if (kind === "drip") dripSound();
  else if (kind === "sand") sandSound();
  else if (kind === "rain") rainSound();
  if (after) {
    const guard = after;
    setTimeout(() => {
      if (nat && nat.after === guard) {
        const already = nat.fired;
        natEnd();
        if (!already) guard();
      }
    }, (dur || 2.6) * 1000 + 2500);
  }
}

/* one exit, so the borrowed canvas always gets handed back */
function natEnd() {
  const wasTravel = nat && nat.travel;
  nat = null;
  if (wasTravel) {
    travelOnly = false;
    if (!finActive) finCanvas.style.display = "none";
  }
}

/* --- frost: dendrites out of the corners, then the thaw --- */
function frostSeeds(W, H) {
  const S = [];
  /* each seed is a recursive tree drawn twice — half as many on a phone,
     where nobody can see the difference and the frame rate is the picture */
  const N = Math.min(W, H) < 560 ? 15 : 26;
  for (let i = 0; i < N; i++) {
    /* they start on the edge, because that is where a pane goes first */
    const e = i / N * 4;
    let x, y, a;
    if (e < 1) { x = W * e; y = 0; a = Math.PI * 0.5; }
    else if (e < 2) { x = W; y = H * (e - 1); a = Math.PI; }
    else if (e < 3) { x = W * (3 - e); y = H; a = -Math.PI * 0.5; }
    else { x = 0; y = H * (4 - e); a = 0; }
    S.push({ x, y, a: a + (Math.random() - 0.5) * 0.9,
             len: Math.min(W, H) * (0.30 + Math.random() * 0.55),
             seed: Math.random() * 100 });
  }
  return S;
}

function frostBranch(c, x, y, a, len, depth, grow, seed) {
  if (len < 4 || depth > 4 || grow <= 0) return;
  const steps = 7;
  let px = x, py = y;
  c.beginPath();
  c.moveTo(px, py);
  for (let s = 1; s <= steps; s++) {
    const f = s / steps;
    if (f > grow) break;
    const aa = a + Math.sin(seed + f * 5) * 0.16;
    px += Math.cos(aa) * len / steps;
    py += Math.sin(aa) * len / steps;
    c.lineTo(px, py);
  }
  c.stroke();
  /* the side spikes, which is what makes frost read as frost */
  for (let s = 1; s <= steps; s++) {
    const f = s / steps;
    if (f > grow) break;
    if (s % 2) continue;
    const bx = x + Math.cos(a) * len * f, by = y + Math.sin(a) * len * f;
    for (const side of [-1, 1]) {
      frostBranch(c, bx, by, a + side * (0.55 + (seed % 1) * 0.25),
                  len * 0.34, depth + 1, Math.min(1, (grow - f) * 3), seed + s);
    }
  }
}

/* --- the whole thing, drawn over whatever scene is live --- */
function natFrame(dt) {
  if (!nat) return false;
  const W = window.innerWidth, H = window.innerHeight;
  nat.t += dt;
  const u = Math.min(1, nat.t / nat.dur);

  if (nat.kind === "frost") {
    if (!nat.seeds) nat.seeds = frostSeeds(W, H);
    const grow = Math.min(1, u / 0.62);
    const thaw = Math.max(0, (u - 0.66) / 0.34);
    fctx.save();
    fctx.globalAlpha = 1 - thaw;
    /* the pane hazes over as the crystals take it */
    fctx.fillStyle = `rgba(226,240,250,${(0.50 * grow).toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
    fctx.globalCompositeOperation = "lighter";
    fctx.strokeStyle = "rgba(238,250,255,0.55)";
    fctx.lineWidth = 1.6;
    fctx.lineCap = "round";
    for (const s of nat.seeds) frostBranch(fctx, s.x, s.y, s.a, s.len, 0, grow, s.seed);
    fctx.strokeStyle = "rgba(255,255,255,0.30)";
    fctx.lineWidth = 3.4;
    for (const s of nat.seeds) frostBranch(fctx, s.x, s.y, s.a, s.len, 0, grow * 0.8, s.seed);
    fctx.restore();
    /* and then it goes, from the middle out, the way a warm pane clears */
    if (thaw > 0) {
      const g = fctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) * 0.6 * thaw);
      g.addColorStop(0, "rgba(0,0,0,0)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      fctx.globalCompositeOperation = "destination-out";
      fctx.fillStyle = `rgba(0,0,0,${thaw.toFixed(3)})`;
      fctx.beginPath();
      fctx.arc(W / 2, H / 2, Math.hypot(W, H) * 0.62 * thaw, 0, 6.3);
      fctx.fill();
      fctx.globalCompositeOperation = "source-over";
    }
  }

  else if (nat.kind === "cloud") {
    if (!nat.seeds) {
      nat.seeds = [];
      for (let i = 0; i < 26; i++)
        nat.seeds.push({ x: Math.random() * W, y: H * (0.7 + Math.random() * 0.7),
                         r: Math.min(W, H) * (0.16 + Math.random() * 0.30),
                         v: 0.6 + Math.random() * 0.9, ph: Math.random() * 6.3 });
    }
    const rise = u * 1.5;
    for (const s of nat.seeds) {
      const y = s.y - rise * H * s.v;
      const a = Math.min(0.5, u * 0.9) * (1 - Math.max(0, (u - 0.72) / 0.28));
      const g = fctx.createRadialGradient(s.x, y, 0, s.x, y, s.r);
      g.addColorStop(0, `rgba(232,238,246,${a.toFixed(3)})`);
      g.addColorStop(0.6, `rgba(206,216,230,${(a * 0.5).toFixed(3)})`);
      g.addColorStop(1, "rgba(196,208,224,0)");
      fctx.fillStyle = g;
      fctx.fillRect(s.x - s.r, y - s.r, s.r * 2, s.r * 2);
    }
    /* thickest in the middle of it, when you are inside the cloud */
    const dense = Math.sin(Math.min(1, u / 0.7) * Math.PI) * 0.72;
    fctx.fillStyle = `rgba(222,230,240,${dense.toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
  }

  else if (nat.kind === "wash") {
    /* the scene does not fade, it is carried off — sheets of it sliding
       away downstream, faster the nearer they are, the way a current
       takes anything you put on it */
    if (!nat.seeds) {
      nat.seeds = [];
      for (let i = 0; i < 26; i++)
        nat.seeds.push({ y: H * (i / 26), h: H / 26 + 2,
                         v: 0.5 + (i / 26) * 2.4, ph: Math.random() * 6.3 });
    }
    const veil = Math.sin(Math.min(1, u / 0.8) * Math.PI);
    fctx.save();
    for (const s of nat.seeds) {
      const off = Math.pow(u, 1.6) * W * 1.6 * s.v + Math.sin(u * 6 + s.ph) * 24;
      fctx.fillStyle = `rgba(150,182,198,${(0.16 * veil).toFixed(3)})`;
      fctx.fillRect(-off, s.y, W * 2, s.h);
      fctx.fillStyle = `rgba(232,244,250,${(0.10 * veil).toFixed(3)})`;
      fctx.fillRect(-off + W * 0.3, s.y + s.h * 0.3, W * 1.2, Math.max(1, s.h * 0.22));
    }
    fctx.restore();
    fctx.fillStyle = `rgba(18,26,32,${(veil * 0.72).toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
  }

  else if (nat.kind === "leaf") {
    if (!nat.seeds) {
      nat.seeds = [];
      for (let i = 0; i < 90; i++)
        nat.seeds.push({ x: Math.random() * W, y: H * (0.2 + Math.random() * 1.0),
                         s: 5 + Math.random() * 13, sp: 0.6 + Math.random() * 1.3,
                         rot: Math.random() * 6.3, spin: (Math.random() - 0.5) * 6,
                         hue: 18 + Math.random() * 34, ph: Math.random() * 6.3 });
    }
    const veil = Math.sin(Math.min(1, u / 0.75) * Math.PI);
    for (const l of nat.seeds) {
      const t = u * l.sp;
      const x = l.x + Math.sin(l.ph + t * 6) * 90 + t * W * 0.5;
      const y = l.y - t * H * 1.35;
      l.rot += l.spin * dt;
      drawLeaf(fctx, x, y, l.s, l.rot, l.hue, Math.min(1, veil * 1.6));
    }
    fctx.fillStyle = `rgba(28,20,12,${(veil * 0.55).toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
  }

  /* --- drain: you go down after the water, looking back up at the light ---
     The basin has just emptied. Rather than cutting away from that, the
     camera follows the last of it down the plughole and turns to look back:
     the room you were in is a coin of daylight overhead, the throat of the
     pipe slides past you in rings, and the coin closes. It can only join
     these two scenes, because only one of them has a drain in it. */
  else if (nat.kind === "drain") {
    const M = Math.min(W, H), cx = W / 2, cy = H * 0.5;
    fctx.fillStyle = T.ink;
    fctx.fillRect(0, 0, W, H);
    fctx.save();
    fctx.translate(cx, cy);
    /* The throat is a surface, not a set of hoops — so it is drawn as filled
       bands from the outside in, each one a little brighter than the last,
       because the only light down here is the hole you came in through. */
    const N = 30, RMAX = M * 1.9;
    /* A ring wider than the frame paints the whole frame, and every ring
       behind it is then invisible. Find the last one that still covers and
       start there — on a phone that is nine full-screen fills a frame saved. */
    const coverR = Math.hypot(W / 2, H / 2 / 0.86) * 1.02;
    let bands = [];
    for (let i = 0; i < N; i++) {
      let p = (i / N - u * 2.15) % 1; if (p < 0) p += 1;
      bands.push(p);
    }
    bands.sort((a, b) => b - a);            // far ones first, near ones over them
    let first = 0;
    for (let i = 0; i < bands.length; i++) {
      if (RMAX * Math.pow(bands[i], 1.7) >= coverR) first = i; else break;
    }
    bands = bands.slice(first);
    for (const p of bands) {
      const r = RMAX * Math.pow(p, 1.7);
      if (r < 1.5) continue;
      const lit = Math.pow(1 - p, 2.1);      // nearer the light = brighter
      const tw = p * 3.4 + u * 1.2;
      /* wet porcelain, warming toward the daylight above */
      const R = 12 + 190 * lit, G = 20 + 202 * lit, B = 28 + 196 * lit;
      fctx.save();
      fctx.rotate(tw);
      fctx.scale(1, 0.86);
      fctx.fillStyle = `rgb(${R | 0},${G | 0},${B | 0})`;
      fctx.beginPath(); fctx.arc(0, 0, r, 0, 6.3); fctx.fill();
      /* the seam where one length of pipe meets the next */
      fctx.strokeStyle = `rgba(0,0,0,${(0.30 + 0.30 * (1 - lit)).toFixed(3)})`;
      fctx.lineWidth = Math.max(1, M * 0.006);
      fctx.beginPath(); fctx.arc(0, 0, r, 0, 6.3); fctx.stroke();
      /* and a wet highlight running down one side of it */
      fctx.strokeStyle = `rgba(236,250,255,${(0.10 + 0.34 * lit).toFixed(3)})`;
      fctx.lineWidth = Math.max(1.2, M * 0.010 * (0.5 + lit));
      fctx.beginPath(); fctx.arc(0, 0, r * 0.97, -1.75, -0.55); fctx.stroke();
      fctx.strokeStyle = `rgba(150,196,214,${(0.06 + 0.16 * lit).toFixed(3)})`;
      fctx.beginPath(); fctx.arc(0, 0, r * 0.97, 1.5, 2.5); fctx.stroke();
      fctx.restore();
    }
    /* the last threads of water, still going round on the way down */
    fctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 40; i++) {
      let p = (i / 40 - u * 1.75 + 0.11) % 1; if (p < 0) p += 1;
      const r = RMAX * Math.pow(p, 1.7);
      const a0 = i * 1.13 + p * 6.0 + u * 2.4;
      fctx.save();
      fctx.scale(1, 0.86);
      fctx.strokeStyle = `rgba(214,240,252,${(0.34 * Math.pow(1 - p, 1.2)).toFixed(3)})`;
      fctx.lineWidth = Math.max(0.8, M * 0.005);
      fctx.beginPath(); fctx.arc(0, 0, r, a0, a0 + 1.05); fctx.stroke();
      fctx.restore();
    }
    /* and the room you left, overhead, closing */
    const cr = M * 0.20 * Math.pow(1 - u, 1.15);
    if (cr > 0.4) {
      const g = fctx.createRadialGradient(0, 0, 0, 0, 0, cr * 4.2);
      g.addColorStop(0, "rgba(255,252,240,0.90)");
      g.addColorStop(0.18, "rgba(226,244,252,0.44)");
      g.addColorStop(1, "rgba(150,200,220,0)");
      fctx.fillStyle = g;
      fctx.beginPath(); fctx.arc(0, 0, cr * 4.2, 0, 6.3); fctx.fill();
      fctx.globalCompositeOperation = "source-over";
      fctx.fillStyle = "rgba(255,253,246,0.94)";
      fctx.beginPath(); fctx.ellipse(0, 0, cr, cr * 0.86, 0, 0, 6.3); fctx.fill();
    }
    fctx.globalCompositeOperation = "source-over";
    fctx.restore();
    /* the corners go, so the pipe closes in on you. Built once — a fresh
       gradient object every frame is not free at three times pixel density. */
    if (!nat.vg || nat.vgW !== W || nat.vgH !== H) {
      nat.vg = fctx.createRadialGradient(cx, cy, M * 0.18, cx, cy, M * 0.95);
      nat.vg.addColorStop(0, "rgba(0,0,0,0)");
      nat.vg.addColorStop(1, "rgba(0,0,0,1)");
      nat.vgW = W; nat.vgH = H;
    }
    fctx.globalAlpha = 0.55 + 0.35 * u;
    fctx.fillStyle = nat.vg;
    fctx.fillRect(0, 0, W, H);
    fctx.globalAlpha = 1;
  }

  /* --- drip: the gel that is left runs down and becomes the ink ---
     You tore the sheet; this is what was holding it. The remaining goo
     hangs, stretches, and runs down over the frame, and on the way down it
     stops being gel and starts being ink — which is the next scene's
     material. Same substance, different meaning. */
  else if (nat.kind === "drip") {
    if (!nat.seeds) {
      nat.seeds = [];
      const N = Math.max(16, Math.round(W / 46));
      for (let i = 0; i < N; i++)
        nat.seeds.push({ x: (i + 0.5 + (Math.random() - 0.5) * 0.6) / N * W,
                         w: W / N * (0.5 + Math.random() * 0.75),
                         sp: 0.7 + Math.random() * 1.5,
                         de: Math.random() * 0.34,
                         wob: Math.random() * 6.3 });
      /* a few that let go entirely */
      nat.drops = [];
      for (let i = 0; i < 14; i++)
        nat.drops.push({ x: Math.random() * W, y: -H * Math.random() * 0.4,
                         r: M0(W, H) * (0.008 + Math.random() * 0.016),
                         sp: 0.9 + Math.random() * 1.4, de: Math.random() * 0.5 });
    }
    /* gel stops being gel on the way down: green at the start, ink by the end */
    const ink = Math.pow(u, 0.85);
    const mix = (a, b) => `${(a + (b - a) * ink) | 0}`;
    const body = `rgb(${mix(96, 20)},${mix(190, 23)},${mix(148, 30)})`;
    const lip  = `rgb(${mix(178, 44)},${mix(238, 52)},${mix(202, 60)})`;
    const deep = `rgb(${mix(30, 8)},${mix(74, 10)},${mix(56, 14)})`;
    /* it is one sheet, not a row of bars — so the sheet sags between the runs */
    const lead = [];
    for (const s of nat.seeds) {
      const t = Math.max(0, (u - s.de) / (1 - s.de));
      lead.push(t <= 0 ? 0 : Math.min(H * 1.3, H * 1.4 * Math.pow(t, 1.4) * s.sp));
    }
    const sagAt = (x) => {
      let y = H * 0.02 + H * 0.10 * u;
      for (let i = 0; i < nat.seeds.length; i++) {
        const s = nat.seeds[i];
        const d = (x - s.x) / (s.w * 2.1);
        y = Math.max(y, lead[i] * 0.34 * Math.exp(-d * d));
      }
      return y;
    };
    fctx.fillStyle = body;
    fctx.beginPath();
    fctx.moveTo(0, 0);
    fctx.lineTo(W, 0);
    for (let x = W; x >= 0; x -= 14) fctx.lineTo(x, sagAt(x));
    fctx.closePath();
    fctx.fill();
    for (let i = 0; i < nat.seeds.length; i++) {
      const s = nat.seeds[i], L = lead[i];
      if (L <= 1) continue;
      /* a run is a tapering column with a fat bead on the end of it */
      const wob = Math.sin(s.wob + u * 7) * s.w * 0.14;
      const wTop = s.w, wBot = s.w * (0.34 + 0.16 * Math.sin(s.wob * 3));
      const g = fctx.createLinearGradient(s.x - wTop, 0, s.x + wTop, 0);
      g.addColorStop(0, deep);
      g.addColorStop(0.34, lip);
      g.addColorStop(0.62, body);
      g.addColorStop(1, deep);
      fctx.fillStyle = g;
      fctx.beginPath();
      fctx.moveTo(s.x - wTop / 2, 0);
      fctx.lineTo(s.x + wTop / 2, 0);
      fctx.quadraticCurveTo(s.x + wTop * 0.42 + wob, L * 0.6,
                            s.x + wBot + wob, L - wBot * 0.6);
      fctx.quadraticCurveTo(s.x + wob, L + wBot * 1.15,
                            s.x - wBot + wob, L - wBot * 0.6);
      fctx.quadraticCurveTo(s.x - wTop * 0.42 + wob, L * 0.6, s.x - wTop / 2, 0);
      fctx.closePath();
      fctx.fill();
      /* the bead on the end is rounder and catches more light than the run */
      const bg = fctx.createRadialGradient(s.x - wBot * 0.35 + wob, L - wBot * 0.3, 0,
