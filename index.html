<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Hershock</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fdfdfb;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6vh;
    transition: opacity 1.4s ease;
  }
  #stage.gone { opacity: 0; pointer-events: none; }
  #heroSvg { width: 100%; height: auto; max-height: 88vh; display: block; }
  #glitter {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .pumpHit { cursor: pointer; }
  .noselect { user-select: none; -webkit-user-select: none; }
</style>
</head>
<body>
<div id="stage" class="noselect"></div>
<canvas id="glitter"></canvas>

<script>
"use strict";

/* ================= letter definitions =================
   Monoline "balloon" letters. Coordinates: y 0 (top) to 100 (baseline).
   Each letter = one or more subpaths (each subpath is one thin balloon). */
const LETTERS = {
  K: { w: 58, subs: ["M10 4 L10 96", "M52 4 L14 50 L52 96"] },
  E: { w: 52, subs: ["M48 4 L12 4 L12 96 L48 96", "M12 50 L40 50"] },
  V: { w: 60, subs: ["M8 4 L30 96 L52 4"] },
  I: { w: 20, subs: ["M10 4 L10 96"] },
  N: { w: 60, subs: ["M10 96 L10 4 L50 96 L50 4"] },
  H: { w: 58, subs: ["M10 4 L10 96", "M48 4 L48 96", "M10 50 L48 50"] },
  R: { w: 56, subs: ["M12 96 L12 4 L32 4 C52 4 52 48 32 48 L12 48", "M31 48 L50 96"] },
  S: { w: 52, subs: ["M44 13 C37 1 13 0 11 20 C8 41 44 44 46 68 C48 92 17 103 8 83"] },
  O: { w: 60, subs: ["M30 4 C7 4 7 96 30 96 C53 96 53 4 30 4 Z"] },
  C: { w: 54, subs: ["M46 15 C35 -1 10 8 10 50 C10 92 35 101 46 85"] },
};
const PALETTE = ["#e63950","#ff8c00","#ffcf00","#00b869","#0f7fb5","#8b46d9",
                 "#ff5d9e","#00a8e8","#d92645","#6cb520","#e8a013","#2aa8b8","#a95fe0"];
const SPACE_W = 34;
const LETTER_GAP = 10;

/* latex color helper: amt>0 lighten toward white, amt<0 darken */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (amt >= 0) { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

/* ================= state ================= */
const PUMP_STEP = 0.085;
const EXPLODE_AT = 1.42;
const IDLE_MS = 950;
const DECAY_PER_S = 0.30;

let target = 0;
let inf = 0;
let vel = 0;
let lastPump = -1e9;
let exploded = false;
let pumpPressT = 0;
let letters = [];
let layoutW = 0, layoutH = 0;
let heroSvg = null, pumpPlunger = null;
const stage = document.getElementById("stage");

/* ================= layout / svg build ================= */
function currentLines() {
  return (window.innerWidth < 720)
    ? ["KEVIN", "HERSHOCK"]
    : ["KEVIN HERSHOCK"];
}

function lineWidth(line) {
  let w = 0;
  for (const ch of line) {
    w += (ch === " ") ? SPACE_W : LETTERS[ch].w + LETTER_GAP;
  }
  return w;
}

function buildSvg() {
  const lines = currentLines();
  const PUMP_ZONE = 165;
  const widest = Math.max(...lines.map(lineWidth));
  const W = PUMP_ZONE + widest + 50;
  const lineGap = 140;
  const firstBase = 190;
  const lastBase = firstBase + (lines.length - 1) * lineGap;
  const H = lastBase + 45;
  layoutW = W; layoutH = H;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("id", "heroSvg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMin meet");

  /* metal gradients for a real-looking pump */
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML =
    `<linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0" stop-color="#7d8288"/>
       <stop offset="0.28" stop-color="#d7dade"/>
       <stop offset="0.5" stop-color="#f2f4f5"/>
       <stop offset="0.72" stop-color="#b9bec3"/>
       <stop offset="1" stop-color="#6b7075"/>
     </linearGradient>
     <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0" stop-color="#8d9296"/>
       <stop offset="0.45" stop-color="#d3d6d9"/>
       <stop offset="1" stop-color="#63676c"/>
     </linearGradient>`;
  svg.appendChild(defs);

  const mkPath = (d) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("stroke-linejoin", "round");
    return p;
  };

  letters = [];
  let ci = 0;
  lines.forEach((line, li) => {
    const base = firstBase + li * lineGap;
    let x = PUMP_ZONE + (widest - lineWidth(line)) / 2;
    for (const ch of line) {
      if (ch === " ") { x += SPACE_W; continue; }
      const def = LETTERS[ch];
      const g = document.createElementNS(NS, "g");
      const color = PALETTE[ci % PALETTE.length];

      /* four layers per balloon segment: dark rim, latex body,
         soft light band, hard specular streak */
      const dark = [], main = [], tint = [], gloss = [];
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, -0.32)); g.appendChild(p); dark.push(p); }
      for (const d of def.subs) { const p = mkPath(d); g.appendChild(p); main.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", shade(color, 0.34)); g.appendChild(p); tint.push(p); }
      for (const d of def.subs) { const p = mkPath(d); p.setAttribute("stroke", "#ffffff"); g.appendChild(p); gloss.push(p); }

      svg.appendChild(g);
      letters.push({
        g, dark, main, tint, gloss,
        subDs: def.subs, subs: null,
        x, base, w: def.w, color,
        phase: Math.random() * Math.PI * 2,
      });
      x += def.w + LETTER_GAP;
      ci++;
    }
  });

  buildPump(svg, NS, firstBase, letters[0]);
  stage.innerHTML = "";
  stage.appendChild(svg);
  heroSvg = svg;
  sampleAll();
}

/* sample every balloon tube into points so it can flop, drape, and fill */
function sampleAll() {
  for (const L of letters) {
    L.subs = L.subDs.map((d, j) => {
      const el = L.dark[j];
      el.setAttribute("d", d);               // restore original for measuring
      const len = el.getTotalLength();
      const N = Math.max(16, Math.min(40, Math.round(len / 7)));
      const pts = [];
      let minX = 1e9, maxX = -1e9;
      for (let i = 0; i < N; i++) {
        const p = el.getPointAtLength(len * i / (N - 1));
        pts.push({ x: p.x, y: p.y });
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
      }
      const closed = /z\s*$/i.test(d);
      /* where this balloon lies when it's a limp noodle on the ground */
      const spillLen = Math.min(len * 0.5, L.w * 1.25);
      let spillX = (minX + maxX) / 2 - spillLen / 2;
      spillX = Math.max(-4, Math.min(spillX, L.w + 4 - spillLen));
      return {
        pts, N, closed, spillLen, spillX,
        ground: 95 + Math.random() * 3,
        ampY: 4 + Math.random() * 4,
        humps: 1.5 + Math.random() * 1.6,
        ph1: Math.random() * Math.PI * 2,
        ph2: Math.random() * Math.PI * 2,
      };
    });
  }
}

function buildPump(svg, NS, base, firstLetter) {
  const px = 62;
  const ground = base + 8;
  const NSrect = (x, y, w, h, rx, fill) => {
    const r = document.createElementNS(NS, "rect");
    r.setAttribute("x", x); r.setAttribute("y", y);
    r.setAttribute("width", w); r.setAttribute("height", h);
    r.setAttribute("rx", rx); r.setAttribute("fill", fill);
    return r;
  };

  /* rubber hose lying on the ground from the outlet to the first balloon */
  const ox = px + 28, oy = ground - 12;
  const ex = firstLetter.x + 8, ey = base - 2;
  const mid = (ox + ex) / 2;
  const hoseD = `M${ox} ${oy}
    C ${ox + 26} ${oy + 20}, ${ox + 52} ${ground + 5}, ${mid} ${ground + 4}
    S ${ex - 34} ${ground + 2}, ${ex} ${ey}`;
  const hose = document.createElementNS(NS, "path");
  hose.setAttribute("d", hoseD);
  hose.setAttribute("fill", "none");
  hose.setAttribute("stroke", "#33363a");
  hose.setAttribute("stroke-width", "7");
  hose.setAttribute("stroke-linecap", "round");
  svg.appendChild(hose);
  const hoseHi = document.createElementNS(NS, "path");
  hoseHi.setAttribute("d", hoseD);
  hoseHi.setAttribute("fill", "none");
  hoseHi.setAttribute("stroke", "#787d82");
  hoseHi.setAttribute("stroke-width", "1.8");
  hoseHi.setAttribute("stroke-linecap", "round");
  hoseHi.setAttribute("opacity", "0.7");
  hoseHi.setAttribute("transform", "translate(-0.8 -1.8)");
  svg.appendChild(hoseHi);
  /* brass nozzle at the balloon end */
  const noz = NSrect(ex - 3, ey - 4, 11, 8, 2, "#b08d57");
  noz.setAttribute("transform", `rotate(-35 ${ex} ${ey})`);
  svg.appendChild(noz);

  const pump = document.createElementNS(NS, "g");

  /* rubber base feet */
  pump.appendChild(NSrect(px - 52, ground - 10, 104, 10, 5, "#2e3134"));
  pump.appendChild(NSrect(px - 58, ground - 4, 30, 6, 3, "#232527"));
  pump.appendChild(NSrect(px + 28, ground - 4, 30, 6, 3, "#232527"));

  /* steel barrel */
  pump.appendChild(NSrect(px - 17, ground - 92, 34, 84, 6, "url(#barrel)"));
  /* top + bottom collars */
  pump.appendChild(NSrect(px - 21, ground - 100, 42, 11, 4, "#43474c"));
  pump.appendChild(NSrect(px - 21, ground - 12, 42, 8, 3, "#43474c"));
  /* brass outlet fitting the hose plugs into */
  pump.appendChild(NSrect(px + 14, ground - 18, 16, 9, 2, "#b08d57"));

  /* plunger: polished rod + T-handle with rubber grips */
  const plunger = document.createElementNS(NS, "g");
  plunger.appendChild(NSrect(px - 3.5, ground - 148, 7, 56, 2, "url(#rod)"));
  plunger.appendChild(NSrect(px - 14, ground - 158, 28, 12, 3, "#3a3d40"));
  plunger.appendChild(NSrect(px - 47, ground - 160, 35, 15, 7.5, "#17181a"));
  plunger.appendChild(NSrect(px + 12, ground - 160, 35, 15, 7.5, "#17181a"));
  const gripHiL = NSrect(px - 43, ground - 157, 27, 3, 1.5, "#4a4d50");
  const gripHiR = NSrect(px + 16, ground - 157, 27, 3, 1.5, "#4a4d50");
  plunger.appendChild(gripHiL); plunger.appendChild(gripHiR);
  pump.appendChild(plunger);
  pumpPlunger = { el: plunger, travel: 40 };

  /* invisible hit area — no arrow, no words. figure it out. */
  const hit = NSrect(px - 62, ground - 170, 190, 185, 0, "transparent");
  hit.setAttribute("class", "pumpHit");
  hit.addEventListener("pointerdown", doPump);
  pump.appendChild(hit);

  svg.appendChild(pump);
}

/* ================= pumping ================= */
function doPump(e) {
  if (e) e.preventDefault();
  if (exploded) return;
  target += PUMP_STEP;
  vel += 0.55;
  lastPump = performance.now();
  pumpPressT = 1;
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") doPump(e);
});

/* ================= animation loop ================= */
const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
let prevT = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - prevT) / 1000);
  prevT = now;

  if (!exploded) {
    if (now - lastPump > IDLE_MS && target > 0) {
      target = Math.max(0, target - DECAY_PER_S * dt);
    }
    const k = 60, damp = 8.5;
    vel += (target - inf) * k * dt;
    vel *= Math.exp(-damp * dt);
    inf += vel * dt;
    if (inf < 0) { inf = 0; vel = 0; }

    if (inf >= EXPLODE_AT) { explode(); }
    else { renderLetters(now); renderPump(dt); }
  }

  tickParticles(dt);
  requestAnimationFrame(frame);
}

/* air fills each balloon from its mouth toward its tip; whatever
   isn't inflated yet stays a limp noodle draped on the ground */
function renderLetters(now) {
  const p = Math.min(1, inf);
  const over = Math.max(0, inf - 1);
  const ep = easeOut(p);
  const f = p * 1.38;                   // fill front sweeps mouth -> tip as you pump
  const ts = now / 1000;

  for (const L of letters) {
    if (!L.subs) continue;
    const wob = over > 0 ? Math.sin(now / 60 + L.phase) * over * 9 : 0;
    L.g.setAttribute("transform",
      over > 0
        ? `translate(${L.x} ${L.base - 100}) translate(${L.w / 2} 50) rotate(${wob}) translate(${-L.w / 2} -50)`
        : `translate(${L.x} ${L.base - 100})`);

    for (let j = 0; j < L.subs.length; j++) {
      const S = L.subs[j];
      let dstr = "", sum = 0;
      for (let i = 0; i < S.N; i++) {
        const t = i / (S.N - 1);
        const li = clamp01((f - t) / 0.33);
        const sm = li * li * (3 - 2 * li);
        sum += sm;
        const P = S.pts[i];
        const flop = 1 - sm;
        const xF = S.spillX + t * S.spillLen
                 + Math.sin(t * 6.3 + S.ph1 + ts * 1.1) * 2.5 * flop;
        const yF = S.ground
                 - Math.abs(Math.sin(t * Math.PI * S.humps + S.ph2)) * S.ampY
                 + Math.sin(ts * 1.4 + S.ph1 + t * 5) * 1.4 * flop;
        const X = xF + (P.x - xF) * sm;
        const Y = yF + (P.y - yF) * sm;
        dstr += (i ? "L" : "M") + X.toFixed(1) + " " + Y.toFixed(1);
      }
      if (S.closed) dstr += "Z";
      const m = sum / S.N;              // how inflated this tube is
      const Ws = 3 + 20 * m + 13 * over;

      L.dark[j].setAttribute("d", dstr);
      L.main[j].setAttribute("d", dstr);
      L.tint[j].setAttribute("d", dstr);
      L.gloss[j].setAttribute("d", dstr);

      L.dark[j].setAttribute("stroke-width", Ws);
      L.main[j].setAttribute("stroke-width", Math.max(1.5, Ws * 0.80));
      L.main[j].setAttribute("stroke", shade(L.color, -0.20 * (1 - m)));
      L.tint[j].setAttribute("stroke-width", Math.max(1, Ws * 0.42));
      L.tint[j].setAttribute("opacity", 0.15 + 0.75 * m);
      L.tint[j].setAttribute("transform", `translate(${-Ws * 0.09} ${-Ws * 0.12})`);
      L.gloss[j].setAttribute("stroke-width", Math.max(0.8, Ws * 0.15));
      L.gloss[j].setAttribute("opacity", 0.85 * m);
      L.gloss[j].setAttribute("transform", `translate(${-Ws * 0.17} ${-Ws * 0.21})`);
    }
  }
}

function renderPump(dt) {
  if (!pumpPlunger) return;
  pumpPressT = Math.max(0, pumpPressT - dt * 5);
  const down = Math.sin(Math.min(1, pumpPressT) * Math.PI) * pumpPlunger.travel;
  pumpPlunger.el.setAttribute("transform", `translate(0 ${down})`);
}

/* ================= explosion + glitter ================= */
const canvas = document.getElementById("glitter");
const ctx = canvas.getContext("2d");
let parts = [];
function sizeCanvas() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}

function svgToScreen(x, y) {
  const r = heroSvg.getBoundingClientRect();
  const s = r.width / layoutW;
  return { x: r.left + x * s, y: r.top + y * s };
}

function explode() {
  exploded = true;

  // balloon scraps burst from each letter
  for (const L of letters) {
    const c = svgToScreen(L.x + L.w / 2, L.base - 50);
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 220 + Math.random() * 420;
      parts.push({
        kind: "scrap", x: c.x, y: c.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 180,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 14,
        w: 6 + Math.random() * 12, h: 3 + Math.random() * 4,
        color: L.color, life: 2.2 + Math.random() * 1.2,
      });
    }
    L.g.style.display = "none";
  }

  /* THE WALL. a screen-consuming curtain of glitter that pours down
     and unveils the site as it passes. */
  const W = window.innerWidth, H = window.innerHeight;
  const COUNT = Math.min(12000, Math.max(3500, Math.round((W * H) / 95)));
  const GLITTER = ["#ffd700","#ffdf6b","#f5c518","#e8e8e8","#c0c0c0","#ffffff",
                  "#ff4d6d","#06d6a0","#118ab2","#9b5de5","#ff70a6","#ffd60a",
                  "#00bbf9","#f7b32b","#7ef9ff","#ffb3f2"];
  for (let i = 0; i < COUNT; i++) {
    const sparkle = Math.random() < 0.22;
    parts.push({
      kind: sparkle ? "sparkle" : "glitter",
      x: Math.random() * W,
      y: H * 0.1 - Math.random() * H * 2.6,
      vx: (Math.random() - 0.5) * 50,
      vy: 380 + Math.random() * 340,
      sway: 15 + Math.random() * 45,
      swayF: 2 + Math.random() * 5,
      ph: Math.random() * Math.PI * 2,
      twF: 6 + Math.random() * 9,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 18,
      s: sparkle ? 4 + Math.random() * 8 : 2.5 + Math.random() * 5.5,
      color: GLITTER[(Math.random() * GLITTER.length) | 0],
      life: 12,
    });
  }

  setTimeout(() => stage.classList.add("gone"), 400);
}

function tickParticles(dt) {
  if (!parts.length) { ctx.clearRect(0, 0, window.innerWidth, window.innerHeight); return; }
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  const H = window.innerHeight;
  parts = parts.filter(pt => {
    pt.life -= dt;
    if (pt.life <= 0) return false;
    if (pt.kind === "scrap") {
      pt.vy += 900 * dt;
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.rot += pt.vr * dt;
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.min(1, pt.life);
      ctx.beginPath();
      ctx.ellipse(0, 0, pt.w, pt.h, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return true;
    }
    pt.ph += pt.swayF * dt;
    pt.x += (pt.vx + Math.sin(pt.ph) * pt.sway) * dt;
    pt.y += pt.vy * dt;
    pt.rot += pt.vr * dt;
    if (pt.y > H + 40) return false;
    if (pt.y < -60) return true;
    const tw = Math.sin(pt.ph * pt.twF * 0.35 + pt.x * 0.05);
    ctx.save();
    ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
    if (pt.kind === "sparkle") {
      const flash = Math.pow(Math.abs(tw), 3);
      ctx.globalAlpha = 0.25 + 0.75 * flash;
      const s = pt.s * (0.7 + 0.6 * flash);
      ctx.fillStyle = pt.color;
      ctx.fillRect(-s / 2, -s * 0.13, s, s * 0.26);
      ctx.fillRect(-s * 0.13, -s / 2, s * 0.26, s);
      ctx.fillStyle = "#ffffff";
      const c = s * 0.45;
      ctx.fillRect(-c / 2, -c * 0.2, c, c * 0.4);
      ctx.fillRect(-c * 0.2, -c / 2, c * 0.4, c);
    } else {
      ctx.globalAlpha = 0.45 + 0.55 * Math.abs(tw);
      ctx.fillStyle = pt.color;
      ctx.fillRect(-pt.s / 2, -pt.s / 2, pt.s, pt.s * 0.72);
    }
    ctx.restore();
    return true;
  });
}

/* ================= boot ================= */
function boot() {
  sizeCanvas();
  buildSvg();
}
let lastLines = "";
window.addEventListener("resize", () => {
  sizeCanvas();
  if (exploded) return;
  const l = currentLines().join("|");
  if (l !== lastLines) { lastLines = l; buildSvg(); }
});
lastLines = currentLines().join("|");
boot();
requestAnimationFrame(frame);

/* The rest of the site goes here one day. For now: pop the balloons. */
</script>
</body>
</html>
