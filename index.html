                                           s.x + wob, L, wBot * 1.5);
      bg.addColorStop(0, lip);
      bg.addColorStop(1, body);
      fctx.fillStyle = bg;
      fctx.beginPath();
      fctx.ellipse(s.x + wob, L - wBot * 0.15, wBot * 1.02, wBot * 1.3, 0, 0, 6.3);
      fctx.fill();
    }
    for (const d of nat.drops) {
      const t = Math.max(0, (u - d.de) / (1 - d.de));
      if (t <= 0) continue;
      const y = d.y + H * 1.5 * t * t * d.sp;
      if (y > H + d.r * 3) continue;
      fctx.fillStyle = `rgba(${(40 + 90 * (1 - u)) | 0},${(120 + 110 * (1 - u)) | 0},${(90 + 80 * (1 - u)) | 0},0.9)`;
      fctx.beginPath();
      fctx.ellipse(d.x, y, d.r * 0.85, d.r * (1.15 + t * 0.7), 0, 0, 6.3);
      fctx.fill();
    }
    /* it closes over into ink */
    const shut = Math.max(0, (u - 0.66) / 0.34);
    if (shut > 0) {
      fctx.fillStyle = `rgba(14,16,22,${(shut * shut).toFixed(3)})`;
      fctx.fillRect(0, 0, W, H);
    }
  }

  /* --- sand: the chart stops being paper ---
     The map is drawn on paper and the beach is made of grains, so the map
     comes apart into grains and they fall and heap up, and the heap is the
     beach you dig in. The red X ends up as flecks in the sand. */
  else if (nat.kind === "sand") {
    if (!nat.seeds) {
      const cell = Math.max(6, Math.round(Math.min(W, H) / 82));
      const cols = Math.ceil(W / cell), rows = Math.ceil(H / cell);
      nat.cell = cell; nat.cols = cols;
      nat.heap = new Float32Array(cols).fill(H);
      nat.seeds = [];
      let img = null;
      if (nat.cap) { try { img = natX.getImageData(0, 0, W, H); } catch (e) {} }
      for (let ry = 0; ry < rows; ry++) {
        for (let rx = 0; rx < cols; rx++) {
          const px = rx * cell + cell * 0.5, py = ry * cell + cell * 0.5;
          let r = 226, g = 208, b = 172, a = 255;
          if (img) {
            const o = ((py | 0) * W + (px | 0)) * 4;
            a = img.data[o + 3];
            if (a > 12) { r = img.data[o]; g = img.data[o + 1]; b = img.data[o + 2]; }
          }
          if (a <= 12) continue;
          /* sand is never one colour; scatter what we sampled a little */
          const j = 0.86 + Math.random() * 0.28;
          nat.seeds.push({ x: px, y: py, ry,
                           /* they fan out on the way down, so what lands is a
                              beach and not a cone */
                           vx: (Math.random() - 0.5) * W * 0.62,
                           vy: 0, col: rx,
                           rep: 0.5 + Math.random() * 0.45,
                           /* the top of the page lets go first, so it pours */
                           de: (ry / rows) * 0.46 + Math.random() * 0.22,
                           c: `rgb(${Math.min(255, r * j) | 0},${Math.min(255, g * j) | 0},${Math.min(255, b * j) | 0})` });
        }
      }
      nat.rows = rows;
      /* Grains that have landed never move again, and grains that have not
         started are still the picture we captured. Only the ones in the air
         need drawing every frame — so landed ones are baked into a pile
         canvas once, and the untouched part of the page is blitted straight
         off the capture. On a phone that is the difference between a
         transition and a slideshow. */
      nat.pile = document.createElement("canvas");
      nat.pile.width = W; nat.pile.height = H;
      nat.pileX = nat.pile.getContext("2d");
    }
    const cell = nat.cell, rows = nat.rows;
    /* the beach's own sky, arriving as the paper leaves */
    const sky = fctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#8fc3dd");
    sky.addColorStop(0.55, "#cfe3e6");
    sky.addColorStop(1, T.sand);
    fctx.globalAlpha = Math.min(1, u * 2.8);
    fctx.fillStyle = sky;
    fctx.fillRect(0, 0, W, H);
    fctx.globalAlpha = 1;
    /* de is (ry/rows)*0.46 + jitter, so every row past this one is certainly
       still sitting where it was drawn — blit it instead of stepping it */
    const staticFrom = Math.ceil((u / 0.46) * rows);
    if (nat.cap && staticFrom < rows) {
      const yTop = Math.max(0, staticFrom * cell - cell);
      try { fctx.drawImage(nat.cap, 0, yTop, W, H - yTop, 0, yTop, W, H - yTop); } catch (e) {}
    }
    fctx.drawImage(nat.pile, 0, 0);
    for (const p of nat.seeds) {
      if (p.done || p.ry >= staticFrom) continue;
      if (u < p.de) {
        fctx.fillStyle = p.c;
        fctx.fillRect(p.x - cell * 0.5, p.y - cell * 0.5, cell + 0.6, cell + 0.6);
        continue;
      }
      p.vy += 980 * dt;
      p.vx *= Math.exp(-1.1 * dt);
      p.y += p.vy * dt;
      p.x += p.vx * dt;
      let c = Math.max(0, Math.min(nat.cols - 1, (p.x / cell) | 0));
      if (p.y >= nat.heap[c] - cell * 0.5) {
        /* Dry sand will not stand steeper than about thirty degrees. A grain
           that lands on a slope rolls downhill until it finds somewhere it
           can stay, which is why a poured heap spreads into a beach instead
           of standing up in a tower. */
        for (let step = 0; step < 60; step++) {
          const l = c > 0 ? nat.heap[c - 1] : Infinity;
          const r = c < nat.cols - 1 ? nat.heap[c + 1] : Infinity;
          const here = nat.heap[c];
          if (l - here < cell * p.rep && r - here < cell * p.rep) break;
          c += (l > r ? -1 : (r > l ? 1 : (Math.random() < 0.5 ? -1 : 1)));
          c = Math.max(0, Math.min(nat.cols - 1, c));
        }
        p.x = c * cell + cell * 0.5;
        p.y = nat.heap[c] - cell * 0.5;
        p.done = true;
        nat.heap[c] -= cell * 0.92;
        nat.pileX.fillStyle = p.c;
        nat.pileX.fillRect(p.x - cell * 0.5, p.y - cell * 0.5, cell + 0.6, cell + 0.6);
        continue;
      }
      fctx.fillStyle = p.c;
      fctx.fillRect(p.x - cell * 0.5, p.y - cell * 0.5, cell + 0.6, cell + 0.6);
    }
    /* and it settles into the beach you are about to be standing on — the
       last frame of this and the first frame of the dig are the same beach */
    const settle = Math.max(0, (u - 0.62) / 0.38);
    if (settle > 0) {
      const horizon = H * 0.42;
      fctx.globalAlpha = Math.min(1, settle * settle * 1.25);
      const sg = fctx.createLinearGradient(0, horizon, 0, H);
      sg.addColorStop(0, "#ded0ab");
      sg.addColorStop(1, "#c9b78e");
      fctx.fillStyle = sg;
      fctx.beginPath();
      fctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 12) {
        const t = x / W;
        fctx.lineTo(x, horizon + Math.sin(t * 7.2) * 5 + Math.sin(t * 3.1 + 1.4) * 9
                              + Math.sin(t * 19.0 + 0.3) * 2);
      }
      fctx.lineTo(W, H);
      fctx.closePath();
      fctx.fill();
      fctx.globalAlpha = 1;
    }
  }

  /* --- rain: the squall that comes in off the sea ---
     A lighthouse and a wood are joined by weather. It drives in, blots the
     frame, and thins out somewhere with trees in it. */
  else if (nat.kind === "rain") {
    if (!nat.seeds) {
      nat.seeds = [];
      const N = Math.round(Math.max(180, Math.min(520, W * H / 2400)));
      for (let i = 0; i < N; i++)
        nat.seeds.push({ x: Math.random() * W * 1.5 - W * 0.3, y: Math.random() * H,
                         len: H * (0.05 + Math.random() * 0.13),
                         sp: 1.1 + Math.random() * 1.5,
                         a: 0.14 + Math.random() * 0.4,
                         de: Math.random() * 0.42 });
      nat.splash = [];
    }
    const heavy = Math.sin(Math.min(1, u / 0.78) * Math.PI);
    const slant = 0.34 + Math.sin(u * 4.1) * 0.16;
    fctx.fillStyle = `rgba(122,136,148,${(Math.pow(heavy, 0.7) * 0.94).toFixed(3)})`;
    fctx.fillRect(0, 0, W, H);
    fctx.lineCap = "round";
    for (const r of nat.seeds) {
      if (u < r.de) continue;
      const t = (u - r.de) * r.sp;
      const y = (r.y + t * H * 3.4) % (H + r.len * 2) - r.len;
      const x = r.x + t * H * 3.4 * slant;
      fctx.strokeStyle = `rgba(226,238,246,${(r.a * heavy).toFixed(3)})`;
      fctx.lineWidth = 1 + r.len / H * 6;
      fctx.beginPath();
      fctx.moveTo(x % (W * 1.4), y);
      fctx.lineTo(x % (W * 1.4) - r.len * slant, y + r.len);
      fctx.stroke();
    }
    /* it lands on something, which is what makes rain sound like rain */
    for (let i = 0; i < 14; i++) {
      const sx = (Math.sin(i * 12.9 + u * 21) * 0.5 + 0.5) * W;
      const sy = H * (0.72 + (Math.sin(i * 7.3 + u * 13) * 0.5 + 0.5) * 0.28);
      const sr = (2 + (i % 4)) * (0.4 + heavy);
      fctx.strokeStyle = `rgba(232,242,248,${(0.20 * heavy).toFixed(3)})`;
      fctx.lineWidth = 1;
      fctx.beginPath(); fctx.ellipse(sx, sy, sr * 2.4, sr * 0.7, 0, 0, 6.3); fctx.stroke();
    }
  }

  if (!nat.fired && u >= nat.at) {
    nat.fired = true;
    const f = nat.after;
    if (nat.at >= 1) { natEnd(); if (f) f(); return false; }
    if (f) f();
    return true;
  }
  if (u >= 1) { natEnd(); return false; }
  return true;
}

const M0 = (W, H) => Math.min(W, H);

function drawLeaf(c, x, y, s, rot, hue, a) {
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  /* leaves are seen edge-on half the time, which is most of the flutter */
  c.scale(1, 0.35 + 0.65 * Math.abs(Math.cos(rot * 1.3)));
  c.globalAlpha = a;
  const g = c.createLinearGradient(-s, -s, s, s);
  g.addColorStop(0, `hsl(${hue},72%,46%)`);
  g.addColorStop(0.5, `hsl(${hue + 8},78%,58%)`);
  g.addColorStop(1, `hsl(${hue - 6},66%,34%)`);
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(0, -s);
  c.quadraticCurveTo(s * 0.9, -s * 0.15, 0, s);
  c.quadraticCurveTo(-s * 0.9, -s * 0.15, 0, -s);
  c.closePath();
  c.fill();
  c.strokeStyle = `hsla(${hue - 10},60%,26%,0.55)`;
  c.lineWidth = Math.max(0.6, s * 0.07);
  c.beginPath(); c.moveTo(0, -s); c.lineTo(0, s); c.stroke();
  c.restore();
  c.globalAlpha = 1;
}

/* --- sound for each --- */
function frostSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  for (let i = 0; i < 40; i++) {
    const t = t0 + Math.random() * 1.7;
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.value = 2600 + Math.random() * 4200;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.016 + Math.random() * 0.012, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05 + Math.random() * 0.09);
    o.connect(g); g.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t); o.stop(t + 0.16);
  }
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5200;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.linearRampToValueAtTime(0.030, t0 + 1.2);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 2.8);
  s.connect(hp); hp.connect(g2); g2.connect(BUS);
  s.start(t0); s.stop(t0 + 3);
}
function cloudSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(240, t0);
  lp.frequency.linearRampToValueAtTime(900, t0 + 1.6);
  lp.frequency.linearRampToValueAtTime(300, t0 + 3.4);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.075, t0 + 1.5);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
  s.connect(lp); lp.connect(g); g.connect(BUS);

}
function washSound() {

function leafSound() {

  const bp = ac.createBiquadFilter(); bp.type = "bandpass";

/* going down a pipe: everything above you gets darker and further off, so
   the filter closes and the reverb opens */
function drainSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.5;
  bp.frequency.setValueAtTime(1500, t0);
  bp.frequency.exponentialRampToValueAtTime(180, t0 + 2.6);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.085, t0 + 0.5);
  g.gain.setValueAtTime(0.085, t0 + 1.8);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 3.3);
  /* the pipe has a note in it, the way pipes do, and it drops as you fall */
  for (const [f, v] of [[196, 0.030], [131, 0.036], [98, 0.028]]) {
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 0.42, t0 + 2.5);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.linearRampToValueAtTime(v, t0 + 0.6);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.0);
    o.connect(og); og.connect(BUS);
    o.start(t0); o.stop(t0 + 3.1);
  }
  /* single drips ringing off the walls, spread across the stereo field */
  for (let i = 0; i < 9; i++) {
    const t = t0 + 0.25 + Math.random() * 2.2;
    const o = ac.createOscillator(); o.type = "sine";
    const f0 = 900 + Math.random() * 1500;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.09);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.030, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    o.connect(og); og.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t); o.stop(t + 0.3);
  }
}

/* gel letting go: a soft low bloop per run, no attack to speak of */
function dripSound() {
  const ac = audio(); if (!ac) return;

  for (let i = 0; i < 16; i++) {
    const t = t0 + Math.random() * 2.0;

    const f0 = 120 + Math.random() * 240;
    o.frequency.setValueAtTime(f0 * 2.1, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.6, t + 0.16 + Math.random() * 0.14);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.036 + Math.random() * 0.02, t + 0.035);

    o.connect(g); g.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t); o.stop(t + 0.4);
  }
  /* the stretch before it goes */
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(700, t0);

/* pouring sand is thousands of tiny impacts — noise high enough up that
   you hear the grains rather than the pour */
function sandSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 1900;
  const bp = ac.createBiquadFilter(); bp.type = "peaking";
  bp.frequency.setValueAtTime(5200, t0);
  bp.frequency.linearRampToValueAtTime(2600, t0 + 3.0);
  bp.gain.value = 7; bp.Q.value = 0.8;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.088, t0 + 0.9);
  g.gain.setValueAtTime(0.088, t0 + 2.0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.4);
  s.connect(hp); hp.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 3.5);
  /* the heap settling under it */
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(74, t0 + 0.6);
  o.frequency.linearRampToValueAtTime(52, t0 + 3.0);
  const og = ac.createGain();
  og.gain.setValueAtTime(0.0001, t0 + 0.6);
  og.gain.linearRampToValueAtTime(0.032, t0 + 1.6);
  og.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.3);
  o.connect(og); og.connect(BUS);
  o.start(t0 + 0.6); o.stop(t0 + 3.4);
}

/* a squall: the bed swells, and individual drops land on top of it */
function rainSound() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 620;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(2200, t0);
  lp.frequency.linearRampToValueAtTime(6800, t0 + 1.5);
  lp.frequency.linearRampToValueAtTime(2400, t0 + 3.4);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.115, t0 + 1.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.6);
  s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 3.7);
  for (let i = 0; i < 26; i++) {
    const t = t0 + 0.3 + Math.random() * 2.4;
    const o = ac.createOscillator(); o.type = "triangle";
    const f0 = 1400 + Math.random() * 2600;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + 0.05);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.012 + Math.random() * 0.010, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(og); og.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t); o.stop(t + 0.1);
  }
}

/* ================= the wood =================
   The beam comes round, cloud takes the frame, and it puts you down in a
   stand of trees at dusk with a wind getting up. Drag your hand through
   them and the wgust follows it — leaves let go where you pass, and go
   over the field. Strip enough of them and the wind takes the lot, and
   you with it. */

let woodOn = false, woodT = 0, trees = [], loose = [], grass = [];
/* the far end of the chain, for now — a place to rest rather than a fall
   back through every earlier scene, which is what happened before */
let chainEnd = false, restT = 0, restLeaves = null;
let wgust = 0, wgustX = 0, wgustY = 0, wgustV = 0, woodDrag = false, stripped = 0, woodHanded = false;
let woodTotal = 0, woodLetGo = false;
let windNode = null;

function startWood() {
  mark("wood");
  if (woodOn) return;
  woodOn = true; woodT = 0; stripped = 0; woodHanded = false; woodLetGo = false;
  loose = [];
  const W = window.innerWidth, H = window.innerHeight;
  const hz = H * 0.72;

  trees = [];
  /* three depths: far ones small, pale and many; near ones big and dark */
  const layers = [
    { n: W < 620 ? 9 : 16, s: 0.16, dark: 0.30, y: hz - H * 0.02 },
    { n: W < 620 ? 5 : 8, s: 0.30, dark: 0.62, y: hz + H * 0.02 },
    { n: W < 620 ? 3 : 4, s: 0.52, dark: 1.00, y: hz + H * 0.07 },
  ];
  layers.forEach((L, li) => {
    for (let i = 0; i < L.n; i++) {
      const x = W * ((i + 0.5 + (rnd() - 0.5) * 0.7) / L.n);
      const hgt = H * L.s * (0.8 + rnd() * 0.45);
      const t = { x, y: L.y, h: hgt, li, dark: L.dark,
                  lean: (rnd() - 0.5) * 0.10, ph: rnd() * 6.3, leaves: [] };
      /* a canopy of clusters, each of which can be shaken loose */
      const NC = li === 2 ? 26 : li === 1 ? 16 : 8;
      for (let k = 0; k < NC; k++) {
        const a = rnd() * Math.PI * 2, rr = Math.pow(rnd(), 0.6);
        t.leaves.push({
          ox: Math.cos(a) * rr * hgt * 0.42,
          oy: -hgt * 0.62 + Math.sin(a) * rr * hgt * 0.34,
          s: hgt * (0.035 + rnd() * 0.030),
          hue: 16 + rnd() * 40, ph: rnd() * 6.3, on: true,
        });
      }
      trees.push(t);
    }
  });
  trees.sort((a, b) => a.li - b.li);

  grass = [];
  for (let i = 0; i < (W < 620 ? 90 : 170); i++)
    grass.push({ x: rnd() * W, y: hz + (H - hz) * (0.10 + rnd() * 0.9),
                 h: H * (0.012 + rnd() * 0.030), ph: rnd() * 6.3,
                 hue: 34 + rnd() * 26 });

  woodTotal = trees.reduce((a, t) => a + t.leaves.length, 0);
  bed("sand");
  woodWind();
}

function woodFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight, hz = H * 0.72;
  woodT += dt;

  /* the wind: three sines that never line up, plus whatever your hand is
     doing to it */
  const base = 0.34 + 0.30 * Math.sin(woodT * 0.31)
             + 0.18 * Math.sin(woodT * 0.77 + 1.3)
             + 0.10 * Math.sin(woodT * 1.9 + 3.1);
  wgust = base + Math.min(1.6, wgustV * 0.004);
  wgustV *= Math.exp(-2.4 * dt);
  if (windNode && AC)
    windNode.g.gain.setTargetAtTime(0.020 + wgust * 0.055, AC.currentTime, 0.2);

  hardClear(finCanvas, fctx);

  /* ---- dusk ---- */
  const sky = fctx.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, "#16283c");
  sky.addColorStop(0.48, "#3b4a56");
  sky.addColorStop(0.80, "#9a7f62");
  sky.addColorStop(1, "#d9a86a");
  fctx.fillStyle = sky; fctx.fillRect(0, 0, W, hz + 2);
  /* a low sun somewhere behind the trunks */
  const sg = fctx.createRadialGradient(W * 0.72, hz - H * 0.03, 0, W * 0.72, hz, H * 0.34);
  sg.addColorStop(0, "rgba(255,214,150,0.55)");
  sg.addColorStop(1, "rgba(255,180,110,0)");
  fctx.fillStyle = sg; fctx.fillRect(0, 0, W, hz + 2);

  /* ---- ground ---- */
  const gr = fctx.createLinearGradient(0, hz, 0, H);
  gr.addColorStop(0, "#4a3a26");
  gr.addColorStop(0.4, "#33281a");
  gr.addColorStop(1, "#1c1610");
  fctx.fillStyle = gr; fctx.fillRect(0, hz, W, H - hz);

  /* ---- the trees ---- */
  for (const t of trees) {
    const sway = Math.sin(woodT * (0.7 + t.li * 0.2) + t.ph) * wgust * (0.05 + t.li * 0.03);
    const lean = t.lean + sway;
    fctx.save();
    fctx.translate(t.x, t.y);
    /* trunk: tapered, leaning with the wind, with a couple of limbs */
    const trunk = (x0, y0, x1, y1, w0, w1) => {
      fctx.beginPath();
      fctx.moveTo(x0 - w0, y0);
      fctx.lineTo(x1 - w1, y1);
      fctx.lineTo(x1 + w1, y1);
      fctx.lineTo(x0 + w0, y0);
      fctx.closePath();
      fctx.fill();
    };
    const shade = 0.10 + 0.16 * (1 - t.dark);
    fctx.fillStyle = `rgba(${(30 + shade * 190) | 0},${(24 + shade * 170) | 0},${(18 + shade * 150) | 0},${(0.45 + t.dark * 0.55).toFixed(2)})`;
    const tipX = Math.sin(lean) * t.h * 0.55, tipY = -t.h * 0.62;
    trunk(0, 0, tipX, tipY, t.h * 0.035, t.h * 0.014);
    for (const side of [-1, 1]) {
      const bx = tipX * 0.55, by = tipY * 0.55;
      trunk(bx, by, bx + side * t.h * 0.26 + tipX * 0.3, by - t.h * 0.24,
            t.h * 0.016, t.h * 0.006);
    }
    /* what is still attached */
    for (const l of t.leaves) {
      if (!l.on) continue;
      const flut = Math.sin(woodT * (2.2 + t.li) + l.ph) * wgust * t.h * 0.020;
      drawLeaf(fctx, l.ox + Math.sin(lean) * (-l.oy) * 0.9 + flut,
               l.oy + Math.cos(woodT * 1.7 + l.ph) * wgust * t.h * 0.010,
               l.s, l.ph + woodT * 0.6 + flut * 0.05,
               l.hue, 0.35 + t.dark * 0.65);
    }
    fctx.restore();
  }

  /* ---- grass, bending ---- */
  fctx.lineCap = "round";
  for (const g of grass) {
    const d = (g.y - hz) / Math.max(1, H - hz);
    const bend = wgust * (12 + d * 26) + Math.sin(woodT * 2.4 + g.ph) * wgust * 7;
    fctx.strokeStyle = `hsla(${g.hue},${28 + d * 16}%,${16 + d * 16}%,${(0.5 + d * 0.5).toFixed(2)})`;
    fctx.lineWidth = Math.max(1, g.h * 0.10);
    fctx.beginPath();
    fctx.moveTo(g.x, g.y);
    fctx.quadraticCurveTo(g.x + bend * 0.4, g.y - g.h * 0.6, g.x + bend, g.y - g.h);
    fctx.stroke();
  }

  /* ---- loose leaves ---- */
  for (let i = loose.length - 1; i >= 0; i--) {
    const l = loose[i];
    l.vx += (wgust * 190 - l.vx) * 1.4 * dt + Math.sin(woodT * 3 + l.ph) * 40 * dt;
    l.vy += (34 - l.vy * 0.6) * dt * 2 + Math.sin(woodT * 2.3 + l.ph * 2) * 30 * dt;
    /* whatever your hand is doing, they feel it */
    if (woodDrag) {
      const dx = l.x - wgustX, dy = l.y - wgustY, d2 = dx * dx + dy * dy;
      const R2 = Math.pow(Math.min(W, H) * 0.22, 2);
      if (d2 < R2) {
        const f = (1 - d2 / R2);
        l.vx += (dx * 0.9 + 260) * f * dt * 3;
        l.vy += (dy * 0.6 - 120) * f * dt * 3;
      }
    }
    l.x += l.vx * dt; l.y += l.vy * dt;
    l.rot += l.spin * dt * (0.6 + wgust);
    if (l.x > W + 60) l.x = -50;
    if (l.x < -60) l.x = W + 50;
    if (l.y > H + 40) { l.y = H + 30; l.vy = -Math.abs(l.vy) * 0.2; }
    drawLeaf(fctx, l.x, l.y, l.s, l.rot, l.hue, 0.95);
  }

  /* ---- what your hand is doing to the air ---- */
  if (woodDrag) {
    fctx.save();
    fctx.globalCompositeOperation = "lighter";
    const g2 = fctx.createRadialGradient(wgustX, wgustY, 0, wgustX, wgustY, Math.min(W, H) * 0.2);
    g2.addColorStop(0, "rgba(255,236,200,0.055)");
    g2.addColorStop(1, "rgba(255,220,170,0)");
    fctx.fillStyle = g2;
    fctx.fillRect(wgustX - W, wgustY - H, W * 2, H * 2);
    fctx.restore();
  }

  /* a nudge if they are just watching */
  const still = trees.reduce((a, t) => a + t.leaves.filter(l => l.on).length, 0);
  if (woodT > 5 && stripped < 3) {
    const p = 0.5 + 0.5 * Math.sin(woodT * 1.9);
    fctx.strokeStyle = `rgba(255,232,190,${(0.06 + 0.10 * p).toFixed(3)})`;
    fctx.lineWidth = Math.max(4, Math.min(W, H) * 0.010);
    fctx.beginPath();
    const cx = W * 0.5 + Math.sin(woodT * 0.8) * W * 0.22;
    fctx.moveTo(cx - W * 0.10, H * 0.42);
    fctx.quadraticCurveTo(cx, H * 0.40, cx + W * 0.10, H * 0.42);
    fctx.stroke();
  }

  /* Hunting the last leaf on the last tree is work, not pleasure. Once most
     of the canopy is down the wind finishes the job — the remainder lets go
     on its own, which is what wind does anyway. */
  if (woodTotal && still > 0 && still <= woodTotal * 0.16 && !woodLetGo) {
    woodLetGo = true;
    for (const t of trees) for (const l of t.leaves) {
      if (!l.on) continue;
      l.on = false; stripped++;
      loose.push({ x: t.x + l.ox, y: t.y + l.oy, s: l.s, hue: l.hue, ph: l.ph,
                   rot: Math.random() * 6.3, spin: (Math.random() - 0.5) * 7,
                   vx: 90 + Math.random() * 160, vy: -50 - Math.random() * 110 });
    }
    wgustV = Math.max(wgustV, 260);
  }
  if (still === 0 && !woodHanded) {
    woodHanded = true;
    release("wood"); setTimeout(() => natRun("leaf", () => { woodOn = false; startRiver(); }, 3.4, { at: 0.60 }), 700);
  }
  natFrame(dt);
}

/* ================= the moon, the pan, and the spin =================
   You get across the water and the light goes. The sun finishes going down,
   the stars come back, and a moon comes up over the far bank and lays a
   second road on the river beside the one the sun left.

   Then it falls out of the sky.

   It lands in a pan, because at that size and that colour it was never
   really a moon. Cook it, flip it, and the handle comes off in your hand and
   the whole thing starts to turn — and a pan turning with an egg on it is a
   sheet of paper on a spinner, which is the oldest and best thing you can do
   with paint and a motor. */

let panOn = false, panT = 0, panPhase = 0, heat = 0, cook = 0;
let eggY = -0.3, eggV = 0, eggSpin = 0, eggFlip = 0, flipGrab = null;
let spinA = 0, spinV = 0, handleGo = 0, pours = [], picked = 0, poured = 0;
let spinC = null, spinX = null, panIdle = 0, panDone = 0, chips = [];
const PAINTS = [
  ["#e8484c", 1.00], ["#3b82f6", 0.84], ["#f2c230", 1.18],
  ["#22c08a", 0.92], ["#a855f7", 0.76],
];

function panGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const R = Math.min(W * 0.30, H * 0.34);
  return { W, H, cx: W * 0.5, cy: H * 0.52, R, squash: 0.62 };
}

function startPan() {
  mark("pan");
  if (panOn) return;
  panOn = true; panT = 0; panPhase = 0;
  heat = 0; cook = 0; panIdle = 0; panDone = 0;
  eggY = -0.35; eggV = 0; eggSpin = 0; eggFlip = 0; flipGrab = null;
  spinA = 0; spinV = 0; handleGo = 0; pours = []; picked = 0; poured = 0;
  const G = panGeom();
  spinC = document.createElement("canvas");
  spinC.width = spinC.height = Math.round(G.R * 2.2);
  spinX = spinC.getContext("2d");
  /* four to choose from, never the same four twice */
  chips = PAINTS.slice().sort(() => rnd() - 0.5).slice(0, 4);
  finCanvas.style.background = "#07070a";
  finCanvas.style.display = "block";
  sizeFinale();
  finCanvas.style.cursor = "pointer";
  bed("night");
  panRoom();
}

/* ---------- the pan ---------- */
function drawPan(G, showHandle) {
  const { cx, cy, R, squash } = G;
  /* what is under it, lit by the flame */
  const und = fctx.createRadialGradient(cx, cy + R * 0.5, 0, cx, cy + R * 0.5, R * 2.4);
  und.addColorStop(0, `rgba(255,140,52,${(0.20 * heat).toFixed(3)})`);
  und.addColorStop(0.4, `rgba(200,80,30,${(0.07 * heat).toFixed(3)})`);
  und.addColorStop(1, "rgba(120,40,20,0)");
  fctx.fillStyle = und;
  fctx.fillRect(0, 0, G.W, G.H);

  if (showHandle > 0.001) {
    fctx.save();
    fctx.globalAlpha = showHandle;
    fctx.translate(cx, cy);
    fctx.rotate(-0.16 + (1 - showHandle) * 0.5);
    const hl = R * 1.55, hw = R * 0.115;
    const hg = fctx.createLinearGradient(0, -hw, 0, hw);
    hg.addColorStop(0, "#4c4a48");
    hg.addColorStop(0.45, "#26241f");
    hg.addColorStop(1, "#131110");
    fctx.fillStyle = hg;
    fctx.beginPath();
    fctx.roundRect(R * 0.86, -hw * 0.5, hl, hw, hw * 0.5);
    fctx.fill();
    fctx.fillStyle = "rgba(210,200,186,0.10)";
    fctx.beginPath();
    fctx.roundRect(R * 0.9, -hw * 0.42, hl * 0.9, hw * 0.22, hw * 0.11);
    fctx.fill();
    fctx.restore();
  }

  /* the body: an iron dish seen from above and a little to one side */
  const bg = fctx.createLinearGradient(cx, cy - R * squash, cx, cy + R * squash);
  bg.addColorStop(0, "#3a3733");
  bg.addColorStop(0.5, "#211f1c");
  bg.addColorStop(1, "#131110");
  fctx.fillStyle = bg;
  fctx.beginPath();
  fctx.ellipse(cx, cy, R, R * squash, 0, 0, 6.3);
  fctx.fill();
  /* the lip, catching what light there is */
  fctx.strokeStyle = "rgba(196,186,170,0.16)";
  fctx.lineWidth = Math.max(2, R * 0.035);
  fctx.beginPath();
  fctx.ellipse(cx, cy, R * 0.985, R * squash * 0.985, 0, 0, 6.3);
  fctx.stroke();
  fctx.strokeStyle = `rgba(255,168,90,${(0.30 * heat).toFixed(3)})`;
  fctx.lineWidth = Math.max(1.5, R * 0.020);
  fctx.beginPath();
  fctx.ellipse(cx, cy, R * 0.985, R * squash * 0.985, 0, 0.4, Math.PI - 0.4);
  fctx.stroke();
  /* the floor of it, darker, with the seasoning showing */
  const fg = fctx.createRadialGradient(cx - R * 0.2, cy - R * squash * 0.3, 0,
                                       cx, cy, R * 0.92);
  fg.addColorStop(0, "#2b2823");
  fg.addColorStop(1, "#15130f");
  fctx.fillStyle = fg;
  fctx.beginPath();
  fctx.ellipse(cx, cy, R * 0.86, R * squash * 0.86, 0, 0, 6.3);
  fctx.fill();
}

function drawFlame(G) {
  if (heat < 0.01) return;
  const { cx, cy, R } = G;
  const n = 17;
  fctx.save();
  fctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const rr = R * 0.94;
    const x = cx + Math.cos(a) * rr, y = cy + R * G.squash * 0.58 + Math.sin(a) * rr * G.squash * 0.34;
    const wob = Math.sin(panT * 9 + i * 1.7) * 0.5 + 0.5;
    const h = R * (0.14 + 0.30 * heat) * (0.6 + wob * 0.7);
    const fg = fctx.createLinearGradient(x, y, x, y - h);
    fg.addColorStop(0, `rgba(120,170,255,${(0.16 * heat).toFixed(3)})`);
    fg.addColorStop(0.25, `rgba(255,150,50,${(0.34 * heat).toFixed(3)})`);
    fg.addColorStop(0.62, `rgba(255,196,96,${(0.20 * heat).toFixed(3)})`);
    fg.addColorStop(1, "rgba(255,230,160,0)");
    fctx.fillStyle = fg;
    fctx.beginPath();
    fctx.moveTo(x - h * 0.30, y + h * 0.10);
    fctx.bezierCurveTo(x - h * 0.34, y - h * 0.42, x - h * 0.10, y - h * 0.62, x, y - h);
    fctx.bezierCurveTo(x + h * 0.10, y - h * 0.62, x + h * 0.34, y - h * 0.42, x + h * 0.30, y + h * 0.10);
    fctx.quadraticCurveTo(x, y + h * 0.30, x - h * 0.30, y + h * 0.10);
    fctx.closePath();
    fctx.fill();
  }
  fctx.restore();
}

/* the egg: a white that spreads and sets, and a yolk that domes */
function drawEgg(G, ex, ey, sc, done) {
  const { R } = G;
  const spread = 0.55 + 0.45 * Math.min(1, cook * 1.3);
  const wr = R * 0.54 * spread * sc;
  fctx.save();
  fctx.translate(ex, ey);
  fctx.scale(1, G.squash * 1.28);
  /* the white — clear and blue at first, opaque as it sets */
  const set = Math.min(1, cook * 1.5);
  fctx.fillStyle = `rgba(${(228 + 27 * set) | 0},${(232 + 22 * set) | 0},${(238 + 10 * set) | 0},${(0.34 + 0.62 * set).toFixed(3)})`;
  const lobes = 11;
  const rAt = (i) => {
    const a = (i / lobes) * Math.PI * 2;
    return wr * (0.82 + 0.24 * Math.sin(a * 2.3 + 1.1) * Math.sin(a * 1.3 + 0.4));
  };
  const pathWhite = () => {
    fctx.beginPath();
    for (let i = 0; i <= lobes; i++) {
      const a0 = (i / lobes) * Math.PI * 2, a1 = ((i + 1) / lobes) * Math.PI * 2;
      const r0 = rAt(i), r1 = rAt(i + 1);
      const x0 = Math.cos(a0) * r0, y0 = Math.sin(a0) * r0;
      const x1 = Math.cos(a1) * r1, y1 = Math.sin(a1) * r1;
      const am = (a0 + a1) / 2, rm = (r0 + r1) / 2 * 1.06;
      if (i === 0) fctx.moveTo(x0, y0);
      fctx.quadraticCurveTo(Math.cos(am) * rm, Math.sin(am) * rm, x1, y1);
    }
    fctx.closePath();
  };
  pathWhite();
  fctx.fill();
  /* the lace round the edge, which is the whole pleasure of a fried egg */
  if (cook > 0.45) {
    const l = (cook - 0.45) / 0.55;
    fctx.strokeStyle = `rgba(${(196 - 40 * l) | 0},${(140 - 46 * l) | 0},${(70 - 24 * l) | 0},${(0.5 * l).toFixed(3)})`;
    fctx.lineWidth = wr * 0.045 * (0.5 + l);
    pathWhite();
    fctx.stroke();
  }
  fctx.restore();

  if (done) return;
  /* the yolk */
  const yr = R * 0.20 * sc;
  const yg = fctx.createRadialGradient(ex - yr * 0.35, ey - yr * 0.45, 0, ex, ey, yr * 1.25);
  yg.addColorStop(0, "#ffe07a");
  yg.addColorStop(0.5, "#f6ae2d");
  yg.addColorStop(1, "#d4831a");
  fctx.fillStyle = yg;
  fctx.beginPath();
  fctx.ellipse(ex, ey, yr, yr * (0.86 + 0.14 * G.squash), 0, 0, 6.3);
  fctx.fill();
  fctx.fillStyle = "rgba(255,252,230,0.55)";
  fctx.beginPath();
  fctx.ellipse(ex - yr * 0.34, ey - yr * 0.40, yr * 0.26, yr * 0.17, -0.5, 0, 6.3);
  fctx.fill();
}

function panFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  const G = panGeom();
  panT += dt;
  hardClear(finCanvas, fctx);

  /* the room: almost nothing, so the pan is the only thing in it */
  const room = fctx.createRadialGradient(G.cx, G.cy, 0, G.cx, G.cy, Math.max(W, H) * 0.8);
  room.addColorStop(0, "#14141a");
  room.addColorStop(1, "#050508");
  fctx.fillStyle = room;
  fctx.fillRect(0, 0, W, H);

  /* ---------- 0: it comes down out of the sky ---------- */
  if (panPhase === 0) {
    drawFlame(G);
    drawPan(G, 1);
    eggV += 2.1 * dt;
    eggY += eggV * dt;
    const ey = G.cy + (eggY - 1) * H * 0.55;
    /* still a moon on the way down, an egg by the time it lands */
    const land = Math.max(0, Math.min(1, (eggY - 0.55) / 0.45));
    const mr = Math.min(W, H) * 0.052 * (1 - land * 0.25);
    const gl = fctx.createRadialGradient(G.cx, ey, 0, G.cx, ey, mr * 6);
    gl.addColorStop(0, `rgba(226,236,255,${(0.30 * (1 - land)).toFixed(3)})`);
    gl.addColorStop(1, "rgba(160,190,240,0)");
    fctx.fillStyle = gl;
    fctx.beginPath(); fctx.arc(G.cx, ey, mr * 6, 0, 6.3); fctx.fill();
    const cr = (244 + (246 - 244) * land) | 0;
    fctx.fillStyle = `rgb(${cr},${(246 - 40 * land) | 0},${(252 - 130 * land) | 0})`;
    fctx.beginPath(); fctx.arc(G.cx, ey, mr, 0, 6.3); fctx.fill();
    if (eggY >= 1) {
      panPhase = 1; eggY = 1; panIdle = 0;
      eggLand();
    }
    natFrame(dt);
    return;
  }

  /* ---------- 1 and 2: cooking ---------- */
  drawFlame(G);
  drawPan(G, panPhase < 3 ? 1 : 1 - handleGo);

  if (panPhase === 1 || panPhase === 2) {
    cook = Math.min(1, cook + heat * dt * 0.20);
    sizzleLevel(heat * (0.35 + cook * 0.65));
    drawEgg(G, G.cx, G.cy - G.R * 0.04, 1, false);
    if (cook >= 1 && panPhase === 1) { panPhase = 2; panIdle = 0; readyChime(); }

    panIdle += dt;
    /* nothing has been touched: the flame wants turning up */
    if (heat < 0.05 && panIdle > 3.2) {
      const p = 0.5 + 0.5 * Math.sin(panT * 2.2);
      fctx.strokeStyle = `rgba(255,178,96,${(0.10 + 0.16 * p).toFixed(3)})`;
      fctx.lineWidth = Math.max(2, G.R * 0.035);
      fctx.beginPath();
      fctx.ellipse(G.cx, G.cy + G.R * G.squash * 1.02, G.R * (0.66 + 0.07 * p),
                   G.R * 0.10 * (0.66 + 0.07 * p), 0, 0.15, Math.PI - 0.15);
      fctx.stroke();
    }
    /* it is cooked: it wants turning over */
    if (panPhase === 2) {
      const p = 0.5 + 0.5 * Math.sin(panT * 2.4);
      fctx.save();
      fctx.strokeStyle = `rgba(246,238,214,${(0.12 + 0.20 * p).toFixed(3)})`;
      fctx.lineWidth = Math.max(2.5, G.R * 0.030);
      fctx.lineCap = "round";
      const ax = G.cx, ay = G.cy - G.R * 0.10 - p * G.R * 0.14;
      fctx.beginPath();
      fctx.moveTo(ax, ay + G.R * 0.30);
      fctx.lineTo(ax, ay - G.R * 0.22);
      fctx.moveTo(ax - G.R * 0.13, ay - G.R * 0.06);
      fctx.lineTo(ax, ay - G.R * 0.23);
      fctx.lineTo(ax + G.R * 0.13, ay - G.R * 0.06);
      fctx.stroke();
      fctx.restore();
    }
    natFrame(dt);
    return;
  }

  /* ---------- 3: over it goes ---------- */
  if (panPhase === 3) {
    eggFlip = Math.min(1, eggFlip + dt * 0.85);
    const e = eggFlip;
    const arc = Math.sin(e * Math.PI);
    const ey = G.cy - G.R * 0.04 - arc * G.R * 1.5;
    const sc = 1 + arc * 0.12;
    eggSpin = e * Math.PI * 2;
    fctx.save();
    fctx.translate(G.cx, ey);
    /* it turns over, which on this camera means squashing through nothing */
    fctx.scale(1, Math.cos(eggSpin) >= 0 ? 1 : -1);
    fctx.scale(1, Math.max(0.06, Math.abs(Math.cos(eggSpin))));
    fctx.translate(-G.cx, -ey);
    drawEgg(G, G.cx, ey, sc, false);
    fctx.restore();
    if (e >= 1) {
      panPhase = 4; spinV = 0.15; eggSlap(); handleOff();
      /* it does not start blank. What is already on the pan is the first
         thing the spin gets hold of. */
      const c = spinC.width / 2, wr = G.R * 0.54;
      spinX.save();
      spinX.translate(c, c);
      spinX.fillStyle = "#f4f1e6";
      spinX.beginPath();
      for (let i = 0; i <= 11; i++) {
        const a0 = (i / 11) * Math.PI * 2, a1 = ((i + 1) / 11) * Math.PI * 2;
        const rr0 = wr * (0.82 + 0.24 * Math.sin(a0 * 2.3 + 1.1) * Math.sin(a0 * 1.3 + 0.4));
        const rr1 = wr * (0.82 + 0.24 * Math.sin(a1 * 2.3 + 1.1) * Math.sin(a1 * 1.3 + 0.4));
        const am = (a0 + a1) / 2, rm = (rr0 + rr1) / 2 * 1.06;
        if (i === 0) spinX.moveTo(Math.cos(a0) * rr0, Math.sin(a0) * rr0);
        spinX.quadraticCurveTo(Math.cos(am) * rm, Math.sin(am) * rm,
                               Math.cos(a1) * rr1, Math.sin(a1) * rr1);
      }
      spinX.closePath(); spinX.fill();
      spinX.fillStyle = "#f0ab24";
      spinX.beginPath(); spinX.arc(0, 0, G.R * 0.20, 0, 6.3); spinX.fill();
      spinX.restore();
    }
    natFrame(dt);
    return;
  }

  /* ---------- 4: it turns, and you paint on it ---------- */
  handleGo = Math.min(1, handleGo + dt * 0.6);
  heat = Math.max(0, heat - dt * 0.9);   /* it has come off the burner */
  spinV = Math.min(4.4, spinV + dt * (poured >= 3 ? 2.4 : 0.42));
  spinA += spinV * dt;
  spinLevel(Math.min(1, spinV / 4.4));

  /* the paint, held in the disc's own frame so it turns with it */
  for (let i = pours.length - 1; i >= 0; i--) {
    const p = pours[i];
    p.life -= dt;
    if (p.life <= 0) { pours.splice(i, 1); continue; }
    /* the dropper does not move; the disc moves under it, which is what
       draws the spiral */
    const dx = p.sx - G.cx, dy = (p.sy - G.cy) / G.squash;
    const rr = Math.hypot(dx, dy), aa = Math.atan2(dy, dx) - spinA;
    const fling = 1 + (p.age) * 0.10;
    const lx = spinC.width / 2 + Math.cos(aa) * rr * fling;
    const ly = spinC.height / 2 + Math.sin(aa) * rr * fling;
    const rad = G.R * 0.062 * (0.30 + p.life / p.total * 1.0);
    spinX.strokeStyle = p.col;
    spinX.fillStyle = p.col;
    spinX.lineCap = "round";
    spinX.lineJoin = "round";
    if (p.lx !== undefined) {
      /* joined up, or it reads as a string of beads instead of a trail */
      spinX.lineWidth = rad * 2;
      spinX.beginPath();
      spinX.moveTo(p.lx, p.ly);
      spinX.lineTo(lx, ly);
      spinX.stroke();
    } else {
      spinX.beginPath();
      spinX.arc(lx, ly, rad * 1.5, 0, 6.3);
      spinX.fill();
    }
    p.lx = lx; p.ly = ly;
    p.age += dt;
  }

  /* the disc */
  fctx.save();
  fctx.translate(G.cx, G.cy);
  fctx.scale(1, G.squash);
  fctx.beginPath(); fctx.arc(0, 0, G.R * 0.86, 0, 6.3); fctx.clip();
  const face = fctx.createRadialGradient(-G.R * 0.2, -G.R * 0.25, 0, 0, 0, G.R * 0.9);
  face.addColorStop(0, "#2b2823");
  face.addColorStop(1, "#141210");
  fctx.fillStyle = face;
  fctx.fillRect(-G.R, -G.R, G.R * 2, G.R * 2);
  fctx.rotate(spinA);
  fctx.drawImage(spinC, -spinC.width / 2, -spinC.height / 2);
  fctx.restore();
  /* the pan's own rim over the top of it */
  fctx.strokeStyle = "rgba(196,186,170,0.16)";
  fctx.lineWidth = Math.max(2, G.R * 0.035);
  fctx.beginPath();
  fctx.ellipse(G.cx, G.cy, G.R * 0.985, G.R * G.squash * 0.985, 0, 0, 6.3);
  fctx.stroke();

  /* the colours to choose from, down the side */
  const chH = Math.min(H * 0.11, G.R * 0.34);
  for (let i = 0; i < chips.length; i++) {
    const x = W * 0.5 - (chips.length - 1) * chH * 0.9 + i * chH * 1.8;
    const y = H - chH * 1.5;
    const on = i === picked;
    fctx.save();
    fctx.translate(x, y);
    fctx.scale(on ? 1.18 : 1, on ? 1.18 : 1);
    fctx.fillStyle = chips[i][0];
    fctx.beginPath();
    fctx.moveTo(0, -chH * 0.62);
    fctx.quadraticCurveTo(chH * 0.40, -chH * 0.10, chH * 0.30, chH * 0.30);
    fctx.quadraticCurveTo(0, chH * 0.66, -chH * 0.30, chH * 0.30);
    fctx.quadraticCurveTo(-chH * 0.40, -chH * 0.10, 0, -chH * 0.62);
    fctx.closePath();
    fctx.fill();
    fctx.fillStyle = "rgba(255,255,255,0.35)";
    fctx.beginPath();
    fctx.ellipse(-chH * 0.11, -chH * 0.16, chH * 0.09, chH * 0.16, -0.4, 0, 6.3);
    fctx.fill();
    if (on) {
      fctx.strokeStyle = "rgba(255,255,255,0.55)";
      fctx.lineWidth = Math.max(1.5, chH * 0.06);
      fctx.beginPath(); fctx.arc(0, 0, chH * 0.78, 0, 6.3); fctx.stroke();
    }
    fctx.restore();
  }

  /* a nudge, if they have not put anything on it */
  if (poured === 0 && panT > 2 && spinV > 0.6) {
    const p = 0.5 + 0.5 * Math.sin(panT * 2.2);
    fctx.strokeStyle = `rgba(240,240,246,${(0.08 + 0.14 * p).toFixed(3)})`;
    fctx.lineWidth = Math.max(2, G.R * 0.022);
    fctx.setLineDash([6, 10]);
    fctx.beginPath();
    fctx.moveTo(W * 0.5, H - chH * 2.6);
    fctx.lineTo(W * 0.5, G.cy + G.R * G.squash * 0.5);
    fctx.stroke();
    fctx.setLineDash([]);
  }

  /* ---------- and it all runs together ---------- */
  if (poured >= 3) {
    panDone += dt;
    if (panDone > 1.2) {
      const b = Math.min(1, (panDone - 1.2) / 2.4);
      fctx.fillStyle = `rgba(250,250,252,${(b * b).toFixed(3)})`;
      fctx.fillRect(0, 0, W, H);
      if (b >= 1 && panPhase === 4) {
        panPhase = 5;
        release("pan");
        panOn = false;
        /* everything ran together and came back down as a card */
        startBingo();
      }
    }
  }
  natFrame(dt);
}

/* ---------- the hands on it ---------- */
window.addEventListener("pointerdown", (e) => {
  if (!panOn) return;
  const G = panGeom();
  panIdle = 0;
  if (panPhase === 1 || panPhase === 2) {
    /* a tap turns the flame up; a drag up flips it once it is ready */
    if (panPhase === 2) flipGrab = { y: e.clientY };
    if (heat < 1) { heat = Math.min(1, heat + 0.34); flameUp(heat); }
    return;
  }
  if (panPhase === 4) {
    const chH = Math.min(G.H * 0.11, G.R * 0.34);
    const cy = G.H - chH * 1.5;
    if (Math.abs(e.clientY - cy) < chH) {
      for (let i = 0; i < chips.length; i++) {
        const x = G.W * 0.5 - (chips.length - 1) * chH * 0.9 + i * chH * 1.8;
        if (Math.abs(e.clientX - x) < chH * 0.9) { picked = i; pickTick(); return; }
      }
    }
    /* on the disc: paint */
    const dx = e.clientX - G.cx, dy = (e.clientY - G.cy) / G.squash;
    if (Math.hypot(dx, dy) < G.R * 0.84) {
      pours.push({ sx: e.clientX, sy: e.clientY, col: chips[picked][0],
                   life: 1.5, total: 1.5, age: 0 });
      poured++;
      plip(chips[picked][1], e.clientX);
    }
  }
}, { passive: true });

window.addEventListener("pointermove", (e) => {
  if (!panOn || !flipGrab) return;
  if (flipGrab.y - e.clientY > 46 && panPhase === 2) {
    flipGrab = null;
    panPhase = 3; eggFlip = 0;
    flipWhoosh();
  }
}, { passive: true });
window.addEventListener("pointerup", () => {
  if (!panOn || !flipGrab) return;
  /* a tap on a cooked egg turns it over too — everything here takes a tap */
  flipGrab = null;
  if (panPhase === 2) { panPhase = 3; eggFlip = 0; flipWhoosh(); }
}, { passive: true });

/* ---------- sound ---------- */
let sizNode = null, spinNode = null;
function panRoom() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* the sizzle, sitting at zero until there is heat under it */
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 2400;
  const pk = ac.createBiquadFilter(); pk.type = "peaking";
  pk.frequency.value = 5200; pk.gain.value = 6; pk.Q.value = 0.7;
  const g = ac.createGain(); g.gain.value = 0.0001;
  s.connect(hp); hp.connect(pk); pk.connect(g); g.connect(BUS);
  s.start(t0);
  sizNode = { g };
  hold("pan", { gain: g, src: s });
  /* and the burner under it */
  const b = ac.createBufferSource(); b.buffer = noise(ac); b.loop = true;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 260;
  const bg = ac.createGain(); bg.gain.value = 0.0001;
  b.connect(lp); lp.connect(bg); bg.connect(BUS);
  b.start(t0);
  spinNode = { burner: bg };
  hold("pan", { gain: bg, src: b });
}
function sizzleLevel(v) {
  if (!sizNode || !AC) return;
  try {
    sizNode.g.gain.setTargetAtTime(0.001 + v * 0.075, AC.currentTime, 0.25);
    if (spinNode) spinNode.burner.gain.setTargetAtTime(0.001 + heat * 0.045, AC.currentTime, 0.3);
  } catch (e) {}
}
function spinLevel(v) {
  if (!sizNode || !AC) return;
  try { sizNode.g.gain.setTargetAtTime(0.004 + v * 0.030, AC.currentTime, 0.3); } catch (e) {}
  if (spinNode) { try { spinNode.burner.gain.setTargetAtTime(0.004 + v * 0.055, AC.currentTime, 0.3); } catch (e) {} }
}
function flameUp(h) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.setValueAtTime(320, t0);
  bp.frequency.exponentialRampToValueAtTime(1100, t0 + 0.28);
  bp.Q.value = 0.8;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.09, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.55);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(120 + h * 90, t0);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.030, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  o.connect(g2); g2.connect(BUS); o.start(t0); o.stop(t0 + 0.24);
}
function eggLand() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.22, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.36);
}
function readyChime() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [659, 988].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.09);
    g.gain.linearRampToValueAtTime(0.042, t0 + i * 0.09 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.09 + 1.2);
    o.connect(g); g.connect(BUS); o.start(t0 + i * 0.09); o.stop(t0 + i * 0.09 + 1.3);
  });
}
function flipWhoosh() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
  bp.frequency.setValueAtTime(500, t0);
  bp.frequency.exponentialRampToValueAtTime(2400, t0 + 0.5);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.07, t0 + 0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.85);
}
function eggSlap() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.34, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  s.connect(lp); lp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.28);
}
function handleOff() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [1244, 1864, 2489].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.030 / (i + 1), t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);
    o.connect(g); g.connect(BUS); o.start(t0); o.stop(t0 + 1.9);
  });
}
function pickTick() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); o.type = "triangle"; o.frequency.value = 1320;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.030, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.10);
  o.connect(g); g.connect(BUS); o.start(t0); o.stop(t0 + 0.12);
}
function plip(rate, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(880 * rate, t0);
  o.frequency.exponentialRampToValueAtTime(300 * rate, t0 + 0.13);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.055, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
  o.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 0.42);
}

/* ================= the card =================
   The spin runs everything together and it comes back down as a bingo card:
   the grid rules itself in, then the letters and the numbers fall out of the
   sky and land in it.

   There is a key down the side. B has a number, I has a number, and so on —
   and past O it keeps going, K, E, V. Five daubs makes a bingo.

   The line across the middle of the card is B, I, N, G, O. It is a real
   line, it is the obvious thing to do, and it is not the answer. */

let bgOn = false, bgT = 0, bgPhase = 0, bgCells = [], bgKey = [], bgDaub = [];
let bgWin = [], bgDecoy = [], bgMsg = 0, bgMsgKind = 0, bgHint = 0;
let bgConf = [], bgIdle = 0, bgDone = 0;
const BG_LETTERS = ["B", "I", "N", "G", "O"];
const KEY_LETTERS = ["B", "I", "N", "G", "O", "K", "E", "V"];
const KEVIN = ["K", "E", "V", "I", "N"];

function bgGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const tall = H > W * 1.05;
  /* the key sits beside the card on a wide screen and under it on a tall one */
  const cell = tall ? Math.min(W * 0.90 / 5, H * 0.50 / 6)
                    : Math.min(W * 0.56 / 5, H * 0.84 / 6);
  const cardW = cell * 5;
  const cardH = cell * 6;                       /* five rows and a header */
  const cx = tall ? W * 0.5 : W * 0.36;
  const cy = tall ? H * 0.36 : H * 0.5;
  const x0 = cx - cardW / 2, y0 = cy - cardH / 2;
  const keyX = tall ? W * 0.5 : cx + cardW / 2 + Math.min(W * 0.06, 60);
  const keyY = tall ? y0 + cardH + H * 0.045 : cy - cell * 2.9;
  /* eight rows, not five — the last two used to fall off the bottom */
  const keyRow = tall ? Math.min(cell * 0.50, (H - keyY - 10) / 8.3) : cell * 0.72;
  return { W, H, tall, cardW, cardH, cell, x0, y0, keyX, keyY, keyRow };
}

function startBingo() {
  mark("bingo");
  if (bgOn) return;
  bgOn = true; bgT = 0; bgPhase = 0; bgMsg = 0; bgHint = 0; bgIdle = 0; bgDone = 0;
  bgDaub = []; bgConf = [];

  /* a real card: each column keeps to its own fifteen */
  bgCells = [];
  for (let c = 0; c < 5; c++) {
    const lo = c * 15 + 1, pool = [];
    for (let n = 0; n < 15; n++) pool.push(lo + n);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = (rnd() * (i + 1)) | 0;
      const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    for (let r = 0; r < 5; r++)
      bgCells.push({ c, r, n: pool[r], fall: -1.1 - rnd() * 1.4, rot: (rnd() - 0.5) * 0.7,
                     de: 0.5 + rnd() * 1.1, landed: 0 });
  }
  const at = (c, r) => bgCells.find(x => x.c === c && x.r === r);

  /* B I N G O lie across the middle, one per column — a proper line, and
     the wrong answer */
  bgKey = [];
  for (let c = 0; c < 5; c++) bgKey.push({ L: BG_LETTERS[c], n: at(c, 2).n, cell: at(c, 2) });

  /* K, E and V are somewhere else on it */
  const spare = [];
  for (let c = 0; c < 5; c++) for (let r = 0; r < 5; r++) if (r !== 2) spare.push([c, r]);
  for (let i = spare.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    const t = spare[i]; spare[i] = spare[j]; spare[j] = t;
  }
  ["K", "E", "V"].forEach((L, i) => {
    const [c, r] = spare[i];
    bgKey.push({ L, n: at(c, r).n, cell: at(c, r) });
  });
  bgKey.sort((a, b) => KEY_LETTERS.indexOf(a.L) - KEY_LETTERS.indexOf(b.L));

  const num = (L) => bgKey.find(k => k.L === L).n;
  bgDecoy = BG_LETTERS.map(num).sort((a, b) => a - b);
  bgWin = KEVIN.map(num).sort((a, b) => a - b);

  finCanvas.style.background = "#0d0c10";
  finCanvas.style.display = "block";
  sizeFinale();
  finCanvas.style.cursor = "pointer";
  bed("paper");
  cardArrive();
}

const bgSame = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);

function bgFont(px, bold, serif) {
  return `${bold ? "700 " : ""}${Math.round(px)}px ` +
    (serif ? 'Georgia, "Times New Roman", serif'
           : '-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif');
}

function bingoFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  const G = bgGeom();
  bgT += dt;
  hardClear(finCanvas, fctx);

  /* a table under a lamp */
  const room = fctx.createRadialGradient(G.x0 + G.cardW / 2, G.y0 + G.cardH / 2, 0,
                                         G.x0 + G.cardW / 2, G.y0 + G.cardH / 2, Math.max(W, H) * 0.8);
  room.addColorStop(0, "#23202a");
  room.addColorStop(1, "#0a0a0e");
  fctx.fillStyle = room;
  fctx.fillRect(0, 0, W, H);

  /* ---------- the card ---------- */
  const draw = Math.min(1, bgT / 0.9);
  fctx.save();
  fctx.shadowColor = "rgba(0,0,0,0.55)";
  fctx.shadowBlur = G.cell * 0.45;
  fctx.shadowOffsetY = G.cell * 0.12;
  fctx.fillStyle = "#f6f1e4";
  fctx.beginPath();
  fctx.roundRect(G.x0, G.y0, G.cardW, G.cardH * draw, G.cell * 0.08);
  fctx.fill();
  fctx.restore();
  if (draw < 1) { bgRules(G, draw); natFrame(dt); return; }

  /* the header band */
  const hg = fctx.createLinearGradient(0, G.y0, 0, G.y0 + G.cell);
  hg.addColorStop(0, "#c0332f");
  hg.addColorStop(1, "#9d2521");
  fctx.save();
  fctx.beginPath();
  fctx.roundRect(G.x0, G.y0, G.cardW, G.cell, [G.cell * 0.08, G.cell * 0.08, 0, 0]);
  fctx.clip();
  fctx.fillStyle = hg;
  fctx.fillRect(G.x0, G.y0, G.cardW, G.cell);
  fctx.restore();

  bgRules(G, 1);

  /* ---------- what falls into it ---------- */
  fctx.textAlign = "center";
  fctx.textBaseline = "middle";
  /* the five letters */
  for (let c = 0; c < 5; c++) {
    const t = Math.max(0, (bgT - 0.9 - c * 0.10) / 0.55);
    if (t <= 0) continue;
    const e = t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
    const bounce = t >= 1 ? 0 : Math.sin(Math.min(1, t) * Math.PI) * -G.cell * 0.10;
    const x = G.x0 + G.cell * (c + 0.5);
    const y = G.y0 + G.cell * 0.5 + (1 - e) * -H * 0.55 + bounce;
    fctx.fillStyle = "#fdf6e6";
    fctx.font = bgFont(G.cell * 0.62, true, true);
    fctx.save();
    fctx.translate(x, y);
    fctx.rotate((1 - e) * 0.5);
    fctx.fillText(BG_LETTERS[c], 0, 0);
    fctx.restore();
    if (t >= 1 && t < 1.06) tick(760 + c * 90, x);
  }
  /* and the twenty-five numbers */
  let allDown = true;
  for (const cl of bgCells) {
    const t = Math.max(0, (bgT - 1.3 - cl.de) / 0.5);
    if (t < 1) allDown = false;
    if (t <= 0) continue;
    const e = t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
    const x = G.x0 + G.cell * (cl.c + 0.5);
    const y0c = G.y0 + G.cell * (cl.r + 1.5);
    const y = y0c + (1 - e) * -H * 0.7;
    if (t >= 1 && !cl.landed) { cl.landed = 1; tick(420 + cl.c * 70 + cl.r * 18, x); }
    fctx.save();
    fctx.translate(x, y);
    fctx.rotate((1 - e) * cl.rot);
    fctx.fillStyle = "#241f1c";
    fctx.font = bgFont(G.cell * 0.42, true, false);
    fctx.fillText(String(cl.n), 0, 0);
    fctx.restore();
  }
  if (bgPhase === 0 && allDown && bgT > 2.4) { bgPhase = 1; bgIdle = 0; }

  /* ---------- the daubs ---------- */
  for (const d of bgDaub) {
    d.t = Math.min(1, d.t + dt * 5);
    const cl = d.cell;
    const x = G.x0 + G.cell * (cl.c + 0.5), y = G.y0 + G.cell * (cl.r + 1.5);
    const r = G.cell * 0.34 * (1 - Math.pow(1 - d.t, 3)) * (d.off ? 1 - d.off : 1);
    if (r <= 0.5) continue;
    fctx.save();
    fctx.globalAlpha = 0.52 * (d.off ? 1 - d.off : 1);
    fctx.fillStyle = d.col;
    fctx.beginPath();
    /* a dauber leaves a soft round blot, not a circle */
    for (let i = 0; i <= 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const rr = r * (0.92 + 0.10 * Math.sin(a * 3 + d.seed));
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      i ? fctx.lineTo(px, py) : fctx.moveTo(px, py);
    }
    fctx.closePath();
    fctx.fill();
    fctx.globalAlpha = 0.26 * (d.off ? 1 - d.off : 1);
    fctx.fillStyle = "#ffffff";
    fctx.beginPath();
    fctx.ellipse(x - r * 0.3, y - r * 0.34, r * 0.24, r * 0.16, -0.5, 0, 6.3);
    fctx.fill();
    /* and the number reads through it, the way it does under a real dauber */
    fctx.globalAlpha = 0.85 * (d.off ? 1 - d.off : 1) * d.t;
    fctx.fillStyle = "#14213f";
    fctx.textAlign = "center"; fctx.textBaseline = "middle";
    fctx.font = bgFont(G.cell * 0.42, true, false);
    fctx.fillText(String(cl.n), x, y);
    fctx.restore();
    if (d.off !== undefined) d.off = Math.min(1, d.off + dt * 1.6);
  }
  bgDaub = bgDaub.filter(d => d.off === undefined || d.off < 1);

  /* ---------- the key ---------- */
  bgDrawKey(G);

  /* ---------- what it says back ---------- */
  if (bgMsg > 0) {
    bgMsg = Math.max(0, bgMsg - dt);
    const a = Math.min(1, bgMsg / 0.6) * Math.min(1, (2.8 - bgMsg) / 0.35);
    const cx = G.x0 + G.cardW / 2, cy = G.y0 + G.cell * 2.0;
    fctx.save();
    fctx.globalAlpha = Math.max(0, a);
    fctx.translate(cx, cy);
    fctx.rotate(-0.06);
    if (bgMsgKind === 1) {
      fctx.fillStyle = "rgba(150,42,38,0.92)";
      fctx.font = bgFont(G.cell * 0.30, true, true);
      fctx.fillText("not a good bingo", 0, -G.cell * 0.20);
      fctx.font = bgFont(G.cell * 0.24, false, true);
      fctx.fillText("try again", 0, G.cell * 0.22);
      fctx.strokeStyle = "rgba(150,42,38,0.55)";
      fctx.lineWidth = Math.max(2, G.cell * 0.035);
      fctx.beginPath();
      fctx.roundRect(-G.cell * 1.55, -G.cell * 0.62, G.cell * 3.1, G.cell * 1.16, G.cell * 0.12);
      fctx.stroke();
    }
    fctx.restore();
  }

  /* ---------- the one that counts ---------- */
  if (bgPhase === 3) {
    bgDone += dt;
    /* a line through the five, in the order they spell */
    const pts = KEVIN.map(L => {
      const k = bgKey.find(q => q.L === L);
      return { x: G.x0 + G.cell * (k.cell.c + 0.5), y: G.y0 + G.cell * (k.cell.r + 1.5) };
    });
    const prog = Math.min(1, bgDone / 1.1) * (pts.length - 1);
    fctx.save();
    fctx.strokeStyle = "rgba(196,42,38,0.85)";
    fctx.lineWidth = Math.max(3, G.cell * 0.075);
    fctx.lineCap = "round"; fctx.lineJoin = "round";
    fctx.beginPath();
    fctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      const f = Math.max(0, Math.min(1, prog - (i - 1)));
      if (f <= 0) break;
      fctx.lineTo(pts[i - 1].x + (pts[i].x - pts[i - 1].x) * f,
                  pts[i - 1].y + (pts[i].y - pts[i - 1].y) * f);
    }
    fctx.stroke();
    fctx.restore();
    if (bgDone > 1.0) {
      const a = Math.min(1, (bgDone - 1.0) / 0.5);
      const pop = 1 + Math.sin(Math.min(1, (bgDone - 1.0) / 0.35) * Math.PI) * 0.18;
      fctx.save();
      fctx.globalAlpha = a;
      fctx.translate(G.x0 + G.cardW / 2, G.y0 + G.cell * 1.55);
      fctx.rotate(-0.05);
      fctx.scale(pop, pop);
      fctx.font = bgFont(G.cell * 0.66, true, true);
      fctx.textAlign = "center"; fctx.textBaseline = "middle";
      /* outlined, so it reads over the daubs and the line and the confetti */
      fctx.lineWidth = G.cell * 0.13;
      fctx.lineJoin = "round";
      fctx.strokeStyle = "rgba(250,246,236,0.95)";
      fctx.strokeText("BINGO!", 0, 0);
      fctx.fillStyle = "#c02a26";
      fctx.fillText("BINGO!", 0, 0);
      fctx.restore();
    }
    /* something to throw in the air */
    if (bgDone > 1.0 && bgConf.length < 150 && Math.random() < 0.7) {
      for (let i = 0; i < 3; i++)
        bgConf.push({ x: G.x0 + G.cardW * Math.random(), y: G.y0 + G.cardH * 0.5,
                      vx: (Math.random() - 0.5) * 620, vy: -280 - Math.random() * 460,
                      rot: Math.random() * 6.3, spin: (Math.random() - 0.5) * 12,
                      c: `hsl(${(Math.random() * 360) | 0},78%,60%)`,
                      s: G.cell * (0.05 + Math.random() * 0.07), life: 1 });
    }
    if (bgDone > 5.2) {
      const f = Math.min(1, (bgDone - 5.2) / 2.2);
      fctx.fillStyle = `rgba(250,248,244,${(f * f).toFixed(3)})`;
      fctx.fillRect(0, 0, W, H);
      if (f >= 1) { bgOn = false; release("bingo"); chainEnd = true; restT = 0;
                    finCanvas.style.cursor = ""; }
    }
  }
  for (let i = bgConf.length - 1; i >= 0; i--) {
    const q = bgConf[i];
    q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.spin * dt;
    q.life -= dt * 0.35;
    if (q.life <= 0 || q.y > H + 40) { bgConf.splice(i, 1); continue; }
    fctx.save();
    fctx.translate(q.x, q.y); fctx.rotate(q.rot);
    fctx.globalAlpha = Math.min(1, q.life * 2);
    fctx.fillStyle = q.c;
    fctx.fillRect(-q.s, -q.s * 0.4, q.s * 2, q.s * 0.8);
    fctx.restore();
  }

  /* ---------- a nudge toward the key ---------- */
  if (bgPhase === 1) {
    bgIdle += dt;
    if (bgIdle > 7 && bgDaub.length === 0) bgHint = Math.min(1, bgHint + dt * 0.6);
  }

  natFrame(dt);
}

function bgRules(G, a) {
  fctx.save();
  fctx.globalAlpha = a;
  fctx.strokeStyle = "rgba(60,50,40,0.30)";
  fctx.lineWidth = Math.max(1, G.cell * 0.014);
  for (let i = 0; i <= 5; i++) {
    const x = G.x0 + G.cell * i;
    fctx.beginPath(); fctx.moveTo(x, G.y0); fctx.lineTo(x, G.y0 + G.cardH * a); fctx.stroke();
  }
  for (let j = 0; j <= 6; j++) {
    const y = G.y0 + G.cell * j;
    if (y > G.y0 + G.cardH * a) break;
    fctx.beginPath(); fctx.moveTo(G.x0, y); fctx.lineTo(G.x0 + G.cardW, y); fctx.stroke();
  }
  fctx.restore();
}

function bgDrawKey(G) {
  const rowH = G.keyRow;
  const inKevin = (L) => KEVIN.indexOf(L) >= 0;
  fctx.save();
  fctx.textAlign = "left";
  fctx.textBaseline = "middle";
  for (let i = 0; i < bgKey.length; i++) {
    const k = bgKey[i];
    const y = G.keyY + rowH * i + rowH * 0.5;
    const x = G.tall ? G.keyX - rowH * 2.6 : G.keyX;
    const lit = bgHint > 0 && inKevin(k.L)
      ? bgHint * (0.5 + 0.5 * Math.sin(bgT * 3 + i))
      : 0;
    if (lit > 0.01) {
      fctx.fillStyle = `rgba(214,178,72,${(0.16 * lit).toFixed(3)})`;
      fctx.beginPath();
      fctx.roundRect(x - rowH * 0.22, y - rowH * 0.40, rowH * 3.0, rowH * 0.80, rowH * 0.16);
      fctx.fill();
    }
    fctx.fillStyle = "rgba(246,241,228,0.92)";
    fctx.font = bgFont(rowH * 0.56, true, true);
    fctx.fillText(k.L, x, y);
    fctx.fillStyle = "rgba(150,142,128,0.65)";
    fctx.font = bgFont(rowH * 0.34, false, false);
    fctx.fillText("—", x + rowH * 0.62, y);
    fctx.fillStyle = "rgba(240,236,226,0.88)";
    fctx.font = bgFont(rowH * 0.46, true, false);
    fctx.fillText(String(k.n), x + rowH * 1.20, y);
  }
  fctx.restore();
}

/* ---------- daubing ---------- */
window.addEventListener("pointerdown", (e) => {
  if (!bgOn || bgPhase !== 1) return;
  const G = bgGeom();
  const cx = Math.floor((e.clientX - G.x0) / G.cell);
  const cy = Math.floor((e.clientY - G.y0 - G.cell) / G.cell);
  if (cx < 0 || cx > 4 || cy < 0 || cy > 4) return;
  bgIdle = 0;
  const cell = bgCells.find(c => c.c === cx && c.r === cy);
  if (!cell) return;
  const had = bgDaub.findIndex(d => d.cell === cell && d.off === undefined);
  if (had >= 0) {
    /* lift it off again — nobody should be stuck with a wrong dot */
    bgDaub[had].off = 0.0001;
    daubOff();
    return;
  }
  bgDaub.push({ cell, t: 0, col: "#2b56c8", seed: Math.random() * 6.3 });
  daubOn(e.clientX);

  const live = bgDaub.filter(d => d.off === undefined).map(d => d.cell.n).sort((a, b) => a - b);
  if (bgSame(live, bgWin)) {
    bgPhase = 3; bgDone = 0; bingoHit();
  } else if (bgSame(live, bgDecoy)) {
    bgMsg = 2.8; bgMsgKind = 1;
    bgHint = Math.max(bgHint, 0.85);       /* now the key is worth reading */
    notQuite();
    setTimeout(() => {
      for (const d of bgDaub) if (d.off === undefined) d.off = 0.0001;
    }, 1500);
  }
}, { passive: true });

/* ---------- sound ---------- */
function cardArrive() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.7;
  bp.frequency.setValueAtTime(1800, t0);
  bp.frequency.exponentialRampToValueAtTime(500, t0 + 0.7);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.075, t0 + 0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start(t0); s.stop(t0 + 0.95);
}
function tick(f, px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); o.type = "triangle";
  o.frequency.setValueAtTime(f, t0);
  o.frequency.exponentialRampToValueAtTime(f * 0.62, t0 + 0.06);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.028, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
  o.connect(g); g.connect(at(px) || BUS);
  o.start(t0); o.stop(t0 + 0.16);
}
function daubOn(px) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.16, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
  s.connect(lp); lp.connect(g); g.connect(at(px) || BUS);
  s.start(t0); s.stop(t0 + 0.15);
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(180, t0);
  o.frequency.exponentialRampToValueAtTime(72, t0 + 0.1);
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.055, t0);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
  o.connect(g2); g2.connect(BUS); o.start(t0); o.stop(t0 + 0.18);
}
function daubOff() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(520, t0);
  o.frequency.exponentialRampToValueAtTime(880, t0 + 0.09);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.026, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
  o.connect(g); g.connect(BUS); o.start(t0); o.stop(t0 + 0.15);
}
function notQuite() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  /* not a buzzer. Two notes down, the sound of a thing politely declining. */
  [[392, 0], [311, 0.20]].forEach(([f, d]) => {
    const o = ac.createOscillator(); o.type = "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.linearRampToValueAtTime(0.055, t0 + d + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.7);
    o.connect(g); g.connect(BUS); o.start(t0 + d); o.stop(t0 + d + 0.75);
  });
}
function bingoHit() {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  [261.6, 329.6, 392, 523.3, 659.3].forEach((f, i) => {
    const o = ac.createOscillator(); o.type = i > 2 ? "sine" : "triangle";
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + i * 0.075);
    g.gain.linearRampToValueAtTime(0.060, t0 + i * 0.075 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.4);
    o.connect(g); g.connect(BUS); o.start(t0 + i * 0.075); o.stop(t0 + 3.5);
  });
  for (let i = 0; i < 26; i++) {
    const t = t0 + 0.9 + Math.random() * 1.6;
    const o = ac.createOscillator(); o.type = "sine";
    o.frequency.value = 1200 + Math.random() * 2400;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.020, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(at(Math.random() * window.innerWidth) || BUS);
    o.start(t); o.stop(t + 0.2);
  }
}

function restFrame(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  restT += dt;
  hardClear(finCanvas, fctx);
  const sky = fctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#0a1220");
  sky.addColorStop(0.62, "#131c2a");
  sky.addColorStop(0.88, "#2b2a2c");
  sky.addColorStop(1, "#171412");
  fctx.fillStyle = sky; fctx.fillRect(0, 0, W, H);
  /* something coming, a long way off */
  const g = fctx.createRadialGradient(W * 0.5, H * 0.99, 0, W * 0.5, H * 0.99, H * 0.5);
  g.addColorStop(0, `rgba(190,140,96,${(0.10 + 0.05 * Math.sin(restT * 0.4)).toFixed(3)})`);
  g.addColorStop(1, "rgba(160,120,90,0)");
  fctx.fillStyle = g; fctx.fillRect(0, H * 0.5, W, H * 0.5);
  if (!restLeaves) {
    restLeaves = [];
    for (let i = 0; i < 26; i++)
      restLeaves.push({ x: rnd() * W, y: rnd() * H, s: 5 + rnd() * 10,
                        rot: rnd() * 6.3, spin: (rnd() - 0.5) * 1.6,
                        hue: 16 + rnd() * 34, v: 8 + rnd() * 22, ph: rnd() * 6.3 });
  }
  for (const l of restLeaves) {
    l.y += l.v * dt;
    l.x += Math.sin(restT * 0.6 + l.ph) * 14 * dt;
    l.rot += l.spin * dt;
    if (l.y > H + 30) { l.y = -30; l.x = Math.random() * W; }
    drawLeaf(fctx, l.x, l.y, l.s, l.rot, l.hue, 0.32);
  }
  natFrame(dt);
}

/* --- the hand in the wind --- */
function woodStrip(x, y) {
  const W = window.innerWidth, H = window.innerHeight;
  const R = Math.min(W, H) * 0.16;
  let took = 0;
  for (const t of trees) {
    for (const l of t.leaves) {
      if (!l.on) continue;
      const lx = t.x + l.ox, ly = t.y + l.oy;
      if (Math.hypot(lx - x, ly - y) > R) continue;
      l.on = false; took++;
      loose.push({ x: lx, y: ly, s: l.s, hue: l.hue, ph: l.ph,
                   rot: Math.random() * 6.3, spin: (Math.random() - 0.5) * 7,
                   vx: 60 + Math.random() * 120, vy: -40 - Math.random() * 90 });
    }
  }
  if (took) { stripped += took; rustle(x, Math.min(1, took / 6)); }
}
window.addEventListener("pointerdown", (e) => {
  if (!woodOn) return;
  woodDrag = true; wgustX = e.clientX; wgustY = e.clientY;
  woodStrip(e.clientX, e.clientY);
  if (e.cancelable) e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => {
  if (!woodOn) return;
  finCanvas.style.cursor = "grab";
  const dx = e.clientX - wgustX;
  wgustX = e.clientX; wgustY = e.clientY;
  wgustV = Math.min(400, wgustV + Math.abs(dx) * 4);
  if (woodDrag) { woodStrip(e.clientX, e.clientY); if (e.cancelable) e.preventDefault(); }
}, { passive: false });
window.addEventListener("pointerup", () => { woodDrag = false; });

/* --- sound --- */
function woodWind() {
  const ac = audio(); if (!ac || windNode) return;
  const s = ac.createBufferSource(); s.buffer = noise(ac); s.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 1500; bp.Q.value = 0.45;
  const g = ac.createGain(); g.gain.value = 0.0001;
  s.connect(bp); bp.connect(g); g.connect(BUS);
  s.start();
  windNode = { s, bp, g };
  hold("wood", { gain: g, src: s });
}
let lastRustle = 0;
function rustle(px, v) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  if (t0 - lastRustle < 0.05) return;
  lastRustle = t0;
  const s = ac.createBufferSource(); s.buffer = noise(ac);
  s.playbackRate.value = 0.8 + Math.random() * 0.7;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 2400 + Math.random() * 2600; bp.Q.value = 0.9;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.020 + 0.050 * v, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32 + v * 0.3);
  s.connect(bp); bp.connect(g); g.connect(at(px) || BUS);
  s.start(t0); s.stop(t0 + 0.7);
}

/* ================= the river =================
   The leaves the wind took have to come down somewhere, and they come down
   on water.

   This ran away from you before — a channel receding to a point, which is
   the shape of a road. So the composition said "go down it" while the thing
   you do said "get across it", and the two fought. It runs across the frame
   now: your bank at your feet, thirty feet of moving water, the far bank and
   the last of the light above it. Crossing is upward, which is also the
   direction the whole piece has been going.

   Put your hand on the water and a stone comes up out of it. Put up enough
   to walk from this bank to that one, and the river takes the frame with it. */

let rivOn = false, rivT = 0, rocks = [], stones = [], rivLeaves = [], foam = [];
let bankStones = [], rivHanded = false, rivNode = null, crossed = 0;
let reeds = [], tufts = [], rivDir = 1, rivGlow = 0;
let barCool = null, barWarm = null, rivVig = null, rivVigW = 0, rivVigH = 0;
let hills = [], rivClouds = [], rivBirds = [], mist = [];
let moonUp = 0, moonX = 0, moonDrop = -1, rivDone = 0;

/* A soft-ended bar. The current and the reflection were each building a fresh
   linear gradient per streak per frame — about a hundred and eighty objects a
   frame on a phone, which is most of the frame budget for something that never
   changes shape. Built once, stretched to fit. */
function softBar(r, g, b) {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 8;
  const x = c.getContext("2d");
  const lg = x.createLinearGradient(0, 0, 128, 0);
  lg.addColorStop(0, `rgba(${r},${g},${b},0)`);
  lg.addColorStop(0.38, `rgba(${r},${g},${b},1)`);
  lg.addColorStop(0.64, `rgba(${r},${g},${b},1)`);
  lg.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = lg;
  x.fillRect(0, 0, 128, 8);
  return c;
}

function rivGeom() {
  const W = window.innerWidth, H = window.innerHeight;
  const tall = H > W * 1.2;
  const farB = H * (tall ? 0.36 : 0.42);     /* the far bank meets the water */
  const nearB = H * (tall ? 0.84 : 0.86);    /* the water meets your feet */
  return { W, H, sky: farB - H * 0.02, farB, nearB, span: nearB - farB };
}
/* 0 at the far bank, 1 at your toes — everything in the water is placed by it */
const rivYAt = (G, t) => G.farB + G.span * t;
const rivTAt = (G, y) => Math.max(0, Math.min(1, (y - G.farB) / G.span));
/* things nearer you are bigger; one place that says by how much */
const rivScale = (G, t) => Math.min(G.W, G.H) * (0.55 + 0.72 * t);
/* a river runs fastest down the middle and hardly at all at its edges */
const rivFlow = (t) => 0.22 + 0.78 * Math.sin(Math.max(0, Math.min(1, t)) * Math.PI);

function startRiver() {
  mark("river");
  if (rivOn) return;
  rivOn = true; rivT = 0; crossed = 0; rivHanded = false; rivGlow = 0;
  stones = []; foam = [];
  const G = rivGeom();
  rivDir = RUN.windDir >= 0 ? 1 : -1;        /* it runs the way the wind did */

  /* rocks that were always there, standing in it */
  rocks = [];
  for (let i = 0; i < (G.W < 620 ? 5 : 8); i++)
    rocks.push({ t: 0.10 + rnd() * 0.80, x: rnd(), s: 0.011 + rnd() * 0.015,
                 rot: rnd() * 6.3, seed: rnd() * 100 });
  rocks.sort((a, b) => a.t - b.t);

  /* shingle on both banks */
  bankStones = [];
  for (let i = 0; i < (G.W < 620 ? 46 : 90); i++)
    bankStones.push({ x: rnd(), near: rnd() < 0.62, o: rnd(),
                      s: 0.0022 + rnd() * 0.0055,
                      hue: 26 + rnd() * 18, l: 14 + rnd() * 18, rot: rnd() * 6.3 });

  /* reeds along the far bank, which is what tells you it is a bank and not a
     wall, and grass tufts on yours */
  /* Reeds grow in clumps where the water is shallow, not evenly spaced like
     a fence — evenly spaced was the reason they read as aerials. */
  reeds = [];
  const clumps = G.W < 620 ? 6 : 11;
  for (let c = 0; c < clumps; c++) {
    const cx = rnd(), n = 3 + ((rnd() * 6) | 0), big = 0.6 + rnd() * 0.7;
    for (let i = 0; i < n; i++)
      reeds.push({ x: cx + (rnd() - 0.5) * 0.035,
                   h: (0.018 + rnd() * 0.030) * big,
                   lean: (rnd() - 0.5) * 0.7,
                   ph: rnd() * 6.3, hue: 44 + rnd() * 22, head: rnd() < 0.35 });
  }
  tufts = [];
  const clu2 = G.W < 620 ? 9 : 16;
  for (let c = 0; c < clu2; c++) {
    const cx = rnd(), co = rnd(), n = 4 + ((rnd() * 7) | 0);
    for (let i = 0; i < n; i++)
      tufts.push({ x: cx + (rnd() - 0.5) * 0.045, o: co + (rnd() - 0.5) * 0.16,
                   h: 0.008 + rnd() * 0.020,
                   ph: rnd() * 6.3, hue: 40 + rnd() * 22 });
  }

  /* Three ranges of hills behind the trees, each one paler and flatter than
     the last. Aerial perspective is the whole of why a landscape reads as
     big: distance takes the contrast out of things. */
  hills = [];
  for (let r = 0; r < 3; r++) {
    const pts = [];
    const n = 9 + r * 4;
    for (let i = 0; i <= n; i++)
      pts.push(0.25 + rnd() * 0.75);
    hills.push({ r, pts, off: rnd() });
  }
  /* cloud bars lying along the sky, lit from underneath */
  rivClouds = [];
  for (let i = 0; i < (G.W < 620 ? 5 : 8); i++)
    rivClouds.push({ y: 0.10 + rnd() * 0.62, x: rnd(), w: 0.16 + rnd() * 0.38,
                     h: 0.006 + rnd() * 0.016, v: 0.004 + rnd() * 0.010,
                     a: 0.10 + rnd() * 0.26 });
  /* something alive, a long way off */
  rivBirds = [];
  const bn = 5 + ((rnd() * 4) | 0);
  for (let i = 0; i < bn; i++)
    rivBirds.push({ o: i / bn, ph: rnd() * 6.3, lift: (rnd() - 0.5) * 0.05,
                 sp: 0.9 + rnd() * 0.5 });
  /* and mist lying on the water where it meets the far bank */
  mist = [];
  for (let i = 0; i < (G.W < 620 ? 4 : 7); i++)
    mist.push({ t: 0.01 + rnd() * 0.22, x: rnd(), w: 0.22 + rnd() * 0.40,
                v: 0.006 + rnd() * 0.014, a: 0.025 + rnd() * 0.055, ph: rnd() * 6.3 });

  moonUp = 0; moonDrop = -1; rivDone = 0;
  moonX = RUN.sunX > 0.5 ? 0.20 + rnd() * 0.14 : 0.66 + rnd() * 0.14;

  rivLeaves = [];
  for (let i = 0; i < (G.W < 620 ? 14 : 24); i++)
    rivLeaves.push({ t: 0.05 + rnd() * 0.9, x: rnd(), s: 4 + rnd() * 7,
                     rot: rnd() * 6.3, spin: (rnd() - 0.5) * 1.6, hue: 16 + rnd() * 34 });

  if (!barCool) barCool = softBar(206, 228, 244);
  if (!barWarm) barWarm = softBar(255, 210, 146);
  bed("sea");
  riverSound();
  finCanvas.style.cursor = "pointer";
}

/* a rock: a lump with a lit top, a wet waterline, and white water piling on
   whichever side the current hits it */
function drawRock(x, y, s, rot, seed, wet) {
  const c = fctx;
  c.save();
  c.translate(x, y);
  c.rotate(Math.sin(seed) * 0.3 + rot * 0.05);
  const g = c.createLinearGradient(0, -s, 0, s * 0.8);
  g.addColorStop(0, "#8d8478");
  g.addColorStop(0.42, "#6d6357");
  g.addColorStop(1, "#3a352e");
  c.fillStyle = g;
  c.beginPath();
  const N = 9;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = s * (0.74 + 0.30 * Math.abs(Math.sin(a * 2.3 + seed)));
    const px = Math.cos(a) * r, py = Math.sin(a) * r * 0.66;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  c.fill();
  /* the top catches what light is left */
  c.fillStyle = "rgba(226,216,196,0.20)";
  c.beginPath();
